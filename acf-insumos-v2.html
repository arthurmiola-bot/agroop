<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACF Insumos</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --verde: #2d6a4f;
    --verde-claro: #40916c;
    --verde-menta: #74c69d;
    --creme: #f8f4ee;
    --creme-escuro: #ede8e0;
    --terra: #7c5c3e;
    --laranja: #e07c3a;
    --vermelho: #c0392b;
    --azul: #2563eb;
    --cinza: #6b7280;
    --branco: #ffffff;
    --texto: #1a1a1a;
    --sombra: 0 2px 12px rgba(0,0,0,0.08);
    --sombra-forte: 0 8px 32px rgba(0,0,0,0.14);
    --radius: 12px;
    --radius-lg: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--creme); color: var(--texto); min-height: 100vh; }

  /* LOGIN */
  #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(145deg, #1a3a2a 0%, #2d6a4f 60%, #40916c 100%); padding: 24px; }
  .login-card { background: var(--branco); border-radius: var(--radius-lg); padding: 48px 40px; width: 100%; max-width: 400px; box-shadow: var(--sombra-forte); }
  .login-logo { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; color: var(--verde); margin-bottom: 4px; }
  .login-sub { font-size: 13px; color: var(--cinza); margin-bottom: 36px; letter-spacing: 0.5px; }
  .login-card label { display: block; font-size: 12px; font-weight: 500; color: var(--cinza); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
  .login-card input { width: 100%; padding: 12px 16px; border: 2px solid var(--creme-escuro); border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif; font-size: 15px; margin-bottom: 18px; transition: border-color 0.2s; outline: none; }
  .login-card input:focus { border-color: var(--verde-claro); }
  .btn-login { width: 100%; padding: 14px; background: var(--verde); color: white; border: none; border-radius: var(--radius);
    font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; transition: background 0.2s, transform 0.1s; }
  .btn-login:hover { background: var(--verde-claro); }
  .btn-login:active { transform: scale(0.98); }
  .login-erro { color: var(--vermelho); font-size: 13px; margin-top: 10px; text-align: center; }

  /* LAYOUT */
  #app { display: none; min-height: 100vh; flex-direction: column; }
  #app.ativo { display: flex; }
  .header { background: var(--verde); color: white; padding: 0 24px; height: 60px; display: flex; align-items: center;
    justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
  .header-logo { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
  .header-logo span { color: var(--verde-menta); }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .header-user { font-size: 13px; opacity: 0.85; display: flex; align-items: center; gap: 8px; }
  .badge-perfil { background: rgba(255,255,255,0.2); border-radius: 20px; padding: 3px 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .btn-sair { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 6px 14px;
    border-radius: 8px; font-size: 13px; cursor: pointer; transition: background 0.2s; }
  .btn-sair:hover { background: rgba(255,255,255,0.25); }

  .nav { background: var(--branco); border-bottom: 2px solid var(--creme-escuro); padding: 0 24px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav-btn { padding: 14px 16px; background: none; border: none; border-bottom: 3px solid transparent; font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 500; color: var(--cinza); cursor: pointer; white-space: nowrap; transition: all 0.2s; display: flex; align-items: center; gap: 7px; }
  .nav-btn:hover { color: var(--verde); }
  .nav-btn.ativo { color: var(--verde); border-bottom-color: var(--verde); font-weight: 600; }

  .main { flex: 1; padding: 28px 24px; max-width: 1100px; margin: 0 auto; width: 100%; }

  /* OPERADOR */
  .operador-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: calc(100vh - 120px); gap: 20px; padding: 24px; }
  .operador-titulo { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 700; color: var(--verde); text-align: center; }
  .operador-sub { color: var(--cinza); font-size: 14px; text-align: center; }
  .btn-operador { width: 100%; max-width: 320px; padding: 22px; border-radius: var(--radius-lg); border: none;
    font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; cursor: pointer; display: flex; align-items: center;
    gap: 16px; transition: transform 0.15s; box-shadow: var(--sombra); text-align: left; }
  .btn-operador:active { transform: scale(0.97); }
  .btn-operador .op-icon { font-size: 32px; }
  .btn-op-retirar { background: var(--verde); color: white; }
  .btn-op-historico { background: var(--branco); color: var(--verde); border: 2px solid var(--verde); }

  /* CARDS */
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .card-resumo { background: var(--branco); border-radius: var(--radius); padding: 20px; box-shadow: var(--sombra); border-left: 4px solid var(--verde); }
  .card-resumo.alerta { border-left-color: var(--laranja); }
  .card-resumo.perigo { border-left-color: var(--vermelho); }
  .card-resumo.info { border-left-color: var(--azul); }
  .card-resumo-valor { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; color: var(--verde); line-height: 1; }
  .card-resumo.alerta .card-resumo-valor { color: var(--laranja); }
  .card-resumo.perigo .card-resumo-valor { color: var(--vermelho); }
  .card-resumo.info .card-resumo-valor { color: var(--azul); }
  .card-resumo-label { font-size: 12px; color: var(--cinza); margin-top: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }

  .sec-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .sec-titulo { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; color: var(--texto); }

  .btn { padding: 10px 20px; border-radius: var(--radius); border: none; font-family: 'DM Sans', sans-serif; font-size: 14px;
    font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 7px; }
  .btn-primary { background: var(--verde); color: white; }
  .btn-primary:hover { background: var(--verde-claro); }
  .btn-secondary { background: var(--creme-escuro); color: var(--texto); }
  .btn-secondary:hover { background: #ddd8cf; }
  .btn-danger { background: var(--vermelho); color: white; }
  .btn-sm { padding: 6px 12px; font-size: 13px; }
  .btn-laranja { background: var(--laranja); color: white; }
  .btn-azul { background: var(--azul); color: white; }

  .tabela-wrap { background: var(--branco); border-radius: var(--radius); box-shadow: var(--sombra); overflow: auto; }
  .tabela-wrap table { width: 100%; border-collapse: collapse; }
  .tabela-wrap th { background: var(--verde); color: white; padding: 12px 16px; text-align: left; font-family: 'Syne', sans-serif;
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
  .tabela-wrap td { padding: 12px 16px; border-bottom: 1px solid var(--creme-escuro); font-size: 14px; vertical-align: middle; }
  .tabela-wrap tr:last-child td { border-bottom: none; }
  .tabela-wrap tbody tr:hover td { background: var(--creme); }
  .tabela-vazia { text-align: center; padding: 40px; color: var(--cinza); font-style: italic; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 500;
    align-items: center; justify-content: center; padding: 16px; }
  .modal-overlay.ativo { display: flex; }
  .modal { background: var(--branco); border-radius: var(--radius-lg); padding: 32px; width: 100%; max-width: 580px;
    max-height: 90vh; overflow-y: auto; box-shadow: var(--sombra-forte); }
  .modal-titulo { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 24px; color: var(--verde); }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--cinza); text-transform: uppercase;
    letter-spacing: 0.6px; margin-bottom: 6px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 11px 14px; border: 2px solid var(--creme-escuro);
    border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; background: var(--branco); }
  .form-group input:focus, .form-group select:focus { border-color: var(--verde-claro); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; }
  .badge-verde { background: #d1fae5; color: #065f46; }
  .badge-laranja { background: #fed7aa; color: #9a3412; }
  .badge-vermelho { background: #fee2e2; color: #991b1b; }
  .badge-azul { background: #dbeafe; color: #1e40af; }
  .badge-cinza { background: #f3f4f6; color: #374151; }
  .badge-amarelo { background: #fef9c3; color: #854d0e; }

  .filtros { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .filtros input, .filtros select { padding: 8px 12px; border: 2px solid var(--creme-escuro); border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; background: var(--branco); }
  .filtros input:focus, .filtros select:focus { border-color: var(--verde-claro); }

  .itens-pedido { border: 2px solid var(--creme-escuro); border-radius: var(--radius); overflow: hidden; margin-top: 8px; }
  .item-pedido-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 8px; align-items: center;
    padding: 10px 12px; border-bottom: 1px solid var(--creme-escuro); font-size: 13px; }
  .item-pedido-row:last-child { border-bottom: none; }
  .item-pedido-row.header-row { background: var(--creme); font-weight: 600; font-size: 11px; text-transform: uppercase;
    color: var(--cinza); letter-spacing: 0.5px; }
  .item-pedido-row input, .item-pedido-row select { padding: 6px 8px; border: 1px solid var(--creme-escuro);
    border-radius: 8px; font-size: 13px; width: 100%; outline: none; }

  .baixa-item-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 8px; align-items: center;
    padding: 10px 12px; border-bottom: 1px solid var(--creme-escuro); font-size: 13px; }
  .baixa-item-row.header-row { background: var(--creme); font-weight: 600; font-size: 11px; text-transform: uppercase; color: var(--cinza); }
  .baixa-item-row input { padding: 6px 8px; border: 1px solid var(--creme-escuro); border-radius: 8px; font-size: 13px; width: 100%; outline: none; }

  .relatorio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .relatorio-card { background: var(--branco); border-radius: var(--radius); padding: 22px; box-shadow: var(--sombra);
    cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; border-top: 4px solid var(--verde); display: flex; flex-direction: column; gap: 8px; }
  .relatorio-card:hover { transform: translateY(-2px); box-shadow: var(--sombra-forte); }
  .relatorio-card.alerta { border-top-color: var(--laranja); }
  .relatorio-card.info { border-top-color: var(--azul); }
  .relatorio-card.terra { border-top-color: var(--terra); }
  .relatorio-card-icon { font-size: 28px; }
  .relatorio-card-titulo { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; }
  .relatorio-card-desc { font-size: 13px; color: var(--cinza); }
  .relatorio-resultado { background: var(--branco); border-radius: var(--radius); padding: 24px; box-shadow: var(--sombra); margin-top: 20px; }
  .relatorio-resultado-titulo { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 16px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }

  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--verde); color: white; padding: 14px 20px;
    border-radius: var(--radius); font-size: 14px; font-weight: 500; z-index: 9999; box-shadow: var(--sombra-forte);
    transform: translateY(80px); opacity: 0; transition: all 0.3s; max-width: 320px; }
  .toast.ativo { transform: translateY(0); opacity: 1; }
  .toast.erro { background: var(--vermelho); }

  .loading { display: flex; align-items: center; justify-content: center; padding: 60px; color: var(--cinza); gap: 12px; }
  .spinner { width: 20px; height: 20px; border: 3px solid var(--creme-escuro); border-top-color: var(--verde);
    border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .venc-hoje { color: var(--vermelho); font-weight: 600; }
  .venc-proximo { color: var(--laranja); font-weight: 600; }
  .venc-ok { color: var(--cinza); }

  /* COBERTURA */
  .cob-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr; gap: 8px; padding: 12px 16px;
    border-bottom: 1px solid var(--creme-escuro); font-size: 14px; align-items: center; }
  .cob-row.header { background: var(--verde); color: white; font-size: 12px; font-weight: 600; text-transform: uppercase;
    font-family: 'Syne', sans-serif; letter-spacing: 0.5px; }


  @media (max-width: 600px) {
    .main { padding: 16px; }
    .form-row { grid-template-columns: 1fr; }
    .header-user { display: none; }
    .modal { padding: 20px; }
    .cob-row { grid-template-columns: 1.5fr 1fr 1fr; }
    .cob-row span:nth-child(3), .cob-row span:nth-child(4) { display: none; }
    .cob-row.header span:nth-child(3), .cob-row.header span:nth-child(4) { display: none; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card" style="text-align:center">
    <div class="login-logo">🌱 ACF Insumos</div>
    <div class="login-sub">Gestão de Insumos Agrícolas</div>
    <div style="margin-top:10px;display:flex;flex-direction:column;gap:14px">
      <button class="btn-login" onclick="entrarComoPerfil('gestor')">👨‍🌾 Sou Gestor</button>
      <button class="btn-login" style="background:var(--branco);color:var(--verde);border:2px solid var(--verde)" onclick="entrarComoPerfil('operador')">🚜 Sou Funcionário</button>
    </div>
    <div class="login-erro" id="login-erro"></div>
  </div>
</div>

<div id="app">
  <div class="header">
    <div class="header-logo">ACF <span>Insumos</span></div>
    <div class="header-right">
      <div class="header-user">
        <span id="header-nome"></span>
        <span class="badge-perfil" id="header-perfil"></span>
      </div>
      <button class="btn-sair" onclick="sair()">Sair</button>
    </div>
  </div>

  <div class="nav" id="nav-gestor" style="display:none">
    <button class="nav-btn ativo" onclick="mostrarAba('dashboard')" data-aba="dashboard">📊 Dashboard</button>
    <button class="nav-btn" onclick="mostrarAba('cobertura')" data-aba="cobertura">🔮 Previsão</button>
    <button class="nav-btn" onclick="mostrarAba('caderno')" data-aba="caderno">📓 Caderno de Campo</button>
    <button class="nav-btn" onclick="mostrarAba('pedidos')" data-aba="pedidos">📋 Pedidos</button>
    <button class="nav-btn" onclick="mostrarAba('estoque')" data-aba="estoque">📦 Estoque</button>
    <button class="nav-btn" onclick="mostrarAba('retiradas')" data-aba="retiradas">🚜 Retiradas</button>
    <button class="nav-btn" onclick="mostrarAba('contas')" data-aba="contas">💰 Contas</button>
    <button class="nav-btn" onclick="mostrarAba('relatorios')" data-aba="relatorios">📈 Relatórios</button>
    <button class="nav-btn" onclick="mostrarAba('cadastros')" data-aba="cadastros">⚙️ Cadastros</button>
  </div>

  <div class="main" id="main-content">
    <div class="loading"><div class="spinner"></div> Carregando...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, signInAnonymously, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, collection, doc, addDoc, getDocs, updateDoc, deleteDoc,
  query, orderBy, Timestamp, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";


// ── CONFIG FIREBASE — usar a mesma config dos seus outros apps ──
const firebaseConfig = {
  apiKey: "AIzaSyDtmcibrocmj0Gc8bpTtXFUc2JTuN5CRjY",
  authDomain: "agroop-d73d4.firebaseapp.com",
  projectId: "agroop-d73d4",
  storageBucket: "agroop-d73d4.firebasestorage.app",
  messagingSenderId: "591049190246",
  appId: "1:591049190246:web:1f0211c97ff4ae8355b6a7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ── ESTADO ──
let usuarioAtual = null;
let perfilAtual = null;
let pedidos = [], estoque = [], retiradas = [], contas = [], talhoes = [], safras = [], fazendas = [], culturas = [];
let plantios = [], adubacoes = [], colheitas = [];
let compendio = null;     // cache de nomes de estoque_ins_produtos (carrega sob demanda)
let compendioDetalhado = null; // cache com todos os campos do compêndio
let entradasRaw = [];     // entradas reais da coleção estoque_ins_entradas (ACF Estoque)
let aplicacoesAgroOp = null; // cache das aplicações do AgroOp
const UNIDADES = ['kg', 'L', 'sc', 'un', 'cx', 'g', 'mL', 'ton'];
function nomesFazendas() { return fazendas.map(f=>f.nome); }

// ── UTILS ──
function fmt(n) { return Number(n||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtData(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('pt-BR');
}
function hoje() { return new Date().toISOString().split('T')[0]; }
function somarDias(dataStr, dias) {
  if (!dataStr) return '';
  const d = new Date(dataStr + 'T12:00:00');
  d.setDate(d.getDate() + (parseInt(dias)||0));
  return d.toISOString().split('T')[0];
}
function diasAte(ts) {
  if (!ts) return 9999;
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return Math.ceil((d - new Date()) / 86400000);
}
function classeVenc(ts) {
  const d = diasAte(ts);
  if (d < 0) return 'venc-hoje';
  if (d <= 7) return 'venc-proximo';
  return 'venc-ok';
}
function labelVenc(ts) {
  const d = diasAte(ts);
  if (d < 0) return `Vencido há ${Math.abs(d)}d`;
  if (d === 0) return 'Vence hoje!';
  if (d <= 7) return `Vence em ${d}d`;
  return fmtData(ts);
}
function toast(msg, tipo='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ativo' + (tipo==='erro' ? ' erro' : '');
  setTimeout(() => el.className = 'toast', 3500);
}
function normalizar(s) { return (s||'').toString().trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

// ── AUTH (sem senha — perfil escolhido na tela) ──
let perfilEscolhido = null;

window.entrarComoPerfil = async function(perfil) {
  perfilEscolhido = perfil;
  const erroEl = document.getElementById('login-erro');
  erroEl.textContent = '';
  try {
    if (!auth.currentUser) await signInAnonymously(auth);
    else iniciarSessao();
  } catch(e) {
    erroEl.textContent = 'Não foi possível entrar. Verifique a internet e tente novamente.';
  }
};

window.sair = async function() {
  perfilEscolhido = null;
  await signOut(auth);
};

function iniciarSessao() {
  usuarioAtual = auth.currentUser;
  perfilAtual = perfilEscolhido;
  document.getElementById('header-nome').textContent = perfilAtual === 'gestor' ? 'Gestor' : 'Funcionário';
  document.getElementById('header-perfil').textContent = perfilAtual;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').classList.add('ativo');
  if (perfilAtual === 'gestor') {
    document.getElementById('nav-gestor').style.display = 'flex';
    carregarDados().then(() => mostrarAba('dashboard'));
  } else {
    document.getElementById('nav-gestor').style.display = 'none';
    renderOperador();
  }
}

onAuthStateChanged(auth, async (user) => {
  if (user && perfilEscolhido) {
    iniciarSessao();

});

    getDocs(query(collection(db, 'insumos_pedidos'), orderBy('criado_em', 'desc'))),
    getDocs(collection(db, 'estoque_ins_entradas')),
    getDocs(query(collection(db, 'insumos_retiradas'), orderBy('data', 'desc'))),
    getDocs(query(collection(db, 'insumos_contas'), orderBy('vencimento'))),
    getDocs(query(collection(db, 'insumos_talhoes'), orderBy('nome'))),
    getDocs(query(collection(db, 'insumos_safras'), orderBy('nome'))),
    getDocs(query(collection(db, 'insumos_fazendas'), orderBy('nome'))),
    getDocs(query(collection(db, 'insumos_culturas'), orderBy('nome'))),
    getDocs(query(collection(db, 'insumos_campo_plantio'), orderBy('data', 'desc'))),
    getDocs(query(collection(db, 'insumos_campo_adubacao'), orderBy('data', 'desc'))),
    getDocs(query(collection(db, 'insumos_campo_colheita'), orderBy('data', 'desc')))
  ]);
  pedidos = pSnap.docs.map(d => ({id: d.id, ...d.data()}));
  entradasRaw = enSnap.docs.map(d => ({id: d.id, ...d.data()}));
  retiradas = rSnap.docs.map(d => ({id: d.id, ...d.data()}));
  contas = cSnap.docs.map(d => ({id: d.id, ...d.data()}));
  talhoes = tSnap.docs.map(d => ({id: d.id, ...d.data()}));
  safras = sSnap.docs.map(d => ({id: d.id, ...d.data()}));
  fazendas = fSnap.docs.map(d => ({id: d.id, ...d.data()}));
  culturas = cuSnap.docs.map(d => ({id: d.id, ...d.data()}));
  plantios = plSnap.docs.map(d => ({id: d.id, ...d.data()}));
  adubacoes = adSnap.docs.map(d => ({id: d.id, ...d.data()}));
  colheitas = colSnap.docs.map(d => ({id: d.id, ...d.data()}));
  // Fallback: se ainda não cadastrou fazendas, usa as 3 conhecidas como sugestão inicial
  if (fazendas.length === 0) {
    fazendas = [{id:'_tmp1',nome:'Rodeio'},{id:'_tmp2',nome:'Córrego das Flores'},{id:'_tmp3',nome:'Palmeiras'}];
  }
  recalcularEstoque();
}

// Estoque real = soma das entradas (compras) do ACF Estoque, menos as retiradas lançadas aqui no Insumos.
// O ACF Estoque nunca teve "saídas" para insumos — essa é a peça que o ACF Insumos adiciona.
function recalcularEstoque() {
  const mapa = {};
  entradasRaw.forEach(e => {
    const nome = (e.prodNome || '').trim();
    if (!nome) return;
    const k = normalizar(nome);
    if (!mapa[k]) mapa[k] = { produto: nome, unidade: e.unid||'', qtdEntradas:0, valorEntradas:0, prodId: e.prodId||'' };
    const qtd = parseFloat(e.qtd)||0;
    const preco = parseFloat(e.preco)||0;
    mapa[k].qtdEntradas += qtd;
    mapa[k].valorEntradas += qtd*preco;
    if (e.unid) mapa[k].unidade = e.unid;
    if (e.prodId) mapa[k].prodId = e.prodId;
    const dtVal = e.dt?.toDate ? e.dt.toDate() : (e.dt ? new Date(e.dt) : null);
    if (dtVal && (!mapa[k].ultimaEntradaDt || dtVal > mapa[k].ultimaEntradaDt)) mapa[k].ultimaEntradaDt = dtVal;
  });
  const qtdRetiradaPorProduto = {};
  retiradas.forEach(r => {
    const k = normalizar(r.produto);
    qtdRetiradaPorProduto[k] = (qtdRetiradaPorProduto[k]||0) + (parseFloat(r.quantidade)||0);
  });
  estoque = Object.entries(mapa).map(([k, m]) => ({
    id: k, produto: m.produto, unidade: m.unidade, prodId: m.prodId,
    custo_medio: m.qtdEntradas>0 ? m.valorEntradas/m.qtdEntradas : 0,
    quantidade: m.qtdEntradas - (qtdRetiradaPorProduto[k]||0),
    ultima_entrada: m.ultimaEntradaDt ? m.ultimaEntradaDt.toLocaleDateString('pt-BR') : ''
  })).sort((a,b) => a.produto.localeCompare(b.produto));
}

// Carrega o compêndio (estoque_ins_produtos) só quando necessário, com cache
async function carregarCompendio() {
  if (compendio) return compendio;
  try {
    const snap = await getDocs(collection(db, 'estoque_ins_produtos'));
    compendioDetalhado = snap.docs.map(d => ({id: d.id, ...d.data()}));
    compendio = compendioDetalhado.map(dt => dt.nome || '').filter(Boolean).sort();
  } catch(e) {
    compendio = []; compendioDetalhado = [];
  }
  return compendio;
}

// Carrega aplicações do AgroOp para previsão de cobertura
async function carregarAplicacoes() {
  if (aplicacoesAgroOp) return aplicacoesAgroOp;
  try {
    const snap = await getDocs(collection(db, 'aplicacoes'));
    aplicacoesAgroOp = snap.docs.map(d => ({id: d.id, ...d.data()}));
  } catch(e) { aplicacoesAgroOp = []; }
  return aplicacoesAgroOp;
}

// ══════════════ PREVISÃO DE COBERTURA ══════════════
async function renderCobertura() {
  document.getElementById('main-content').innerHTML = `<div class="loading"><div class="spinner"></div> Cruzando dados do AgroOp...</div>`;
  aplicacoesAgroOp = null; // força recarga para pegar planejamentos novos
  await carregarAplicacoes();

  // Aplicações planejadas = não finalizadas OU com data futura
  const hojeStr = hoje();
  const planejadas = aplicacoesAgroOp.filter(a => !a.finalizadoEm || (a.data && a.data >= hojeStr));

  // Necessidade por produto: dose × área
  const necessidade = {}; // chave normalizada -> {produto, total, semArea: n}
  planejadas.forEach(a => {
    // tenta achar área: campo direto ou via talhão cadastrado
    let areaHa = parseFloat(a.area || a.areaHa || a.area_ha || a.hectares) || 0;
    if (!areaHa && a.talhao) {
      const t = talhoes.find(t => normalizar(t.nome) === normalizar(a.talhao) && (!a.fazenda || normalizar(t.fazenda||'') === normalizar((a.fazenda||'').replace('Fazenda ',''))));
      if (t) areaHa = parseFloat(t.area_ha) || 0;
    }
    (a.produtos||[]).forEach(p => {
      const nome = p.produto || p.nome || '';
      if (!nome) return;
      const k = normalizar(nome);
      if (!necessidade[k]) necessidade[k] = { produto: nome, total: 0, aplicacoesSemArea: 0, dosesSemArea: [] };
      const dose = parseFloat(String(p.dose).replace(',','.')) || 0;
      if (areaHa > 0) {
        necessidade[k].total += dose * areaHa;
      } else {
        necessidade[k].aplicacoesSemArea++;
        necessidade[k].dosesSemArea.push(dose);
      }
    });
  });

  // Pendente nos pedidos
  const pendentePedidos = {};
  pedidos.filter(p => p.status !== 'entregue_total' && p.status !== 'cancelado').forEach(p => {
    (p.itens||[]).forEach(it => {
      const k = normalizar(it.produto);
      const pend = (it.quantidade||0) - (it.quantidade_recebida||0);
      if (pend > 0) pendentePedidos[k] = (pendentePedidos[k]||0) + pend;
    });
  });

  // Montar linhas
  const chaves = Object.keys(necessidade);
  let rows = chaves.map(k => {
    const n = necessidade[k];
    const est = estoque.find(e => normalizar(e.produto) === k);
    const emEstoque = est ? (est.quantidade||0) : 0;
    const unidade = est ? est.unidade : '';
    const aChegar = pendentePedidos[k] || 0;
    const saldo = emEstoque + aChegar - n.total;
    return { ...n, emEstoque, aChegar, saldo, unidade, k };
  }).sort((a,b) => a.saldo - b.saldo);

  const faltando = rows.filter(r => r.saldo < 0).length;
  const semArea = rows.filter(r => r.aplicacoesSemArea > 0).length;

  document.getElementById('main-content').innerHTML = `
    <div class="sec-header">
      <div class="sec-titulo">🔮 Previsão de Cobertura de Estoque</div>
      <button class="btn btn-secondary btn-sm" onclick="mostrarAba('cobertura')">↻ Atualizar</button>
    </div>
    <p style="font-size:13px;color:var(--cinza);margin-bottom:16px">
      Baseado em <strong>${planejadas.length}</strong> aplicações planejadas no AgroOp (não finalizadas ou futuras),
      comparando necessidade (dose × área) com estoque atual + pedidos a receber.
    </p>
    ${faltando > 0 ? `
    <div style="background:#fee2e2;border:1px solid #fca5a5;border-radius:var(--radius);padding:14px 18px;margin-bottom:16px">
      🔴 <strong>${faltando} produto(s) sem cobertura suficiente</strong> — considere fazer pedido de compra.
    </div>` : chaves.length > 0 ? `
    <div style="background:#d1fae5;border:1px solid #6ee7b7;border-radius:var(--radius);padding:14px 18px;margin-bottom:16px">
      ✅ <strong>Todos os produtos planejados têm cobertura!</strong>
    </div>` : ''}
    ${semArea > 0 ? `
    <div style="background:#fef3c7;border:1px solid #fcd34d;border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;font-size:13px">
      ⚠️ ${semArea} produto(s) têm aplicações sem área definida (nem no AgroOp, nem no cadastro de talhões) — a necessidade pode estar subestimada.
      Cadastre os talhões com área em <strong>⚙️ Cadastros</strong>.
    </div>` : ''}

    ${chaves.length === 0 ? `
    <div class="tabela-wrap"><div class="tabela-vazia">Nenhuma aplicação planejada encontrada no AgroOp.<br>
    Crie um planejamento no AgroOp e ele aparecerá aqui automaticamente.</div></div>` : `
    <div class="tabela-wrap" style="border-radius:var(--radius);overflow:hidden">
      <div class="cob-row header">
        <span>Produto</span><span>Necessário</span><span>Em Estoque</span><span>A Receber</span><span>Saldo</span>
      </div>
      ${rows.map(r => `
        <div class="cob-row" style="${r.saldo<0?'background:#fef2f2':''}">
          <span><strong>${r.produto}</strong>${r.aplicacoesSemArea>0?` <span class="badge badge-amarelo" title="aplicações sem área">⚠ s/área</span>`:''}</span>
          <span>${fmt(r.total)} ${r.unidade}</span>
          <span>${fmt(r.emEstoque)}</span>
          <span style="color:var(--azul)">${r.aChegar>0?'+'+fmt(r.aChegar):'—'}</span>
          <span style="font-weight:700;color:${r.saldo<0?'var(--vermelho)':'var(--verde)'}">
            ${r.saldo<0?'🔴 Faltam '+fmt(Math.abs(r.saldo)):'✅ +'+fmt(r.saldo)}
          </span>
        </div>
      `).join('')}
    </div>
    <div style="margin-top:16px">
      <button class="btn btn-primary" onclick="exportarCobertura()">📥 Exportar Excel</button>
    </div>`}
  `;
  window._coberturaRows = rows;
}

window.exportarCobertura = function() {
  const rows = window._coberturaRows || [];
  exportarExcel('Previsao_Cobertura',
    ['Produto','Necessário','Unidade','Em Estoque','A Receber (pedidos)','Saldo'],
    rows.map(r => [r.produto, r.total, r.unidade, r.emEstoque, r.aChegar, r.saldo])
  );
};

}

window.salvarPedido = async function() {
  const fornecedor = document.getElementById('ped-fornecedor').value.trim();
  if (!fornecedor) { toast('Informe o fornecedor.', 'erro'); return; }
  const itensValidos = itensPedidoTemp.filter(i => i.produto && i.quantidade);
  if (itensValidos.length === 0) { toast('Adicione pelo menos um item.', 'erro'); return; }
  const itens = itensValidos.map(i => ({
    produto: i.produto.trim(), quantidade: parseFloat(i.quantidade)||0, quantidade_recebida: 0,
    unidade: i.unidade, preco_unit: parseFloat(i.preco_unit)||0,
    total: (parseFloat(i.quantidade)||0)*(parseFloat(i.preco_unit)||0)
  }));
  const valor_total = itens.reduce((s,i) => s+i.total, 0);
  const pedido = {
    fornecedor, fazenda: document.getElementById('ped-fazenda').value,
    data_pedido: document.getElementById('ped-data').value,
    previsao_entrega: document.getElementById('ped-entrega').value,
    obs: document.getElementById('ped-obs').value,
    itens, valor_total, status: 'pendente',
    criado_em: Timestamp.now(), criado_por: usuarioAtual.uid
  };
  try {
    const ref = await addDoc(collection(db, 'insumos_pedidos'), pedido);
    pedidos.unshift({id: ref.id, ...pedido});
    fecharModal('modal-pedido');
    toast('Pedido criado com sucesso!');
    // ── MELHORIA 1: oferecer conta a pagar automática ──
    if (valor_total > 0) abrirContaAutomatica(ref.id, fornecedor, valor_total);
    else renderPedidos();
  } catch(e) { toast('Erro ao salvar: ' + e.message, 'erro'); }
};

window.salvarContaAutomatica = async function(pedidoId, fornecedor, valor) {
  const venc = document.getElementById('ca-venc').value;
  const parcelas = parseInt(document.getElementById('ca-parcelas').value)||1;
  if (!venc) { toast('Informe o vencimento.','erro'); return; }
  try {
    for (let i = 0; i < parcelas; i++) {
      const dataVenc = new Date(venc + 'T12:00:00');
      dataVenc.setMonth(dataVenc.getMonth() + i);
      const conta = {
        fornecedor, descricao: `Pedido de compra${parcelas>1?` (${i+1}/${parcelas})`:''}`,
        valor_total: valor/parcelas, vencimento: Timestamp.fromDate(dataVenc),
        pedido_id: pedidoId, pago: false, criado_em: Timestamp.now()
      };
      const ref = await addDoc(collection(db,'insumos_contas'), conta);
      contas.push({id: ref.id, ...conta});
    }
    contas.sort((a,b) => (a.vencimento?.toDate?a.vencimento.toDate():new Date(a.vencimento)) - (b.vencimento?.toDate?b.vencimento.toDate():new Date(b.vencimento)));
    fecharModal('modal-conta-auto');
    toast(parcelas>1?`${parcelas} parcelas geradas no contas a pagar!`:'Conta a pagar gerada!');
    renderPedidos();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

  const p = pedidos.find(x => x.id === id);

          }).join('')}
        </div>
        <p style="font-size:12px;color:var(--cinza)">* Itens recebidos entram como entrada no ACF Estoque (custo médio ponderado calculado automaticamente).</p>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="fecharModal('modal-baixa')">Cancelar</button>
          <button class="btn btn-primary" id="btn-confirma-baixa" onclick="confirmarBaixa('${id}')">Confirmar Recebimento</button>
        </div>
      </div>
    </div>`);
  carregarCompendio();

window.confirmarBaixa = async function(id) {
  const p = pedidos.find(x => x.id === id);
  if (!p) return;
  const btn = document.getElementById('btn-confirma-baixa');
  btn.disabled = true; btn.textContent = 'Salvando...';
  const itensPend = (p.itens||[]).filter(it => (it.quantidade||0) - (it.quantidade_recebida||0) > 0);
  const dataReceb = document.getElementById('baixa-data').value;
  const batch = writeBatch(db);
  let totalRecebido = 0;
  const novosItens = [...p.itens];

  itensPend.forEach((it, i) => {
    const qtdReceber = parseFloat(document.getElementById(`baixa-qtd-${i}`)?.value) || 0;
    if (qtdReceber <= 0) return;
    totalRecebido += qtdReceber;
    const idx = novosItens.findIndex(x => x.produto === it.produto);
    if (idx >= 0) novosItens[idx] = { ...novosItens[idx], quantidade_recebida: (novosItens[idx].quantidade_recebida||0) + qtdReceber };
    // tenta casar com o compêndio pra herdar prodId/cat/ia (opcional, não bloqueia se não achar)
    const match = (compendioDetalhado||[]).find(c => normalizar(c.nome||'') === normalizar(it.produto));
    const novaEntrada = {
      cat: match?.cat || '', dt: Timestamp.now(), forn: p.fornecedor, funcId: '', funcNome: '',
      ia: match?.ia || '', nf: '', preco: it.preco_unit||0, prodId: match?.id || '',
      prodNome: it.produto, qtd: qtdReceber, unid: it.unidade
    };
    const eRef = doc(collection(db, 'estoque_ins_entradas'));
    batch.set(eRef, novaEntrada);
    entradasRaw.push({ id: eRef.id, ...novaEntrada });
  });

  if (totalRecebido === 0) { toast('Informe a quantidade a receber.', 'erro'); btn.disabled=false; btn.textContent='Confirmar Recebimento'; return; }

  const todosEntregues = novosItens.every(it => (it.quantidade_recebida||0) >= (it.quantidade||0));
  const novoStatus = todosEntregues ? 'entregue_total' : 'parcial';

  batch.update(doc(db, 'insumos_pedidos', id), { itens: novosItens, status: novoStatus });
  try {
    await batch.commit();
    const pi = pedidos.findIndex(x => x.id === id);
    if (pi >= 0) { pedidos[pi].itens = novosItens; pedidos[pi].status = novoStatus; }
    recalcularEstoque();
    fecharModal('modal-baixa');
    toast('Recebimento registrado no ACF Estoque!');
    renderPedidos();
  } catch(e) { toast('Erro: ' + e.message, 'erro'); btn.disabled=false; btn.textContent='Confirmar Recebimento'; }
};

  const lista = retiradas.filter(r => {
    const d = r.data?.toDate ? r.data.toDate() : new Date(r.data);

    return (!de || dStr >= de) && (!ate || dStr <= ate) && (!faz || r.fazenda === faz) && (!prod || r.produto.toLowerCase().includes(prod));

  const el = document.getElementById('lista-retiradas');

  const totalCusto = lista.reduce((s,r)=>s+(r.custo_total||0),0);

  el.innerHTML = `

    </table></div>
    <div style="margin-top:14px"><button class="btn btn-secondary btn-sm" onclick="exportarRetiradas()">📥 Exportar Excel</button></div>`;
  window._retiradasFiltradas = lista;

window.atualizarTalhoes = function() {
  const faz = document.getElementById('ret-fazenda').value;
  const sel = document.getElementById('ret-talhao');
  const lista = talhoes.filter(t => !faz || normalizar(t.fazenda||'') === normalizar(faz));
  sel.innerHTML = `<option value="">—</option>` + lista.map(t=>`<option value="${t.nome}">${t.nome}${t.area_ha?` (${fmt(t.area_ha)} ha)`:''}</option>`).join('');
};

window.atualizarInfoEstoque = function() {
  const sel = document.getElementById('ret-produto').value;
  const el = document.getElementById('ret-info');
  if (!sel) { el.style.display='none'; return; }
  const est = estoque.find(e => e.id === sel);
  if (!est) return;
  el.style.display = 'block';
  document.getElementById('ret-info-qtd').textContent = `${fmt(est.quantidade)} ${est.unidade}`;
  const custoEl = document.getElementById('ret-info-custo');
  if (custoEl) custoEl.textContent = `R$ ${fmt(est.custo_medio||0)}/${est.unidade}`;
};

window.confirmarRetirada = async function(simples) {
  const prodId = document.getElementById('ret-produto').value;
  const qtd = parseFloat(document.getElementById('ret-qtd').value)||0;
  const fazenda = document.getElementById('ret-fazenda').value;
  if (!prodId) { toast('Selecione o produto.','erro'); return; }
  if (qtd <= 0) { toast('Informe a quantidade.','erro'); return; }
  if (!fazenda) { toast('Selecione a fazenda.','erro'); return; }
  const est = estoque.find(e => e.id === prodId);
  if (!est) return;
  if (qtd > est.quantidade) { toast(`Quantidade maior que o disponível (${fmt(est.quantidade)} ${est.unidade}).`,'erro'); return; }
  const custo_total = qtd * (est.custo_medio||0);
  const retirada = {
    produto: est.produto, unidade: est.unidade, quantidade: qtd, fazenda,
    talhao: document.getElementById('ret-talhao')?.value||'',
    cultura: document.getElementById('ret-cultura')?.value||'',
    safra: document.getElementById('ret-safra')?.value||'',
    obs: document.getElementById('ret-obs')?.value||'',
    custo_unitario: est.custo_medio||0, custo_total,
    data: Timestamp.now(), operador_uid: usuarioAtual.uid
  };
  try {
    const ref = await addDoc(collection(db,'insumos_retiradas'), retirada);
    retiradas.unshift({id: ref.id, ...retirada});
    recalcularEstoque();
    fecharModal('modal-retirada');
    toast('Retirada registrada com sucesso!');
    if (simples) renderOperador(); else renderRetiradas();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

function renderContas() {
  document.getElementById('main-content').innerHTML = `
    <div class="sec-header">
      <div class="sec-titulo">💰 Contas a Pagar</div>
      <button class="btn btn-primary" onclick="abrirModalConta()">+ Nova Conta</button>
    </div>
    <div class="filtros">
      <select id="filt-conta-status" onchange="filtrarContas()">
        <option value="pendente">Pendentes</option><option value="pago">Pagas</option><option value="">Todas</option>
      </select>
      <input type="text" id="filt-conta-forn" oninput="filtrarContas()" placeholder="Fornecedor...">
    </div>
    <div id="lista-contas"></div>`;
  filtrarContas();
}

window.filtrarContas = function() {
  const status = document.getElementById('filt-conta-status')?.value;
  const forn = (document.getElementById('filt-conta-forn')?.value||'').toLowerCase();
  const lista = contas.filter(c =>
    (status === '' || (status === 'pago' ? c.pago === true : c.pago !== true)) &&
    (!forn || (c.fornecedor||'').toLowerCase().includes(forn)));
  const el = document.getElementById('lista-contas');
  if (!el) return;
  const totalPend = lista.filter(c=>!c.pago).reduce((s,c)=>s+(c.valor_total||0),0);
  el.innerHTML = `
    <div style="margin-bottom:12px;font-size:13px;color:var(--cinza)">${lista.length} registros ${totalPend>0?`— Pendente: <strong>R$ ${fmt(totalPend)}</strong>`:''}</div>
    <div class="tabela-wrap"><table>
      <thead><tr><th>Fornecedor</th><th>Descrição</th><th>Valor</th><th>Vencimento</th><th>Status</th><th>Ações</th></tr></thead>
      <tbody>
        ${lista.length === 0 ? '<tr><td colspan="6" class="tabela-vazia">Nenhuma conta encontrada</td></tr>' :
        lista.map(c => `<tr>
          <td>${c.fornecedor||'—'}</td><td>${c.descricao||'—'}</td>
          <td style="font-weight:600">R$ ${fmt(c.valor_total)}</td>
          <td class="${c.pago?'venc-ok':classeVenc(c.vencimento)}">${c.pago ? fmtData(c.vencimento) : labelVenc(c.vencimento)}</td>
          <td>${c.pago ? '<span class="badge badge-verde">Pago</span>' : '<span class="badge badge-laranja">Pendente</span>'}</td>
          <td style="white-space:nowrap">
            ${!c.pago ? `<button class="btn btn-sm btn-primary" onclick="marcarPago('${c.id}')">Pagar</button>` : ''}
            <button class="btn btn-sm btn-secondary" style="margin-left:6px" onclick="excluirConta('${c.id}')">✕</button>
          </td></tr>`).join('')}
      </tbody>
    </table></div>
    <div style="margin-top:14px"><button class="btn btn-secondary btn-sm" onclick="exportarContas()">📥 Exportar Excel</button></div>`;
  window._contasFiltradas = lista;
};

window.exportarContas = function() {
  const lista = window._contasFiltradas || contas;
  exportarExcel('Contas_a_Pagar', ['Fornecedor','Descrição','Valor (R$)','Vencimento','Status'],
    lista.map(c => [c.fornecedor||'', c.descricao||'', c.valor_total||0, fmtData(c.vencimento), c.pago?'Pago':'Pendente']));
};

window.abrirModalConta = function() {
  document.body.insertAdjacentHTML('beforeend', `

        <div class="form-group"><label>Descrição</label><input type="text" id="cnt-desc" placeholder="Ex: NF 456"></div>
        <div class="form-row">
          <div class="form-group"><label>Valor Total (R$) *</label><input type="number" id="cnt-valor" min="0" step="0.01"></div>
          <div class="form-group"><label>1º Vencimento *</label><input type="date" id="cnt-venc"></div>
        </div>
        <div class="form-group"><label>Nº Parcelas</label><input type="number" id="cnt-parcelas" value="1" min="1" max="12"></div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="fecharModal('modal-conta')">Cancelar</button>
          <button class="btn btn-primary" onclick="salvarConta()">Salvar</button>
        </div>
      </div>
    </div>`);
};

window.salvarConta = async function() {
  const forn = document.getElementById('cnt-forn').value.trim();
  const valor = parseFloat(document.getElementById('cnt-valor').value)||0;
  const venc = document.getElementById('cnt-venc').value;
  const parcelas = parseInt(document.getElementById('cnt-parcelas').value)||1;
  if (!forn || !valor || !venc) { toast('Preencha fornecedor, valor e vencimento.','erro'); return; }
  try {
    for (let i = 0; i < parcelas; i++) {
      const dataVenc = new Date(venc + 'T12:00:00');
      dataVenc.setMonth(dataVenc.getMonth() + i);
      const conta = {
        fornecedor: forn,
        descricao: document.getElementById('cnt-desc').value + (parcelas>1?` (${i+1}/${parcelas})`:''),
        valor_total: valor/parcelas, vencimento: Timestamp.fromDate(dataVenc),
        pago: false, criado_em: Timestamp.now()
      };
      const ref = await addDoc(collection(db,'insumos_contas'), conta);
      contas.push({id: ref.id, ...conta});
    }
    contas.sort((a,b) => (a.vencimento?.toDate?a.vencimento.toDate():new Date(a.vencimento)) - (b.vencimento?.toDate?b.vencimento.toDate():new Date(b.vencimento)));
    fecharModal('modal-conta');
    toast(parcelas>1?`${parcelas} parcelas criadas!`:'Conta registrada!');
    renderContas();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

window.marcarPago = async function(id) {
  try {
    await updateDoc(doc(db,'insumos_contas',id), { pago: true, data_pagamento: Timestamp.now() });
    const c = contas.find(x=>x.id===id);
    if (c) c.pago = true;
    toast('Conta marcada como paga!');
    renderContas();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

window.excluirConta = async function(id) {
  if (!confirm('Excluir esta conta?')) return;
  try {
    await deleteDoc(doc(db,'insumos_contas',id));
    contas.splice(contas.findIndex(x=>x.id===id),1);
    toast('Conta excluída.');
    renderContas();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

window.salvarSafra = async function() {
  const nome = document.getElementById('saf-nome').value.trim();
  if (!nome) { toast('Informe o nome.','erro'); return; }
  if (safras.find(s => normalizar(s.nome) === normalizar(nome))) { toast('Safra já cadastrada.','erro'); return; }
  try {
    const ref = await addDoc(collection(db,'insumos_safras'), { nome });
    safras.push({id: ref.id, nome});
    safras.sort((a,b)=>a.nome.localeCompare(b.nome));
    fecharModal('modal-safra');
    toast('Safra cadastrada!');
    renderCadastros();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

window.excluirSafra = async function(id) {
  if (!confirm('Excluir esta safra? (não afeta retiradas já registradas)')) return;
  try {
    await deleteDoc(doc(db,'insumos_safras',id));
    safras.splice(safras.findIndex(x=>x.id===id),1);
    renderCadastros();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

window.atualizarPrevisaoColheita = function() {
  const data = document.getElementById('pl-data')?.value;
  const ciclo = parseFloat(document.getElementById('pl-ciclo')?.value)||0;
  const campo = document.getElementById('pl-previsao-colheita');
  if (campo) campo.value = (data && ciclo>0) ? somarDias(data, ciclo) : '';

window.salvarPlantio = async function(id) {
  const fazenda = document.getElementById('pl-fazenda').value;
  const talhao = document.getElementById('pl-talhao').value;
  const cultura = document.getElementById('pl-cultura').value;
  if (!fazenda || !talhao || !cultura) { toast('Preencha fazenda, talhão e cultura.','erro'); return; }
  const data = document.getElementById('pl-data').value;
  const ciclo_dias = parseFloat(document.getElementById('pl-ciclo').value)||0;
  const reg = {
    data, fazenda, talhao, cultura,
    safra: document.getElementById('pl-safra').value,
    cultivar: document.getElementById('pl-cultivar').value,
    ciclo_dias,
    data_prevista_colheita: ciclo_dias>0 ? somarDias(data, ciclo_dias) : '',
    populacao: parseFloat(document.getElementById('pl-populacao').value)||0,
    espacamento: parseFloat(document.getElementById('pl-espacamento').value)||0,
    obs: document.getElementById('pl-obs').value
  };
  try {
    if (id) {
      await updateDoc(doc(db,'insumos_campo_plantio',id), reg);
      const i = plantios.findIndex(x=>x.id===id);
      if (i>=0) plantios[i] = { ...plantios[i], ...reg };
      toast('Plantio atualizado!');
    } else {
      reg.status = 'planejado'; reg.criado_em = Timestamp.now();
      const ref = await addDoc(collection(db,'insumos_campo_plantio'), reg);
      plantios.unshift({id: ref.id, ...reg});
      toast('Plantio planejado!');
    }
    fecharModal('modal-plantio');
    renderPlantio();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

// Gera o HTML dos campos de data (fixa / X dias após plantio / X dias após outra aplicação)
function renderModoDataCampos(valores) {
  valores = valores || {};
  const fazenda = document.getElementById('ad-fazenda')?.value||'';
  const talhao = document.getElementById('ad-talhao')?.value||'';
  const modo = document.getElementById('ad-modo-data')?.value || valores.modo_data || 'fixa';
  if (modo === 'plantio') {
    const opcoes = plantios.filter(p => normalizar(p.fazenda||'')===normalizar(fazenda) && normalizar(p.talhao||'')===normalizar(talhao));
    if (opcoes.length===0) return `<p style="font-size:12px;color:var(--laranja)">Nenhum plantio cadastrado para esse talhão ainda. Cadastre o plantio primeiro, ou use Data fixa.</p>`;
    return `
      <div class="form-row">
        <div class="form-group"><label>Plantio de referência</label>
          <select id="ad-ref-plantio">${opcoes.map(p=>`<option value="${p.id}" ${p.id===valores.ref_plantio_id?'selected':''}>${p.cultura||'Plantio'} — ${p.data} (${p.cultivar||''})</option>`).join('')}</select></div>
        <div class="form-group"><label>Dias após o plantio</label><input type="number" id="ad-dias-apos" value="${valores.dias_apos!=null?valores.dias_apos:''}" min="0" step="1"></div>
      </div>`;
  }
  if (modo === 'aplicacao') {
    const opcoes = adubacoes.filter(a => normalizar(a.fazenda||'')===normalizar(fazenda) && normalizar(a.talhao||'')===normalizar(talhao) && a.id!==valores.idAtual);
    if (opcoes.length===0) return `<p style="font-size:12px;color:var(--laranja)">Nenhum outro planejamento nesse talhão ainda para usar como referência.</p>`;
    return `
      <div class="form-row">
        <div class="form-group"><label>Aplicação de referência</label>
          <select id="ad-ref-aplicacao">${opcoes.map(a=>`<option value="${a.id}" ${a.id===valores.ref_aplicacao_id?'selected':''}>${a.produto} — ${a.data}</option>`).join('')}</select></div>
        <div class="form-group"><label>Dias após essa aplicação</label><input type="number" id="ad-dias-apos" value="${valores.dias_apos!=null?valores.dias_apos:''}" min="0" step="1"></div>
      </div>`;
  }
  return `<div class="form-group"><label>Data Planejada *</label><input type="date" id="ad-data" value="${valores.data||hoje()}"></div>`;
}

window.salvarAdubacao = async function(id) {
  const fazenda = document.getElementById('ad-fazenda').value;
  const talhao = document.getElementById('ad-talhao').value;
  const produto = document.getElementById('ad-produto').value.trim();
  if (!fazenda || !talhao || !produto) { toast('Preencha fazenda, talhão e produto.','erro'); return; }

  const modo_data = document.getElementById('ad-modo-data').value;
  let dataFinal = '', ref_plantio_id = '', ref_aplicacao_id = '', dias_apos = 0;
  if (modo_data === 'fixa') {
    dataFinal = document.getElementById('ad-data')?.value || '';
    if (!dataFinal) { toast('Informe a data.','erro'); return; }
  } else if (modo_data === 'plantio') {
    ref_plantio_id = document.getElementById('ad-ref-plantio')?.value || '';
    dias_apos = parseFloat(document.getElementById('ad-dias-apos')?.value)||0;
    const pRef = plantios.find(p=>p.id===ref_plantio_id);
    if (!pRef) { toast('Selecione o plantio de referência.','erro'); return; }
    dataFinal = somarDias(pRef.data, dias_apos);
  } else if (modo_data === 'aplicacao') {
    ref_aplicacao_id = document.getElementById('ad-ref-aplicacao')?.value || '';
    dias_apos = parseFloat(document.getElementById('ad-dias-apos')?.value)||0;
    const aRef = adubacoes.find(x=>x.id===ref_aplicacao_id);
    if (!aRef) { toast('Selecione a aplicação de referência.','erro'); return; }
    dataFinal = somarDias(aRef.data, dias_apos);
  }

  const reg = {
    data: dataFinal, fazenda, talhao,
    safra: document.getElementById('ad-safra').value, categoria: document.getElementById('ad-categoria').value,
    produto, dose: parseFloat(document.getElementById('ad-dose').value)||0,
    unidade: document.getElementById('ad-unidade').value, obs: document.getElementById('ad-obs').value,
    modo_data, ref_plantio_id, ref_aplicacao_id, dias_apos
  };
  try {
    if (id) {
      await updateDoc(doc(db,'insumos_campo_adubacao',id), reg);
      const i = adubacoes.findIndex(x=>x.id===id);
      if (i>=0) adubacoes[i] = { ...adubacoes[i], ...reg };
      toast('Planejamento atualizado!');
    } else {
      reg.status = 'planejado'; reg.criado_em = Timestamp.now();
      const ref = await addDoc(collection(db,'insumos_campo_adubacao'), reg);
      adubacoes.unshift({id: ref.id, ...reg});
      toast('Planejamento salvo!');
    }
    fecharModal('modal-adubacao');
    renderAdubacao();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

// Recalcula a data de um item "X dias após..." com base no valor atual da referência
// (útil se a data do plantio ou da aplicação-base mudou depois que este item foi criado)
window.recalcularDataAdubacao = async function(id) {
  const a = adubacoes.find(x=>x.id===id);
  if (!a || !a.modo_data || a.modo_data==='fixa') return;
  let novaData = a.data;
  if (a.modo_data==='plantio') {
    const p = plantios.find(x=>x.id===a.ref_plantio_id);
    if (!p) { toast('Plantio de referência não encontrado (pode ter sido excluído).','erro'); return; }
    novaData = somarDias(p.data, a.dias_apos);
  } else if (a.modo_data==='aplicacao') {
    const ref = adubacoes.find(x=>x.id===a.ref_aplicacao_id);
    if (!ref) { toast('Aplicação de referência não encontrada (pode ter sido excluída).','erro'); return; }
    novaData = somarDias(ref.data, a.dias_apos);
  }
  if (novaData === a.data) { toast('A data já está atualizada.'); return; }
  try {
    await updateDoc(doc(db,'insumos_campo_adubacao',id), { data: novaData });
    a.data = novaData;
    toast('Data recalculada para '+novaData);
    renderAdubacao();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

// Envia o planejamento para o AgroOp (cria doc na coleção "aplicacoes")
window.enviarAoOperador = async function(id) {
  const a = adubacoes.find(x=>x.id===id);
  if (!a) return;
  if (!confirm(`Enviar "${a.produto}" (${a.talhao}) para o AgroOp?`)) return;
  try {
    const nomeFazendaAgroOp = a.fazenda.startsWith('Fazenda ') ? a.fazenda : `Fazenda ${a.fazenda}`;
    const aplicacao = {
      data: a.data, fazenda: nomeFazendaAgroOp, talhao: a.talhao,
      produtos: [{ produto: a.produto, dose: String(a.dose||'') }],
      obs: a.obs||'', status: 'Pendente',
      criadoEm: new Date().toISOString()
    };
    const ref = await addDoc(collection(db,'aplicacoes'), aplicacao);
    await updateDoc(doc(db,'aplicacoes',ref.id), { id: ref.id });
    await updateDoc(doc(db,'insumos_campo_adubacao',id), { status: 'enviado_operador', agroop_id: ref.id });
    a.status = 'enviado_operador'; a.agroop_id = ref.id;
    aplicacoesAgroOp = null; // invalida cache
    toast('Enviado ao AgroOp! O operador já pode ver no app dele.');
    renderAdubacao();
  } catch(e) { toast('Erro ao enviar: '+e.message,'erro'); }
};

// Concluir sem passar pelo operador (ex: já foi feito, só registrando)
window.concluirDireto = async function(id) {
  const data_conclusao = prompt('Data de conclusão (DD/MM/AAAA ou deixe vazio para hoje):','');
  const dataFinal = data_conclusao ? data_conclusao : hoje();
  try {
    await updateDoc(doc(db,'insumos_campo_adubacao',id), { status: 'concluido', data_conclusao: dataFinal });
    const a = adubacoes.find(x=>x.id===id);
    if (a) { a.status='concluido'; a.data_conclusao=dataFinal; }
    toast('Registrado como concluído!');
    renderAdubacao();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

// Verifica no AgroOp se algum item "enviado_operador" já foi finalizado, e sincroniza o status
async function verificarConclusoesAgroOp() {
  const pendentesEnvio = adubacoes.filter(a => a.status === 'enviado_operador' && a.agroop_id);
  if (pendentesEnvio.length === 0) return false;
  await carregarAplicacoes();
  let mudou = false;
  for (const a of pendentesEnvio) {
    const doc_agroop = aplicacoesAgroOp.find(x => x.id === a.agroop_id);
    if (doc_agroop && (doc_agroop.finalizadoEm || doc_agroop.status === 'Finalizado')) {
      const dataConcl = doc_agroop.finalizadoEm ? doc_agroop.finalizadoEm.split('T')[0] : hoje();
      try {
        await updateDoc(doc(db,'insumos_campo_adubacao',a.id), { status: 'concluido', data_conclusao: dataConcl });
        a.status = 'concluido'; a.data_conclusao = dataConcl;
        mudou = true;
      } catch(e) { /* silencioso */ }
    }
  }
  return mudou;
}

  el.innerHTML = `

window.salvarEdicaoColheita = async function(id) {
  const upd = {
    data: document.getElementById('ecol-data').value,
    fazenda: document.getElementById('ecol-fazenda').value,
    talhao: document.getElementById('ecol-talhao').value,
    cultura: document.getElementById('ecol-cultura').value,
    safra: document.getElementById('ecol-safra').value,
    obs: document.getElementById('ecol-obs').value
  };
  const campoConclusao = document.getElementById('ecol-dataconclusao');
  if (campoConclusao) {
    upd.data_conclusao = campoConclusao.value;
    upd.produtividade = parseFloat(document.getElementById('ecol-produtividade').value)||0;
    upd.unidade_produtividade = document.getElementById('ecol-unidade').value;
    upd.umidade = parseFloat(document.getElementById('ecol-umidade').value)||0;
    upd.pms = parseFloat(document.getElementById('ecol-pms').value)||0;
  }
  if (!upd.fazenda || !upd.talhao) { toast('Preencha fazenda e talhão.','erro'); return; }
  try {
    await updateDoc(doc(db,'insumos_campo_colheita',id), upd);
    const i = colheitas.findIndex(x=>x.id===id);
    if (i>=0) colheitas[i] = { ...colheitas[i], ...upd };
    fecharModal('modal-editar-colheita');
    toast('Colheita atualizada!');
    renderColheita();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

// Helper compartilhado: atualizar talhões conforme fazenda escolhida (prefixo dos ids: pl-, ad-, col-, ecol-)
window.atualizarTalhoesCampo = function(prefixo) {
  const faz = document.getElementById(`${prefixo}-fazenda`).value;
  const sel = document.getElementById(`${prefixo}-talhao`);
  const lista = talhoes.filter(t => normalizar(t.fazenda||'') === normalizar(faz));
  sel.innerHTML = `<option value="">Selecione...</option>` + lista.map(t=>`<option value="${t.nome}">${t.nome}${t.area_ha?` (${fmt(t.area_ha)} ha)`:''}</option>`).join('');
};

window.excluirRegistroCampo = async function(colecao, id, tipo) {
  if (!confirm('Excluir este registro?')) return;
  try {
    await deleteDoc(doc(db, colecao, id));
    if (tipo==='plantio') plantios.splice(plantios.findIndex(x=>x.id===id),1);
    if (tipo==='adubacao') adubacoes.splice(adubacoes.findIndex(x=>x.id===id),1);
    if (tipo==='colheita') colheitas.splice(colheitas.findIndex(x=>x.id===id),1);
    toast('Registro excluído.');
    renderSubabaCaderno();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

window.baixarModelo = function(tipo) {
  const m = MODELOS_CADERNO[tipo];
  try {
    const ws = XLSX.utils.aoa_to_sheet([m.colunas, m.linhaExemplo]);
    ws['!cols'] = m.colunas.map(c => ({ wch: Math.max(c.length+2, 16) }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Modelo');
    XLSX.writeFile(wb, `ACF_Modelo_${tipo}.xlsx`);
  } catch(e) { toast('Erro ao gerar modelo: '+e.message,'erro'); }
};

window.importarPlanilha = function(input, tipo) {
  const file = input.files[0];
  if (!file) return;
  const m = MODELOS_CADERNO[tipo];
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try {
      const wb = XLSX.read(ev.target.result, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const linhas = XLSX.utils.sheet_to_json(ws, { defval: '' });
      if (linhas.length === 0) { toast('Planilha vazia.','erro'); input.value=''; return; }
      let importados = 0, ignorados = 0;
      const batch = writeBatch(db);
      const novosLocais = [];
      linhas.forEach(row => {
        const reg = m.doExcel(row);
        const faltando = m.obrigatorios.some(campo => !reg[campo]);
        if (faltando) { ignorados++; return; }
        const ref = doc(collection(db, m.colecao));
        batch.set(ref, reg);
        novosLocais.push({ id: ref.id, ...reg });
        importados++;
      });
      if (importados === 0) { toast('Nenhuma linha válida encontrada — confira as colunas obrigatórias.','erro'); input.value=''; return; }
      await batch.commit();
      if (tipo==='plantio') plantios.unshift(...novosLocais);
      if (tipo==='adubacao') adubacoes.unshift(...novosLocais);
      if (tipo==='colheita') colheitas.unshift(...novosLocais);
      toast(`${importados} registro(s) importado(s)${ignorados>0?`, ${ignorados} ignorado(s) por falta de dados obrigatórios`:''}.`);
      renderSubabaCaderno();
    } catch(e) { toast('Erro ao importar: '+e.message,'erro'); }
    input.value = '';
  };
  reader.readAsArrayBuffer(file);
};

window.exportarCaderno = function(tipo) {
  const m = MODELOS_CADERNO[tipo];
  const lista = m.lista();
  if (lista.length === 0) { toast('Nada para exportar.','erro'); return; }
  try {
    const linhas = lista.map(m.paraExportar);
    const ws = XLSX.utils.json_to_sheet(linhas);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, tipo.substring(0,31));
    XLSX.writeFile(wb, `ACF_${tipo}_${hoje()}.xlsx`);
    toast('Excel gerado!');
  } catch(e) { toast('Erro ao exportar: '+e.message,'erro'); }
};

// Exporta os 3 módulos (planejamento + execução) num único arquivo com 3 abas
window.exportarCadernoCompleto = function() {
  try {
    const wb = XLSX.utils.book_new();
    ['plantio','adubacao','colheita'].forEach(tipo => {
      const m = MODELOS_CADERNO[tipo];
      const lista = m.lista();
      const linhas = lista.length > 0 ? lista.map(m.paraExportar) : [{}];
      const ws = XLSX.utils.json_to_sheet(linhas);
      XLSX.utils.book_append_sheet(wb, ws, tipo);
    });
    XLSX.writeFile(wb, `ACF_Caderno_de_Campo_${hoje()}.xlsx`);
    toast('Excel gerado com as 3 abas!');
  } catch(e) { toast('Erro ao exportar: '+e.message,'erro'); }
};

let relatorioAtual = { titulo:'', colunas:[], rows:[] };

window.gerarRelatorio = function(tipo) {
  const el = document.getElementById('resultado-relatorio');
  let html = '';
  switch(tipo) {
    case 'custo_talhao': {
      // MELHORIA 7: custo por hectare
      const mapa = {};
      retiradas.forEach(r => {
        const k = `${r.fazenda} / ${r.talhao||'(sem talhão)'}`;
        if (!mapa[k]) mapa[k] = { custo:0, qtd:0, fazenda:r.fazenda, talhao:r.talhao };
        mapa[k].qtd++; mapa[k].custo += r.custo_total||0;
      });
      const rows = Object.entries(mapa).sort((a,b)=>b[1].custo-a[1].custo).map(([k,v]) => {
        const t = talhoes.find(t => normalizar(t.nome) === normalizar(v.talhao||'') && normalizar(t.fazenda||'') === normalizar(v.fazenda||''));
        const area = t ? parseFloat(t.area_ha)||0 : 0;
        const custoHa = area > 0 ? v.custo/area : null;
        return [k, v.qtd, area>0?fmt(area)+' ha':'—', `R$ ${fmt(v.custo)}`, custoHa!==null?`R$ ${fmt(custoHa)}/ha`:'—'];
      });
      html = tabelaRelatorio('🌾 Custo por Talhão', ['Fazenda / Talhão','Registros','Área','Custo Total','Custo/ha'], rows,
        `Total: R$ ${fmt(retiradas.reduce((s,r)=>s+(r.custo_total||0),0))}`);
      relatorioAtual = { titulo:'Custo_por_Talhao', colunas:['Fazenda/Talhão','Registros','Área (ha)','Custo Total (R$)','Custo/ha (R$)'], rows };
      break;
    }
    case 'custo_safra': {
      const mapa = {};
      retiradas.forEach(r => {
        const k = r.safra||'(sem safra)';
        if (!mapa[k]) mapa[k] = { custo:0, qtd:0 };
        mapa[k].custo += r.custo_total||0; mapa[k].qtd++;
      });
      const rows = Object.entries(mapa).sort((a,b)=>b[1].custo-a[1].custo).map(([k,v]) => [k, v.qtd, `R$ ${fmt(v.custo)}`]);
      html = tabelaRelatorio('📅 Custo por Safra', ['Safra','Retiradas','Custo Total'], rows,
        `Total: R$ ${fmt(Object.values(mapa).reduce((s,v)=>s+v.custo,0))}`);
      relatorioAtual = { titulo:'Custo_por_Safra', colunas:['Safra','Retiradas','Custo Total (R$)'], rows };
      break;
    }
    case 'custo_cultura': {
      const mapa = {};
      retiradas.forEach(r => {
        const k = r.cultura||'(sem cultura)';
        if (!mapa[k]) mapa[k] = { custo:0, qtd:0 };
        mapa[k].custo += r.custo_total||0; mapa[k].qtd++;
      });
      const rows = Object.entries(mapa).sort((a,b)=>b[1].custo-a[1].custo).map(([k,v]) => [k, v.qtd, `R$ ${fmt(v.custo)}`]);
      html = tabelaRelatorio('🌱 Custo por Cultura', ['Cultura','Retiradas','Custo Total'], rows,
        `Total: R$ ${fmt(Object.values(mapa).reduce((s,v)=>s+v.custo,0))}`);
      relatorioAtual = { titulo:'Custo_por_Cultura', colunas:['Cultura','Retiradas','Custo Total (R$)'], rows };
      break;
    }
    case 'custo_produto': {
      const mapa = {};
      retiradas.forEach(r => {
        if (!mapa[r.produto]) mapa[r.produto] = { custo:0, qtd:0, unidade:r.unidade };
        mapa[r.produto].custo += r.custo_total||0; mapa[r.produto].qtd += r.quantidade||0;
      });
      const rows = Object.entries(mapa).sort((a,b)=>b[1].custo-a[1].custo).map(([k,v]) => [k, `${fmt(v.qtd)} ${v.unidade}`, `R$ ${fmt(v.custo)}`]);
      html = tabelaRelatorio('🧪 Consumo por Produto', ['Produto','Qtd Total','Custo Total'], rows,
        `Total: R$ ${fmt(Object.values(mapa).reduce((s,v)=>s+v.custo,0))}`);
      relatorioAtual = { titulo:'Consumo_por_Produto', colunas:['Produto','Qtd Total','Custo Total (R$)'], rows };
      break;
    }
    case 'pedidos_abertos': {
      const rows = [];
      pedidos.filter(p => p.status !== 'entregue_total' && p.status !== 'cancelado').forEach(p => {
        (p.itens||[]).forEach(it => {
          const pend = (it.quantidade||0) - (it.quantidade_recebida||0);
          if (pend > 0) rows.push([p.fornecedor, it.produto, `${fmt(it.quantidade)} ${it.unidade}`, `${fmt(it.quantidade_recebida||0)}`, `${fmt(pend)} ${it.unidade}`]);
        });
      });
      html = rows.length === 0
        ? `<div class="relatorio-resultado"><div style="text-align:center;padding:40px;color:var(--cinza)">✅ Nenhum pedido em aberto!</div></div>`
        : tabelaRelatorio('📋 Pedidos em Aberto', ['Fornecedor','Produto','Pedido','Recebido','Pendente'], rows);
      relatorioAtual = { titulo:'Pedidos_em_Aberto', colunas:['Fornecedor','Produto','Pedido','Recebido','Pendente'], rows };
      break;
    }
    case 'contas_vencer': {
      const pend = contas.filter(c => !c.pago);
      const rows = pend.map(c => [c.fornecedor||'—', c.descricao||'—', `R$ ${fmt(c.valor_total)}`, fmtData(c.vencimento),
        diasAte(c.vencimento)<0?'Vencida':diasAte(c.vencimento)<=7?`Em ${diasAte(c.vencimento)}d ⚠️`:`Em ${diasAte(c.vencimento)}d`]);
      html = tabelaRelatorio('💸 Contas a Pagar — Pendentes', ['Fornecedor','Descrição','Valor','Vencimento','Situação'], rows,
        `Total Pendente: R$ ${fmt(pend.reduce((s,c)=>s+(c.valor_total||0),0))}`);
      relatorioAtual = { titulo:'Contas_a_Vencer', colunas:['Fornecedor','Descrição','Valor (R$)','Vencimento','Situação'], rows };
      break;
    }
    case 'estoque_valor': {
      const rows = [...estoque].sort((a,b)=>(b.quantidade*b.custo_medio)-(a.quantidade*a.custo_medio))
        .map(e => [e.produto, fmt(e.quantidade), e.unidade, `R$ ${fmt(e.custo_medio||0)}`, `R$ ${fmt((e.quantidade||0)*(e.custo_medio||0))}`]);
      html = tabelaRelatorio('📦 Estoque Atual — Valor', ['Produto','Quantidade','Un','Custo Médio','Valor Total'], rows,
        `Valor Total: R$ ${fmt(estoque.reduce((s,e)=>s+(e.quantidade||0)*(e.custo_medio||0),0))}`);
      relatorioAtual = { titulo:'Estoque_Valor', colunas:['Produto','Quantidade','Unidade','Custo Médio (R$)','Valor Total (R$)'], rows };
      break;
    }
    case 'custo_fazenda': {
      const mapa = {};
      retiradas.forEach(r => {
        if (!mapa[r.fazenda]) mapa[r.fazenda] = { custo:0, qtd:0 };
        mapa[r.fazenda].custo += r.custo_total||0; mapa[r.fazenda].qtd++;
      });
      // custo/ha por fazenda usando soma das áreas dos talhões
      const rows = Object.entries(mapa).sort((a,b)=>b[1].custo-a[1].custo).map(([k,v]) => {
        const areaFaz = talhoes.filter(t=>normalizar(t.fazenda||'')===normalizar(k)).reduce((s,t)=>s+(parseFloat(t.area_ha)||0),0);
        return [k, v.qtd, areaFaz>0?fmt(areaFaz)+' ha':'—', `R$ ${fmt(v.custo)}`, areaFaz>0?`R$ ${fmt(v.custo/areaFaz)}/ha`:'—'];
      });
      html = tabelaRelatorio('🏡 Custo por Fazenda', ['Fazenda','Retiradas','Área Total','Custo Total','Custo/ha'], rows,
        `Total: R$ ${fmt(Object.values(mapa).reduce((s,v)=>s+v.custo,0))}`);
      relatorioAtual = { titulo:'Custo_por_Fazenda', colunas:['Fazenda','Retiradas','Área Total (ha)','Custo Total (R$)','Custo/ha (R$)'], rows };
      break;
    }
  }
  el.innerHTML = html;
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
};

function tabelaRelatorio(titulo, colunas, rows, rodape) {
  return `
    <div class="relatorio-resultado">
      <div class="relatorio-resultado-titulo">
        ${titulo}
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary btn-sm" onclick="exportarRelatorioAtual()">📥 Excel</button>
          <button class="btn btn-secondary btn-sm" onclick="document.getElementById('resultado-relatorio').innerHTML=''">✕</button>
        </div>
      </div>
      ${rows.length === 0 ? '<div style="text-align:center;padding:30px;color:var(--cinza)">Nenhum dado para exibir.</div>' : `
      <div class="tabela-wrap"><table>
        <thead><tr>${colunas.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
        <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
        ${rodape ? `<tfoot><tr><td colspan="${colunas.length}" style="padding:12px 16px;font-weight:700;background:var(--creme)">${rodape}</td></tr></tfoot>` : ''}
      </table></div>`}
    </div>`;
}

// ── MELHORIA 3: EXPORTAR EXCEL ──
window.exportarRelatorioAtual = function() {
  if (!relatorioAtual.rows.length) { toast('Nada para exportar.','erro'); return; }
  // limpar formatação (R$, badges html) para o Excel
  const rowsLimpos = relatorioAtual.rows.map(r => r.map(c => {
    if (typeof c !== 'string') return c;
    const semHtml = c.replace(/<[^>]*>/g,'').trim();
    const num = semHtml.replace('R$','').trim().replace(/\./g,'').replace(',','.');
    return semHtml.startsWith('R$') && !isNaN(parseFloat(num)) ? parseFloat(num) : semHtml;
  }));
  exportarExcel(relatorioAtual.titulo, relatorioAtual.colunas, rowsLimpos);
};

function exportarExcel(nome, colunas, rows) {
  try {
    const ws = XLSX.utils.aoa_to_sheet([colunas, ...rows]);
    ws['!cols'] = colunas.map((c,i) => ({ wch: Math.max(c.length+2, ...rows.map(r=>String(r[i]||'').length+2), 10) }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, nome.substring(0,31));
    XLSX.writeFile(wb, `ACF_${nome}_${hoje()}.xlsx`);
    toast('Excel gerado!');
  } catch(e) { toast('Erro ao gerar Excel: '+e.message,'erro'); }
}
