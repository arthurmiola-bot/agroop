<!-- ============================ CAMADA FIREBASE ============================ -->
<script>
(function(){
  // MESMO PROJETO do Posto Diesel (agroop-d73d4) — e isso que permite LER os
  // abastecimentos da FH 540 direto da base do Posto, sem redigitar nada.
  var firebaseConfig = {
    apiKey: "AIzaSyDtmcibrocmj0Gc8bpTtXFUc2JTuN5CRjY",
    authDomain: "agroop-d73d4.firebaseapp.com",
    projectId: "agroop-d73d4",
    storageBucket: "agroop-d73d4.firebasestorage.app",
    messagingSenderId: "591049190246",
    appId: "1:591049190246:web:0a21a937f978ade855b6a7"
  };

  window.TX = { ready:false };

  try {
    var existing = firebase.apps.filter(function(a){return a.name==="transportadora";});
    var fbApp = existing.length ? existing[0] : firebase.initializeApp(firebaseConfig, "transportadora");
    var db = fbApp.firestore();

    // ---- Dados DESTE app (transportadora) ----
    var ROOT = db.collection("transportadora").doc("dados");
    var REC  = ROOT.collection("receitas");   // 1 doc por frete
    var DESP = ROOT.collection("despesas");    // 1 doc por lançamento/recorrência/parcelamento
    var ODO  = ROOT.collection("odometro");    // abastecimentos externos + leitura de odômetro (consumo)
    var CONF = db.collection("transportadora").doc("config");

    // ---- Dados do Posto Diesel (somente leitura) ----
    var POSTO_CONFIG = db.collection("posto-diesel").doc("config");
    var POSTO_FUEL   = db.collection("posto-diesel").doc("dados").collection("abastecimentos");

    var state = { rec:[], desp:[], conf:null, postoMachines:[], fuel:[], odo:[] };
    var listeners = [];
    function emit(){ for(var i=0;i<listeners.length;i++){ try{listeners[i](state);}catch(e){console.error(e);} } }

    // Assinaturas em tempo real
    REC.onSnapshot(function(qs){
      state.rec = qs.docs.map(function(d){return d.data();}).filter(function(x){return x && !x.deleted;});
      emit();
    }, function(e){console.error("rec:",e);});

    DESP.onSnapshot(function(qs){
      state.desp = qs.docs.map(function(d){return d.data();}).filter(function(x){return x && !x.deleted;});
      emit();
    }, function(e){console.error("desp:",e);});

    ODO.onSnapshot(function(qs){
      state.odo = qs.docs.map(function(d){return d.data();}).filter(function(x){return x && !x.deleted;});
      emit();
    }, function(e){console.error("odo:",e);});

    CONF.onSnapshot(function(snap){
      if(snap.exists && snap.data() && snap.data().payload){
        try{ state.conf = JSON.parse(snap.data().payload); }catch(e){ state.conf = {}; }
      } else { state.conf = {}; }
      emit();
    }, function(e){console.error("conf:",e);});

    POSTO_CONFIG.onSnapshot(function(snap){
      var m = [];
      if(snap.exists && snap.data() && snap.data().payload){
        try{ var p = JSON.parse(snap.data().payload); m = p.machines || []; }catch(e){}
      }
      state.postoMachines = m;
      emit();
    }, function(e){console.error("postoConfig:",e);});

    POSTO_FUEL.onSnapshot(function(qs){
      state.fuel = qs.docs.map(function(d){return d.data();}).filter(function(x){return x && !x.deleted;});
      emit();
    }, function(e){console.error("postoFuel:",e);});

    // ---- SEGUNDO PROJETO: Nossas Contas (nossas-contas-6c240) ----
    // Lê SOMENTE as despesas marcadas como "Diamantes LHM" no app de gastos pessoais.
    // Esse projeto exige login anônimo (regras: request.auth != null).
    state.diamGastos = [];
    try {
      var ncConfig = {
        apiKey: "AIzaSyC2dPU4lZUelyCMCY0hyLDCBTwHW7PDGuw",
        authDomain: "nossas-contas-6c240.firebaseapp.com",
        projectId: "nossas-contas-6c240",
        storageBucket: "nossas-contas-6c240.firebasestorage.app",
        messagingSenderId: "553757944177",
        appId: "1:553757944177:web:016e77aaf412609a02eed0"
      };
      var ncEx = firebase.apps.filter(function(a){return a.name==="nossas-contas";});
      var ncApp = ncEx.length ? ncEx[0] : firebase.initializeApp(ncConfig, "nossas-contas");
      var ncDb = ncApp.firestore();
      ncApp.auth().signInAnonymously().then(function(){
        ncDb.collection("gastos_familia").doc("dados").collection("gastos")
          .where("category","==","Diamantes LHM")
          .onSnapshot(function(qs){
            state.diamGastos = qs.docs.map(function(d){ var o=d.data()||{}; o.__id=d.id; return o; })
              .filter(function(x){ return x && !x.deleted; });
            emit();
          }, function(e){ console.error("diamGastos:",e); });
      }).catch(function(e){ console.error("Nossas Contas auth:",e); });
    } catch(ncErr){ console.error("Falha init Nossas Contas:", ncErr); }

    // API para o React
    window.TX = {
      ready: true,
      onData: function(cb){ listeners.push(cb); cb(state); },
      addReceita: function(item){ return REC.doc(String(item.id)).set(item); },
      delReceita: function(id){ return REC.doc(String(id)).set({deleted:true, deletedAt:new Date().toISOString()},{merge:true}); },
      addDespesa: function(item){ return DESP.doc(String(item.id)).set(item); },
      delDespesa: function(id){ return DESP.doc(String(id)).set({deleted:true, deletedAt:new Date().toISOString()},{merge:true}); },
      addOdometro: function(item){ return ODO.doc(String(item.id)).set(item); },
      delOdometro: function(id){ return ODO.doc(String(id)).set({deleted:true, deletedAt:new Date().toISOString()},{merge:true}); },
      saveConfig: function(cfg){ return CONF.set({ payload: JSON.stringify(cfg) }); }
    };
  } catch(err){
    console.error("Falha init Firebase:", err);
    window.TX = { ready:false, error:String(err) };
  }
})();
</script>

<!-- ============================ APLICATIVO REACT ============================ -->
<script type="text/babel" data-presets="react-classic">
var useState = React.useState, useEffect = React.useEffect, useMemo = React.useMemo;

// ── PALETA (mesma identidade do Posto Diesel) ────────────────────────────────
var GN="#2a7a2a", GN2="#1d561d", GN3="#d4f0a0";
var BG="#f0f4f0", CARD="#ffffff", INP="#e8f0e8", BDR="#b8d4b8";
var TXT="#1a2e1a", MUT="#4a6e4a", DIM="#7a9a7a";
var RED="#dc2626", BLU="#0369a1", PUR="#7c3aed", AMB="#854d0e";

var CSS = [
  "@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap');",
  "*{box-sizing:border-box;margin:0;padding:0}",

  "input:focus,select:focus,textarea:focus{border-color:"+GN+";box-shadow:0 0 0 3px #2a7a2a22}",

  ".bg{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0}",
  ".br{background:#fee2e2;color:"+RED+";border:1px solid #fca5a5}",
  ".by{background:#fef9c3;color:"+AMB+";border:1px solid #fde047}",
  ".bb{background:#dbeafe;color:#1d4ed8;border:1px solid #93c5fd}",
  ".bp{background:#f3e8ff;color:"+PUR+";border:1px solid #d8b4fe}",
  "table{width:100%;border-collapse:collapse}",
  "th{text-align:left;padding:9px 12px;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;color:"+MUT+";border-bottom:2px solid "+BDR+";text-transform:uppercase;background:#f7faf7}",
  "td{padding:10px 12px;border-bottom:1px solid "+BDR+";font-size:14px;vertical-align:middle}",
  "tr:hover td{background:#f0f7f0}",
  ".sec{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;letter-spacing:1.5px;color:"+GN+";text-transform:uppercase;margin-bottom:14px}",
  ".card{background:"+CARD+";border:1.5px solid "+BDR+";border-radius:12px;padding:20px;box-shadow:0 2px 8px #0000000d}",
  ".sbox{background:"+CARD+";border:1.5px solid "+BDR+";border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:3px;box-shadow:0 2px 8px #0000000d}",
  ".slbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:"+MUT+";font-family:'Barlow Condensed',sans-serif}",
  ".sval{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;color:"+TXT+"}",
  ".flbl{font-size:12px;color:"+MUT+";margin-bottom:5px;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:600;letter-spacing:.5px}",
  ".mtog{display:flex;border:2px solid "+BDR+";border-radius:8px;overflow:hidden;background:#fff}",
  ".mtog button{flex:1;padding:9px 8px;background:none;color:"+MUT+";font-size:14px;border:none;border-radius:0;font-family:'Barlow',sans-serif}",
  ".mtog button.on{background:"+GN+";color:#fff;font-weight:700}",
  "@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}",
  ".fi{animation:fi .3s ease forwards}",
  "@media print{ body{background:#fff} .noprint{display:none !important} #root>div>*{display:none} #printArea{display:block !important} }",
  "#printArea{display:none}"
].join("\n");

// ── UTILIDADES ───────────────────────────────────────────────────────────────
function pad(n){ return (n<10?"0":"")+n; }
function todayISO(){ var n=new Date(); return n.getFullYear()+"-"+pad(n.getMonth()+1)+"-"+pad(n.getDate()); }
function thisMonth(){ var n=new Date(); return n.getFullYear()+"-"+pad(n.getMonth()+1); }
function monthOf(d){ return String(d||"").slice(0,7); }
function monthDiff(a,b){ // b - a em meses (a,b = "YYYY-MM")
  var pa=a.split("-"), pb=b.split("-");
  return (Number(pb[0])-Number(pa[0]))*12 + (Number(pb[1])-Number(pa[1]));
}
function brl(v){ v=Number(v)||0; return "R$ "+v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function num(v){ v=Number(v)||0; return v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function ddmmyyyy(d){ var p=String(d||"").slice(0,10).split("-"); return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : d; }
function mesLabel(mk){
  var nomes=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  var p=String(mk).split("-"); return nomes[Number(p[1])-1]+"/"+p[0];
}
function norm(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim(); }

// Custo do diesel de UM abastecimento (R$/L), congelado — mesma regra do Posto:
function fuelCostPerLiter(x, avg){
  if(x && x.costPerLiter!==undefined && x.costPerLiter!==null && Number(x.costPerLiter)>0) return Number(x.costPerLiter);
  var d10 = String((x&&x.date)||"").slice(0,10);
  if(d10 && d10<="2026-08-16") return 6.20;
  if(d10 && d10<="2026-08-23") return 6.15;
  return Number(avg)||0;
}

// ── COMPONENTES BÁSICOS ──────────────────────────────────────────────────────
function Fld(props){
  return (
    <div style={{display:"flex",flexDirection:"column"}}>
      <label className="flbl">{props.label}</label>
      {props.textarea
        ? <textarea rows={props.rows||2} value={props.value} onChange={function(e){props.onChange(e.target.value);}} placeholder={props.placeholder||""}/>
        : props.options
          ? <select value={props.value} onChange={function(e){props.onChange(e.target.value);}}>
              {props.options.map(function(o){return <option key={o.v} value={o.v}>{o.t}</option>;})}
            </select>
          : <input type={props.type||"text"} value={props.value} onChange={function(e){props.onChange(e.target.value);}} placeholder={props.placeholder||""} step={props.step} inputMode={props.inputMode}/>
      }
    </div>
  );
}
function Btn(props){
  var bg = props.color || GN;
  var st = Object.assign({background:bg,color:props.color?TXT:"#fff",padding:"11px 18px",fontSize:15,letterSpacing:.5,opacity:props.disabled?0.5:1,width:props.full?"100%":"auto"}, props.style||{});
  return <button style={st} onClick={props.onClick} disabled={props.disabled}>{props.children}</button>;
}
function Stat(props){
  return (
    <div className="sbox">
      <span className="slbl">{props.label}</span>
      <span className="sval" style={{color:props.color||TXT}}>{props.value}</span>
      {props.sub?<span style={{fontSize:12,color:MUT}}>{props.sub}</span>:null}
    </div>
  );
}
function Modal(props){
  return (
    <div className="noprint" style={{position:"fixed",inset:0,background:"#0006",display:"flex",alignItems:"flex-start",justifyContent:"center",zIndex:50,padding:"40px 14px",overflowY:"auto"}} onClick={props.onClose}>
      <div style={{background:CARD,borderRadius:14,padding:22,width:"100%",maxWidth:440,boxShadow:"0 10px 40px #0004"}} onClick={function(e){e.stopPropagation();}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <span className="sec" style={{margin:0}}>{props.title}</span>
          <button onClick={props.onClose} style={{background:INP,width:32,height:32,borderRadius:8,color:MUT,fontSize:18}}>×</button>
        </div>
        {props.children}
      </div>
    </div>
  );
}
function Toast(props){
  if(!props.msg) return null;
  return <div className="noprint" style={{position:"fixed",bottom:20,left:"50%",transform:"translateX(-50%)",background:props.err?RED:GN2,color:"#fff",padding:"12px 22px",borderRadius:10,fontSize:15,fontWeight:600,zIndex:99,boxShadow:"0 4px 20px #0003"}}>{props.msg}</div>;
}

// ── APP ──────────────────────────────────────────────────────────────────────
function App(){
  var s0 = useState({ rec:[], desp:[], conf:null, postoMachines:[], fuel:[], diamGastos:[], odo:[] }); var data=s0[0], setData=s0[1];
  var t0 = useState("painel"); var tab=t0[0], setTab=t0[1];
  var m0 = useState(thisMonth()); var mk=m0[0], setMk=m0[1];
  var ts0 = useState(null); var toast=ts0[0], setToast=ts0[1];
  var rl0 = useState((function(){ try{return localStorage.getItem("tx_role")||"";}catch(e){return "";} })()); var role=rl0[0], setRole=rl0[1];
  var driver = role==="motorista";
  var OWNER_PIN = "284284";   // PIN do dono (troque pedindo pra mim)
  function pickRole(r){ try{localStorage.setItem("tx_role",r);}catch(e){} setRole(r); setTab(r==="motorista"?"receitas":"painel"); }
  function trocarPerfil(){ try{localStorage.removeItem("tx_role");}catch(e){} setRole(""); }

  useEffect(function(){
    if(window.TX && window.TX.ready){ window.TX.onData(function(st){ setData(Object.assign({},st)); }); }
  },[]);

  function showToast(msg,err){ setToast({msg:msg,err:err}); setTimeout(function(){setToast(null);},2600); }

  var conf = data.conf || {};
  var fazendaKey = conf.fazendaKey || "ACF";
  var custoFallback = Number(conf.custoFallback)||6.15;

  // ---- localizar a FH 540 (código 016) no Posto ----
  var fh540 = useMemo(function(){
    var list = data.postoMachines || [];
    var found = null;
    for(var i=0;i<list.length;i++){ if(String(list[i].code||"").trim()==="016"){ found=list[i]; break; } }
    if(!found){ for(var j=0;j<list.length;j++){ if(norm(list[j].desc)==="fh 540"||norm(list[j].desc)==="fh540"){ found=list[j]; break; } } }
    return found;
  },[data.postoMachines]);

  // ---- diesel da FH 540 no mês selecionado ----
  var diesel = useMemo(function(){
    if(!fh540) return { litros:0, custo:0, itens:[] };
    var itens = (data.fuel||[]).filter(function(x){
      return Number(x.machineId)===Number(fh540.id) && monthOf(x.date)===mk;
    }).sort(function(a,b){ return String(a.date)<String(b.date)?-1:1; });
    // fallback de custo = último costPerLiter conhecido da FH540, senão config
    var avg = custoFallback;
    for(var i=itens.length-1;i>=0;i--){ if(Number(itens[i].costPerLiter)>0){ avg=Number(itens[i].costPerLiter); break; } }
    var litros=0, custo=0;
    var det = itens.map(function(x){
      var l=Number(x.liters)||0; var cpl=fuelCostPerLiter(x,avg); var v=l*cpl;
      litros+=l; custo+=v;
      return { date:x.date, liters:l, cpl:cpl, valor:v };
    });
    return { litros:litros, custo:custo, itens:det };
  },[data.fuel, fh540, mk, custoFallback]);

  // ---- receitas do mês ----
  var recMes = useMemo(function(){
    return (data.rec||[]).filter(function(r){ return monthOf(r.date)===mk; })
      .sort(function(a,b){ return String(a.date)<String(b.date)?-1:1; });
  },[data.rec, mk]);
  var recFazenda = recMes.filter(function(r){ return norm(r.tomador).indexOf(norm(fazendaKey))>=0; });
  var totRec = recMes.reduce(function(a,r){ return a+(Number(r.valor)||0); },0);
  var totRecFaz = recFazenda.reduce(function(a,r){ return a+(Number(r.valor)||0); },0);

  // ---- despesas Diamantes vindas do Nossas Contas (cartão pessoal), SOMENTE LEITURA ----
  var diamDesp = useMemo(function(){
    return (data.diamGastos||[]).map(function(g){
      return {
        id: "nc_"+(g.__id||g.importKey||(String(g.date)+"_"+g.amount)),
        tipo: "unica",
        categoria: (String(g.subcat||"").trim()) || "Diamantes (sem subcategoria)",
        descricao: (g.desc||"Sem descrição") + " · " + (g.person||""),
        date: g.date,
        valor: Number(g.amount)||0,
        fonte: "nossas-contas",
        createdAt: g.createdAt ? new Date(g.createdAt).toISOString() : ""
      };
    });
  },[data.diamGastos]);
  // ARLA lançado na aba Abastecimento entra como despesa (categoria ARLA), só leitura aqui
  var arlaDesp = useMemo(function(){
    return (data.odo||[]).filter(function(x){ return x.tipo==="arla"; }).map(function(a){
      return { id:"arla_"+a.id, tipo:"unica", categoria:"ARLA",
        descricao:((a.local||"ARLA")+(a.motorista?" · "+a.motorista:"")), date:a.date,
        valor:Number(a.valor)||0, fonte:"abastec", createdAt:a.createdAt||"" };
    });
  },[data.odo]);
  // lista combinada: despesas próprias + Diamantes (Nossas Contas) + ARLA (abastecimento)
  var despAll = useMemo(function(){ return (data.desp||[]).concat(diamDesp).concat(arlaDesp); },[data.desp, diamDesp, arlaDesp]);
  var totDiamMes = useMemo(function(){
    return diamDesp.filter(function(d){ return monthOf(d.date)===mk; }).reduce(function(a,d){ return a+(Number(d.valor)||0); },0);
  },[diamDesp, mk]);

  // ---- despesas que incidem no mês ----
  function despValorNoMes(d, m){
    if(d.tipo==="recorrente"){ if(m>=(d.inicio||"0000-00") && (!d.fim || m<=d.fim)) return Number(d.valor)||0; return 0; }
    if(d.tipo==="parcelada"){ var n=monthDiff(d.parcInicio||m, m); if(n>=0 && n<(Number(d.parcN)||0)) return Number(d.valor)||0; return 0; }
    return monthOf(d.date)===m ? (Number(d.valor)||0) : 0; // unica
  }
  var despMes = useMemo(function(){
    return despAll.map(function(d){ return { d:d, v:despValorNoMes(d,mk) }; })
      .filter(function(o){ return o.v!==0; })
      .sort(function(a,b){ return b.v-a.v; });
  },[despAll, mk]);
  var totDesp = despMes.reduce(function(a,o){ return a+o.v; },0);

  var resultado = totRec - totDesp - diesel.custo;   // resultado geral da transportadora
  var acertoLiquido = totRecFaz - diesel.custo;      // acerto com a fazenda

  var fuelFH = useMemo(function(){
    if(!fh540) return [];
    return (data.fuel||[]).filter(function(x){ return Number(x.machineId)===Number(fh540.id); });
  },[data.fuel, fh540]);
  useEffect(function(){ if(driver && (tab==="painel"||tab==="acerto"||tab==="config")) setTab("receitas"); },[driver,tab]);

  if(!role){ return <RolePicker onPick={pickRole} ownerPin={OWNER_PIN}/>; }

  var estilos = { maxWidth:960, margin:"0 auto", padding:"0 14px 90px" };

  return (
    <div style={{minHeight:"100vh"}}>
      <style>{CSS}</style>

      {/* CABEÇALHO */}
      <div className="noprint" style={{background:"linear-gradient(180deg,"+GN2+","+GN+")",padding:"18px 14px 16px",color:"#fff",boxShadow:"0 2px 12px #0002"}}>
        <div style={{maxWidth:960,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,flexWrap:"wrap"}}>
          <div>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:24,letterSpacing:1,lineHeight:1}}>DIAMANTES LHM</div>
            <div style={{fontSize:12,opacity:.85,marginTop:2}}>Controle de resultados · Caminhão FH 540 (016)</div>
            <div style={{marginTop:6,display:"flex",alignItems:"center",gap:8}}>
              <span style={{background:"#ffffff22",borderRadius:20,padding:"2px 11px",fontSize:12,fontWeight:700}}>{driver?"Motorista":"Dono"}</span>
              <button onClick={trocarPerfil} style={{background:"none",color:"#fff",textDecoration:"underline",fontSize:12,padding:0,fontWeight:600}}>trocar perfil</button>
            </div>
          </div>
          <div style={{background:"#ffffff22",borderRadius:10,padding:"6px 10px",display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:11,textTransform:"uppercase",letterSpacing:1,opacity:.85}}>Mês</span>
            <input type="month" value={mk} onChange={function(e){setMk(e.target.value);}} style={{width:150,padding:"6px 10px",border:"none",fontWeight:700,color:TXT}}/>
          </div>
        </div>
      </div>

      {/* AVISO se não achou a FH540 */}
      {(!window.TX||!window.TX.ready) &&
        <div style={estilos}><div className="card" style={{marginTop:16,borderColor:"#fca5a5",background:"#fef2f2",color:RED}}>Sem conexão com o banco de dados. Verifique a internet e recarregue.</div></div>}

      {/* NAV */}
      <div className="noprint" style={{background:CARD,borderBottom:"1.5px solid "+BDR}}>
        <div style={{maxWidth:960,margin:"0 auto",display:"flex",gap:4,padding:"0 8px",overflowX:"auto"}}>
          {(driver
            ? [["receitas","Frete"],["despesas","Despesa"],["abastec","Abastecimento"]]
            : [["painel","Painel"],["receitas","Receitas"],["despesas","Despesas"],["acerto","Acerto Fazenda"],["abastec","Abastecimento"],["config","Config"]]
          ).map(function(t){
            var on = tab===t[0];
            return <button key={t[0]} onClick={function(){setTab(t[0]);}} style={{background:"none",color:on?GN:MUT,borderBottom:on?"3px solid "+GN:"3px solid transparent",borderRadius:0,padding:"14px 14px",fontSize:15,whiteSpace:"nowrap"}}>{t[1]}</button>;
          })}
        </div>
      </div>

      <div style={estilos} className="fi">
        {tab==="painel" && !driver && <Painel mk={mk} totRec={totRec} totRecFaz={totRecFaz} totDesp={totDesp} totDiam={totDiamMes} diesel={diesel} resultado={resultado} acerto={acertoLiquido} fh540={fh540} recCount={recMes.length} despCount={despMes.length}/>}
        {tab==="receitas" && <Receitas data={data} mk={mk} recMes={recMes} totRec={totRec} driver={driver} toast={showToast}/>}
        {tab==="despesas" && <Despesas data={data} despAll={despAll} mk={mk} despMes={despMes} totDesp={totDesp} totDiam={totDiamMes} driver={driver} toast={showToast}/>}
        {tab==="abastec" && <Abastecimento data={data} mk={mk} fuelFH={fuelFH} driver={driver} toast={showToast}/>}
        {tab==="acerto" && !driver && <Acerto mk={mk} recFazenda={recFazenda} totRecFaz={totRecFaz} diesel={diesel} liquido={acertoLiquido} fazendaKey={fazendaKey} conf={conf}/>}
        {tab==="config" && !driver && <Config conf={conf} toast={showToast} fh540={fh540}/>}
      </div>

      <Toast msg={toast&&toast.msg} err={toast&&toast.err}/>
    </div>
  );
}

// ── RECEITAS ─────────────────────────────────────────────────────────────────
function Receitas(props){
  var f0=useState(null); var form=f0[0], setForm=f0[1];
  function nova(){ setForm({ date:todayISO(), tomador:"", produto:"", origem:"", destino:"", precoTon:"", ton:"" }); }
  function set(k,v){ setForm(function(p){ var o=Object.assign({},p); o[k]=v; return o; }); }

  function salvar(){
    var precoTon=Number(String(form.precoTon).replace(",","."))||0;
    var ton=Number(String(form.ton).replace(",","."))||0;
    var item = {
      id: form.id || Date.now(),
      date: form.date, tomador:(form.tomador||"").trim(), produto:(form.produto||"").trim(),
      origem:(form.origem||"").trim(), destino:(form.destino||"").trim(),
      precoTon:precoTon, ton:ton, valor:precoTon*ton, createdAt: form.createdAt||new Date().toISOString()
    };
    window.TX.addReceita(item).then(function(){ setForm(null); props.toast("Frete salvo"); })
      .catch(function(){ props.toast("Erro ao salvar",true); });
  }
  function excluir(r){
    if(!confirm("Excluir este frete?")) return;
    window.TX.delReceita(r.id).then(function(){ props.toast("Frete excluído"); });
  }
  function editar(r){ setForm(Object.assign({},r,{ precoTon:String(r.precoTon), ton:String(r.ton) })); }

  // ---- Importar Excel/CSV (tolerante a formatos) ----
  function importar(ev){
    var file = ev.target.files[0]; if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      try {
        var wb = XLSX.read(e.target.result, {type:"array", cellDates:true});
        var ws = wb.Sheets[wb.SheetNames[0]];
        var aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:"", raw:false});
        // acha a linha de cabeçalho (pode haver título/linhas acima)
        var KW = ["tomador","cliente","empresa","contratante","data","valor","frete","receita","preco","preço","ton","tonelada","quantidade","peso","produto","origem","destino"];
        var hRow = -1;
        for(var i=0;i<Math.min(aoa.length,20);i++){
          var hits=0;
          for(var c=0;c<aoa[i].length;c++){ var cell=norm(aoa[i][c]); if(!cell) continue;
            for(var k=0;k<KW.length;k++){ if(cell.indexOf(norm(KW[k]))>=0){ hits++; break; } } }
          if(hits>=2){ hRow=i; break; }
        }
        if(hRow<0){ alert("Não encontrei uma linha de cabeçalho na planilha.\n\nDica: clique em \"Baixar modelo\", coloque seus fretes nele e importe — as colunas já ficam certas."); ev.target.value=""; return; }
        var headers = aoa[hRow].map(function(x){ return String(x); }).filter(function(x){return x.trim();});
        var rows = XLSX.utils.sheet_to_json(ws, {defval:"", raw:false, range:hRow});

        function get(row, aliases){
          for(var key in row){ var nk=norm(key); for(var a=0;a<aliases.length;a++){ if(nk.indexOf(aliases[a])>=0) return row[key]; } }
          return "";
        }
        function toNum(v){ if(typeof v==="number") return v; var s=String(v).replace(/[r$\s]/gi,""); if(!s) return 0;
          if(s.indexOf(",")>=0){ s=s.replace(/\./g,"").replace(",","."); } var n=parseFloat(s); return isNaN(n)?0:n; }
        function toISO(v){
          if(v instanceof Date) return v.getFullYear()+"-"+pad(v.getMonth()+1)+"-"+pad(v.getDate());
          var s=String(v).trim(); if(!s) return "";
          if(s.indexOf("/")>0){ var p=s.split("/"); if(p.length>=3){ var y=p[2].slice(0,4); if(y.length===2) y="20"+y; return y+"-"+pad(Number(p[1]))+"-"+pad(Number(p[0])); } }
          if(s.indexOf("-")>0 && s.length>=8) return s.slice(0,10);
          return "";
        }

        var n=0;
        rows.forEach(function(row){
          var tom = String(get(row,["tomador","cliente","empresa","contratante","razao"])).trim();
          var dISO = toISO(get(row,["data","date","dia","emissao"]));
          var preco = toNum(get(row,["r$/ton","rs/ton","valor/ton","r$/t","preco/ton","preco","preço"]));
          var ton = toNum(get(row,["quantidade","tonelada","ton","peso","carga","qtd"]));
          // valor total do frete: coluna com "valor/frete/receita/total" que NÃO seja por tonelada
          var totalRaw="";
          for(var key in row){ var nk=norm(key);
            if((nk.indexOf("valor")>=0||nk.indexOf("frete")>=0||nk.indexOf("receita")>=0||nk.indexOf("total")>=0) && nk.indexOf("ton")<0 && nk.indexOf("/t")<0){ totalRaw=row[key]; break; } }
          var total = toNum(totalRaw);
          var valor = total>0 ? total : preco*ton;
          if(valor>0 && ton>0 && !(preco>0)) preco = valor/ton;   // deriva R$/ton se só veio o total
          if(!tom && !valor && !ton && !dISO) return;             // pula linha realmente vazia
          var item = {
            id: Date.now()+Math.floor(Math.random()*100000)+n,
            date: dISO || todayISO(),
            tomador: tom,
            produto: String(get(row,["produto","material"])).trim(),
            origem: String(get(row,["origem","saida"])).trim(),
            destino: String(get(row,["destino","entrega"])).trim(),
            precoTon: preco, ton: ton, valor: valor,
            createdAt: new Date().toISOString()
          };
          window.TX.addReceita(item); n++;
        });
        if(n===0){ alert("Li a planilha, mas não importei nenhum frete.\n\nColunas encontradas:\n• "+headers.join("\n• ")+"\n\nO app precisa de: Tomador (ou Cliente), Data e Valor (ou R$/ton + Quantidade).\nDica: use o botão \"Baixar modelo\"."); }
        else props.toast(n+" frete(s) importado(s)");
      } catch(err){ console.error(err); props.toast("Erro ao ler a planilha",true); }
      ev.target.value="";
    };
    reader.readAsArrayBuffer(file);
  }

  function baixarModelo(){
    var ws = XLSX.utils.aoa_to_sheet([["Tomador","Data","Produto","Origem","Destino","R$/ton","Quantidade (ton)"],
      ["Fazenda","01/09/2026","Soja","Fazenda Rodeio","Armazém Uberlândia","95","33.5"]]);
    var wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Receitas");
    XLSX.writeFile(wb,"modelo-receitas.xlsx");
  }
  function exportar(){
    var aoa=[["Data","Tomador","Produto","Origem","Destino","R$/ton","Ton","Valor"]];
    props.recMes.forEach(function(r){ aoa.push([ddmmyyyy(r.date),r.tomador,r.produto,r.origem,r.destino,r.precoTon,r.ton,r.valor]); });
    var ws=XLSX.utils.aoa_to_sheet(aoa); var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Receitas"); XLSX.writeFile(wb,"receitas-"+props.mk+".xlsx");
  }

  return (
    <div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",margin:"18px 0 14px"}}>
        <Btn onClick={nova}>+ Novo frete</Btn>
        <Btn color={INP} onClick={function(){ var el=document.getElementById("fileFretes"); if(el) el.click(); }}>Importar Excel</Btn>
        <input id="fileFretes" type="file" accept=".xlsx,.xls,.csv" onChange={importar} style={{display:"none"}}/>
        <Btn color={INP} onClick={baixarModelo}>Modelo</Btn>
        <Btn color={INP} onClick={exportar}>Exportar mês</Btn>
      </div>

      <div className="sec">Fretes de {mesLabel(props.mk)}{!props.driver?" — total "+brl(props.totRec):""}</div>
      <div className="card" style={{padding:0,overflowX:"auto"}}>
        <table>
          <thead><tr><th>Data</th><th>Tomador</th><th>Produto</th><th>Origem → Destino</th><th>Ton</th><th>R$/ton</th><th>Valor</th><th></th></tr></thead>
          <tbody>
            {props.recMes.length===0 && <tr><td colSpan={8} style={{color:MUT,textAlign:"center",padding:24}}>Nenhum frete neste mês. Adicione ou importe uma planilha.</td></tr>}
            {props.recMes.map(function(r){
              return <tr key={r.id}>
                <td>{ddmmyyyy(r.date)}</td>
                <td>{r.tomador}</td>
                <td>{r.produto}</td>
                <td style={{fontSize:13,color:MUT}}>{r.origem}{r.destino?" → "+r.destino:""}</td>
                <td>{num(r.ton)}</td>
                <td>{brl(r.precoTon)}</td>
                <td style={{fontWeight:700}}>{brl(r.valor)}</td>
                <td style={{whiteSpace:"nowrap"}}>
                  <button onClick={function(){editar(r);}} style={{background:INP,color:MUT,padding:"5px 9px",fontSize:13,marginRight:4}}>✎</button>
                  <button onClick={function(){excluir(r);}} style={{background:"#fee2e2",color:RED,padding:"5px 9px",fontSize:13}}>×</button>
                </td>
              </tr>;
            })}
          </tbody>
        </table>
      </div>

      {form &&
        <Modal title={form.id?"Editar frete":"Novo frete"} onClose={function(){setForm(null);}}>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <Fld label="Data" type="date" value={form.date} onChange={function(v){set("date",v);}}/>
              <Fld label="Tomador do serviço" value={form.tomador} onChange={function(v){set("tomador",v);}} placeholder="Ex: ACF (fazenda) ou outro cliente"/>
            </div>
            <Fld label="Produto" value={form.produto} onChange={function(v){set("produto",v);}} placeholder="Ex: Soja, Milho, Calcário"/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <Fld label="Origem" value={form.origem} onChange={function(v){set("origem",v);}}/>
              <Fld label="Destino" value={form.destino} onChange={function(v){set("destino",v);}}/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <Fld label="R$/ton" type="text" inputMode="decimal" value={form.precoTon} onChange={function(v){set("precoTon",v);}} placeholder="0,00"/>
              <Fld label="Quantidade (ton)" type="text" inputMode="decimal" value={form.ton} onChange={function(v){set("ton",v);}} placeholder="0,00"/>
            </div>
            <div style={{background:"#f7faf7",borderRadius:8,padding:"10px 14px",fontSize:15}}>
              Valor do frete: <b style={{color:GN}}>{brl((Number(String(form.precoTon).replace(",","."))||0)*(Number(String(form.ton).replace(",","."))||0))}</b>
            </div>
            <div style={{display:"flex",gap:10,marginTop:4}}>
              <Btn full color={INP} onClick={function(){setForm(null);}}>Cancelar</Btn>
              <Btn full onClick={salvar} disabled={!form.date||!form.tomador}>Salvar</Btn>
            </div>
          </div>
        </Modal>}
    </div>
  );
}

// ── DESPESAS ─────────────────────────────────────────────────────────────────
function Despesas(props){
  var f0=useState(null); var form=f0[0], setForm=f0[1];
  var v0=useState("mes"); var view=v0[0], setView=v0[1]; // mes | todas
  function nova(){ setForm({ tipo:"unica", date:todayISO(), categoria:"", descricao:"", valor:"", inicio:thisMonth(), fim:"", parcInicio:thisMonth(), parcN:"", parcTotal:"" }); }
  function set(k,v){ setForm(function(p){ var o=Object.assign({},p); o[k]=v; return o; }); }

      item.date=form.date; item.valor=Number(String(form.valor).replace(",","."))||0;

      item.inicio=form.inicio; item.fim=form.fim||null; item.valor=Number(String(form.valor).replace(",","."))||0;

      item.parcInicio=form.parcInicio; item.parcN=n; item.parcTotal=total; item.valor= n>0? total/n : total;
    }
    window.TX.addDespesa(item).then(function(){ setForm(null); props.toast("Despesa salva"); })
      .catch(function(){ props.toast("Erro ao salvar",true); });
  }
  function excluir(d){

    if(!confirm(msg)) return;

  function tipoBadge(t){
    if(t==="recorrente") return <span className="bdg bb">recorrente</span>;
    if(t==="parcelada") return <span className="bdg bp">parcelada</span>;
    return <span className="bdg bg">única</span>;

  return (
    <div>

        <div className="mtog" style={{width:230}}>
          <button className={view==="mes"?"on":""} onClick={function(){setView("mes");}}>Deste mês</button>
          <button className={view==="todas"?"on":""} onClick={function(){setView("todas");}}>Todas / recorrências</button>
        </div>
      </div>

      {view==="mes" && <div>
        <div className="sec">Despesas de {mesLabel(props.mk)}{!props.driver?" — total "+brl(props.totDesp):""}</div>
        {!props.driver && props.totDiam!==0 && <div style={{fontSize:13,color:MUT,marginBottom:10}}>Inclui <b style={{color:PUR}}>{brl(props.totDiam)}</b> em despesas Diamantes lançadas no cartão pessoal (via Nossas Contas). São geridas lá — aqui aparecem só para leitura, já com a subcategoria.</div>}
        <div className="card" style={{padding:0,overflowX:"auto"}}>
          <table>

// ── ABASTECIMENTO EXTERNO + ODÔMETRO (consumo médio) ─────────────────────────
function Abastecimento(props){
  var f0 = useState({tipo:"diesel", date:todayISO(), odometro:"", litros:"", valor:"", local:"", motorista:""}); var form=f0[0], setForm=f0[1];
  function set(k,v){ setForm(function(p){var o=Object.assign({},p);o[k]=v;return o;}); }
  function num2(v){ return Number(String(v).replace(",","."))||0; }
  var isArla = form.tipo==="arla";
  function salvar(){
    var lit=num2(form.litros), val=num2(form.valor);
    if(isArla){
      if(!form.date || val<=0){ props.toast("Preencha data e valor do ARLA",true); return; }
      window.TX.addOdometro({
        id: Date.now()+Math.floor(Math.random()*100000),
        tipo:"arla", date: form.date, odometro:0, litros:lit, valor:val,
        local:(form.local||"").trim(), motorista:(form.motorista||"").trim(),
        fonte:"externo", createdAt:new Date().toISOString()
      });
      props.toast("ARLA registrado ✓ (entra nas despesas)");
    } else {
      var odo=num2(form.odometro);
      if(!form.date || odo<=0 || lit<=0){ props.toast("Preencha data, odômetro e litros",true); return; }
      window.TX.addOdometro({
        id: Date.now()+Math.floor(Math.random()*100000),
        tipo:"diesel", date: form.date, odometro: odo, litros: lit, valor: val,
        local:(form.local||"").trim(), motorista:(form.motorista||"").trim(),
        fonte:"externo", createdAt:new Date().toISOString()
      });
      props.toast("Abastecimento registrado ✓");
    }
    setForm({tipo:form.tipo, date:todayISO(), odometro:"", litros:"", valor:"", local:"", motorista:""});
  }
  var dieselEntries = (props.data.odo||[]).slice().filter(function(x){return x.tipo!=="arla" && Number(x.odometro)>0;});
  var porOdo = dieselEntries.slice().sort(function(a,b){ return Number(a.odometro)-Number(b.odometro); });
  var consumo=null;
  if(porOdo.length>=2){
    var first=porOdo[0], last=porOdo[porOdo.length-1];
    var km=Number(last.odometro)-Number(first.odometro);
    var litros=0;
    for(var i=1;i<porOdo.length;i++){ litros += Number(porOdo[i].litros)||0; }
    (props.fuelFH||[]).forEach(function(fl){ if(String(fl.date)>String(first.date) && String(fl.date)<=String(last.date)) litros += Number(fl.liters)||0; });
    consumo = { km:km, litros:litros, kmL: litros>0? km/litros : 0 };
  }
  var lista = (props.data.odo||[]).slice().sort(function(a,b){ return String(b.date)<String(a.date)?-1:(String(b.date)>String(a.date)?1:(Number(b.odometro)-Number(a.odometro))); });
  function excluir(r){ if(confirm("Excluir este registro?")) window.TX.delOdometro(r.id); }

  return (
    <div>
      <div className="sec" style={{marginTop:18}}>Consumo do caminhão</div>
      {consumo
        ? <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10,marginBottom:16}}>
            <Stat label="Consumo médio" value={num(consumo.kmL)+" km/L"} sub="posto + externo" color={GN}/>
            <Stat label="Km rodados" value={num(consumo.km)+" km"} sub="entre leituras" color={BLU}/>
            <Stat label="Litros no período" value={num(consumo.litros)+" L"} sub="abastecidos" color={AMB}/>
          </div>
        : <div className="card" style={{marginBottom:16,color:MUT,fontSize:14}}>Registre pelo menos <b>2 abastecimentos com odômetro</b> para o app calcular o consumo médio.</div>}

      <div className="card" style={{marginBottom:18}}>
        <div style={{fontWeight:700,marginBottom:12,color:GN2}}>Registrar abastecimento</div>
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          <button onClick={function(){set("tipo","diesel");}} style={{flex:1,padding:"10px",background:!isArla?GN:INP,color:!isArla?"#fff":MUT}}>Diesel</button>
          <button onClick={function(){set("tipo","arla");}} style={{flex:1,padding:"10px",background:isArla?BLU:INP,color:isArla?"#fff":MUT}}>ARLA</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:12}}>
          <Fld label="Data" type="date" value={form.date} onChange={function(v){set("date",v);}}/>
          {!isArla && <Fld label="Odômetro (km)" type="text" inputMode="numeric" value={form.odometro} onChange={function(v){set("odometro",v);}} placeholder="Ex: 245680"/>}
          <Fld label={isArla?"Litros — opcional":"Litros"} type="text" inputMode="decimal" value={form.litros} onChange={function(v){set("litros",v);}} placeholder="Ex: 180"/>
          <Fld label={isArla?"Valor (R$)":"Valor (R$) — opcional"} type="text" inputMode="decimal" value={form.valor} onChange={function(v){set("valor",v);}} placeholder="0,00"/>
          <Fld label="Local/Posto — opcional" value={form.local} onChange={function(v){set("local",v);}} placeholder="Ex: Posto Trevo, BR-050"/>
          <Fld label="Motorista — opcional" value={form.motorista} onChange={function(v){set("motorista",v);}} placeholder="Nome"/>
        </div>
        {isArla && <div style={{fontSize:13,color:MUT,marginTop:10}}>O ARLA não pede odômetro e não entra no consumo de diesel — ele entra automaticamente nas <b>Despesas</b> (categoria ARLA).</div>}
        <div style={{marginTop:14}}><Btn full onClick={salvar}>{isArla?"Salvar ARLA":"Salvar abastecimento"}</Btn></div>
      </div>

      <div className="sec">Abastecimentos registrados</div>
      <div className="card" style={{padding:0,overflow:"hidden"}}>
        <table><thead><tr>
          <th>Data</th><th>Tipo</th><th>Odômetro</th><th>Litros</th><th>Local</th>
          {!props.driver && <th>Valor</th>}{!props.driver && <th></th>}
        </tr></thead><tbody>
          {lista.length===0 && <tr><td colSpan={props.driver?5:7} style={{color:MUT,textAlign:"center",padding:22}}>Nenhum abastecimento registrado ainda.</td></tr>}
          {lista.map(function(r){
            var arla = r.tipo==="arla";
            return <tr key={r.id}>
              <td>{ddmmyyyy(r.date)}</td>
              <td><span className={"bdg "+(arla?"bb":"bg")}>{arla?"ARLA":"Diesel"}</span></td>
              <td style={{fontWeight:700}}>{arla?"—":num(r.odometro)+" km"}</td>
              <td>{r.litros>0?num(r.litros)+" L":"—"}</td>
              <td style={{fontSize:13,color:MUT}}>{r.local||"—"}{r.motorista?" · "+r.motorista:""}</td>
              {!props.driver && <td>{r.valor>0?brl(r.valor):"—"}</td>}
              {!props.driver && <td><button onClick={function(){excluir(r);}} style={{background:"#fee2e2",color:RED,padding:"5px 9px",fontSize:13}}>×</button></td>}
            </tr>;
          })}
        </tbody></table>
      </div>
      <div style={{fontSize:13,color:MUT,marginTop:12,lineHeight:1.5}}>O consumo médio junta os litros do <b>posto da fazenda</b> (automático) com os abastecimentos <b>externos</b> registrados aqui, dividindo os km rodados pelo total de litros entre a primeira e a última leitura de odômetro.</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
