<script>
(function(){
  // MESMO PROJETO do Posto Diesel (agroop-d73d4) — e isso que permite LER os
  // abastecimentos da FH 540 direto da base do Posto, sem redigitar nada.
  var firebaseConfig = {
    apiKey: "AIzaSyDtmcibrocmj0Gc8bpTtXFUc2JTuN5CRjY",
    authDomain: "agroop-d73d4.firebaseapp.com",
    projectId: "agroop-d73d4",
    storageBucket: "agroop-d73d4.firebasestorage.app",
    messagingSenderId: "591049190246",
    appId: "1:591049190246:web:0a21a937f978ade855b6a7"
  };

  window.TX = { ready:false };

  try {
    var existing = firebase.apps.filter(function(a){return a.name==="transportadora";});
    var fbApp = existing.length ? existing[0] : firebase.initializeApp(firebaseConfig, "transportadora");
    var db = fbApp.firestore();

    // ---- Dados DESTE app (transportadora) ----
    var ROOT = db.collection("transportadora").doc("dados");
    var REC  = ROOT.collection("receitas");   // 1 doc por frete
    var DESP = ROOT.collection("despesas");    // 1 doc por lançamento/recorrência/parcelamento
    var CONF = db.collection("transportadora").doc("config");

    // ---- Dados do Posto Diesel (somente leitura) ----
    var POSTO_CONFIG = db.collection("posto-diesel").doc("config");
    var POSTO_FUEL   = db.collection("posto-diesel").doc("dados").collection("abastecimentos");

    // ---- Abastecimentos externos (S10 e Arla fora da fazenda) ----
    var ABAST_EXT = ROOT.collection("abastExt");

    var state = { rec:[], desp:[], conf:null, postoMachines:[], fuel:[], abastExt:[] };
    var listeners = [];
    function emit(){ for(var i=0;i<listeners.length;i++){ try{listeners[i](state);}catch(e){console.error(e);} } }

    // Assinaturas em tempo real
    REC.onSnapshot(function(qs){
      state.rec = qs.docs.map(function(d){return d.data();}).filter(function(x){return x && !x.deleted;});
      emit();
    }, function(e){console.error("rec:",e);});

    DESP.onSnapshot(function(qs){
      state.desp = qs.docs.map(function(d){return d.data();}).filter(function(x){return x && !x.deleted;});
      emit();
    }, function(e){console.error("desp:",e);});

    CONF.onSnapshot(function(snap){
      if(snap.exists && snap.data() && snap.data().payload){
        try{ state.conf = JSON.parse(snap.data().payload); }catch(e){ state.conf = {}; }
      } else { state.conf = {}; }
      emit();
    }, function(e){console.error("conf:",e);});

    POSTO_CONFIG.onSnapshot(function(snap){
      var m = [];
      if(snap.exists && snap.data() && snap.data().payload){
        try{ var p = JSON.parse(snap.data().payload); m = p.machines || []; }catch(e){}
      }
      state.postoMachines = m;
      emit();
    }, function(e){console.error("postoConfig:",e);});

    POSTO_FUEL.onSnapshot(function(qs){
      state.fuel = qs.docs.map(function(d){return d.data();}).filter(function(x){return x && !x.deleted;});
      emit();
    }, function(e){console.error("postoFuel:",e);});

    ABAST_EXT.onSnapshot(function(qs){
      state.abastExt = qs.docs.map(function(d){return d.data();}).filter(function(x){return x && !x.deleted;});
      emit();
    }, function(e){console.error("abastExt:",e);});

    // API para o React
    window.TX = {
      ready: true,
      onData: function(cb){ listeners.push(cb); cb(state); },
      addReceita: function(item){ return REC.doc(String(item.id)).set(item); },
      delReceita: function(id){ return REC.doc(String(id)).set({deleted:true, deletedAt:new Date().toISOString()},{merge:true}); },
      addDespesa: function(item){ return DESP.doc(String(item.id)).set(item); },
      delDespesa: function(id){ return DESP.doc(String(id)).set({deleted:true, deletedAt:new Date().toISOString()},{merge:true}); },
      addAbastExt: function(item){ return ABAST_EXT.doc(String(item.id)).set(item); },
      delAbastExt: function(id){ return ABAST_EXT.doc(String(id)).set({deleted:true, deletedAt:new Date().toISOString()},{merge:true}); },
      saveConfig: function(cfg){ return CONF.set({ payload: JSON.stringify(cfg) }); }
    };
  } catch(err){
    console.error("Falha init Firebase:", err);
    window.TX = { ready:false, error:String(err) };
  }
})();
</script>

// ── UTILIDADES ───────────────────────────────────────────────────────────────
function pad(n){ return (n<10?"0":"")+n; }
function todayISO(){ var n=new Date(); return n.getFullYear()+"-"+pad(n.getMonth()+1)+"-"+pad(n.getDate()); }
function thisMonth(){ var n=new Date(); return n.getFullYear()+"-"+pad(n.getMonth()+1); }
function monthOf(d){ return String(d||"").slice(0,7); }
function monthDiff(a,b){ // b - a em meses (a,b = "YYYY-MM")
  var pa=a.split("-"), pb=b.split("-");
  return (Number(pb[0])-Number(pa[0]))*12 + (Number(pb[1])-Number(pa[1]));
}
function brl(v){ v=Number(v)||0; return "R$ "+v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function num(v){ v=Number(v)||0; return v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function ddmmyyyy(d){ var p=String(d||"").slice(0,10).split("-"); return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : d; }
function mesLabel(mk){
  var nomes=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  var p=String(mk).split("-"); return nomes[Number(p[1])-1]+"/"+p[0];
}
function norm(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim(); }

// Custo do diesel de UM abastecimento (R$/L), congelado — mesma regra do Posto:
function fuelCostPerLiter(x, avg){
  if(x && x.costPerLiter!==undefined && x.costPerLiter!==null && Number(x.costPerLiter)>0) return Number(x.costPerLiter);
  var d10 = String((x&&x.date)||"").slice(0,10);
  if(d10 && d10<="2026-08-16") return 6.20;
  if(d10 && d10<="2026-08-23") return 6.15;
  return Number(avg)||0;
}

// ── IMPRESSÃO PDF (iOS-compatible) ────────────────────────────────────────────
// Clona o conteúdo para fora do React e oculta o app antes de window.print().
// Garante compatibilidade com iOS Safari, que não aplica CSS class a tempo.
function imprimirPDF(printAreaId){
  var el = document.getElementById(printAreaId);
  if(!el){ console.warn("printArea não encontrado:", printAreaId); return; }
  var clone = el.cloneNode(true);
  clone.style.cssText = "display:block;background:#fff;font-family:'Barlow',sans-serif;";
  clone.id = "";
  document.body.appendChild(clone);
  var root = document.getElementById("root");
  root.style.display = "none";
  function cleanup(){
    root.style.display = "";
    if(clone.parentNode) clone.parentNode.removeChild(clone);
    window.removeEventListener("afterprint", cleanup);
    clearTimeout(fallback);
  }
  window.addEventListener("afterprint", cleanup);
  var fallback = setTimeout(cleanup, 15000); // fallback iOS (afterprint pode não disparar)
  setTimeout(function(){ window.print(); }, 300);
}

// ── COMPARTILHAR / BAIXAR PDF ──────────────────────────────────────────────────
// Gera um PDF real via html2canvas + jsPDF e abre o share sheet do iOS.
// Fallback: download direto no desktop.
function compartilharPDF(printAreaId, filename, onStart, onEnd){
  var el = document.getElementById(printAreaId);
  if(!el || typeof html2canvas==="undefined" || !window.jspdf){
    imprimirPDF(printAreaId); onEnd&&onEnd(); return;
  }
  onStart&&onStart();

  // Clona o conteúdo fora da tela para captura
  var clone = el.cloneNode(true);
  clone.style.cssText = "display:block;position:fixed;top:0;left:110vw;width:720px;background:#fff;padding:20px 24px;box-sizing:border-box;font-family:Arial,sans-serif;font-size:13px;line-height:1.4;";
  document.body.appendChild(clone);

  setTimeout(function(){
    html2canvas(clone, {
      scale:2, useCORS:true, allowTaint:true, backgroundColor:"#fff",
      logging:false, width:720, windowWidth:770
    }).then(function(canvas){
      if(clone.parentNode) clone.parentNode.removeChild(clone);

      var pdf = new window.jspdf.jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
      var pw = pdf.internal.pageSize.getWidth();   // 210mm
      var ph = pdf.internal.pageSize.getHeight();  // 297mm
      var imgH = pw * canvas.height / canvas.width; // altura total da imagem em mm
      var imgData = canvas.toDataURL("image/png");

      // Paginar: cada página mostra uma fatia da imagem
      var offset = 0;
      var page = 0;
      while(offset < imgH - 1){
        if(page > 0) pdf.addPage();
        pdf.addImage(imgData, "PNG", 0, -offset, pw, imgH);
        offset += ph;
        page++;
      }

      var blob = pdf.output("blob");
      var fname = filename || "relatorio.pdf";

      // iOS / Android: Share API com arquivo PDF
      try {
        var file = new File([blob], fname, {type:"application/pdf"});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          navigator.share({files:[file], title:fname})
            .then(function(){ onEnd&&onEnd(); })
            .catch(function(){ onEnd&&onEnd(); });
          return;
        }
      } catch(e){}

      // Fallback desktop: download direto
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href=url; a.download=fname; a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      onEnd&&onEnd();

    }).catch(function(err){
      if(clone.parentNode) clone.parentNode.removeChild(clone);
      console.error("html2canvas error:", err);
      imprimirPDF(printAreaId); // fallback
      onEnd&&onEnd();
    });
  }, 600);
}

function Toast(props){

}

// ── APP ──────────────────────────────────────────────────────────────────────
function App(){
  var s0 = useState({ rec:[], desp:[], conf:null, postoMachines:[], fuel:[], abastExt:[] }); var data=s0[0], setData=s0[1];
  var t0 = useState("receitas"); var tab=t0[0], setTab=t0[1];
  var m0 = useState(thisMonth()); var mk=m0[0], setMk=m0[1];
  var ts0 = useState(null); var toast=ts0[0], setToast=ts0[1];
  var pf0 = useState(null); var perfil=pf0[0], setPerfil=pf0[1];
  var pm0 = useState(false); var pinModal=pm0[0], setPinModal=pm0[1];
  var pd0 = useState(""); var pinDigits=pd0[0], setPinDigits=pd0[1];
  var nc0 = useState([]); var ncDespesas=nc0[0], setNcDespesas=nc0[1];
  var ne0 = useState(null); var ncErr=ne0[0], setNcErr=ne0[1];
  var ns0 = useState("idle"); var ncStatus=ns0[0], setNcStatus=ns0[1];

  useEffect(function(){
    if(window.TX && window.TX.ready){ window.TX.onData(function(st){ setData(Object.assign({},st)); }); }
  },[]);

  // conf precisa estar definido ANTES dos useEffects que o referenciam
  var conf = data.conf || {};

  // ── Conexão ao Nossas Contas (Diamantes LHM) ──
  useEffect(function(){
    var ncKey = conf.ncApiKey;
    var ncAppId = conf.ncAppId;
    if(!ncKey || !ncAppId){ setNcStatus("idle"); setNcDespesas([]); return; }

    setNcStatus("connecting");
    var unsubscribe;
    try {
      var existing = firebase.apps.filter(function(a){ return a.name==="nc"; });
      var ncApp = existing.length ? existing[0] : firebase.initializeApp({
        apiKey: ncKey,
        authDomain: "nossas-contas-6c240.firebaseapp.com",
        projectId: "nossas-contas-6c240",
        storageBucket: "nossas-contas-6c240.firebasestorage.app",
        appId: ncAppId
      }, "nc");

      var ncDb = ncApp.firestore();
      var ncAuth = ncApp.auth();

      ncAuth.signInAnonymously().then(function(){
        var col = ncDb.collection("gastos_familia").doc("dados").collection("gastos");
        unsubscribe = col.onSnapshot(function(snap){
          var lista = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); })
            .filter(function(e){ return e.category==="Diamantes LHM" && e.include!==false && Number(e.amount)>0; });
          setNcDespesas(lista);
          setNcStatus("ok");
          setNcErr(null);
        }, function(err){
          setNcErr(err.message||"Erro ao ler Nossas Contas");
          setNcStatus("error");
        });
      }).catch(function(err){
        setNcErr(err.message||"Erro de autenticação");
        setNcStatus("error");
      });
    } catch(err) {
      setNcErr(err.message||"Erro ao conectar");
      setNcStatus("error");
    }
    return function(){ if(unsubscribe) unsubscribe(); };
  },[conf.ncApiKey, conf.ncAppId]);

  function showToast(msg,err){ setToast({msg:msg,err:err}); setTimeout(function(){setToast(null);},2600); }

  var fazendaKey = conf.fazendaKey || "ACF";
  var custoFallback = Number(conf.custoFallback)||6.15;

  // ---- localizar a FH 540 (código 016) no Posto ----
  var fh540 = useMemo(function(){
    var list = data.postoMachines || [];
    var found = null;
    for(var i=0;i<list.length;i++){ if(String(list[i].code||"").trim()==="016"){ found=list[i]; break; } }
    if(!found){ for(var j=0;j<list.length;j++){ if(norm(list[j].desc)==="fh 540"||norm(list[j].desc)==="fh540"){ found=list[j]; break; } } }
    return found;
  },[data.postoMachines]);

  // ---- diesel da FH 540 no mês selecionado ----
  var ano = mk.slice(0,4);

  var diesel = useMemo(function(){
    if(!fh540) return { litros:0, custo:0, itens:[], km:0, kml:0, custokm:0 };
    var itens = (data.fuel||[]).filter(function(x){
      return Number(x.machineId)===Number(fh540.id) && monthOf(x.date)===mk;
    }).sort(function(a,b){ return String(a.date)<String(b.date)?-1:1; });
    // fallback de custo = último costPerLiter conhecido da FH540, senão config
    var avg = custoFallback;
    for(var i=itens.length-1;i>=0;i--){ if(Number(itens[i].costPerLiter)>0){ avg=Number(itens[i].costPerLiter); break; } }
    var litros=0, custo=0;
    var det = itens.map(function(x){
      var l=Number(x.liters)||0; var cpl=fuelCostPerLiter(x,avg); var v=l*cpl;
      litros+=l; custo+=v;
      return { date:x.date, liters:l, cpl:cpl, valor:v, meter:Number(x.meter)||0 };
    });
    // km rodado no mês = maior hodômetro − menor hodômetro dos registros do mês
    var meters = det.map(function(d){return d.meter;}).filter(function(m){return m>0;});
    var km = meters.length>=2 ? Math.max.apply(null,meters)-Math.min.apply(null,meters) : 0;
    var kml = (km>0 && litros>0) ? km/litros : 0;
    var custokm = (km>0 && custo>0) ? custo/km : 0;
    return { litros:litros, custo:custo, itens:det, km:km, kml:kml, custokm:custokm };
  },[data.fuel, fh540, mk, custoFallback]);

  // ---- diesel FH 540 acumulado no ano ----
  var dieselAno = useMemo(function(){
    if(!fh540) return { litros:0, custo:0, km:0, kml:0, custokm:0 };
    var itens = (data.fuel||[]).filter(function(x){
      return Number(x.machineId)===Number(fh540.id) && String(x.date||"").slice(0,4)===ano;
    });
    var avg = custoFallback;
    for(var i=itens.length-1;i>=0;i--){ if(Number(itens[i].costPerLiter)>0){ avg=Number(itens[i].costPerLiter); break; } }
    var litros=0, custo=0, meters=[];
    itens.forEach(function(x){
      var l=Number(x.liters)||0; var cpl=fuelCostPerLiter(x,avg); var v=l*cpl;
      litros+=l; custo+=v;
      if(Number(x.meter)>0) meters.push(Number(x.meter));
    });
    var km = meters.length>=2 ? Math.max.apply(null,meters)-Math.min.apply(null,meters) : 0;
    var kml = (km>0 && litros>0) ? km/litros : 0;
    var custokm = (km>0 && custo>0) ? custo/km : 0;
    return { litros:litros, custo:custo, km:km, kml:kml, custokm:custokm };
  },[data.fuel, fh540, ano, custoFallback]);

  // ---- receitas do mês ----
  var recMes = useMemo(function(){
    return (data.rec||[]).filter(function(r){ return monthOf(r.date)===mk; })
      .sort(function(a,b){ return String(a.date)<String(b.date)?-1:1; });
  },[data.rec, mk]);
  var recFazenda = recMes.filter(function(r){ return norm(r.tomador).indexOf(norm(fazendaKey))>=0; });
  var totRec = recMes.reduce(function(a,r){ return a+(Number(r.valor)||0); },0);
  var totRecFaz = recFazenda.reduce(function(a,r){ return a+(Number(r.valor)||0); },0);

  // ---- despesas que incidem no mês ----
  function despValorNoMes(d, m){
    if(d.tipo==="recorrente"){ if(m>=(d.inicio||"0000-00") && (!d.fim || m<=d.fim)) return Number(d.valor)||0; return 0; }
    if(d.tipo==="parcelada"){ var n=monthDiff(d.parcInicio||m, m); if(n>=0 && n<(Number(d.parcN)||0)) return Number(d.valor)||0; return 0; }
    return monthOf(d.date)===m ? (Number(d.valor)||0) : 0; // unica
  }
  var despMes = useMemo(function(){
    return (data.desp||[]).map(function(d){ return { d:d, v:despValorNoMes(d,mk) }; })
      .filter(function(o){ return o.v>0; })
      .sort(function(a,b){ return b.v-a.v; });
  },[data.desp, mk]);
  var totDespLocal = despMes.reduce(function(a,o){ return a+o.v; },0);

  // Despesas Diamantes vindas do Nossas Contas
  var ncDespMes = useMemo(function(){
    return (ncDespesas||[]).filter(function(e){ return monthOf(e.date)===mk; })
      .sort(function(a,b){ return String(a.date)<String(b.date)?-1:1; });
  },[ncDespesas, mk]);
  var totDespNC = ncDespMes.reduce(function(a,e){ return a+(Number(e.amount)||0); },0);
  var totDesp = totDespLocal + totDespNC;

  // Custo de abastecimentos externos (S10 + Arla, ambos são saída de caixa)
  var extFuelCusto = useMemo(function(){
    return (data.abastExt||[]).filter(function(x){ return monthOf(x.date)===mk; })
      .reduce(function(a,x){ return a+(Number(x.valorTotal)||0); }, 0);
  },[data.abastExt, mk]);

  // Custo total do mês a ser distribuído pelos fretes
  var custoTotalMes = totDesp + diesel.custo + extFuelCusto;

  var resultado = totRec - totDesp - diesel.custo;   // resultado geral da transportadora
  var acertoLiquido = totRecFaz - diesel.custo;      // acerto com a fazenda

  // ---- análise econômica anual ----
  var analise = useMemo(function(){
    var meses = [];
    var tomadores = {};
    var categorias = {};
    var totA = { rec:0, desp:0, diesel:0, resultado:0, km:0, litros:0 };

    for(var m=1; m<=12; m++){
      var mkM = ano+"-"+pad(m);

      // Receitas do mês
      var recM = (data.rec||[]).filter(function(r){ return monthOf(r.date)===mkM; });
      var totRecM = recM.reduce(function(a,r){ return a+(Number(r.valor)||0); }, 0);

      // Despesas locais do mês
      var totDespLocalM = (data.desp||[]).reduce(function(a,d){ return a+despValorNoMes(d,mkM); }, 0);
      // Despesas NC do mês
      var totDespNCM = (ncDespesas||[]).filter(function(e){ return monthOf(e.date)===mkM; })
        .reduce(function(a,e){ return a+(Number(e.amount)||0); }, 0);
      var totDespM = totDespLocalM + totDespNCM;

      // Diesel do mês
      var fuelM = fh540 ? (data.fuel||[]).filter(function(x){
        return Number(x.machineId)===Number(fh540.id) && monthOf(x.date)===mkM;
      }) : [];
      var avgCPL = custoFallback;
      for(var i=fuelM.length-1;i>=0;i--){ if(Number(fuelM[i].costPerLiter)>0){ avgCPL=Number(fuelM[i].costPerLiter); break; } }
      var litrosM=0, custoM=0, metersM=[];
      fuelM.forEach(function(x){
        var l=Number(x.liters)||0; var cpl=fuelCostPerLiter(x,avgCPL);
        litrosM+=l; custoM+=l*cpl;
        if(Number(x.meter)>0) metersM.push(Number(x.meter));
      });
      var kmM = metersM.length>=2 ? Math.max.apply(null,metersM)-Math.min.apply(null,metersM) : 0;
      var kmlM = (kmM>0&&litrosM>0) ? kmM/litrosM : 0;
      var resultadoM = totRecM - totDespM - custoM;

      // Acumula totais anuais
      totA.rec    += totRecM;
      totA.desp   += totDespM;
      totA.diesel += custoM;
      totA.km     += kmM;
      totA.litros += litrosM;
      totA.resultado += resultadoM;

      // Receita por tomador (ano)
      recM.forEach(function(r){
        var t = (r.tomador||"Sem tomador").trim();
        if(!tomadores[t]) tomadores[t]=0;
        tomadores[t]+=(Number(r.valor)||0);
      });

      meses.push({ mk:mkM, m:m, rec:totRecM, desp:totDespM, diesel:custoM,
                   resultado:resultadoM, km:kmM, litros:litrosM, kml:kmlM,
                   temDados: totRecM>0||totDespM>0||custoM>0 });
    }

    // Despesas por categoria (ano inteiro) — locais
    (data.desp||[]).forEach(function(d){
      for(var m=1;m<=12;m++){
        var mkM2 = ano+"-"+pad(m);
        var v = despValorNoMes(d, mkM2);
        if(v>0){
          var cat = (d.categoria||"Sem categoria").trim();
          if(!categorias[cat]) categorias[cat]=0;
          categorias[cat]+=v;
        }
      }
    });
    // Despesas Diamantes do Nossas Contas no ano
    (ncDespesas||[]).filter(function(e){ return String(e.date||"").slice(0,4)===ano; }).forEach(function(e){
      var desc = (e.desc||"Outros").trim();
      var cat = "Diamantes · " + (desc.length>28 ? desc.slice(0,28)+"…" : desc);
      if(!categorias[cat]) categorias[cat]=0;
      categorias[cat]+=(Number(e.amount)||0);
    });
    // Adiciona diesel como categoria
    if(totA.diesel>0) categorias["Diesel (FH 540)"] = totA.diesel;

    var tomList = Object.keys(tomadores).map(function(k){ return {nome:k,valor:tomadores[k]}; })
      .sort(function(a,b){ return b.valor-a.valor; });
    var catList = Object.keys(categorias).map(function(k){ return {nome:k,valor:categorias[k]}; })
      .sort(function(a,b){ return b.valor-a.valor; });

    var totCusto = totA.desp + totA.diesel;
    var kmlAno = (totA.km>0&&totA.litros>0) ? totA.km/totA.litros : 0;
    var recKm  = (totA.km>0&&totA.rec>0)    ? totA.rec/totA.km    : 0;
    var custoKm= (totA.km>0&&totCusto>0)    ? totCusto/totA.km    : 0;
    var margem = totA.rec>0 ? totA.resultado/totA.rec*100 : 0;
    var dieselPct = totA.rec>0 ? totA.diesel/totA.rec*100 : 0;

    return { meses:meses, totA:totA, totCusto:totCusto,
             tomadores:tomList, categorias:catList,
             kmlAno:kmlAno, recKm:recKm, custoKm:custoKm,
             margem:margem, dieselPct:dieselPct };
  },[data.rec, data.desp, data.fuel, fh540, ano, custoFallback, ncDespesas]);

  // ---- km/L combinado do mês (posto fazenda S10 + externo S10, para Elinton) ----
  var kmlElintonMes = useMemo(function(){
    // S10 do Posto Fazenda (meter já registrado no Posto Diesel)
    var postoS10 = fh540 ? (data.fuel||[]).filter(function(x){
      return Number(x.machineId)===Number(fh540.id) && monthOf(x.date)===mk;
    }) : [];
    var postoLitros = postoS10.reduce(function(a,x){return a+(Number(x.liters)||0);},0);
    var postoMeters = postoS10.map(function(x){return Number(x.meter)||0;}).filter(function(m){return m>0;});

    // S10 externo (abastecimentos fora da fazenda, tipo S10)
    var extS10 = (data.abastExt||[]).filter(function(x){
      return x.tipo==="S10" && monthOf(x.date)===mk;
    });
    var extLitros = extS10.reduce(function(a,x){return a+(Number(x.litros)||0);},0);
    var extMeters = extS10.map(function(x){return Number(x.odometro)||0;}).filter(function(m){return m>0;});

    // Combina odômetros de ambas as fontes para calcular km rodados
    var allMeters = postoMeters.concat(extMeters);
    var totalLitrosS10 = postoLitros + extLitros;
    var km = allMeters.length>=2 ? Math.max.apply(null,allMeters)-Math.min.apply(null,allMeters) : 0;
    return { kml: (km>0&&totalLitrosS10>0)?km/totalLitrosS10:0, km:km, litrosS10:totalLitrosS10 };
  },[data.fuel, data.abastExt, fh540, mk]);

  var estilos = { maxWidth:960, margin:"0 auto", padding:"0 14px 90px" };

  // ── Login / PIN helpers ──
  var pinGestora = String(conf.pinGestora || "1234");

  function entrarGestora(){
    if(pinDigits === pinGestora){
      setPerfil("gestora"); setPinModal(false); setPinDigits(""); setTab("painel");
    } else {
      setPinDigits(""); showToast("PIN incorreto",true);
    }
  }

  function teclarPin(d){
    if(d==="del"){ setPinDigits(function(p){ return p.slice(0,-1); }); return; }
    if(d==="ok"){ entrarGestora(); return; }
    setPinDigits(function(p){ if(p.length>=4) return p; return p+d; });
  }

  useEffect(function(){
    if(pinDigits.length===4){ entrarGestora(); }
  },[pinDigits]);

  function sair(){ setPerfil(null); setPinDigits(""); setTab("receitas"); }

  // Tabs por perfil
  var tabsGestora  = [["painel","Painel"],["receitas","Receitas"],["despesas","Despesas"],["analise","Análise"],["acerto","Acerto Fazenda"],["relatorio","Relatório"],["config","Config"]];
  var tabsMotorista = [["receitas","Fretes"],["despesas","Despesas"],["abast","Abastecimento"]];
  var tabs = perfil==="gestora" ? tabsGestora : tabsMotorista;

  // ── Tela de login ──
  if(!perfil){
    return (
      <div style={{minHeight:"100vh",background:"linear-gradient(160deg,"+GN2+" 0%,"+GN+" 50%,#3a9a3a 100%)"}}>
        <style>{CSS}</style>
        <div style={{maxWidth:400,margin:"0 auto",padding:"60px 24px 40px",display:"flex",flexDirection:"column",alignItems:"center",gap:0}}>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:32,color:"#fff",letterSpacing:2,textAlign:"center",lineHeight:1}}>DIAMANTES LHM</div>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,fontSize:18,color:"#ffffffbb",letterSpacing:4,marginBottom:48}}>ACF</div>

          <div style={{fontSize:12,textTransform:"uppercase",letterSpacing:2,color:"#ffffffaa",marginBottom:18,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700}}>Selecione seu perfil</div>

          {/* Card Luana */}
          <button onClick={function(){ setPinModal(true); setPinDigits(""); }}
            style={{width:"100%",background:"#fff",borderRadius:16,padding:"22px 24px",marginBottom:14,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:10,boxShadow:"0 8px 32px #00000030",cursor:"pointer"}}>
            <div style={{width:52,height:52,borderRadius:"50%",background:"linear-gradient(135deg,"+GN+","+GN2+")",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>👩</div>
            <div style={{textAlign:"center"}}>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:22,color:TXT}}>LUANA</div>
              <div style={{fontSize:13,color:MUT,marginTop:2}}>Gestora · acesso completo</div>
              <div style={{fontSize:11,color:DIM,marginTop:1}}>🔒 Requer PIN</div>
            </div>
          </button>

          {/* Card Elinton */}
          <button onClick={function(){ setPerfil("motorista"); setTab("receitas"); }}
            style={{width:"100%",background:"#fff",borderRadius:16,padding:"22px 24px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:10,boxShadow:"0 8px 32px #00000030",cursor:"pointer"}}>
            <div style={{width:52,height:52,borderRadius:"50%",background:"linear-gradient(135deg,#1d6fa4,#0369a1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>👨</div>
            <div style={{textAlign:"center"}}>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:22,color:TXT}}>ELINTON</div>
              <div style={{fontSize:13,color:MUT,marginTop:2}}>Motorista · lançamentos</div>
              <div style={{fontSize:11,color:DIM,marginTop:1}}>✓ Acesso direto</div>
            </div>
          </button>
        </div>

        {/* Modal PIN */}
        {pinModal &&
          <div style={{position:"fixed",inset:0,background:"#000a",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:50}} onClick={function(){ setPinModal(false); setPinDigits(""); }}>
            <div style={{background:CARD,borderRadius:"20px 20px 0 0",padding:"28px 24px 40px",width:"100%",maxWidth:400,boxShadow:"0 -8px 40px #0004"}} onClick={function(e){e.stopPropagation();}}>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:20,color:TXT,textAlign:"center",marginBottom:6}}>ACESSO GESTOR</div>
              <div style={{fontSize:13,color:MUT,textAlign:"center",marginBottom:24}}>Luana — insira o PIN</div>

              {/* Pontos do PIN */}
              <div style={{display:"flex",justifyContent:"center",gap:16,marginBottom:28}}>
                {[0,1,2,3].map(function(i){
                  return <div key={i} style={{width:18,height:18,borderRadius:"50%",background:i<pinDigits.length?GN:BDR,transition:"background .15s"}}/>;
                })}
              </div>

              {/* Teclado numérico */}
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
                {["1","2","3","4","5","6","7","8","9","del","0","ok"].map(function(d){
                  var isDel=d==="del", isOk=d==="ok";
                  return <button key={d} onClick={function(){teclarPin(d);}}
                    style={{padding:"18px 0",fontSize:isDel||isOk?15:22,fontWeight:700,borderRadius:12,
                      background:isOk?GN:isDel?"#fee2e2":INP,
                      color:isOk?"#fff":isDel?RED:TXT,
                      fontFamily:"'Barlow Condensed',sans-serif"}}>
                    {isDel?"⌫":isOk?"OK":d}
                  </button>;
                })}
              </div>
            </div>
          </div>}

        <Toast msg={toast&&toast.msg} err={toast&&toast.err}/>
      </div>
    );
  }

  // ── App principal (após login) ──
  return (
    <div style={{minHeight:"100vh"}}>
      <style>{CSS}</style>

      {/* CABEÇALHO */}
      <div className="noprint" style={{background:"linear-gradient(180deg,"+GN2+","+GN+")",padding:"14px 14px 12px",color:"#fff",boxShadow:"0 2px 12px #0002"}}>
        <div style={{maxWidth:960,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,flexWrap:"wrap"}}>
          <div>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:22,letterSpacing:1,lineHeight:1}}>DIAMANTES LHM · ACF</div>
            <div style={{fontSize:11,opacity:.75,marginTop:1}}>
              {perfil==="gestora" ? "👩 Luana — Gestora" : "👨 Elinton — Motorista"}
              
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            {perfil==="gestora" &&
              <div style={{background:"#ffffff22",borderRadius:10,padding:"6px 10px",display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:11,textTransform:"uppercase",letterSpacing:1,opacity:.85}}>Mês</span>
                <input type="month" value={mk} onChange={function(e){setMk(e.target.value);}} style={{width:140,padding:"5px 8px",border:"none",fontWeight:700,color:TXT}}/>
              </div>}
            <button onClick={sair} style={{background:"#ffffff22",color:"#fff",padding:"8px 12px",borderRadius:8,fontSize:13,fontWeight:600}}>Sair</button>
          </div>
        </div>
        {/* Seletor de mês para motorista */}
        {perfil==="motorista" &&
          <div style={{maxWidth:960,margin:"6px auto 0",display:"flex",alignItems:"center",gap:8}}>
            <div style={{background:"#ffffff22",borderRadius:10,padding:"5px 10px",display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:11,textTransform:"uppercase",letterSpacing:1,opacity:.85}}>Mês</span>
              <input type="month" value={mk} onChange={function(e){setMk(e.target.value);}} style={{width:150,padding:"5px 8px",border:"none",fontWeight:700,color:TXT}}/>
            </div>
          </div>}
      </div>

      {/* AVISO se não achou a FH540 */}
      {(!window.TX||!window.TX.ready) &&
        <div style={estilos}><div className="card" style={{marginTop:16,borderColor:"#fca5a5",background:"#fef2f2",color:RED}}>Sem conexão com o banco de dados. Verifique a internet e recarregue.</div></div>}

      {/* NAV */}
      <div className="noprint" style={{background:CARD,borderBottom:"1.5px solid "+BDR}}>
        <div style={{maxWidth:960,margin:"0 auto",display:"flex",gap:4,padding:"0 8px",overflowX:"auto"}}>
          {tabs.map(function(t){
            var on = tab===t[0];
            return <button key={t[0]} onClick={function(){setTab(t[0]);}} style={{background:"none",color:on?GN:MUT,borderBottom:on?"3px solid "+GN:"3px solid transparent",borderRadius:0,padding:"14px 14px",fontSize:15,whiteSpace:"nowrap"}}>{t[1]}</button>;
          })}
        </div>
      </div>

      <div style={estilos} className="fi">
        {tab==="painel"   && <Painel mk={mk} ano={ano} totRec={totRec} totRecFaz={totRecFaz} totDesp={totDesp} diesel={diesel} dieselAno={dieselAno} resultado={resultado} acerto={acertoLiquido} fh540={fh540} recCount={recMes.length} despCount={despMes.length}/>}
        {tab==="receitas" && <Receitas data={data} mk={mk} recMes={recMes} totRec={totRec} custoTotalMes={custoTotalMes} custoBreakdown={{diesel:diesel.custo, extFuel:extFuelCusto, despLocal:totDespLocal, despNC:totDespNC}} toast={showToast} soLeitura={perfil==="motorista"}/>}
        {tab==="despesas" && <Despesas data={data} mk={mk} despMes={despMes} totDespLocal={totDespLocal} totDesp={totDesp} ncDespMes={ncDespMes} totDespNC={totDespNC} ncStatus={ncStatus} ncErr={ncErr} toast={showToast} soLeitura={perfil==="motorista"}/>}
        {tab==="analise"  && <Analise mk={mk} ano={ano} analise={analise}/>}
        {tab==="acerto"   && <Acerto mk={mk} recFazenda={recFazenda} totRecFaz={totRecFaz} diesel={diesel} liquido={acertoLiquido} fazendaKey={fazendaKey} conf={conf}/>}
        {tab==="relatorio" && <Relatorio mk={mk} conf={conf} recMes={recMes} totRec={totRec} despMes={despMes} totDespLocal={totDespLocal} ncDespMes={ncDespMes} totDespNC={totDespNC} diesel={diesel} data={data} kmlMes={kmlElintonMes} extFuelCusto={extFuelCusto} custoTotalMes={custoTotalMes}/>}
        {tab==="config"   && <Config conf={conf} toast={showToast} fh540={fh540} ncStatus={ncStatus} ncErr={ncErr}/>}
        {tab==="abast"    && <AbastExterno data={data} mk={mk} kmlMes={kmlElintonMes} toast={showToast}/>}
      </div>

      <Toast msg={toast&&toast.msg} err={toast&&toast.err}/>
    </div>
  );
}

// ── PAINEL ───────────────────────────────────────────────────────────────────
function Painel(props){
  var d=props.diesel, da=props.dieselAno||{};
  function fmtKml(v){ return v>0 ? v.toFixed(2)+" km/L" : "—"; }
  function fmtCkm(v){ return v>0 ? brl(v)+"/km" : "—"; }
  function fmtKm(v){ return v>0 ? v.toLocaleString("pt-BR",{maximumFractionDigits:0})+" km" : "—"; }

  return (
    <div>
      {/* ── Resumo financeiro ── */}
      <div className="sec" style={{marginTop:18}}>Resumo de {mesLabel(props.mk)}</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <Stat label="Receitas" value={brl(props.totRec)} sub={props.recCount+" frete(s)"} color={GN} accent={GN}/>
        <Stat label="Despesas" value={brl(props.totDesp)} sub={props.despCount+" lançamento(s)"} color={RED} accent={RED}/>

// ── ANÁLISE ECONÔMICA ────────────────────────────────────────────────────────
function Analise(props){
  var a = props.analise;
  var nomes = ["","Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

  // barra proporcional ao maior valor absoluto do conjunto
  function Bar(bprops){
    var max = bprops.max || 1;
    var v   = Math.abs(bprops.valor);
    var pct = Math.min(v/max*100, 100);
    var pos = (bprops.valor||0) >= 0;
    var clr = bprops.color || (pos ? GN : RED);
    return (
      <div style={{height:8,background:"#e8f0e8",borderRadius:4,overflow:"hidden",marginTop:4}}>
        <div style={{height:"100%",width:pct+"%",background:clr,borderRadius:4,transition:"width .4s"}}/>
      </div>
    );
  }

  // max resultado absoluto para as barras mensais
  var maxRes   = Math.max.apply(null, a.meses.map(function(m){ return Math.abs(m.resultado); }).concat([1]));
  var maxTom   = a.tomadores.length > 0 ? a.tomadores[0].valor : 1;
  var maxCat   = a.categorias.length > 0 ? a.categorias[0].valor : 1;
  var mesesComDados = a.meses.filter(function(m){ return m.temDados; });

  return (
    <div>
      {/* ── 1. Indicadores-chave ── */}
      <div className="sec" style={{marginTop:18}}>Indicadores-chave — {props.ano}</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:4}}>
        <Stat label="Margem operacional" value={a.margem!==0 ? a.margem.toFixed(1)+"%" : "—"} sub="resultado ÷ receita" color={a.margem>=0?GN:RED} accent={a.margem>=0?GN:RED}/>
        <Stat label="Diesel / receita" value={a.dieselPct>0 ? a.dieselPct.toFixed(1)+"%" : "—"} sub="% da receita em combustível" color={AMB} accent={AMB}/>
        <Stat label="Receita / km" value={a.recKm>0 ? brl(a.recKm)+"/km" : "—"} sub="faturamento por km rodado" color={BLU} accent={BLU}/>
        <Stat label="Custo total / km" value={a.custoKm>0 ? brl(a.custoKm)+"/km" : "—"} sub="despesas + diesel por km" color={PUR} accent={PUR}/>
      </div>

      {/* ── Totais anuais resumidos ── */}
      <div className="card" style={{marginTop:4,background:"#f7faf7",padding:"14px 18px"}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,textAlign:"center"}}>
          <div><div className="slbl">Receitas {props.ano}</div><div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:18,color:GN}}>{brl(a.totA.rec)}</div></div>
          <div><div className="slbl">Custos {props.ano}</div><div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:18,color:RED}}>{brl(a.totCusto)}</div></div>
          <div><div className="slbl">Resultado {props.ano}</div><div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:18,color:a.totA.resultado>=0?GN:RED}}>{brl(a.totA.resultado)}</div></div>
        </div>
      </div>

      {/* ── 2. Resultado mês a mês ── */}
      <div className="sec" style={{marginTop:22}}>Resultado mês a mês — {props.ano}</div>
      <div className="card" style={{padding:0,overflowX:"auto"}}>
        <table>
          <thead>
            <tr>
              <th>Mês</th>
              <th style={{textAlign:"right"}}>Receitas</th>
              <th style={{textAlign:"right"}}>Despesas</th>
              <th style={{textAlign:"right"}}>Diesel</th>
              <th style={{textAlign:"right",minWidth:130}}>Resultado</th>
            </tr>
          </thead>
          <tbody>
            {a.meses.map(function(m){
              var ativo = m.mk===props.mk;
              return (
                <tr key={m.mk} style={{background:ativo?"#f0f7f0":""}}>
                  <td style={{fontWeight:ativo?700:400,color:ativo?GN:TXT,whiteSpace:"nowrap"}}>
                    {ativo ? "▶ " : ""}{nomes[m.m]}
                  </td>
                  <td style={{textAlign:"right",color:m.rec>0?GN:DIM}}>{m.rec>0?brl(m.rec):"—"}</td>
                  <td style={{textAlign:"right",color:m.desp>0?RED:DIM}}>{m.desp>0?brl(m.desp):"—"}</td>
                  <td style={{textAlign:"right",color:m.diesel>0?AMB:DIM}}>{m.diesel>0?brl(m.diesel):"—"}</td>
                  <td style={{textAlign:"right",minWidth:130}}>
                    {m.temDados
                      ? <div>
                          <div style={{fontWeight:700,color:m.resultado>=0?GN:RED}}>{brl(m.resultado)}</div>
                          <Bar valor={m.resultado} max={maxRes}/>
                        </div>
                      : <span style={{color:DIM}}>—</span>}
                  </td>
                </tr>
              );
            })}
            {/* Totais */}
            <tr style={{borderTop:"2px solid "+BDR,background:"#f7faf7"}}>
              <td style={{fontWeight:700}}>TOTAL</td>
              <td style={{textAlign:"right",fontWeight:700,color:GN}}>{brl(a.totA.rec)}</td>
              <td style={{textAlign:"right",fontWeight:700,color:RED}}>{brl(a.totA.desp)}</td>
              <td style={{textAlign:"right",fontWeight:700,color:AMB}}>{brl(a.totA.diesel)}</td>
              <td style={{textAlign:"right",fontWeight:700,color:a.totA.resultado>=0?GN:RED}}>{brl(a.totA.resultado)}</td>
            </tr>
          </tbody>
        </table>
      </div>

      {/* ── 3. Receita por tomador ── */}
      <div className="sec" style={{marginTop:22}}>Receita por tomador — {props.ano}</div>
      {a.tomadores.length===0
        ? <div className="card" style={{color:MUT}}>Nenhuma receita lançada em {props.ano}.</div>
        : <div className="card" style={{display:"flex",flexDirection:"column",gap:14}}>
            {a.tomadores.map(function(t){
              var pct = a.totA.rec>0 ? t.valor/a.totA.rec*100 : 0;
              return (
                <div key={t.nome}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:4}}>
                    <span style={{fontWeight:600,fontSize:15}}>{t.nome}</span>
                    <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:16,color:GN}}>{brl(t.valor)} <span style={{fontSize:12,color:MUT,fontWeight:400}}>({pct.toFixed(1)}%)</span></span>
                  </div>
                  <Bar valor={t.valor} max={maxTom} color={GN}/>
                </div>
              );
            })}
            <div style={{borderTop:"1px solid "+BDR,paddingTop:10,display:"flex",justifyContent:"space-between",fontSize:13,color:MUT}}>
              <span>Total de receitas em {props.ano}</span>
              <span style={{fontWeight:700,color:TXT}}>{brl(a.totA.rec)}</span>
            </div>
          </div>}

      {/* ── 4. Despesas por categoria ── */}
      <div className="sec" style={{marginTop:22}}>Despesas por categoria — {props.ano}</div>
      {a.categorias.length===0
        ? <div className="card" style={{color:MUT}}>Nenhuma despesa lançada em {props.ano}.</div>
        : <div className="card" style={{display:"flex",flexDirection:"column",gap:14}}>
            {a.categorias.map(function(c){
              var totGasto = a.totCusto;
              var pct = totGasto>0 ? c.valor/totGasto*100 : 0;
              var isDiesel = c.nome==="Diesel (FH 540)";
              return (
                <div key={c.nome}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:4}}>
                    <span style={{fontWeight:600,fontSize:15,color:isDiesel?AMB:TXT}}>{c.nome}</span>
                    <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:16,color:RED}}>{brl(c.valor)} <span style={{fontSize:12,color:MUT,fontWeight:400}}>({pct.toFixed(1)}%)</span></span>
                  </div>
                  <Bar valor={c.valor} max={maxCat} color={isDiesel?AMB:RED}/>
                </div>
              );
            })}
            <div style={{borderTop:"1px solid "+BDR,paddingTop:10,display:"flex",justifyContent:"space-between",fontSize:13,color:MUT}}>
              <span>Total de custos em {props.ano} (despesas + diesel)</span>
              <span style={{fontWeight:700,color:TXT}}>{brl(a.totCusto)}</span>
            </div>
          </div>}

      {/* ── Eficiência mensal ── */}
      {mesesComDados.some(function(m){return m.kml>0;}) &&
        <div>
          <div className="sec" style={{marginTop:22}}>Eficiência de combustível por mês — {props.ano}</div>
          <div className="card" style={{padding:0,overflowX:"auto"}}>
            <table>
              <thead>
                <tr>
                  <th>Mês</th>
                  <th style={{textAlign:"right"}}>Km rodados</th>
                  <th style={{textAlign:"right"}}>Litros</th>
                  <th style={{textAlign:"right"}}>Consumo</th>
                  <th style={{textAlign:"right"}}>Custo/km</th>
                </tr>
              </thead>
              <tbody>
                {a.meses.filter(function(m){return m.kml>0||m.litros>0;}).map(function(m){
                  var ativo = m.mk===props.mk;
                  return (
                    <tr key={m.mk} style={{background:ativo?"#f0f7f0":""}}>
                      <td style={{fontWeight:ativo?700:400,color:ativo?GN:TXT}}>{ativo?"▶ ":""}{nomes[m.m]}</td>
                      <td style={{textAlign:"right",color:MUT}}>{m.km>0?m.km.toLocaleString("pt-BR",{maximumFractionDigits:0})+" km":"—"}</td>
                      <td style={{textAlign:"right",color:MUT}}>{m.litros>0?num(m.litros)+" L":"—"}</td>
                      <td style={{textAlign:"right",fontWeight:700,color:BLU}}>{m.kml>0?m.kml.toFixed(2)+" km/L":"—"}</td>
                      <td style={{textAlign:"right",color:PUR}}>{(m.km>0&&m.diesel>0)?brl(m.diesel/m.km)+"/km":"—"}</td>
                    </tr>
                  );
                })}
                <tr style={{borderTop:"2px solid "+BDR,background:"#f7faf7"}}>
                  <td style={{fontWeight:700}}>TOTAL/MÉD</td>
                  <td style={{textAlign:"right",fontWeight:700}}>{a.totA.km>0?a.totA.km.toLocaleString("pt-BR",{maximumFractionDigits:0})+" km":"—"}</td>
                  <td style={{textAlign:"right",fontWeight:700}}>{a.totA.litros>0?num(a.totA.litros)+" L":"—"}</td>
                  <td style={{textAlign:"right",fontWeight:700,color:BLU}}>{a.kmlAno>0?a.kmlAno.toFixed(2)+" km/L":"—"}</td>
                  <td style={{textAlign:"right",fontWeight:700,color:PUR}}>{a.custoKm>0?brl(a.custoKm)+"/km":"—"}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>}

    </div>
  );
}

// ── RECEITAS ─────────────────────────────────────────────────────────────────
function Receitas(props){
  var f0=useState(null); var form=f0[0], setForm=f0[1];
  var dm0=useState("receita"); var distMethod=dm0[0], setDistMethod=dm0[1];
  function nova(){ setForm({ date:todayISO(), tomador:"", produto:"", origem:"", destino:"", precoTon:"", ton:"" }); }
  function set(k,v){ setForm(function(p){ var o=Object.assign({},p); o[k]=v; return o; }); }

  function salvar(){
    var precoTon=Number(String(form.precoTon).replace(",","."))||0;
    var ton=Number(String(form.ton).replace(",","."))||0;
    var item = {
      id: form.id || Date.now(),
      date: form.date, tomador:(form.tomador||"").trim(), produto:(form.produto||"").trim(),
      origem:(form.origem||"").trim(), destino:(form.destino||"").trim(),
      precoTon:precoTon, ton:ton, valor:precoTon*ton, createdAt: form.createdAt||new Date().toISOString()
    };
    window.TX.addReceita(item).then(function(){ setForm(null); props.toast("Frete salvo"); })
      .catch(function(){ props.toast("Erro ao salvar",true); });
  }
  function excluir(r){
    if(!confirm("Excluir este frete?")) return;
    window.TX.delReceita(r.id).then(function(){ props.toast("Frete excluído"); });
  }
  function editar(r){ setForm(Object.assign({},r,{ precoTon:String(r.precoTon), ton:String(r.ton) })); }

  // ---- Importar Excel/CSV ----
  function importar(ev){
    var file = ev.target.files[0]; if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      try {
        var wb = XLSX.read(e.target.result, {type:"array", cellDates:true});
        var ws = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(ws, {defval:""});
        var mapKey = function(obj,alts){ for(var k in obj){ if(alts.indexOf(norm(k))>=0) return obj[k]; } return ""; };
        var n=0;
        rows.forEach(function(row){
          var tom = mapKey(row,["tomador","tomador do servico","cliente"]);
          if(!tom && !mapKey(row,["origem"])) return; // linha vazia
          var dcell = mapKey(row,["data","date"]);
          var dISO;
          if(dcell instanceof Date){ dISO = dcell.getFullYear()+"-"+pad(dcell.getMonth()+1)+"-"+pad(dcell.getDate()); }
          else { var ds=String(dcell); if(ds.indexOf("/")>0){ var p=ds.split("/"); dISO=p[2]+"-"+pad(Number(p[1]))+"-"+pad(Number(p[0])); } else { dISO=String(dcell).slice(0,10); } }
          var preco=Number(String(mapKey(row,["r$/ton","preco","preco/ton","valor/ton","rs/ton"])).replace(",","."))||0;
          var ton=Number(String(mapKey(row,["quantidade","quantidade (ton)","ton","toneladas"])).replace(",","."))||0;
          var item = {
            id: Date.now()+Math.floor(Math.random()*10000)+n,
            date: dISO, tomador:String(tom).trim(),
            produto:String(mapKey(row,["produto"])).trim(),
            origem:String(mapKey(row,["origem"])).trim(),
            destino:String(mapKey(row,["destino"])).trim(),
            precoTon:preco, ton:ton, valor:preco*ton, createdAt:new Date().toISOString()
          };
          window.TX.addReceita(item); n++;
        });
        props.toast(n+" frete(s) importado(s)");
      } catch(err){ console.error(err); props.toast("Erro ao ler a planilha",true); }
      ev.target.value="";
    };
    reader.readAsArrayBuffer(file);
  }

  function baixarModelo(){
    var ws = XLSX.utils.aoa_to_sheet([["Tomador","Data","Produto","Origem","Destino","R$/ton","Quantidade (ton)"],
      ["Fazenda","01/09/2026","Soja","Fazenda Rodeio","Armazém Uberlândia","95","33.5"]]);
    var wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Receitas");
    XLSX.writeFile(wb,"modelo-receitas.xlsx");
  }
  function exportar(){
    var aoa=[["Data","Tomador","Produto","Origem","Destino","R$/ton","Ton","Valor"]];
    props.recMes.forEach(function(r){ aoa.push([ddmmyyyy(r.date),r.tomador,r.produto,r.origem,r.destino,r.precoTon,r.ton,r.valor]); });
    var ws=XLSX.utils.aoa_to_sheet(aoa); var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Receitas"); XLSX.writeFile(wb,"receitas-"+props.mk+".xlsx");
  }

  return (
    <div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",margin:"18px 0 14px"}}>
        <Btn onClick={nova}>+ Novo frete</Btn>
        {!props.soLeitura && <label style={{display:"inline-block"}}>
          <Btn color={INP} style={{pointerEvents:"none"}}>Importar Excel</Btn>
          <input type="file" accept=".xlsx,.xls,.csv" onChange={importar} style={{display:"none"}}/>
        </label>}
        {!props.soLeitura && <Btn color={INP} onClick={baixarModelo}>Modelo</Btn>}
        {!props.soLeitura && <Btn color={INP} onClick={exportar}>Exportar mês</Btn>}
      </div>

      {props.soLeitura
        ? <div className="sec">Fretes de {mesLabel(props.mk)}</div>
        : <div className="sec">Fretes de {mesLabel(props.mk)} — total {brl(props.totRec)}</div>}
      <div className="card" style={{padding:0,overflowX:"auto"}}>
        <table>
          <thead><tr><th>Data</th><th>Tomador</th><th>Produto</th><th>Origem → Destino</th><th>Ton</th>{!props.soLeitura&&<th>R$/ton</th>}{!props.soLeitura&&<th>Valor</th>}<th></th></tr></thead>
          <tbody>
            {props.recMes.length===0 && <tr><td colSpan={8} style={{color:MUT,textAlign:"center",padding:24}}>Nenhum frete neste mês. Adicione ou importe uma planilha.</td></tr>}
            {props.recMes.map(function(r){
              return <tr key={r.id}>
                <td>{ddmmyyyy(r.date)}</td>
                <td>{r.tomador}</td>
                <td>{r.produto}</td>
                <td style={{fontSize:13,color:MUT}}>{r.origem}{r.destino?" → "+r.destino:""}</td>
                <td>{num(r.ton)}</td>
                {!props.soLeitura&&<td>{brl(r.precoTon)}</td>}
                {!props.soLeitura&&<td style={{fontWeight:700}}>{brl(r.valor)}</td>}
                <td style={{whiteSpace:"nowrap"}}>
                  {!props.soLeitura && <button onClick={function(){editar(r);}} style={{background:INP,color:MUT,padding:"5px 9px",fontSize:13,marginRight:4}}>✎</button>}
                  {!props.soLeitura && <button onClick={function(){excluir(r);}} style={{background:"#fee2e2",color:RED,padding:"5px 9px",fontSize:13}}>×</button>}
                </td>
              </tr>;
            })}
          </tbody>
        </table>
      </div>

      {/* ── Margem por frete (só gestora) ── */}
      {!props.soLeitura && props.recMes.length>0 && (function(){
        var custo = Number(props.custoTotalMes)||0;
        var bkd   = props.custoBreakdown||{};
        var fretes = props.recMes.slice();
        var totR   = fretes.reduce(function(a,r){return a+(Number(r.valor)||0);},0);
        var n      = fretes.length;

        // Custo alocado por frete
        var comMargem = fretes.map(function(r){
          var rec = Number(r.valor)||0;
          var custoR = distMethod==="receita"
            ? (totR>0 ? custo*(rec/totR) : custo/n)
            : custo/n;
          var margem = rec - custoR;
          var pct = rec>0 ? margem/rec*100 : 0;
          return Object.assign({},r,{custoR:custoR,margem:margem,pct:pct});
        }).sort(function(a,b){return b.margem-a.margem;});

        var melhor = comMargem[0];
        var pior   = comMargem[comMargem.length-1];
        var margemMedia = totR>0 ? (totR-custo)/totR*100 : 0;

        return (
          <div style={{marginTop:22}}>
            <div className="sec">Margem por frete — {mesLabel(props.mk)}</div>

            {/* Custo total + método */}
            <div className="card" style={{marginBottom:12,padding:"14px 16px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:10,marginBottom:12}}>
                <div>
                  <div className="slbl">Total de custos distribuídos</div>
                  <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:22,color:RED}}>{brl(custo)}</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div className="slbl">Margem média</div>
                  <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:22,color:margemMedia>=0?GN:RED}}>{margemMedia.toFixed(1)+"%"}</div>
                </div>
              </div>

              {/* Breakdown dos custos */}
              <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:6,marginBottom:12,fontSize:12,color:MUT}}>
                <div style={{background:"#f7faf7",padding:"6px 10px",borderRadius:8}}>
                  <span style={{display:"block",fontWeight:600,color:TXT}}>Despesas</span>
                  {brl(bkd.despLocal||0)}{(bkd.despNC||0)>0?" + NC "+brl(bkd.despNC):""}
                </div>
                <div style={{background:"#f7faf7",padding:"6px 10px",borderRadius:8}}>
                  <span style={{display:"block",fontWeight:600,color:TXT}}>Diesel</span>
                  Fazenda {brl(bkd.diesel||0)}{(bkd.extFuel||0)>0?" + ext. "+brl(bkd.extFuel):""}
                </div>
              </div>

              {/* Método de distribuição */}
              <div>
                <label className="flbl">Distribuição do custo entre fretes</label>
                <div className="mtog">
                  <button className={distMethod==="receita"?"on":""} onClick={function(){setDistMethod("receita");}}>Proporcional à receita</button>
                  <button className={distMethod==="igual"?"on":""} onClick={function(){setDistMethod("igual");}}>Igualitária</button>
                </div>
                <div style={{fontSize:11,color:DIM,marginTop:5}}>
                  {distMethod==="receita"
                    ? "Fretes maiores absorvem mais custo — mais preciso para avaliar rotas rentáveis"
                    : "Custo igual para cada frete — independente do valor"}
                </div>
              </div>
            </div>

            {/* Tabela de margem */}
            <div className="card" style={{padding:0,overflowX:"auto"}}>
              <table>
                <thead>
                  <tr>
                    <th>Frete</th>
                    <th style={{textAlign:"right"}}>Receita</th>
                    <th style={{textAlign:"right"}}>Custo</th>
                    <th style={{textAlign:"right",minWidth:90}}>Margem R$</th>
                    <th style={{textAlign:"right"}}>Margem %</th>
                  </tr>
                </thead>
                <tbody>
                  {comMargem.map(function(r){
                    var pos = r.margem>=0;
                    return (
                      <tr key={r.id} style={{borderLeft:"3px solid "+(pos?GN:RED)}}>
                        <td>
                          <div style={{fontWeight:600,fontSize:13}}>{r.tomador}</div>
                          <div style={{fontSize:12,color:MUT}}>{ddmmyyyy(r.date)} · {r.produto}</div>
                          <div style={{fontSize:11,color:DIM}}>{r.origem}{r.destino?" → "+r.destino:""}</div>
                        </td>
                        <td style={{textAlign:"right",color:GN,fontWeight:600}}>{brl(r.valor)}</td>
                        <td style={{textAlign:"right",color:RED}}>{brl(r.custoR)}</td>
                        <td style={{textAlign:"right",fontWeight:700,color:pos?GN:RED}}>{brl(r.margem)}</td>
                        <td style={{textAlign:"right"}}>
                          <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:16,color:pos?GN:RED}}>{r.pct.toFixed(1)+"%"}</span>
                          <div style={{height:5,background:"#e8f0e8",borderRadius:3,marginTop:3,overflow:"hidden"}}>
                            <div style={{height:"100%",width:Math.min(Math.abs(r.pct),100)+"%",background:pos?GN:RED,borderRadius:3}}/>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            {/* Destaques */}
            {n>1 && <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:10}}>
              <div className="sbox" style={{borderTop:"4px solid "+GN}}>
                <span className="slbl">Melhor frete</span>
                <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:18,color:GN}}>{melhor.pct.toFixed(1)+"%"}</span>
                <span style={{fontSize:12,color:MUT}}>{melhor.tomador} · {melhor.produto}</span>
              </div>
              <div className="sbox" style={{borderTop:"4px solid "+(pior.margem>=0?GN:RED)}}>
                <span className="slbl">Frete com menor margem</span>
                <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:18,color:pior.margem>=0?GN:RED}}>{pior.pct.toFixed(1)+"%"}</span>
                <span style={{fontSize:12,color:MUT}}>{pior.tomador} · {pior.produto}</span>
              </div>
            </div>}

            <div style={{fontSize:11,color:DIM,marginTop:8}}>* O custo alocado é uma estimativa mensal — a margem real de cada viagem depende de variáveis operacionais específicas como distância e consumo pontual.</div>
          </div>
        );
      })()}

      {form &&
        <Modal title={form.id?"Editar frete":"Novo frete"} onClose={function(){setForm(null);}}>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <Fld label="Data" type="date" value={form.date} onChange={function(v){set("date",v);}}/>
              <Fld label="Tomador do serviço" value={form.tomador} onChange={function(v){set("tomador",v);}} placeholder="Ex: ACF (fazenda) ou outro cliente"/>
            </div>
            <Fld label="Produto" value={form.produto} onChange={function(v){set("produto",v);}} placeholder="Ex: Soja, Milho, Calcário"/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <Fld label="Origem" value={form.origem} onChange={function(v){set("origem",v);}}/>
              <Fld label="Destino" value={form.destino} onChange={function(v){set("destino",v);}}/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <Fld label="R$/ton" type="text" inputMode="decimal" value={form.precoTon} onChange={function(v){set("precoTon",v);}} placeholder="0,00"/>
              <Fld label="Quantidade (ton)" type="text" inputMode="decimal" value={form.ton} onChange={function(v){set("ton",v);}} placeholder="0,00"/>
            </div>
            <div style={{background:"#f7faf7",borderRadius:8,padding:"10px 14px",fontSize:15}}>
              Valor do frete: <b style={{color:GN}}>{brl((Number(String(form.precoTon).replace(",","."))||0)*(Number(String(form.ton).replace(",","."))||0))}</b>
            </div>
            <div style={{display:"flex",gap:10,marginTop:4}}>
              <Btn full color={INP} onClick={function(){setForm(null);}}>Cancelar</Btn>
              <Btn full onClick={salvar} disabled={!form.date||!form.tomador}>Salvar</Btn>
            </div>
          </div>
        </Modal>}
    </div>
  );
}

// ── DESPESAS ─────────────────────────────────────────────────────────────────
function Despesas(props){
  var f0=useState(null); var form=f0[0], setForm=f0[1];
  var v0=useState("mes"); var view=v0[0], setView=v0[1]; // mes | todas
  var ncOk = props.ncStatus==="ok";
  var ncConf = props.ncStatus!=="idle";
  function nova(){ setForm({ tipo:"unica", date:todayISO(), categoria:"", descricao:"", valor:"", inicio:thisMonth(), fim:"", parcInicio:thisMonth(), parcN:"", parcTotal:"" }); }
  function set(k,v){ setForm(function(p){ var o=Object.assign({},p); o[k]=v; return o; }); }

  function salvar(){
    var tipo=form.tipo;
    var item = { id: form.id||Date.now(), tipo:tipo, categoria:(form.categoria||"").trim(), descricao:(form.descricao||"").trim(), createdAt: form.createdAt||new Date().toISOString() };
    if(tipo==="unica"){
      item.date=form.date; item.valor=Number(String(form.valor).replace(",","."))||0;
    } else if(tipo==="recorrente"){
      item.inicio=form.inicio; item.fim=form.fim||null; item.valor=Number(String(form.valor).replace(",","."))||0;
    } else { // parcelada
      var total=Number(String(form.parcTotal).replace(",","."))||0;
      var n=Number(form.parcN)||1;
      item.parcInicio=form.parcInicio; item.parcN=n; item.parcTotal=total; item.valor= n>0? total/n : total;
    }
    window.TX.addDespesa(item).then(function(){ setForm(null); props.toast("Despesa salva"); })
      .catch(function(){ props.toast("Erro ao salvar",true); });
  }
  function excluir(d){
    var msg = d.tipo==="unica" ? "Excluir esta despesa?" : "Excluir esta despesa recorrente/parcelada de TODOS os meses?";
    if(!confirm(msg)) return;
    window.TX.delDespesa(d.id).then(function(){ props.toast("Despesa excluída"); });
  }
  function editar(d){
    setForm(Object.assign({tipo:d.tipo,date:d.date||todayISO(),inicio:d.inicio||thisMonth(),fim:d.fim||"",parcInicio:d.parcInicio||thisMonth(),parcN:d.parcN||"",parcTotal:d.parcTotal||"",valor:d.tipo==="parcelada"?d.parcTotal:d.valor},d,{valor:d.tipo==="parcelada"?String(d.parcTotal||""):String(d.valor||""),parcN:String(d.parcN||""),parcTotal:String(d.parcTotal||"")}));
  }
  function tipoBadge(t){
    if(t==="recorrente") return <span className="bdg bb">recorrente</span>;
    if(t==="parcelada") return <span className="bdg bp">parcelada</span>;
    return <span className="bdg bg">única</span>;
  }

  var todas = (props.data.desp||[]).slice().sort(function(a,b){ return String(b.createdAt||"")<String(a.createdAt||"")?-1:1; });

  return (
    <div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",margin:"18px 0 14px",alignItems:"center"}}>
        <Btn onClick={nova}>+ Nova despesa</Btn>
        <div className="mtog" style={{width:230}}>
          <button className={view==="mes"?"on":""} onClick={function(){setView("mes");}}>Deste mês</button>
          <button className={view==="todas"?"on":""} onClick={function(){setView("todas");}}>Todas / recorrências</button>
        </div>
      </div>

      {view==="mes" && <div>
        <div className="sec">Despesas de {mesLabel(props.mk)} — total {brl(props.totDesp)}</div>
        <div className="card" style={{padding:0,overflowX:"auto"}}>
          <table>
            <thead><tr><th>Categoria</th><th>Descrição</th><th>Tipo</th><th>Valor no mês</th></tr></thead>
            <tbody>
              {props.despMes.length===0 && <tr><td colSpan={4} style={{color:MUT,textAlign:"center",padding:24}}>Nenhuma despesa incide neste mês.</td></tr>}
              {props.despMes.map(function(o){
                var d=o.d;
                return <tr key={d.id}>
                  <td style={{fontWeight:600}}>{d.categoria||"—"}</td>
                  <td style={{fontSize:13,color:MUT}}>{d.descricao}{d.tipo==="parcelada"?" (parcela "+(monthDiff(d.parcInicio,props.mk)+1)+"/"+d.parcN+")":""}</td>
                  <td>{tipoBadge(d.tipo)}</td>
                  <td style={{fontWeight:700,color:RED}}>{brl(o.v)}</td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>
      </div>}

      {/* ── Despesas do Nossas Contas (Diamantes LHM) ── */}
      {view==="mes" && ncConf && <div style={{marginTop:16}}>
        <div className="sec">Diamantes · Nossas Contas
          {props.ncStatus==="connecting" && <span style={{fontSize:12,color:MUT,fontWeight:400,marginLeft:8}}>conectando…</span>}
          {props.ncStatus==="error" && <span style={{fontSize:12,color:RED,fontWeight:400,marginLeft:8}}>erro de conexão</span>}
          {ncOk && <span style={{fontSize:12,color:GN,fontWeight:400,marginLeft:8}}>✓ sincronizado</span>}
        </div>
        {props.ncStatus==="error" &&
          <div className="card" style={{borderColor:"#fca5a5",background:"#fef2f2",color:RED,fontSize:13}}>{props.ncErr}</div>}
        {ncOk && (props.ncDespMes||[]).length===0 &&
          <div className="card" style={{color:MUT}}>Nenhuma despesa Diamantes LHM no Nossas Contas este mês.</div>}
        {ncOk && (props.ncDespMes||[]).length>0 &&
          <div className="card" style={{padding:0,overflowX:"auto"}}>
            <table>
              <thead><tr><th>Data</th><th>Descrição</th><th>Quem</th><th style={{textAlign:"right"}}>Valor</th></tr></thead>
              <tbody>
                {(props.ncDespMes||[]).map(function(e){
                  return <tr key={e.id}>
                    <td style={{whiteSpace:"nowrap"}}>{ddmmyyyy(e.date)}</td>
                    <td style={{fontSize:13,color:MUT}}>{e.desc||"—"}</td>
                    <td><span className="bdg bb">{e.person||"—"}</span></td>
                    <td style={{textAlign:"right",fontWeight:700,color:RED}}>{brl(e.amount)}</td>
                  </tr>;
                })}
                <tr style={{borderTop:"2px solid "+BDR,background:"#f7faf7"}}>
                  <td colSpan={3} style={{fontWeight:700,textAlign:"right"}}>Total Diamantes</td>
                  <td style={{fontWeight:700,color:RED,textAlign:"right"}}>{brl(props.totDespNC||0)}</td>
                </tr>
              </tbody>
            </table>
            <div style={{padding:"8px 14px",fontSize:12,color:MUT}}>Despesas lançadas no Nossas Contas com categoria "Diamantes LHM" · somente leitura aqui</div>
          </div>}
        {!ncConf &&
          <div className="card" style={{color:MUT,fontSize:13}}>Configure as credenciais do Nossas Contas em <b>Config</b> para ativar a integração.</div>}
      </div>}

      {view==="todas" && <div>
        <div className="sec">Todos os lançamentos</div>
        <div style={{fontSize:13,color:MUT,marginBottom:12}}>Recorrentes se repetem todo mês automaticamente; parceladas cobram só o valor da parcela nos meses do parcelamento. Adicione uma vez — não precisa repetir.</div>
        <div className="card" style={{padding:0,overflowX:"auto"}}>
          <table>
            <thead><tr><th>Categoria</th><th>Descrição</th><th>Tipo</th><th>Período</th><th>Valor</th><th></th></tr></thead>
            <tbody>
              {todas.length===0 && <tr><td colSpan={6} style={{color:MUT,textAlign:"center",padding:24}}>Nenhuma despesa cadastrada.</td></tr>}
              {todas.map(function(d){
                var periodo, valor;
                if(d.tipo==="unica"){ periodo=ddmmyyyy(d.date); valor=brl(d.valor); }
                else if(d.tipo==="recorrente"){ periodo="desde "+mesLabel(d.inicio)+(d.fim?" até "+mesLabel(d.fim):" (sem fim)"); valor=brl(d.valor)+"/mês"; }
                else { periodo=d.parcN+"x desde "+mesLabel(d.parcInicio); valor=brl(d.valor)+" (total "+brl(d.parcTotal)+")"; }
                return <tr key={d.id}>
                  <td style={{fontWeight:600}}>{d.categoria||"—"}</td>
                  <td style={{fontSize:13,color:MUT}}>{d.descricao}</td>
                  <td>{tipoBadge(d.tipo)}</td>
                  <td style={{fontSize:13}}>{periodo}</td>
                  <td style={{fontWeight:700,color:RED}}>{valor}</td>
                  <td style={{whiteSpace:"nowrap"}}>
                    {!props.soLeitura && <button onClick={function(){editar(d);}} style={{background:INP,color:MUT,padding:"5px 9px",fontSize:13,marginRight:4}}>✎</button>}
                    {!props.soLeitura && <button onClick={function(){excluir(d);}} style={{background:"#fee2e2",color:RED,padding:"5px 9px",fontSize:13}}>×</button>}
                  </td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>
      </div>}

      {form &&
        <Modal title={form.id?"Editar despesa":"Nova despesa"} onClose={function(){setForm(null);}}>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <div>
              <label className="flbl">Tipo de despesa</label>
              <div className="mtog">
                <button className={form.tipo==="unica"?"on":""} onClick={function(){set("tipo","unica");}}>Única</button>
                <button className={form.tipo==="recorrente"?"on":""} onClick={function(){set("tipo","recorrente");}}>Recorrente</button>
                <button className={form.tipo==="parcelada"?"on":""} onClick={function(){set("tipo","parcelada");}}>Parcelada</button>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <Fld label="Categoria" value={form.categoria} onChange={function(v){set("categoria",v);}} placeholder="Ex: Seguro, Pneu, Salário"/>
              <Fld label="Descrição" value={form.descricao} onChange={function(v){set("descricao",v);}} placeholder="opcional"/>
            </div>

            {form.tipo==="unica" &&
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                <Fld label="Data" type="date" value={form.date} onChange={function(v){set("date",v);}}/>
                <Fld label="Valor (R$)" inputMode="decimal" value={form.valor} onChange={function(v){set("valor",v);}} placeholder="0,00"/>
              </div>}

            {form.tipo==="recorrente" &&
              <div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                  <Fld label="Valor mensal (R$)" inputMode="decimal" value={form.valor} onChange={function(v){set("valor",v);}} placeholder="0,00"/>
                  <Fld label="Início" type="month" value={form.inicio} onChange={function(v){set("inicio",v);}}/>
                </div>
                <div style={{marginTop:12}}>
                  <Fld label="Fim (deixe vazio para sem fim)" type="month" value={form.fim} onChange={function(v){set("fim",v);}}/>
                </div>
                <div style={{fontSize:13,color:MUT,marginTop:8}}>Vai aparecer automaticamente em todo mês a partir do início.</div>
              </div>}

            {form.tipo==="parcelada" &&
              <div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                  <Fld label="Valor total (R$)" inputMode="decimal" value={form.parcTotal} onChange={function(v){set("parcTotal",v);}} placeholder="0,00"/>
                  <Fld label="Nº de parcelas" type="number" value={form.parcN} onChange={function(v){set("parcN",v);}} placeholder="Ex: 6"/>
                </div>
                <div style={{marginTop:12}}>
                  <Fld label="Mês da 1ª parcela" type="month" value={form.parcInicio} onChange={function(v){set("parcInicio",v);}}/>
                </div>
                <div style={{background:"#f7faf7",borderRadius:8,padding:"10px 14px",fontSize:14,marginTop:10}}>
                  Cada parcela: <b style={{color:RED}}>{brl((Number(String(form.parcTotal).replace(",","."))||0)/(Number(form.parcN)||1))}</b> — cobrada em {form.parcN||"?"} mês(es), só nos meses do parcelamento.
                </div>
              </div>}

            <div style={{display:"flex",gap:10,marginTop:4}}>
              <Btn full color={INP} onClick={function(){setForm(null);}}>Cancelar</Btn>
              <Btn full onClick={salvar} disabled={!form.categoria}>Salvar</Btn>
            </div>
          </div>
        </Modal>}
    </div>
  );
}

// ── ACERTO FAZENDA ───────────────────────────────────────────────────────────
