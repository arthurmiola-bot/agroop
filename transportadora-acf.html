// ── ABASTECIMENTO EXTERNO ─────────────────────────────────────────────────────
function AbastExterno(props){
  var km = props.kmlMes || {};
  var f0=useState(null); var form=f0[0], setForm=f0[1];

  function nova(){
    setForm({ date:todayISO(), posto:"", tipo:"S10", litros:"", precoLitro:"", odometro:"" });
  }
  function set(k,v){ setForm(function(p){ var o=Object.assign({},p); o[k]=v; return o; }); }

  function salvar(){
    var litros = Number(String(form.litros).replace(",","."))||0;
    var preco  = Number(String(form.precoLitro).replace(",","."))||0;
    var odo    = Number(String(form.odometro).replace(".","").replace(",","."))||0;
    var item = {
      id: form.id||Date.now(),
      date: form.date,
      posto: (form.posto||"").trim(),
      tipo: form.tipo,
      litros: litros,
      precoLitro: preco,
      valorTotal: litros*preco,
      odometro: odo,
      createdAt: form.createdAt||new Date().toISOString()
    };
    window.TX.addAbastExt(item).then(function(){ setForm(null); props.toast("Abastecimento salvo"); })
      .catch(function(){ props.toast("Erro ao salvar",true); });
  }

  function excluir(x){
    if(!confirm("Excluir este abastecimento?")) return;
    window.TX.delAbastExt(x.id).then(function(){ props.toast("Excluído"); });
  }

  var itens = (props.data.abastExt||[]).filter(function(x){ return monthOf(x.date)===props.mk; })
    .sort(function(a,b){ return String(a.date)<String(b.date)?-1:1; });

  var totS10  = itens.filter(function(x){return x.tipo==="S10";}).reduce(function(a,x){return a+(Number(x.litros)||0);},0);
  var totArla = itens.filter(function(x){return x.tipo==="Arla";}).reduce(function(a,x){return a+(Number(x.litros)||0);},0);
  var totValor = itens.reduce(function(a,x){return a+(Number(x.valorTotal)||0);},0);

  return (
    <div>
      {/* Consumo do mês */}
      <div className="sec" style={{marginTop:18}}>Consumo do mês — {mesLabel(props.mk)}</div>

      {km.kml>0
        ? <div style={{background:"linear-gradient(135deg,"+BLU+",#1d4ed8)",borderRadius:14,padding:"18px 20px",marginBottom:16,boxShadow:"0 4px 18px #0369a130"}}>
            <div style={{fontSize:11,letterSpacing:1.5,textTransform:"uppercase",color:"#ffffffbb",fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,marginBottom:4}}>Consumo médio · S10 apenas</div>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:38,color:"#fff",lineHeight:1}}>
              {km.kml.toFixed(2)} <span style={{fontSize:18,fontWeight:600}}>km/L</span>
            </div>
            <div style={{fontSize:13,color:"#ffffffbb",marginTop:6}}>
              {km.km>0?km.km.toLocaleString("pt-BR",{maximumFractionDigits:0})+" km rodados · ":""}{num(km.litrosS10||0)} L de S10 (posto fazenda + externo)
            </div>
          </div>
        : <div className="card" style={{marginBottom:16,color:MUT}}>
            Sem dados suficientes para calcular o consumo — registre abastecimentos com o hodômetro preenchido.
          </div>}

      {/* Totais rápidos */}
      {itens.length>0 &&
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
          <Stat label="S10 externo" value={num(totS10)+" L"} sub={itens.filter(function(x){return x.tipo==="S10";}).length+" abastecimento(s)"} color={GN} accent={GN}/>
          <Stat label="Arla externo" value={num(totArla)+" L"} sub="não conta no km/L" color={BLU} accent={BLU}/>
        </div>}

      {/* Botão */}
      <Btn onClick={nova} style={{marginBottom:14}}>+ Novo abastecimento</Btn>

      {/* Lista */}
      <div className="sec">Abastecimentos de {mesLabel(props.mk)}</div>
      <div className="card" style={{padding:0,overflowX:"auto"}}>
        <table>
          <thead><tr>
            <th>Data</th><th>Posto</th><th>Tipo</th>
            <th style={{textAlign:"right"}}>Litros</th>
            <th style={{textAlign:"right"}}>R$/L</th>
            <th style={{textAlign:"right"}}>Hodôm.</th>
            <th></th>
          </tr></thead>
          <tbody>
            {itens.length===0 &&
              <tr><td colSpan={7} style={{color:MUT,textAlign:"center",padding:24}}>Nenhum abastecimento externo neste mês.</td></tr>}
            {itens.map(function(x){
              return <tr key={x.id}>
                <td>{ddmmyyyy(x.date)}</td>
                <td style={{fontWeight:600}}>{x.posto||"—"}</td>
                <td>
                  <span className={"bdg "+(x.tipo==="S10"?"bg":"bb")}>{x.tipo}</span>
                </td>
                <td style={{textAlign:"right"}}>{num(x.litros)} L</td>
                <td style={{textAlign:"right",color:MUT}}>{x.precoLitro>0?brl(x.precoLitro):"—"}</td>
                <td style={{textAlign:"right",color:MUT,fontSize:13}}>{x.odometro>0?x.odometro.toLocaleString("pt-BR")+" km":"—"}</td>
                <td><button onClick={function(){excluir(x);}} style={{background:"#fee2e2",color:RED,padding:"5px 9px",fontSize:13}}>×</button></td>
              </tr>;
            })}
          </tbody>
        </table>
      </div>

      {/* Formulário */}
      {form &&
        <Modal title={form.id?"Editar abastecimento":"Novo abastecimento"} onClose={function(){setForm(null);}}>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>

            {/* Tipo S10 / Arla */}
            <div>
              <label className="flbl">Tipo de combustível</label>
              <div className="mtog">
                <button className={form.tipo==="S10"?"on":""} onClick={function(){set("tipo","S10");}}>S10 (diesel)</button>
                <button className={form.tipo==="Arla"?"on":""} onClick={function(){set("tipo","Arla");}}>Arla 32</button>
              </div>
              {form.tipo==="Arla" &&
                <div style={{fontSize:12,color:BLU,marginTop:6}}>Arla não conta no cálculo de km/L — apenas registrado para controle de custo.</div>}
            </div>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <Fld label="Data" type="date" value={form.date} onChange={function(v){set("date",v);}}/>
              <Fld label="Nome do posto" value={form.posto} onChange={function(v){set("posto",v);}} placeholder="Ex: Posto Ipiranga"/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <Fld label="Litros" inputMode="decimal" value={form.litros} onChange={function(v){set("litros",v);}} placeholder="0,00"/>
              <Fld label="Preço por litro (R$)" inputMode="decimal" value={form.precoLitro} onChange={function(v){set("precoLitro",v);}} placeholder="0,00"/>
            </div>
            <Fld label="Hodômetro do caminhão (km)" inputMode="numeric" value={form.odometro} onChange={function(v){set("odometro",v);}} placeholder="Ex: 366500"/>

            {/* Preview do valor total */}
            {(Number(String(form.litros).replace(",","."))||0)>0 && (Number(String(form.precoLitro).replace(",","."))||0)>0 &&
              <div style={{background:"#f7faf7",borderRadius:8,padding:"10px 14px",fontSize:15}}>
                Valor total: <b style={{color:GN}}>{brl((Number(String(form.litros).replace(",","."))||0)*(Number(String(form.precoLitro).replace(",","."))||0))}</b>
              </div>}

            <div style={{display:"flex",gap:10,marginTop:4}}>
              <Btn full color={INP} onClick={function(){setForm(null);}}>Cancelar</Btn>
              <Btn full onClick={salvar} disabled={!form.date||!form.litros}>Salvar</Btn>
            </div>
          </div>
        </Modal>}
    </div>
  );
}

// ── RELATÓRIO MENSAL COMPLETO ──────────────────────────────────────────────────
function Relatorio(props){
  var d = props.diesel || {};
  var km = props.kmlMes || {};
  var conf = props.conf || {};
  var nomeFaz = conf.fazendaNome || "Agropecuária Córrego das Flores";

  // Abastecimentos externos do mês
  var abastMes = (props.data.abastExt||[]).filter(function(x){ return monthOf(x.date)===props.mk; });
  var abastS10ext = abastMes.filter(function(x){return x.tipo==="S10";});
  var abastArla   = abastMes.filter(function(x){return x.tipo==="Arla";});
  var extS10L   = abastS10ext.reduce(function(a,x){return a+(Number(x.litros)||0);},0);
  var extArlaL  = abastArla.reduce(function(a,x){return a+(Number(x.litros)||0);},0);
  var extS10Val = abastS10ext.reduce(function(a,x){return a+(Number(x.valorTotal)||0);},0);
  var extArlaVal= abastArla.reduce(function(a,x){return a+(Number(x.valorTotal)||0);},0);
  var totDieselMes = d.custo + extS10Val + extArlaVal;

  // Despesas locais agrupadas por categoria
  var despByCat = {};
  (props.despMes||[]).forEach(function(o){
    var cat = o.d.categoria||"Sem categoria";
    if(!despByCat[cat]) despByCat[cat]={itens:[],total:0};
    despByCat[cat].itens.push({desc:o.d.descricao,tipo:o.d.tipo,valor:o.v});
    despByCat[cat].total+=o.v;
  });
  var catKeys = Object.keys(despByCat).sort(function(a,b){ return despByCat[b].total-despByCat[a].total; });

  var totDesp = props.totDespLocal + props.totDespNC;
  var resultado = props.totRec - totDesp - totDieselMes;

  var gc0=useState(false); var gerando=gc0[0], setGerando=gc0[1];
  function imprimir(){
    compartilharPDF("printAreaRelatorio", "resultado-mensal-"+props.mk+".pdf",
      function(){setGerando(true);},
      function(){setGerando(false);}
    );
  }

  var PSTY = {fontFamily:"'Barlow',sans-serif",fontSize:13,color:"#111"};
  var TH = {textAlign:"left",borderBottom:"1.5px solid #999",padding:"6px 8px",fontSize:12,fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:.5,textTransform:"uppercase"};
  var TD = {padding:"5px 8px",borderBottom:"1px solid #ddd"};
  var TDR = Object.assign({},TD,{textAlign:"right"});
  var GNC = "#1d561d", REDC = "#b91c1c", AMC = "#854d0e";

  var printContent = (
    <div style={PSTY}>
      {/* ── CABEÇALHO ── */}
      <div style={{borderBottom:"3px solid "+GNC,paddingBottom:12,marginBottom:20}}>
        <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:28,color:GNC,letterSpacing:1}}>DIAMANTES LHM · ACF</div>
        <div style={{fontSize:14,color:"#333",marginTop:2}}>Relatório de Resultado Mensal</div>
        <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginTop:6}}>
          <div style={{fontSize:14}}><b>Referência:</b> {mesLabel(props.mk)}</div>
          <div style={{fontSize:12,color:"#666"}}>Emitido em {ddmmyyyy(todayISO())}</div>
        </div>
      </div>

      {/* ── 1. RECEITAS ── */}
      <div style={{fontWeight:700,fontSize:15,margin:"0 0 8px",color:GNC}}>1. Receitas — Fretes</div>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:13,marginBottom:4}}>
        <thead><tr>
          <th style={TH}>Data</th><th style={TH}>Tomador</th><th style={TH}>Produto</th>
          <th style={TH}>Origem → Destino</th>
          <th style={Object.assign({},TH,{textAlign:"right"})}>Ton</th>
          <th style={Object.assign({},TH,{textAlign:"right"})}>R$/ton</th>
          <th style={Object.assign({},TH,{textAlign:"right"})}>Valor</th>
        </tr></thead>
        <tbody>
          {(props.recMes||[]).map(function(r){
            return <tr key={r.id}>
              <td style={TD}>{ddmmyyyy(r.date)}</td>
              <td style={TD}>{r.tomador}</td>
              <td style={TD}>{r.produto}</td>
              <td style={TD}>{r.origem}{r.destino?" → "+r.destino:""}</td>
              <td style={TDR}>{num(r.ton)}</td>
              <td style={TDR}>{brl(r.precoTon)}</td>
              <td style={Object.assign({},TDR,{fontWeight:700})}>{brl(r.valor)}</td>
            </tr>;
          })}
          <tr>
            <td colSpan={6} style={{padding:"7px 8px",textAlign:"right",fontWeight:700}}>Total Receitas</td>
            <td style={{padding:"7px 8px",textAlign:"right",fontWeight:800,color:GNC,fontSize:14}}>{brl(props.totRec)}</td>
          </tr>
        </tbody>
      </table>

      {/* ── 2. DESPESAS ── */}
      <div style={{fontWeight:700,fontSize:15,margin:"18px 0 8px",color:REDC}}>2. Despesas</div>

      {/* 2.1 Locais por categoria */}
      {catKeys.length>0 && <div>
        <div style={{fontSize:12,fontWeight:600,color:"#555",marginBottom:6,textTransform:"uppercase",letterSpacing:.5}}>2.1 Lançadas no app</div>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13,marginBottom:10}}>
          <thead><tr>
            <th style={TH}>Categoria</th><th style={TH}>Descrição</th><th style={TH}>Tipo</th>
            <th style={Object.assign({},TH,{textAlign:"right"})}>Valor</th>
          </tr></thead>
          <tbody>
            {catKeys.map(function(cat){
              return (props.despByCat||despByCat)[cat]
                ? (despByCat[cat].itens||[]).map(function(it,i){
                    return <tr key={cat+i}>
                      <td style={TD}>{i===0?cat:""}</td>
                      <td style={TD}>{it.desc||"—"}</td>
                      <td style={TD}>{it.tipo}</td>
                      <td style={TDR}>{brl(it.valor)}</td>
                    </tr>;
                  })
                : null;
            })}
            <tr>
              <td colSpan={3} style={{padding:"6px 8px",textAlign:"right",fontWeight:700}}>Subtotal</td>
              <td style={{padding:"6px 8px",textAlign:"right",fontWeight:700,color:REDC}}>{brl(props.totDespLocal)}</td>
            </tr>
          </tbody>
        </table>
      </div>}

      {/* 2.2 Diamantes do Nossas Contas */}
      {(props.ncDespMes||[]).length>0 && <div>
        <div style={{fontSize:12,fontWeight:600,color:"#555",marginBottom:6,textTransform:"uppercase",letterSpacing:.5}}>2.2 Diamantes LHM (Nossas Contas)</div>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13,marginBottom:10}}>
          <thead><tr>
            <th style={TH}>Data</th><th style={TH}>Descrição</th><th style={TH}>Pago por</th>
            <th style={Object.assign({},TH,{textAlign:"right"})}>Valor</th>
          </tr></thead>
          <tbody>
            {(props.ncDespMes||[]).map(function(e){
              return <tr key={e.id}>
                <td style={TD}>{ddmmyyyy(e.date)}</td>
                <td style={TD}>{e.desc||"—"}</td>
                <td style={TD}>{e.person||"—"}</td>
                <td style={TDR}>{brl(e.amount)}</td>
              </tr>;
            })}
            <tr>
              <td colSpan={3} style={{padding:"6px 8px",textAlign:"right",fontWeight:700}}>Subtotal</td>
              <td style={{padding:"6px 8px",textAlign:"right",fontWeight:700,color:REDC}}>{brl(props.totDespNC)}</td>
            </tr>
          </tbody>
        </table>
      </div>}

      {/* Total despesas */}
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:13,marginBottom:16}}>
        <tbody>
          <tr style={{borderTop:"2px solid #ccc"}}>
            <td style={{padding:"7px 8px",fontWeight:700}}>Total Despesas</td>
            <td style={{padding:"7px 8px",textAlign:"right",fontWeight:800,color:REDC,fontSize:14}}>{brl(totDesp)}</td>
          </tr>
        </tbody>
      </table>

      {/* ── 3. DIESEL ── */}
      <div style={{fontWeight:700,fontSize:15,margin:"0 0 8px",color:AMC}}>3. Diesel e Arla</div>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:13,marginBottom:4}}>
        <thead><tr>
          <th style={TH}>Tipo</th><th style={TH}>Fonte</th>
          <th style={Object.assign({},TH,{textAlign:"right"})}>Litros</th>
          <th style={Object.assign({},TH,{textAlign:"right"})}>Custo total</th>
        </tr></thead>
        <tbody>
          {d.litros>0 && <tr>
            <td style={TD}>S10</td>
            <td style={TD}>Posto Fazenda ACF</td>
            <td style={TDR}>{num(d.litros)} L</td>
            <td style={TDR}>{brl(d.custo)}</td>
          </tr>}
          {extS10L>0 && <tr>
            <td style={TD}>S10</td>
            <td style={TD}>Abastecimento externo</td>
            <td style={TDR}>{num(extS10L)} L</td>
            <td style={TDR}>{brl(extS10Val)}</td>
          </tr>}
          {extArlaL>0 && <tr>
            <td style={TD}>Arla 32</td>
            <td style={TD}>Abastecimento externo</td>
            <td style={TDR}>{num(extArlaL)} L</td>
            <td style={TDR}>{brl(extArlaVal)}</td>
          </tr>}
          <tr>
            <td colSpan={3} style={{padding:"7px 8px",textAlign:"right",fontWeight:700}}>Total Diesel/Arla</td>
            <td style={{padding:"7px 8px",textAlign:"right",fontWeight:800,color:AMC,fontSize:14}}>{brl(totDieselMes)}</td>
          </tr>
        </tbody>
      </table>

      {/* ── 4. RESULTADO ── */}
      <div style={{fontWeight:700,fontSize:15,margin:"18px 0 8px"}}>4. Resultado do Mês</div>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:14,marginBottom:8}}>
        <tbody>
          <tr><td style={{padding:"6px 8px"}}>(+) Receitas</td><td style={{padding:"6px 8px",textAlign:"right",color:GNC,fontWeight:600}}>{brl(props.totRec)}</td></tr>
          <tr><td style={{padding:"6px 8px"}}>(−) Despesas</td><td style={{padding:"6px 8px",textAlign:"right",color:REDC,fontWeight:600}}>{brl(totDesp)}</td></tr>
          <tr><td style={{padding:"6px 8px"}}>(−) Diesel / Arla</td><td style={{padding:"6px 8px",textAlign:"right",color:AMC,fontWeight:600}}>{brl(totDieselMes)}</td></tr>
          <tr style={{borderTop:"2px solid #333"}}>
            <td style={{padding:"10px 8px",fontWeight:800,fontSize:16}}>{resultado>=0?"= RESULTADO LÍQUIDO":"= PREJUÍZO"}</td>
            <td style={{padding:"10px 8px",textAlign:"right",fontWeight:800,fontSize:18,color:resultado>=0?GNC:REDC}}>{brl(resultado)}</td>
          </tr>
          {props.totRec>0 && <tr>
            <td style={{padding:"4px 8px",color:"#555",fontSize:12}}>Margem operacional</td>
            <td style={{padding:"4px 8px",textAlign:"right",color:"#555",fontSize:12}}>{(resultado/props.totRec*100).toFixed(1)+"%"}</td>
          </tr>}
        </tbody>
      </table>

      {/* ── 5. EFICIÊNCIA ── */}
      {km.km>0 && <div>
        <div style={{fontWeight:700,fontSize:15,margin:"16px 0 8px"}}>5. Eficiência — FH 540</div>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr>
            <th style={TH}>Km rodados</th><th style={TH}>S10 total (L)</th>
            <th style={TH}>Consumo médio</th><th style={TH}>Custo S10/km</th>
          </tr></thead>
          <tbody>
            <tr>
              <td style={TD}>{km.km.toLocaleString("pt-BR",{maximumFractionDigits:0})+" km"}</td>
              <td style={TD}>{num(km.litrosS10||0)+" L"}</td>
              <td style={TD}>{km.kml>0?km.kml.toFixed(2)+" km/L":"—"}</td>
              <td style={TD}>{km.km>0?brl((d.custo+extS10Val)/km.km)+"/km":"—"}</td>
            </tr>
          </tbody>
        </table>
      </div>}

      <div style={{marginTop:24,fontSize:11,color:"#888",borderTop:"1px solid #ccc",paddingTop:8}}>
        Diamantes LHM · ACF · {nomeFaz} · Relatório gerado em {ddmmyyyy(todayISO())}
      </div>
    </div>
  );

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10,margin:"18px 0 16px"}} className="noprint">
        <div className="sec" style={{margin:0}}>Relatório Mensal — {mesLabel(props.mk)}</div>
        <Btn onClick={imprimir} disabled={gerando} style={{minWidth:160}}>{gerando?"⏳ Gerando PDF…":"📤 Compartilhar PDF"}</Btn>
      </div>

      {/* Preview em tela */}
      <div className="card noprint">{printContent}</div>

      {/* Área de impressão */}
      <div id="printAreaRelatorio" style={{padding:"16px 20px"}}>
        {printContent}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
