window.atualizarTalhoes = function() {
  const faz = document.getElementById('ret-fazenda').value;
  const sel = document.getElementById('ret-talhao');
  const lista = talhoes.filter(t => !faz || normalizar(t.fazenda||'') === normalizar(faz));
  sel.innerHTML = `<option value="">—</option>` + lista.map(t=>`<option value="${t.nome}">${t.nome}${t.area_ha?` (${fmt(t.area_ha)} ha)`:''}</option>`).join('');
};

window.atualizarInfoEstoque = function() {
  const sel = document.getElementById('ret-produto').value;
  const el = document.getElementById('ret-info');
  if (!sel) { el.style.display='none'; return; }
  const est = estoque.find(e => e.id === sel);
  if (!est) return;
  el.style.display = 'block';
  document.getElementById('ret-info-qtd').textContent = `${fmt(est.quantidade)} ${est.unidade}`;
  const custoEl = document.getElementById('ret-info-custo');
  if (custoEl) custoEl.textContent = `R$ ${fmt(est.custo_medio||0)}/${est.unidade}`;
};

window.confirmarRetirada = async function() {
  const prodId = document.getElementById('ret-produto').value;
  const qtd = parseFloat(document.getElementById('ret-qtd').value)||0;
  const fazenda = document.getElementById('ret-fazenda').value;
  if (!prodId) { toast('Selecione o produto.','erro'); return; }
  if (qtd <= 0) { toast('Informe a quantidade.','erro'); return; }
  if (!fazenda) { toast('Selecione a fazenda.','erro'); return; }
  const est = estoque.find(e => e.id === prodId);
  if (!est) return;
  if (qtd > est.quantidade) { toast(`Quantidade maior que o disponível (${fmt(est.quantidade)} ${est.unidade}).`,'erro'); return; }
  const custo_total = qtd * (est.custo_medio||0);
  const retirada = {
    produto: est.produto, unidade: est.unidade, quantidade: qtd, fazenda,
    talhao: document.getElementById('ret-talhao')?.value||'',
    cultura: document.getElementById('ret-cultura')?.value||'',
    safra: document.getElementById('ret-safra')?.value||'',
    obs: document.getElementById('ret-obs')?.value||'',
    custo_unitario: est.custo_medio||0, custo_total,
    data: Timestamp.now(), operador_uid: usuarioAtual.uid
  };
  try {
    const ref = await addDoc(collection(db,'insumos_retiradas'), retirada);
    retiradas.unshift({id: ref.id, ...retirada});
    recalcularEstoque();
    fecharModal('modal-retirada');
    toast('Retirada registrada com sucesso!');
    renderRetiradas();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

  if (!el) return;
  const totalPend = lista.filter(c=>!c.pago).reduce((s,c)=>s+(c.valor_total||0),0);
  el.innerHTML = `
    <div style="margin-bottom:12px;font-size:13px;color:var(--cinza)">${lista.length} registros ${totalPend>0?`— Pendente: <strong>R$ ${fmt(totalPend)}</strong>`:''}</div>
    <div class="tabela-wrap"><table>
      <thead><tr><th>Fornecedor</th><th>Descrição</th><th>Valor</th><th>Vencimento</th><th>Status</th><th>Ações</th></tr></thead>
      <tbody>
        ${lista.length === 0 ? '<tr><td colspan="6" class="tabela-vazia">Nenhuma conta encontrada</td></tr>' :
        lista.map(c => `<tr>
          <td>${c.fornecedor||'—'}</td><td>${c.descricao||'—'}</td>
          <td style="font-weight:600">R$ ${fmt(c.valor_total)}</td>

          <td style="white-space:nowrap">
            ${!c.pago ? `<button class="btn btn-sm btn-primary" onclick="marcarPago('${c.id}')">Pagar</button>` : ''}

window.abrirModalConta = function() {
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay ativo" id="modal-conta">
      <div class="modal">
        <div class="modal-titulo">💰 Nova Conta a Pagar</div>
        <div class="form-group"><label>Fornecedor *</label><input type="text" id="cnt-forn" placeholder="Nome do fornecedor"></div>
        <div class="form-group"><label>Descrição</label><input type="text" id="cnt-desc" placeholder="Ex: NF 456"></div>
        <div class="form-row">
          <div class="form-group"><label>Valor Total (R$) *</label><input type="number" id="cnt-valor" min="0" step="0.01"></div>
          <div class="form-group"><label>1º Vencimento *</label><input type="date" id="cnt-venc"></div>
        </div>
        <div class="form-group"><label>Nº Parcelas</label><input type="number" id="cnt-parcelas" value="1" min="1" max="12"></div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="fecharModal('modal-conta')">Cancelar</button>
          <button class="btn btn-primary" onclick="salvarConta()">Salvar</button>
        </div>
      </div>
    </div>`);
};

window.salvarConta = async function() {
  const forn = document.getElementById('cnt-forn').value.trim();
  const valor = parseFloat(document.getElementById('cnt-valor').value)||0;
  const venc = document.getElementById('cnt-venc').value;
  const parcelas = parseInt(document.getElementById('cnt-parcelas').value)||1;
  if (!forn || !valor || !venc) { toast('Preencha fornecedor, valor e vencimento.','erro'); return; }
  try {
    for (let i = 0; i < parcelas; i++) {
      const dataVenc = new Date(venc + 'T12:00:00');
      dataVenc.setMonth(dataVenc.getMonth() + i);
      const conta = {
        fornecedor: forn,
        descricao: document.getElementById('cnt-desc').value + (parcelas>1?` (${i+1}/${parcelas})`:''),
        valor_total: valor/parcelas, vencimento: Timestamp.fromDate(dataVenc),
        pago: false, criado_em: Timestamp.now()
      };
      const ref = await addDoc(collection(db,'insumos_contas'), conta);
      contas.push({id: ref.id, ...conta});
    }
    contas.sort((a,b) => (a.vencimento?.toDate?a.vencimento.toDate():new Date(a.vencimento)) - (b.vencimento?.toDate?b.vencimento.toDate():new Date(b.vencimento)));
    fecharModal('modal-conta');
    toast(parcelas>1?`${parcelas} parcelas criadas!`:'Conta registrada!');
    renderContas();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

window.marcarPago = async function(id) {
  try {
    await updateDoc(doc(db,'insumos_contas',id), { pago: true, data_pagamento: Timestamp.now() });
    const c = contas.find(x=>x.id===id);
    if (c) c.pago = true;
    toast('Conta marcada como paga!');
    renderContas();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

window.excluirConta = async function(id) {
  if(!exigirMaster())return;
  if (!confirm('Excluir esta conta?')) return;
  try {
    await deleteDoc(doc(db,'insumos_contas',id));
    contas.splice(contas.findIndex(x=>x.id===id),1);
    toast('Conta excluída.');
    renderContas();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

// Conta quantos registros (plantio + aplicação + colheita) usam uma safra
function contarRegistrosSafra(nome) {
  const n = normalizar(nome);
  const c = [...plantios, ...adubacoes, ...colheitas].filter(r => normalizar(r.safra||'') === n).length;
  return c;
}

// Aplica a troca de nome de safra em todas as coleções de registros
async function reescreverSafraNosRegistros(nomeAntigo, nomeNovo) {
  const na = normalizar(nomeAntigo);
  const alvos = [
    { arr: plantios, col: 'insumos_campo_plantio' },
    { arr: adubacoes, col: 'insumos_campo_adubacao' },
    { arr: colheitas, col: 'insumos_campo_colheita' }
  ];
  let batch = writeBatch(db), n = 0, total = 0;
  for (const {arr, col} of alvos) {
    for (const r of arr) {
      if (normalizar(r.safra||'') === na) {
        batch.update(doc(db, col, r.id), { safra: nomeNovo });
        r.safra = nomeNovo; // atualiza local
        n++; total++;
        if (n >= 400) { await batch.commit(); batch = writeBatch(db); n = 0; }
      }
    }
  }
  if (n > 0) await batch.commit();
  return total;
}

window.renomearSafra = async function(id) {
  const s = safras.find(x=>x.id===id);
  if (!s) return;
  const novo = document.getElementById('rs-nome').value.trim();
  if (!novo) { toast('Informe o novo nome.','erro'); return; }
  if (novo === s.nome) { fecharModal('modal-renomear-safra'); return; }
  // Se já existe outra safra com esse nome, isso vira uma unificação
  const jaExiste = safras.find(x => x.id!==id && normalizar(x.nome)===normalizar(novo));
  try {
    const nomeAntigo = s.nome;
    const total = await reescreverSafraNosRegistros(nomeAntigo, novo);
    await updateDoc(doc(db,'insumos_safras',id), { nome: novo });
    s.nome = novo;
    // se colidiu com outra safra existente, remove a duplicata do cadastro
    if (jaExiste) {
      await deleteDoc(doc(db,'insumos_safras',jaExiste.id));
      safras.splice(safras.findIndex(x=>x.id===jaExiste.id),1);
    }
    safras.sort((a,b)=>a.nome.localeCompare(b.nome));
    fecharModal('modal-renomear-safra');
    toast(`Safra renomeada em ${total} registro(s).`);
    renderCadastros();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

window.unificarSafras = async function() {
  const nomeOrigem = document.getElementById('uni-origem').value;
  const nomeDestino = document.getElementById('uni-destino').value;
  if (normalizar(nomeOrigem) === normalizar(nomeDestino)) { toast('Escolha safras diferentes.','erro'); return; }
  if (!confirm(`Unificar "${nomeOrigem}" em "${nomeDestino}"? Todos os registros de "${nomeOrigem}" passarão para "${nomeDestino}".`)) return;
  try {
    const total = await reescreverSafraNosRegistros(nomeOrigem, nomeDestino);
    // Remove a safra de origem do cadastro, se existir lá
    const sOrigem = safras.find(s => normalizar(s.nome) === normalizar(nomeOrigem));
    if (sOrigem) {
      await deleteDoc(doc(db,'insumos_safras',sOrigem.id));
      safras.splice(safras.findIndex(x=>x.id===sOrigem.id),1);
    }
    // Garante que o destino exista no cadastro
    if (!safras.find(s => normalizar(s.nome) === normalizar(nomeDestino))) {
      const ref = await addDoc(collection(db,'insumos_safras'), { nome: nomeDestino });
      safras.push({ id: ref.id, nome: nomeDestino });
      safras.sort((a,b)=>a.nome.localeCompare(b.nome));
    }
    fecharModal('modal-unificar-safra');
    toast(`${total} registro(s) movidos para "${nomeDestino}". Safra "${nomeOrigem}" removida.`);
    renderCadastros();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

let cadernoSubaba = 'talhoes';
let cadernoSafra = '';  // '' = todas as safras (filtro global do caderno)

// Lista de safras disponíveis (cadastro + as que aparecem em registros)
function safrasDisponiveis() {
  const s = new Set();
  [...plantios, ...adubacoes, ...colheitas].forEach(r => { if (r.safra) s.add(r.safra); });
  safras.forEach(x => s.add(x.nome));
  return [...s].filter(Boolean).sort();
}
// Aplica o filtro global de safra (usado por plantio/adubação/colheita)
function filtroCadernoSafra(r) { return !cadernoSafra || r.safra === cadernoSafra; }

          const prevCell = cs.length===0 ? '—' : cs.map(c=>fmtDataBR(c.data_prevista_colheita)).join('<br>');

function badgeStatusCampo(status) {
  if (status === 'concluido') return '<span class="badge badge-verde">Concluído</span>';
  if (status === 'execucao') return '<span class="badge badge-laranja">Em execução</span>';
  if (status === 'enviado_operador') return '<span class="badge badge-laranja">Enviado ao Operador</span>';
  return '<span class="badge badge-azul">Planejado</span>';
}

// Lê as cultivares de um plantio de forma retrocompatível:
// - formato novo: p.cultivares = [{cultivar, area_ha, ciclo_dias, data_prevista_colheita}]
// - formato antigo: p.cultivar / p.ciclo_dias / p.data_prevista_colheita (única)
function cultivaresDoPlantio(p) {
  if (Array.isArray(p.cultivares) && p.cultivares.length > 0) {
    return p.cultivares.map(c => ({
      cultivar: c.cultivar||'', area_ha: parseFloat(c.area_ha)||0,
      ciclo_dias: parseFloat(c.ciclo_dias)||0, data_prevista_colheita: c.data_prevista_colheita||'',
      populacao: parseFloat(c.populacao)||0, obs: c.obs||''
    }));
  }
  if (p.cultivar || p.ciclo_dias) return [{
    cultivar: p.cultivar||'', area_ha: 0,
    ciclo_dias: parseFloat(p.ciclo_dias)||0, data_prevista_colheita: p.data_prevista_colheita||'',
    populacao: parseFloat(p.populacao)||0, obs: p.obs||''
  }];
  return [];
}

  if (!cont) return;

  cont.innerHTML = lista.map((c, i) => `
    <div class="pl-cult-linha" style="border:1px solid var(--creme-escuro);border-radius:10px;padding:10px;margin-bottom:8px">
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">

        <input type="number" class="pl-cult-area" value="${c.area_ha||''}" placeholder="Área (ha) — vazio = talhão todo" min="0" step="0.01" style="flex:1;min-width:85px">
        <input type="number" class="pl-cult-ciclo" value="${c.ciclo_dias||''}" placeholder="Ciclo (dias)" min="0" step="1" oninput="atualizarPrevisaoColheita()" style="flex:1;min-width:85px">

function coletarLinhasCultivar() {
  const cont = document.getElementById('pl-cultivares-lista');
  if (!cont) return;
  const linhas = [];
  cont.querySelectorAll('.pl-cult-linha').forEach(div => {
    linhas.push({
      cultivar: div.querySelector('.pl-cult-nome').value.trim(),
      area_ha: div.querySelector('.pl-cult-area').value,
      ciclo_dias: div.querySelector('.pl-cult-ciclo').value,
      populacao: div.querySelector('.pl-cult-pop').value,
      obs: div.querySelector('.pl-cult-obs').value
    });
  });
  window._plCultivares = linhas;
}

window.adicionarLinhaCultivar = function() {
  coletarLinhasCultivar();
  window._plCultivares.push({cultivar:'',area_ha:'',ciclo_dias:'',populacao:'',obs:''});
  renderLinhasCultivar();
};

window.removerLinhaCultivar = function(i) {
  coletarLinhasCultivar();
  window._plCultivares.splice(i,1);
  if (window._plCultivares.length === 0) window._plCultivares.push({cultivar:'',area_ha:'',ciclo_dias:'',populacao:'',obs:''});

};

// Recalcula a previsão de colheita de cada cultivar (data do plantio + ciclo) em tempo real
window.atualizarPrevisaoColheita = function() {
  const data = document.getElementById('pl-data')?.value;
  document.querySelectorAll('.pl-cult-linha').forEach(div => {
    const ciclo = parseFloat(div.querySelector('.pl-cult-ciclo')?.value)||0;
    const span = div.querySelector('.pl-cult-prev');
    if (span) span.textContent = 'Previsão de colheita: ' + ((data && ciclo>0) ? fmtDataBR(somarDias(data, ciclo)) : '—');

window.salvarPlantio = async function(id) {
  const fazenda = document.getElementById('pl-fazenda').value;
  const talhao = document.getElementById('pl-talhao').value;
  const cultura = document.getElementById('pl-cultura').value;
  if (!fazenda || !talhao || !cultura) { toast('Preencha fazenda, talhão e cultura.','erro'); return; }
  const data = document.getElementById('pl-data').value;
  // Coleta as cultivares e valida
  coletarLinhasCultivar();
  const cultivares = (window._plCultivares||[])
    .map(c => ({
      cultivar: (c.cultivar||'').trim(),
      area_ha: parseFloat(c.area_ha)||0,
      ciclo_dias: parseFloat(c.ciclo_dias)||0,
      populacao: parseFloat(c.populacao)||0,
      obs: (c.obs||'').trim(),
      data_prevista_colheita: (data && (parseFloat(c.ciclo_dias)||0)>0) ? somarDias(data, parseFloat(c.ciclo_dias)) : ''
    }))
    .filter(c => c.cultivar);
  if (cultivares.length === 0) { toast('Informe ao menos uma cultivar.','erro'); return; }
  // Se houver só uma cultivar e a área não foi informada, assume a área do talhão
  if (cultivares.length === 1 && !cultivares[0].area_ha) {
    const areaTal = areaDoTalhao(fazenda, talhao);
    if (areaTal > 0) cultivares[0].area_ha = areaTal;
  }

  const reg = {
    data, fazenda, talhao, cultura,
    safra: document.getElementById('pl-safra').value,
    // Formato novo: lista de cultivares (cada uma com área, ciclo, população e obs).
    // Mantém campos antigos com a 1ª cultivar para compatibilidade.
    cultivares,
    cultivar: cultivares[0].cultivar,
    ciclo_dias: cultivares[0].ciclo_dias,
    data_prevista_colheita: cultivares[0].data_prevista_colheita,
    populacao: cultivares[0].populacao,
    obs: cultivares[0].obs,
    espacamento: parseFloat(document.getElementById('pl-espacamento').value)||0
  };
  try {
    if (id) {
      await updateDoc(doc(db,'insumos_campo_plantio',id), reg);
      const i = plantios.findIndex(x=>x.id===id);
      if (i>=0) plantios[i] = { ...plantios[i], ...reg };
      await sincronizarColheitasDoPlantio(plantios[i>=0?i:0]);
      toast('Plantio atualizado! Colheitas sincronizadas.');
    } else {
      reg.status = 'planejado'; reg.criado_em = Timestamp.now();
      const ref = await addDoc(collection(db,'insumos_campo_plantio'), reg);
      const novoPlantio = {id: ref.id, ...reg};
      plantios.unshift(novoPlantio);
      await sincronizarColheitasDoPlantio(novoPlantio);
      toast('Plantio planejado! Colheita(s) gerada(s) automaticamente.');
    }
    fecharModal('modal-plantio');
    renderPlantio();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

// Regulariza: gera as colheitas de todos os plantios que ainda não têm (plantios antigos)
window.gerarColheitasFaltantes = async function() {
  if(!exigirMaster())return;
  const semColheita = plantios.filter(p => !colheitas.some(c => c.plantio_id === p.id));
  if (semColheita.length === 0 && plantios.length > 0) {
    // Mesmo que todos tenham, ressincroniza para atualizar datas/cultivares
    if (!confirm('Todos os plantios já têm colheita. Deseja ressincronizar as datas e cultivares mesmo assim?')) return;
  } else if (plantios.length === 0) {
    toast('Nenhum plantio cadastrado.','erro'); return;
  } else {
    if (!confirm(`Gerar colheitas para ${semColheita.length} plantio(s) que ainda não têm? (uma colheita por cultivar)`)) return;
  }
  let total = 0;
  for (const p of plantios) {
    const antes = colheitas.filter(c => c.plantio_id === p.id).length;
    await sincronizarColheitasDoPlantio(p);
    const depois = colheitas.filter(c => c.plantio_id === p.id).length;
    total += Math.max(0, depois - antes);
  }
  toast(`${total} colheita(s) gerada(s).`);
  renderSubabaCaderno();
};

// A data-base da colheita é a data de EXECUÇÃO do plantio; se ainda não executado, a planejada.
function dataBasePlantio(p) {
  return (p.status === 'concluido' && p.data_conclusao) ? p.data_conclusao : p.data;
}

// Cria/atualiza/remove as colheitas de um plantio — uma por cultivar.
// Vincula por plantio_id + cultivar. A data planejada = data-base + ciclo da cultivar.
// Campos de execução (produtividade, umidade, PMS, stand_final) NÃO são tocados aqui.
async function sincronizarColheitasDoPlantio(p) {
  if (!p || !p.id) return;
  const base = dataBasePlantio(p);
  let cults = cultivaresDoPlantio(p);
  // Plantio antigo sem cultivar cadastrada: gera uma colheita "genérica" pela cultura,
  // usando o ciclo/previsão que o plantio tiver (marcada com cultivar vazio).
  if (cults.length === 0) {
    cults = [{
      cultivar: '', area_ha: areaDoTalhao(p.fazenda, p.talhao) || 0,
      ciclo_dias: parseFloat(p.ciclo_dias)||0, data_prevista_colheita: p.data_prevista_colheita||'',
      populacao: 0, obs: ''
    }];
  }
  const existentes = colheitas.filter(c => c.plantio_id === p.id);

  // Remove colheitas de cultivares que não existem mais (só se ainda não colhidas)
  for (const c of existentes) {
    const aindaExiste = cults.some(cu => normalizar(cu.cultivar) === normalizar(c.cultivar));
    if (!aindaExiste && c.status !== 'concluido') {
      try { await deleteDoc(doc(db,'insumos_campo_colheita',c.id)); } catch(e){}
      const i = colheitas.findIndex(x=>x.id===c.id); if (i>=0) colheitas.splice(i,1);
    }
  }

  // Cria/atualiza uma colheita por cultivar
  for (const cu of cults) {
    const dataPrev = (base && cu.ciclo_dias>0) ? somarDias(base, cu.ciclo_dias) : (cu.data_prevista_colheita||'');
    const jaTem = colheitas.find(c => c.plantio_id === p.id && normalizar(c.cultivar) === normalizar(cu.cultivar));
    if (jaTem) {
      // Atualiza só os campos vindos do plantio; preserva execução
      const upd = {
        data: dataPrev, fazenda: p.fazenda, talhao: p.talhao, cultura: p.cultura,
        safra: p.safra, cultivar: cu.cultivar, area_ha: cu.area_ha, ciclo_dias: cu.ciclo_dias
      };
      // não recalcula data se a colheita já foi concluída
      if (jaTem.status === 'concluido') delete upd.data;
      try {
        await updateDoc(doc(db,'insumos_campo_colheita',jaTem.id), upd);
        Object.assign(jaTem, upd);
      } catch(e){}
    } else {
      const nova = {
        plantio_id: p.id, data: dataPrev, fazenda: p.fazenda, talhao: p.talhao,
        cultura: p.cultura, safra: p.safra, cultivar: cu.cultivar, area_ha: cu.area_ha,
        ciclo_dias: cu.ciclo_dias, status: 'planejado',
        produtividade: 0, umidade: 0, pms: 0, stand_final: 0,
        criado_em: Timestamp.now()
      };
      try {
        const ref = await addDoc(collection(db,'insumos_campo_colheita'), nova);
        colheitas.unshift({id: ref.id, ...nova});
      } catch(e){}
    }
  }
}

// Remove todas as colheitas vinculadas a um plantio (usado ao excluir o plantio)
async function removerColheitasDoPlantio(plantioId) {
  const vinculadas = colheitas.filter(c => c.plantio_id === plantioId);
  for (const c of vinculadas) {
    try { await deleteDoc(doc(db,'insumos_campo_colheita',c.id)); } catch(e){}
    const i = colheitas.findIndex(x=>x.id===c.id); if (i>=0) colheitas.splice(i,1);
  }
}

// ── APLICAÇÕES: PULVERIZAÇÃO (líquidos, com vazão) e SÓLIDOS (corretivos/adubação) ──
// tipo: 'pulverizacao' | 'solido'. Registros antigos sem tipo contam como 'solido'.
function tipoDaAdubacao(a) { return a.tipo_aplicacao === 'pulverizacao' ? 'pulverizacao' : 'solido'; }

// Lê os produtos de uma aplicação de forma retrocompatível:
// - formato novo: a.produtos = [{produto, dose, unidade}, ...]
// - formato antigo: a.produto / a.dose / a.unidade (produto único)
function produtosDaAplicacao(a) {
  if (Array.isArray(a.produtos) && a.produtos.length > 0) {
    return a.produtos.map(p => ({ produto: p.produto||'', dose: parseFloat(p.dose)||0, unidade: p.unidade||'' }));
  }
  if (a.produto) return [{ produto: a.produto, dose: parseFloat(a.dose)||0, unidade: a.unidade||'' }];
  return [];
}
// Texto resumido dos produtos (para tabelas): "Produto A, Produto B (+1)"
function resumoProdutos(a) {
  const lista = produtosDaAplicacao(a);
  if (lista.length === 0) return '—';
  if (lista.length === 1) return lista[0].produto || '—';
  return `${lista[0].produto} +${lista.length-1}`;
}

    <div class="tabela-wrap"><table>

        ${thOrd(tipo,'data','Data Planejada')}

        </div></td></tr>`;}).join('')}
      </tbody>
    </table></div>`;
}

// Gera o HTML dos campos de data (fixa / X dias após plantio / X dias após outra aplicação)
function renderModoDataCampos(valores) {
  valores = valores || {};
  const fazenda = document.getElementById('ad-fazenda')?.value||'';
  const talhao = document.getElementById('ad-talhao')?.value||'';
  const modo = document.getElementById('ad-modo-data')?.value || valores.modo_data || 'fixa';
  if (modo === 'plantio') {
    const opcoes = plantios.filter(p => normalizar(p.fazenda||'')===normalizar(fazenda) && normalizar(p.talhao||'')===normalizar(talhao));
    if (opcoes.length===0) return `<p style="font-size:12px;color:var(--laranja)">Nenhum plantio cadastrado para esse talhão ainda. Cadastre o plantio primeiro, ou use Data fixa.</p>`;
    return `
      <div class="form-row">
        <div class="form-group"><label>Plantio de referência</label>
          <select id="ad-ref-plantio">${opcoes.map(p=>`<option value="${p.id}" ${p.id===valores.ref_plantio_id?'selected':''}>${p.cultura||'Plantio'} — ${p.data} (${p.cultivar||''})</option>`).join('')}</select></div>
        <div class="form-group"><label>Dias após o plantio</label><input type="number" id="ad-dias-apos" value="${valores.dias_apos!=null?valores.dias_apos:''}" min="0" step="1"></div>
      </div>`;
  }
  if (modo === 'aplicacao') {
    const opcoes = adubacoes.filter(a => normalizar(a.fazenda||'')===normalizar(fazenda) && normalizar(a.talhao||'')===normalizar(talhao) && a.id!==valores.idAtual);
    if (opcoes.length===0) return `<p style="font-size:12px;color:var(--laranja)">Nenhum outro planejamento nesse talhão ainda para usar como referência.</p>`;
    return `
      <div class="form-row">
        <div class="form-group"><label>Aplicação de referência</label>
          <select id="ad-ref-aplicacao">${opcoes.map(a=>`<option value="${a.id}" ${a.id===valores.ref_aplicacao_id?'selected':''}>${a.produto} — ${a.data}</option>`).join('')}</select></div>
        <div class="form-group"><label>Dias após essa aplicação</label><input type="number" id="ad-dias-apos" value="${valores.dias_apos!=null?valores.dias_apos:''}" min="0" step="1"></div>
      </div>`;
  }
  return `<div class="form-group"><label>Data Planejada *</label><input type="date" id="ad-data" value="${valores.data||hoje()}"></div>`;
}

        <div class="form-group"><label>Como definir a data? *</label>
          <select id="ad-modo-data" onchange="atualizarModoDataAdubacao()">
            <option value="fixa" ${modoInicial==='fixa'?'selected':''}>Data fixa</option>
            <option value="plantio" ${modoInicial==='plantio'?'selected':''}>X dias após o plantio</option>
            <option value="aplicacao" ${modoInicial==='aplicacao'?'selected':''}>X dias após outra aplicação já planejada</option>

        <div id="ad-modo-data-campos"></div>
        <div class="form-group"><label>Observação</label><input type="text" id="ad-obs" value="${a?.obs||''}" placeholder="Opcional"></div>
        ${a?`<div class="form-group"><label>Status (master)</label><select id="ad-status">
          <option value="planejado" ${a.status==='planejado'?'selected':''}>Planejado</option>
          <option value="enviado_operador" ${a.status==='enviado_operador'?'selected':''}>Liberado / Aguardando execução</option>

// Renderiza as linhas de produto a partir de window._adProdutos, preservando o que foi digitado
function renderLinhasProduto() {
  const cont = document.getElementById('ad-produtos-lista');
  if (!cont) return;
  const lista = window._adProdutos || [];
  cont.innerHTML = `
    <div style="display:flex;gap:6px;margin-bottom:4px;font-size:11px;color:var(--cinza);font-weight:600;text-transform:uppercase;letter-spacing:.03em">
      <span style="flex:2">Produto</span>
      <span style="flex:1;min-width:70px">Dose/ha</span>
      <span style="flex:1;min-width:60px">Un</span>
      <span style="flex:1;min-width:80px">Total no talhão</span>
      ${lista.length>1?'<span style="width:28px"></span>':''}
    </div>` + lista.map((p, i) => `
    <div class="ad-prod-linha" style="display:flex;gap:6px;margin-bottom:6px;align-items:center">
      <input type="text" class="ad-prod-nome" data-i="${i}" value="${(p.produto||'').replace(/"/g,'&quot;')}" placeholder="Produto" list="ad-prod-dl-${i}" style="flex:2">
      <datalist id="ad-prod-dl-${i}" class="ad-prod-datalist"></datalist>
      <input type="number" class="ad-prod-dose" data-i="${i}" value="${p.dose||''}" placeholder="Dose/ha" min="0" step="0.01" style="flex:1;min-width:70px" oninput="recalcularTotalProduto(${i})">
      <select class="ad-prod-unidade" data-i="${i}" style="flex:1;min-width:60px">${UNIDADES.map(u=>`<option ${u===p.unidade?'selected':''}>${u}</option>`).join('')}</select>
      <input type="number" class="ad-prod-total" data-i="${i}" value="${p.total||''}" placeholder="Total" min="0" step="0.01" style="flex:1;min-width:80px" oninput="recalcularDoseProduto(${i})" title="Total de produto no talhão (arredonde aqui para embalagem)">
      ${lista.length>1?`<button type="button" class="btn btn-sm btn-secondary" onclick="moverLinhaProduto(${i},-1)" title="Mover para cima" ${i===0?'disabled style="opacity:.35"':''}>▲</button>
      <button type="button" class="btn btn-sm btn-secondary" onclick="moverLinhaProduto(${i},1)" title="Mover para baixo" ${i===lista.length-1?'disabled style="opacity:.35"':''}>▼</button>
      <button type="button" class="btn btn-sm btn-secondary" onclick="removerLinhaProduto(${i})" title="Remover">✕</button>`:''}
    </div>`).join('');
  // preenche datalists do compêndio se já carregado
  if (window._compendioProdutos) {
    cont.querySelectorAll('.ad-prod-datalist').forEach(dl => {
      dl.innerHTML = window._compendioProdutos.map(n=>`<option value="${n.replace(/"/g,'&quot;')}">`).join('');
    });
  }
  // calcula os totais iniciais a partir das doses
  (window._adProdutos||[]).forEach((_,i)=>recalcularTotalProduto(i, true));
}

// Área do talhão selecionado no modal de aplicação (0 se não cadastrada)
function areaTalhaoModalAplic() {
  const fazenda = document.getElementById('ad-fazenda')?.value || '';
  const talhao = document.getElementById('ad-talhao')?.value || '';
  return areaDoTalhao(fazenda, talhao);
}

// Dose digitada → recalcula o Total (dose × área)
window.recalcularTotalProduto = function(i, silencioso) {
  const cont = document.getElementById('ad-produtos-lista');
  if (!cont) return;
  const linha = cont.querySelectorAll('.ad-prod-linha')[i];
  if (!linha) return;
  const area = areaTalhaoModalAplic();
  const dose = parseFloat(linha.querySelector('.ad-prod-dose').value)||0;
  const campoTotal = linha.querySelector('.ad-prod-total');
  if (area > 0 && dose > 0) {
    campoTotal.value = +(dose * area).toFixed(2);
    campoTotal.placeholder = 'Total';
  } else if (!silencioso) {
    campoTotal.placeholder = area>0 ? 'Total' : 'sem área';
  }
};

// Total digitado (arredondado) → recalcula a Dose (total ÷ área). A dose ajustada vira a oficial.
window.recalcularDoseProduto = function(i) {
  const cont = document.getElementById('ad-produtos-lista');
  if (!cont) return;
  const linha = cont.querySelectorAll('.ad-prod-linha')[i];
  if (!linha) return;
  const area = areaTalhaoModalAplic();
  const total = parseFloat(linha.querySelector('.ad-prod-total').value)||0;
  const campoDose = linha.querySelector('.ad-prod-dose');
  if (area > 0 && total > 0) {
    campoDose.value = +(total / area).toFixed(4);
  }
};

// Lê o que está nos inputs de volta para window._adProdutos (para não perder ao adicionar/remover)
function coletarLinhasProduto() {
  const cont = document.getElementById('ad-produtos-lista');
  if (!cont) return;
  const linhas = [];
  cont.querySelectorAll('.ad-prod-linha').forEach(div => {
    linhas.push({
      produto: div.querySelector('.ad-prod-nome').value.trim(),
      dose: div.querySelector('.ad-prod-dose').value,
      unidade: div.querySelector('.ad-prod-unidade').value,
      total: div.querySelector('.ad-prod-total').value
    });
  });
  window._adProdutos = linhas;
}

window.recalcularTotaisTodos = function() {
  const cont = document.getElementById('ad-produtos-lista');
  if (!cont) return;
  cont.querySelectorAll('.ad-prod-linha').forEach((_,i)=>recalcularTotalProduto(i));
};

window.moverLinhaProduto = function(i, dir) {
  coletarLinhasProduto();
  const j = i + dir;
  if (j < 0 || j >= window._adProdutos.length) return;
  const tmp = window._adProdutos[i];
  window._adProdutos[i] = window._adProdutos[j];
  window._adProdutos[j] = tmp;
  renderLinhasProduto();
};

window.adicionarLinhaProduto = function() {
  coletarLinhasProduto();
  window._adProdutos.push({produto:'',dose:'',unidade:UNIDADES[0]});
  renderLinhasProduto();
};

window.removerLinhaProduto = function(i) {
  coletarLinhasProduto();
  window._adProdutos.splice(i,1);
  if (window._adProdutos.length === 0) window._adProdutos.push({produto:'',dose:'',unidade:UNIDADES[0]});
  renderLinhasProduto();
};

window.salvarAdubacao = async function(id) {
  const fazenda = document.getElementById('ad-fazenda').value;
  const talhao = document.getElementById('ad-talhao').value;
  // Coleta a lista de produtos e valida
  coletarLinhasProduto();
  const produtos = (window._adProdutos||[])
    .map(p => ({ produto: (p.produto||'').trim(), dose: parseFloat(p.dose)||0, unidade: p.unidade||'' }))
    .filter(p => p.produto);
  if (!fazenda || !talhao || produtos.length === 0) { toast('Preencha fazenda, talhão e ao menos um produto.','erro'); return; }

  const modo_data = document.getElementById('ad-modo-data').value;
  let dataFinal = '', ref_plantio_id = '', ref_aplicacao_id = '', dias_apos = 0;
  if (modo_data === 'fixa') {
    dataFinal = document.getElementById('ad-data')?.value || '';
    if (!dataFinal) { toast('Informe a data.','erro'); return; }
  } else if (modo_data === 'plantio') {
    ref_plantio_id = document.getElementById('ad-ref-plantio')?.value || '';
    dias_apos = parseFloat(document.getElementById('ad-dias-apos')?.value)||0;
    const pRef = plantios.find(p=>p.id===ref_plantio_id);
    if (!pRef) { toast('Selecione o plantio de referência.','erro'); return; }
    dataFinal = somarDias(pRef.data, dias_apos);
  } else if (modo_data === 'aplicacao') {
    ref_aplicacao_id = document.getElementById('ad-ref-aplicacao')?.value || '';
    dias_apos = parseFloat(document.getElementById('ad-dias-apos')?.value)||0;
    const aRef = adubacoes.find(x=>x.id===ref_aplicacao_id);
    if (!aRef) { toast('Selecione a aplicação de referência.','erro'); return; }
    dataFinal = somarDias(aRef.data, dias_apos);
  }

  const tipo_aplicacao = document.getElementById('ad-tipo')?.value || 'solido';
  const reg = {
    data: dataFinal, fazenda, talhao,
    safra: document.getElementById('ad-safra').value, categoria: document.getElementById('ad-categoria').value,
    // Formato novo: lista de produtos. Mantém produto/dose/unidade do 1º p/ compatibilidade.
    produtos,
    produto: produtos[0].produto, dose: produtos[0].dose, unidade: produtos[0].unidade,
    obs: document.getElementById('ad-obs').value,
    modo_data, ref_plantio_id, ref_aplicacao_id, dias_apos,
    tipo_aplicacao,
    vazao: tipo_aplicacao === 'pulverizacao' ? (document.getElementById('ad-vazao')?.value.trim() || '') : ''
  };
  try {
    if (id) {
      // Master pode alterar o status. Ajusta campos ligados ao status.
      const novoStatus = document.getElementById('ad-status')?.value;
      const a0 = adubacoes.find(x=>x.id===id) || {};
      const statusAnterior = a0.status;
      if (novoStatus) {
        reg.status = novoStatus;
        if (novoStatus === 'concluido' && !a0.data_conclusao) reg.data_conclusao = hoje();
        if (novoStatus === 'execucao' && !a0.iniciado_em) reg.iniciado_em = Timestamp.now();
        // volta para planejado limpa timestamps de execução/conclusão
        if (novoStatus === 'planejado') { reg.iniciado_em = null; reg.data_conclusao = ''; }
      }
      await updateDoc(doc(db,'insumos_campo_adubacao',id), reg);
      const i = adubacoes.findIndex(x=>x.id===id);
      if (i>=0) adubacoes[i] = { ...adubacoes[i], ...reg };
      // Sincroniza a baixa de estoque com a mudança de status
      const aAtual = adubacoes.find(x=>x.id===id);
      if (novoStatus === 'concluido' && statusAnterior !== 'concluido') {
        const baixa = await baixarEstoquePorAplicacao(aAtual);
        if (baixa.ok) toast('Registro atualizado! Estoque baixado.');
        else toast(`Atualizado, mas estoque NÃO baixado: ${baixa.motivo}.`, 'erro');
      } else if (novoStatus && novoStatus !== 'concluido' && statusAnterior === 'concluido') {
        await reverterBaixaAplicacao(aAtual);
        toast('Registro atualizado! Baixa de estoque revertida.');
      } else {
        toast('Registro atualizado!');
      }
    } else {
      reg.status = 'planejado'; reg.criado_em = Timestamp.now();
      const ref = await addDoc(collection(db,'insumos_campo_adubacao'), reg);
      adubacoes.unshift({id: ref.id, ...reg});
      toast('Planejamento salvo!');
    }
    fecharModal('modal-adubacao');
    renderSubabaCaderno();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

// Recalcula a data de um item "X dias após..." com base no valor atual da referência
// (útil se a data do plantio ou da aplicação-base mudou depois que este item foi criado)
window.recalcularDataAdubacao = async function(id) {
  const a = adubacoes.find(x=>x.id===id);
  if (!a || !a.modo_data || a.modo_data==='fixa') return;
  let novaData = a.data;
  if (a.modo_data==='plantio') {
    const p = plantios.find(x=>x.id===a.ref_plantio_id);
    if (!p) { toast('Plantio de referência não encontrado (pode ter sido excluído).','erro'); return; }
    novaData = somarDias(p.data, a.dias_apos);
  } else if (a.modo_data==='aplicacao') {
    const ref = adubacoes.find(x=>x.id===a.ref_aplicacao_id);
    if (!ref) { toast('Aplicação de referência não encontrada (pode ter sido excluída).','erro'); return; }
    novaData = somarDias(ref.data, a.dias_apos);
  }
  if (novaData === a.data) { toast('A data já está atualizada.'); return; }
  try {
    await updateDoc(doc(db,'insumos_campo_adubacao',id), { data: novaData });
    a.data = novaData;
    toast('Data recalculada para '+novaData);
    renderSubabaCaderno();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

// (substituída por liberarParaCampo — execução agora é interna)
// Libera a aplicação para execução no modo Aplicações (deste mesmo app).
// Não depende mais do AgroOp — muda o status para 'enviado_operador',
// que é o estado "pendente de execução" que o modo Aplicações mostra.
window.liberarParaCampo = async function(id) {
  const a = adubacoes.find(x=>x.id===id);
  if (!a) return;
  if (!confirm(`Liberar "${a.produto}" (${a.talhao}) para execução no campo?`)) return;
  try {
    await updateDoc(doc(db,'insumos_campo_adubacao',id), { status: 'enviado_operador' });
    a.status = 'enviado_operador';
    toast('Liberado! Já aparece no modo Aplicações para o operador executar.');
    renderSubabaCaderno();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

// Concluir sem passar pelo operador (ex: já foi feito, só registrando)
// Baixa retroativa: para aplicações concluídas antes da baixa automática existir
window.baixarEstoqueRetroativo = async function(id) {
  const a = adubacoes.find(x=>x.id===id);
  if (!a) return;
  if (a.estoque_baixado) { toast('Estoque desta aplicação já foi baixado.'); return; }
  const areaHa = areaDoTalhao(a.fazenda, a.talhao);
  const qtd = (parseFloat(a.dose)||0) * areaHa;
  if (!confirm(`Baixar do estoque ${fmt(qtd)} ${a.unidade||''} de "${a.produto}" (${fmt(a.dose)} ${a.unidade||''}/ha × ${fmt(areaHa)} ha em ${a.talhao})?`)) return;
  const baixa = await baixarEstoquePorAplicacao(a);
  if (baixa.ok) toast('Estoque baixado!' + (baixa.semCadastro ? ' (produto sem entrada no estoque — retirada registrada mesmo assim)' : ''));
  else toast(`Não foi possível baixar: ${baixa.motivo}.`, 'erro');
  renderSubabaCaderno();
};

window.concluirDireto = async function(id) {
  const data_conclusao = prompt('Data de conclusão (DD/MM/AAAA ou deixe vazio para hoje):','');
  const dataFinal = data_conclusao ? data_conclusao : hoje();
  try {
    await updateDoc(doc(db,'insumos_campo_adubacao',id), { status: 'concluido', data_conclusao: dataFinal });
    const a = adubacoes.find(x=>x.id===id);
    if (a) { a.status='concluido'; a.data_conclusao=dataFinal; }
    // Baixa automática de estoque
    const baixa = a ? await baixarEstoquePorAplicacao(a) : { ok: false, motivo: 'registro não encontrado' };
    if (baixa.ok) toast('Registrado como concluído! Estoque baixado.' + (baixa.semCadastro ? ' (produto sem entrada no estoque)' : ''));
    else toast(`Concluído, mas estoque NÃO baixado: ${baixa.motivo}.`, 'erro');
    renderSubabaCaderno();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

// ══════════════ PAINEL POR TALHÃO (usa o filtro de safra global do caderno) ══════════════
function renderPainelTalhoes() {
  const el = document.getElementById('caderno-conteudo');
  el.innerHTML = `
    <div class="sec-header">
      <div style="font-size:14px;color:var(--cinza)">Situação de cada talhão — plantio, aplicações e colheita${cadernoSafra?` · safra ${cadernoSafra}`:' · todas as safras'}</div>
    </div>
    <div id="painel-talhoes-lista"></div>`;
  renderListaTalhoes();
}

function filtraSafra(r) { return filtroCadernoSafra(r); }

function renderListaTalhoes() {
  const cont = document.getElementById('painel-talhoes-lista');
  if (!cont) return;

  // Monta a lista de talhões: usa o cadastro; se vazio, deriva dos registros
  let unidades = talhoes.map(t => ({ nome: t.nome, fazenda: t.fazenda||'', area_ha: parseFloat(t.area_ha)||0 }));
  if (unidades.length === 0) {
    const chaves = new Set();
    [...plantios, ...adubacoes, ...colheitas].forEach(r => { if (r.talhao) chaves.add(`${r.fazenda||''}||${r.talhao}`); });
    unidades = [...chaves].map(k => { const [f,n] = k.split('||'); return { nome:n, fazenda:f, area_ha:0 }; });
  }

  // Para cada talhão, coleta os eventos filtrados pela safra
  const cards = unidades.map((u, idx) => {
    const mesmoTalhao = (r) => normalizar(r.talhao||'') === normalizar(u.nome) &&
      (!u.fazenda || normalizar((r.fazenda||'').replace('Fazenda ','')) === normalizar(u.fazenda));
    const pls = plantios.filter(r => mesmoTalhao(r) && filtraSafra(r));
    const aps = adubacoes.filter(r => mesmoTalhao(r) && filtraSafra(r));
    const cols = colheitas.filter(r => mesmoTalhao(r) && filtraSafra(r));
    const totalEventos = pls.length + aps.length + cols.length;
    if (totalEventos === 0) return ''; // não mostra talhão sem nada na safra filtrada

    // Contadores de status das aplicações
    const nPlan = aps.filter(a => a.status==='planejado').length;
    const nLib = aps.filter(a => a.status==='enviado_operador').length;
    const nExec = aps.filter(a => a.status==='execucao').length;
    const nConc = aps.filter(a => a.status==='concluido').length;

    const cardId = `talhao-card-${idx}`;
    return `
      <div class="talhao-card" id="${cardId}">
        <div class="talhao-head" onclick="toggleTalhaoCard('${cardId}')">
          <div>
            <div class="talhao-nome">${u.fazenda?u.fazenda+' · ':''}${u.nome}${u.area_ha>0?` <span class="talhao-area">${fmt(u.area_ha)} ha</span>`:''}</div>
            <div class="talhao-resumo">
              ${pls.length?`<span>🌱 ${pls.length} plantio(s)</span>`:''}
              ${aps.length?`<span>🧪 ${aps.length} aplic.</span>`:''}
              ${cols.length?`<span>🌾 ${cols.length} colheita(s)</span>`:''}
            </div>
          </div>
          <div class="talhao-badges">
            ${nPlan?`<span class="tb tb-plan">${nPlan} plan.</span>`:''}
            ${nLib?`<span class="tb tb-lib">${nLib} liberada(s)</span>`:''}
            ${nExec?`<span class="tb tb-exec">${nExec} em exec.</span>`:''}
            ${nConc?`<span class="tb tb-conc">${nConc} concl.</span>`:''}
            <span class="talhao-seta">▾</span>
          </div>
        </div>
        <div class="talhao-detalhes">
          ${blocoEventoTalhao('🌱 Plantio', [...pls].sort((a,b)=>(a.data||'').localeCompare(b.data||'')).map(p => ({
            dataPlan: p.data,
            dataExec: p.status==='concluido'?(p.data_conclusao||''):'',
            produtos: (()=>{ const cs=cultivaresDoPlantio(p); return cs.length?cs.map(c=>({nome:`${p.cultura||'Plantio'}${c.cultivar?` — ${c.cultivar}`:''}`, dose:c.ciclo_dias?`ciclo ${fmt(c.ciclo_dias)}d`:''})):[{nome:p.cultura||'Plantio',dose:''}]; })(),
            status: p.status
          })))}
          ${blocoEventoTalhao('🧪 Aplicações', [...aps].sort((a,b)=>(a.data||'').localeCompare(b.data||'')).map(a => ({
            dataPlan: a.data,
            dataExec: a.status==='concluido'?(a.data_conclusao||''):'',
            produtos: produtosDaAplicacao(a).map(p=>({nome:p.produto||'—', dose:p.dose?`${fmt(p.dose)} ${p.unidade||''}/ha`:''})),
            descricao: [tipoDaAdubacao(a)==='pulverizacao'?'💧 pulveriz.':'🪨 sólido', a.categoria||''].filter(Boolean).join(' · '),
            status: a.status
          })))}
          ${blocoEventoTalhao('🌾 Colheita', [...cols].sort((a,b)=>(a.data||'').localeCompare(b.data||'')).map(c => ({
            dataPlan: c.data,
            dataExec: c.status==='concluido'?(c.data_conclusao||''):'',
            produtos: [{nome:`${c.cultura||'Colheita'}${c.cultivar?` — ${c.cultivar}`:''}`, dose: c.status==='concluido'&&c.produtividade?`${fmt(c.produtividade)} ${c.unidade_produtividade||'sc/ha'}`:''}],
            status: c.status
          })))}
        </div>
      </div>`;
  }).filter(Boolean).join('');

  cont.innerHTML = cards || `<div style="text-align:center;padding:48px 16px;color:var(--cinza)"><div style="font-size:34px;opacity:.35;margin-bottom:8px">📍</div>Nenhum evento para a safra selecionada</div>`;
}

// Bloco de uma categoria de evento (tabela: Data Plan. | Data Exec. | Produtos/doses | Status)
function blocoEventoTalhao(titulo, eventos) {
  if (!eventos.length) return '';
  const linhas = eventos.map(e => {
    const prodTab = e.produtos && e.produtos.length
      ? `<table class="prod-dose-mini">${e.produtos.map(p=>`<tr><td class="pd-nome">${p.nome}</td><td class="pd-dose">${p.dose||''}</td></tr>`).join('')}</table>`
      : '';
    return `<div class="te-item">
      <div class="te-topo">
        <div class="te-datas">
          <span><span class="te-lbl">Plan.</span> ${fmtDataBR(e.dataPlan)}</span>
          ${e.dataExec?`<span><span class="te-lbl">Exec.</span> ${fmtDataBR(e.dataExec)}</span>`:''}
        </div>
        ${badgeStatusCampo(e.status)}
      </div>
      <div class="te-corpo">${prodTab||'—'}</div>
      ${e.descricao?`<div class="te-desc">${e.descricao}</div>`:''}
    </div>`;
  }).join('');
  return `<div class="talhao-secao">
    <div class="talhao-secao-titulo">${titulo}</div>
    ${linhas}
  </div>`;
}

window.excluirRegistroCampo = async function(colecao, id, tipo) {
  if(!exigirMaster())return;
  const aviso = tipo==='plantio' ? 'Excluir este plantio também remove as colheitas geradas a partir dele. Continuar?' : 'Excluir este registro?';
  if (!confirm(aviso)) return;
  try {
    await deleteDoc(doc(db, colecao, id));
    if (tipo==='plantio') {
      plantios.splice(plantios.findIndex(x=>x.id===id),1);
      await removerColheitasDoPlantio(id); // remove colheitas vinculadas
    }
    if (tipo==='adubacao') adubacoes.splice(adubacoes.findIndex(x=>x.id===id),1);
    if (tipo==='colheita') colheitas.splice(colheitas.findIndex(x=>x.id===id),1);
    toast('Registro excluído.');
    renderSubabaCaderno();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

// ══════════════ IMPORTAR / EXPORTAR PLANEJAMENTO (Excel) ══════════════
// Converte a data vinda do Excel para o padrão ISO AAAA-MM-DD.
// Trata: número serial do Excel (ex: 46305), DD/MM/AAAA, AAAA-MM-DD (com/sem aspa), Date.
function normalizarDataExcel(v) {
  if (v == null || v === '') return '';
  // Já é objeto Date
  if (v instanceof Date && !isNaN(v)) {
    return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  }
  // Número serial do Excel (dias desde 1899-12-30)
  if (typeof v === 'number' || (/^\d+(\.\d+)?$/.test(String(v).trim()))) {
    const n = parseFloat(v);
    if (n > 20000 && n < 90000) { // faixa razoável de datas
      const d = new Date(Math.round((n - 25569) * 86400 * 1000)); // 25569 = dias entre 1900 e 1970
      if (!isNaN(d)) return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
    }
  }
  let s = String(v).trim().replace(/'/g,''); // remove aspa que o Excel adiciona
  // AAAA-MM-DD (aceita / ou -)
  let m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
  if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  // DD/MM/AAAA (aceita / ou -)
  m = s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return s; // devolve como veio se não reconhecer
}

window.importarPlanilha = function(input, tipo) {
  const file = input.files[0];
  if (!file) return;
  const m = MODELOS_CADERNO[tipo];
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try {
      const wb = XLSX.read(ev.target.result, { type: 'array', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const linhas = XLSX.utils.sheet_to_json(ws, { defval: '', raw: false });
      if (linhas.length === 0) { toast('Planilha vazia.','erro'); input.value=''; return; }
      let importados = 0, ignorados = 0;
      const batch = writeBatch(db);
      const novosLocais = [];

      if (tipo === 'solido' || tipo === 'pulverizacao') {
        // Agrupa linhas por fazenda+talhão+data+vazão+safra+regra -> uma aplicação com vários produtos.
        // A categoria fica em cada produto (uma aplicação pode ter herbicida, inseticida, óleo...).
        const grupos = {};
        linhas.forEach(row => {
          const reg = m.doExcel(row);
          if (!reg.fazenda || !reg.talhao || !reg.produto) { ignorados++; return; }
          const md = reg.modo_data||'fixa';
          const k = [normalizar(reg.fazenda), normalizar(reg.talhao), reg.data||'', normalizar(reg.vazao||''), normalizar(reg.safra||''), md, reg.dias_apos||0].join('||');
          if (!grupos[k]) {
            grupos[k] = {
              data: reg.data, fazenda: reg.fazenda, talhao: reg.talhao, safra: reg.safra,
              vazao: reg.vazao||'', tipo_aplicacao: reg.tipo_aplicacao,
              obs: reg.obs||'', categoria: reg.categoria||'',
              produtos: [], status: 'planejado', criado_em: Timestamp.now(),
              modo_data: md, dias_apos: reg.dias_apos||0
            };
          }
          grupos[k].produtos.push({ produto: reg.produto, dose: reg.dose||0, unidade: reg.unidade||'', categoria: reg.categoria||'' });
        });
        Object.values(grupos).forEach(g => {
          // Datas relativas: calcula a data a partir do plantio (DAP) ou da 1ª aplicação (DAA) do mesmo talhão
          if (g.modo_data === 'plantio') {
            const pRef = plantios.find(p => normalizar(p.fazenda)===normalizar(g.fazenda) && normalizar(p.talhao)===normalizar(g.talhao));
            if (pRef && pRef.data) { g.data = somarDias(dataBasePlantio(pRef), g.dias_apos); g.ref_plantio_id = pRef.id; }
          } else if (g.modo_data === 'aplicacao') {
            const aRef = adubacoes
              .filter(a => normalizar(a.fazenda)===normalizar(g.fazenda) && normalizar(a.talhao)===normalizar(g.talhao) && a.data)
              .sort((x,y)=>(x.data||'').localeCompare(y.data||''))[0];
            if (aRef) { g.data = somarDias(aRef.data, g.dias_apos); g.ref_aplicacao_id = aRef.id; }
          }
          // mantém produto/dose/unidade/categoria da 1ª linha para compatibilidade
          g.produto = g.produtos[0].produto;
          g.dose = g.produtos[0].dose;
          g.unidade = g.produtos[0].unidade;
          g.categoria = g.produtos[0].categoria || g.categoria;
          const ref = doc(collection(db, m.colecao));
          batch.set(ref, g);
          novosLocais.push({ id: ref.id, ...g });
          importados++;
        });
      } else {
        // Plantio / colheita: uma linha = um registro
        linhas.forEach(row => {
          const reg = m.doExcel(row);
          const faltando = m.obrigatorios.some(campo => !reg[campo]);
          if (faltando) { ignorados++; return; }
          const ref = doc(collection(db, m.colecao));
          batch.set(ref, reg);
          novosLocais.push({ id: ref.id, ...reg });
          importados++;
        });
      }

      if (importados === 0) { toast('Nenhuma linha válida encontrada — confira as colunas obrigatórias.','erro'); input.value=''; return; }
      await batch.commit();
      if (tipo==='plantio') {
        plantios.unshift(...novosLocais);
        // gera as colheitas de cada plantio importado
        for (const p of novosLocais) { await sincronizarColheitasDoPlantio(p); }
      }
      if (tipo==='solido' || tipo==='pulverizacao') adubacoes.unshift(...novosLocais);
      if (tipo==='colheita') colheitas.unshift(...novosLocais);
      const msgAgrup = (tipo==='solido'||tipo==='pulverizacao') ? ' (linhas do mesmo talhão/data/vazão agrupadas numa aplicação)' : '';
      toast(`${importados} registro(s) importado(s)${msgAgrup}${ignorados>0?`, ${ignorados} ignorado(s)`:''}.`);
      renderSubabaCaderno();
    } catch(e) { toast('Erro ao importar: '+e.message,'erro'); }
    input.value = '';
  };
  reader.readAsArrayBuffer(file);
};

window.exportarCaderno = function(tipo) {
  const m = MODELOS_CADERNO[tipo];
  const lista = m.lista();
  if (lista.length === 0) { toast('Nada para exportar.','erro'); return; }
  try {
    const linhas = lista.map(m.paraExportar);
    const ws = XLSX.utils.json_to_sheet(linhas);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, tipo.substring(0,31));
    XLSX.writeFile(wb, `ACF_${tipo}_${hoje()}.xlsx`);
    toast('Excel gerado!');
  } catch(e) { toast('Erro ao exportar: '+e.message,'erro'); }
};

window.gerarRelatorio = function(tipo) {
  const el = document.getElementById('resultado-relatorio');
  let html = '';
  switch(tipo) {
    case 'custo_talhao': {
      // MELHORIA 7: custo por hectare
      const mapa = {};
      retiradas.forEach(r => {
        const k = `${r.fazenda} / ${r.talhao||'(sem talhão)'}`;
        if (!mapa[k]) mapa[k] = { custo:0, qtd:0, fazenda:r.fazenda, talhao:r.talhao };
        mapa[k].qtd++; mapa[k].custo += r.custo_total||0;
      });
      const rows = Object.entries(mapa).sort((a,b)=>b[1].custo-a[1].custo).map(([k,v]) => {
        const t = talhoes.find(t => normalizar(t.nome) === normalizar(v.talhao||'') && normalizar(t.fazenda||'') === normalizar(v.fazenda||''));
        const area = t ? parseFloat(t.area_ha)||0 : 0;
        const custoHa = area > 0 ? v.custo/area : null;
        return [k, v.qtd, area>0?fmt(area)+' ha':'—', `R$ ${fmt(v.custo)}`, custoHa!==null?`R$ ${fmt(custoHa)}/ha`:'—'];
      });
      html = tabelaRelatorio('🌾 Custo por Talhão', ['Fazenda / Talhão','Registros','Área','Custo Total','Custo/ha'], rows,
        `Total: R$ ${fmt(retiradas.reduce((s,r)=>s+(r.custo_total||0),0))}`);
      relatorioAtual = { titulo:'Custo_por_Talhao', colunas:['Fazenda/Talhão','Registros','Área (ha)','Custo Total (R$)','Custo/ha (R$)'], rows };
      break;
    }
    case 'custo_safra': {
      const mapa = {};
      retiradas.forEach(r => {
        const k = r.safra||'(sem safra)';
        if (!mapa[k]) mapa[k] = { custo:0, qtd:0 };
        mapa[k].custo += r.custo_total||0; mapa[k].qtd++;
      });
      const rows = Object.entries(mapa).sort((a,b)=>b[1].custo-a[1].custo).map(([k,v]) => [k, v.qtd, `R$ ${fmt(v.custo)}`]);
      html = tabelaRelatorio('📅 Custo por Safra', ['Safra','Retiradas','Custo Total'], rows,
        `Total: R$ ${fmt(Object.values(mapa).reduce((s,v)=>s+v.custo,0))}`);
      relatorioAtual = { titulo:'Custo_por_Safra', colunas:['Safra','Retiradas','Custo Total (R$)'], rows };
      break;
    }
    case 'custo_cultura': {
      const mapa = {};
      retiradas.forEach(r => {
        const k = r.cultura||'(sem cultura)';
        if (!mapa[k]) mapa[k] = { custo:0, qtd:0 };
        mapa[k].custo += r.custo_total||0; mapa[k].qtd++;

        });
      });
      html = rows.length === 0
        ? `<div class="relatorio-resultado"><div style="text-align:center;padding:40px;color:var(--cinza)">✅ Nenhum pedido em aberto!</div></div>`
        : tabelaRelatorio('📋 Pedidos em Aberto', ['Fornecedor','Produto','Pedido','Recebido','Pendente'], rows);
      relatorioAtual = { titulo:'Pedidos_em_Aberto', colunas:['Fornecedor','Produto','Pedido','Recebido','Pendente'], rows };
      break;
    }
    case 'contas_vencer': {
      const pend = contas.filter(c => !c.pago);
      const rows = pend.map(c => [c.fornecedor||'—', c.descricao||'—', `R$ ${fmt(c.valor_total)}`, fmtData(c.vencimento),
        diasAte(c.vencimento)<0?'Vencida':diasAte(c.vencimento)<=7?`Em ${diasAte(c.vencimento)}d ⚠️`:`Em ${diasAte(c.vencimento)}d`]);
      html = tabelaRelatorio('💸 Contas a Pagar — Pendentes', ['Fornecedor','Descrição','Valor','Vencimento','Situação'], rows,
        `Total Pendente: R$ ${fmt(pend.reduce((s,c)=>s+(c.valor_total||0),0))}`);
      relatorioAtual = { titulo:'Contas_a_Vencer', colunas:['Fornecedor','Descrição','Valor (R$)','Vencimento','Situação'], rows };
      break;
    }
    case 'estoque_valor': {
      const rows = [...estoque].sort((a,b)=>(b.quantidade*b.custo_medio)-(a.quantidade*a.custo_medio))
        .map(e => [e.produto, fmt(e.quantidade), e.unidade, `R$ ${fmt(e.custo_medio||0)}`, `R$ ${fmt((e.quantidade||0)*(e.custo_medio||0))}`]);
      html = tabelaRelatorio('📦 Estoque Atual — Valor', ['Produto','Quantidade','Un','Custo Médio','Valor Total'], rows,
        `Valor Total: R$ ${fmt(estoque.reduce((s,e)=>s+(e.quantidade||0)*(e.custo_medio||0),0))}`);
      relatorioAtual = { titulo:'Estoque_Valor', colunas:['Produto','Quantidade','Unidade','Custo Médio (R$)','Valor Total (R$)'], rows };
      break;
    }
    case 'custo_fazenda': {
      const mapa = {};
      retiradas.forEach(r => {
        if (!mapa[r.fazenda]) mapa[r.fazenda] = { custo:0, qtd:0 };
        mapa[r.fazenda].custo += r.custo_total||0; mapa[r.fazenda].qtd++;
      });
      // custo/ha por fazenda usando soma das áreas dos talhões
      const rows = Object.entries(mapa).sort((a,b)=>b[1].custo-a[1].custo).map(([k,v]) => {
        const areaFaz = talhoes.filter(t=>normalizar(t.fazenda||'')===normalizar(k)).reduce((s,t)=>s+(parseFloat(t.area_ha)||0),0);
        return [k, v.qtd, areaFaz>0?fmt(areaFaz)+' ha':'—', `R$ ${fmt(v.custo)}`, areaFaz>0?`R$ ${fmt(v.custo/areaFaz)}/ha`:'—'];
      });
      html = tabelaRelatorio('🏡 Custo por Fazenda', ['Fazenda','Retiradas','Área Total','Custo Total','Custo/ha'], rows,
        `Total: R$ ${fmt(Object.values(mapa).reduce((s,v)=>s+v.custo,0))}`);
      relatorioAtual = { titulo:'Custo_por_Fazenda', colunas:['Fazenda','Retiradas','Área Total (ha)','Custo Total (R$)','Custo/ha (R$)'], rows };
      break;
    }
  }
  el.innerHTML = html;
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
};

function tabelaRelatorio(titulo, colunas, rows, rodape) {
  return `
    <div class="relatorio-resultado">
      <div class="relatorio-resultado-titulo">
        ${titulo}
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary btn-sm" onclick="exportarRelatorioAtual()">📥 Excel</button>
          <button class="btn btn-secondary btn-sm" onclick="document.getElementById('resultado-relatorio').innerHTML=''">✕</button>
        </div>
      </div>
      ${rows.length === 0 ? '<div style="text-align:center;padding:30px;color:var(--cinza)">Nenhum dado para exibir.</div>' : `
      <div class="tabela-wrap"><table>
        <thead><tr>${colunas.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
        <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
        ${rodape ? `<tfoot><tr><td colspan="${colunas.length}" style="padding:12px 16px;font-weight:700;background:var(--creme)">${rodape}</td></tr></tfoot>` : ''}
      </table></div>`}
    </div>`;
}

// ── MELHORIA 3: EXPORTAR EXCEL ──
window.exportarRelatorioAtual = function() {
  if (!relatorioAtual.rows.length) { toast('Nada para exportar.','erro'); return; }
  // limpar formatação (R$, badges html) para o Excel
  const rowsLimpos = relatorioAtual.rows.map(r => r.map(c => {
    if (typeof c !== 'string') return c;
    const semHtml = c.replace(/<[^>]*>/g,'').trim();
    const num = semHtml.replace('R$','').trim().replace(/\./g,'').replace(',','.');
    return semHtml.startsWith('R$') && !isNaN(parseFloat(num)) ? parseFloat(num) : semHtml;
  }));
  exportarExcel(relatorioAtual.titulo, relatorioAtual.colunas, rowsLimpos);
};

function exportarExcel(nome, colunas, rows) {
  try {
    const ws = XLSX.utils.aoa_to_sheet([colunas, ...rows]);
    ws['!cols'] = colunas.map((c,i) => ({ wch: Math.max(c.length+2, ...rows.map(r=>String(r[i]||'').length+2), 10) }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, nome.substring(0,31));
    XLSX.writeFile(wb, `ACF_${nome}_${hoje()}.xlsx`);
    toast('Excel gerado!');
  } catch(e) { toast('Erro ao gerar Excel: '+e.message,'erro'); }
}

window.fecharModal = function(id) { document.getElementById(id)?.remove(); };
</script>
