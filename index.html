// Dose digitada → recalcula o Total (dose × área)
window.recalcularTotalProduto = function(i, silencioso) {
  const cont = document.getElementById('ad-produtos-lista');
  if (!cont) return;
  const linha = cont.querySelectorAll('.ad-prod-linha')[i];
  if (!linha) return;
  const area = areaTalhaoModalAplic();
  const dose = parseFloat(linha.querySelector('.ad-prod-dose').value)||0;
  const campoTotal = linha.querySelector('.ad-prod-total');
  if (area > 0 && dose > 0) {
    campoTotal.value = +(dose * area).toFixed(2);
    campoTotal.placeholder = 'Total';
  } else if (!silencioso) {
    campoTotal.placeholder = area>0 ? 'Total' : 'sem área';
  }
};

// Total digitado (arredondado) → recalcula a Dose (total ÷ área). A dose ajustada vira a oficial.
window.recalcularDoseProduto = function(i) {
  const cont = document.getElementById('ad-produtos-lista');
  if (!cont) return;
  const linha = cont.querySelectorAll('.ad-prod-linha')[i];
  if (!linha) return;
  const area = areaTalhaoModalAplic();
  const total = parseFloat(linha.querySelector('.ad-prod-total').value)||0;
  const campoDose = linha.querySelector('.ad-prod-dose');
  if (area > 0 && total > 0) {
    campoDose.value = +(total / area).toFixed(4);
  }
};

// Lê o que está nos inputs de volta para window._adProdutos (para não perder ao adicionar/remover)
function coletarLinhasProduto() {
  const cont = document.getElementById('ad-produtos-lista');
  if (!cont) return;
  const linhas = [];
  cont.querySelectorAll('.ad-prod-linha').forEach(div => {
    linhas.push({
      produto: div.querySelector('.ad-prod-nome').value.trim(),
      dose: div.querySelector('.ad-prod-dose').value,
      unidade: div.querySelector('.ad-prod-unidade').value,
      total: div.querySelector('.ad-prod-total').value
    });
  });
  window._adProdutos = linhas;
}

window.recalcularTotaisTodos = function() {
  const cont = document.getElementById('ad-produtos-lista');
  if (!cont) return;
  cont.querySelectorAll('.ad-prod-linha').forEach((_,i)=>recalcularTotalProduto(i));
};

window.moverLinhaProduto = function(i, dir) {
  coletarLinhasProduto();
  const j = i + dir;
  if (j < 0 || j >= window._adProdutos.length) return;
  const tmp = window._adProdutos[i];
  window._adProdutos[i] = window._adProdutos[j];
  window._adProdutos[j] = tmp;
  renderLinhasProduto();
};

window.adicionarLinhaProduto = function() {
  coletarLinhasProduto();
  window._adProdutos.push({produto:'',dose:'',unidade:UNIDADES[0]});
  renderLinhasProduto();
};

window.removerLinhaProduto = function(i) {
  coletarLinhasProduto();
  window._adProdutos.splice(i,1);
  if (window._adProdutos.length === 0) window._adProdutos.push({produto:'',dose:'',unidade:UNIDADES[0]});
  renderLinhasProduto();
};

window.salvarAdubacao = async function(id) {
  const fazenda = document.getElementById('ad-fazenda').value;
  const talhao = document.getElementById('ad-talhao').value;
  // Coleta a lista de produtos e valida
  coletarLinhasProduto();
  const produtos = (window._adProdutos||[])
    .map(p => ({ produto: (p.produto||'').trim(), dose: parseFloat(p.dose)||0, unidade: p.unidade||'' }))
    .filter(p => p.produto);
  if (!fazenda || !talhao || produtos.length === 0) { toast('Preencha fazenda, talhão e ao menos um produto.','erro'); return; }

  const modo_data = document.getElementById('ad-modo-data').value;
  let dataFinal = '', ref_plantio_id = '', ref_aplicacao_id = '', dias_apos = 0;
  if (modo_data === 'fixa') {
    dataFinal = document.getElementById('ad-data')?.value || '';
    if (!dataFinal) { toast('Informe a data.','erro'); return; }
  } else if (modo_data === 'plantio') {
    ref_plantio_id = document.getElementById('ad-ref-plantio')?.value || '';
    dias_apos = parseFloat(document.getElementById('ad-dias-apos')?.value)||0;
    const pRef = plantios.find(p=>p.id===ref_plantio_id);
    if (!pRef) { toast('Selecione o plantio de referência.','erro'); return; }
    dataFinal = somarDias(pRef.data, dias_apos);
  } else if (modo_data === 'aplicacao') {
    ref_aplicacao_id = document.getElementById('ad-ref-aplicacao')?.value || '';
    dias_apos = parseFloat(document.getElementById('ad-dias-apos')?.value)||0;
    const aRef = adubacoes.find(x=>x.id===ref_aplicacao_id);
    if (!aRef) { toast('Selecione a aplicação de referência.','erro'); return; }
    dataFinal = somarDias(aRef.data, dias_apos);
  } else if (modo_data === 'pulv_anterior') {
    dias_apos = parseFloat(document.getElementById('ad-dias-apos')?.value)||0;
    // encontra a pulverização anterior (por data) no mesmo talhão; se não houver, deixa a data em branco (recalcula depois)
    const dataRefAnterior = dataPulvAnterior(fazenda, talhao, id, '');
    dataFinal = dataRefAnterior ? somarDias(dataRefAnterior, dias_apos) : '';
    if (!dataFinal) toast('Sem pulverização anterior ainda — crie a anterior e use o botão 🔄 para calcular.', 'aviso');
  }

  const tipo_aplicacao = document.getElementById('ad-tipo')?.value || 'solido';
  const reg = {
    data: dataFinal, fazenda, talhao,
    safra: document.getElementById('ad-safra').value, categoria: document.getElementById('ad-categoria').value,
    // Formato novo: lista de produtos. Mantém produto/dose/unidade do 1º p/ compatibilidade.
    produtos,
    produto: produtos[0].produto, dose: produtos[0].dose, unidade: produtos[0].unidade,
    obs: document.getElementById('ad-obs').value,
    modo_data, ref_plantio_id, ref_aplicacao_id, dias_apos,
    tipo_aplicacao,
    vazao: tipo_aplicacao === 'pulverizacao' ? (document.getElementById('ad-vazao')?.value.trim() || '') : ''
  };
  try {
    if (id) {
      // Master pode alterar o status. Ajusta campos ligados ao status.
      const novoStatus = document.getElementById('ad-status')?.value;
      const a0 = adubacoes.find(x=>x.id===id) || {};
      const statusAnterior = a0.status;
      if (novoStatus) {
        reg.status = novoStatus;
        if (novoStatus === 'concluido' && !a0.data_conclusao) reg.data_conclusao = hoje();
        if (novoStatus === 'execucao' && !a0.iniciado_em) reg.iniciado_em = Timestamp.now();
        // volta para planejado limpa timestamps de execução/conclusão
        if (novoStatus === 'planejado') { reg.iniciado_em = null; reg.data_conclusao = ''; }
      }
      await updateDoc(doc(db,'insumos_campo_adubacao',id), reg);
      const i = adubacoes.findIndex(x=>x.id===id);
      if (i>=0) adubacoes[i] = { ...adubacoes[i], ...reg };
      // Sincroniza a baixa de estoque com a mudança de status
      const aAtual = adubacoes.find(x=>x.id===id);
      if (novoStatus === 'concluido' && statusAnterior !== 'concluido') {
        const baixa = await baixarEstoquePorAplicacao(aAtual);
        if (baixa.ok) toast('Registro atualizado! Estoque baixado.');
        else toast(`Atualizado, mas estoque NÃO baixado: ${baixa.motivo}.`, 'erro');
      } else if (novoStatus && novoStatus !== 'concluido' && statusAnterior === 'concluido') {
        await reverterBaixaAplicacao(aAtual);
        toast('Registro atualizado! Baixa de estoque revertida.');
      } else {
        toast('Registro atualizado!');
      }
    } else {
      reg.status = 'planejado'; reg.criado_em = Timestamp.now();
      const ref = await addDoc(collection(db,'insumos_campo_adubacao'), reg);
      adubacoes.unshift({id: ref.id, ...reg});
      toast('Planejamento salvo!');
    }
    fecharModal('modal-adubacao');
    // Se for pulverização, recalcula a cadeia DAA do talhão (propaga Fung1→Fung2→Fung3...)
    if (tipo_aplicacao === 'pulverizacao') {
      await recalcularCadeiaDAA(fazenda, talhao);
    }
    renderSubabaCaderno();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

// Encontra a DATA da pulverização imediatamente anterior (por data) no mesmo talhão.
// Considera só pulverizações; ignora a própria aplicação (idAtual) e as sem data.
// dataLimite (opcional) = considerar só pulverizações ANTES desta data; se vazio, pega a última de todas.
function dataPulvAnterior(fazenda, talhao, idAtual, dataLimite) {
  const cands = adubacoes
    .filter(x => tipoDaAdubacao(x)==='pulverizacao'
      && normalizar(x.fazenda||'')===normalizar(fazenda)
      && normalizar(x.talhao||'')===normalizar(talhao)
      && x.id !== idAtual
      && x.data)
    .map(x => String(x.data).slice(0,10))
    .filter(d => !dataLimite || d < dataLimite)
    .sort((a,b)=> a.localeCompare(b));
  return cands.length ? cands[cands.length-1] : '';
}

// Extrai um número da categoria/descrição (ex: "Fungicida 3" -> 3) para ordenar a sequência.
function numeroCategoria(a) {
  const m = normalizar(a.categoria||'').match(/(\d+)/);
  return m ? parseInt(m[1]) : null;
}

// Recalcula toda a cadeia DAA de um talhão. Cada pulverização "pulv_anterior" conta a partir da
// pulverização imediatamente anterior NA SEQUÊNCIA (ordenada por: data conhecida → número da
// categoria → ordem de criação). Isso funciona mesmo quando as datas ainda estão vazias.
async function recalcularCadeiaDAA(fazenda, talhao) {
  for (let passada=0; passada<12; passada++) {
    let mudou = false;
    // sequência ordenada de TODAS as pulverizações do talhão
    const seq = adubacoes
      .filter(a => tipoDaAdubacao(a)==='pulverizacao'
        && normalizar(a.fazenda||'')===normalizar(fazenda)
        && normalizar(a.talhao||'')===normalizar(talhao))
      .map((a, ordemCriacao) => ({ a, ordemCriacao }))
      .sort((x, y) => {
        // 1º critério: quem já tem data vai pela data
        const dx = x.a.data ? String(x.a.data).slice(0,10) : '';
        const dy = y.a.data ? String(y.a.data).slice(0,10) : '';
        if (dx && dy && dx !== dy) return dx.localeCompare(dy);
        if (dx && !dy) return -1;
        if (!dx && dy) return 1;
        // 2º critério: número da categoria (Fungicida 1 < Fungicida 2 < ...)
        const nx = numeroCategoria(x.a), ny = numeroCategoria(y.a);
        if (nx != null && ny != null && nx !== ny) return nx - ny;
        if (nx != null && ny == null) return -1;
        if (nx == null && ny != null) return 1;
        // 3º critério: ordem de criação
        return x.ordemCriacao - y.ordemCriacao;
      })
      .map(o => o.a);

    // cada pulv_anterior aponta para o item ANTERIOR na sequência que já tenha data
    for (let i = 0; i < seq.length; i++) {
      const a = seq[i];
      if (a.modo_data !== 'pulv_anterior') continue;
      // acha o anterior (i-1, i-2...) que tenha data
      let ref = '';
      for (let j = i-1; j >= 0; j--) {
        if (seq[j].data) { ref = String(seq[j].data).slice(0,10); break; }
      }
      if (ref) {
        const nova = somarDias(ref, a.dias_apos||0);
        if (nova && nova !== a.data) {
          try { await updateDoc(doc(db,'insumos_campo_adubacao',a.id), { data: nova }); a.data = nova; mudou = true; } catch(e){}
        }
      }
    }
    if (!mudou) break; // estabilizou
  }
}

// Recalcula a data de um item "X dias após..." com base no valor atual da referência
// (útil se a data do plantio ou da aplicação-base mudou depois que este item foi criado)
window.recalcularDataAdubacao = async function(id) {
  const a = adubacoes.find(x=>x.id===id);
  if (!a || !a.modo_data || a.modo_data==='fixa') return;
  let novaData = a.data;
  if (a.modo_data==='plantio') {
    const p = plantios.find(x=>x.id===a.ref_plantio_id);
    if (!p) { toast('Plantio de referência não encontrado (pode ter sido excluído).','erro'); return; }
    novaData = somarDias(p.data, a.dias_apos);
  } else if (a.modo_data==='aplicacao') {
    const ref = adubacoes.find(x=>x.id===a.ref_aplicacao_id);
    if (!ref) { toast('Aplicação de referência não encontrada (pode ter sido excluída).','erro'); return; }
    novaData = somarDias(ref.data, a.dias_apos);
  } else if (a.modo_data==='pulv_anterior') {
    // recalcula a cadeia inteira do talhão (propaga Fung1→Fung2→Fung3...) e re-renderiza
    await recalcularCadeiaDAA(a.fazenda, a.talhao);
    toast('Cadeia de datas recalculada.');
    renderSubabaCaderno();
    return;
  }
  if (novaData === a.data) { toast('A data já está atualizada.'); return; }
  try {
    await updateDoc(doc(db,'insumos_campo_adubacao',id), { data: novaData });
    a.data = novaData;
    toast('Data recalculada para '+novaData);
    renderSubabaCaderno();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

// (substituída por liberarParaCampo — execução agora é interna)
// Libera a aplicação para execução no modo Aplicações (deste mesmo app).
// Não depende mais do AgroOp — muda o status para 'enviado_operador',
// que é o estado "pendente de execução" que o modo Aplicações mostra.
window.liberarParaCampo = async function(id) {
  const a = adubacoes.find(x=>x.id===id);
  if (!a) return;
  if (!confirm(`Liberar "${a.produto}" (${a.talhao}) para execução no campo?`)) return;
  try {
    await updateDoc(doc(db,'insumos_campo_adubacao',id), { status: 'enviado_operador' });
    a.status = 'enviado_operador';
    toast('Liberado! Já aparece no modo Aplicações para o operador executar.');
    renderSubabaCaderno();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

// Concluir sem passar pelo operador (ex: já foi feito, só registrando)
// Baixa retroativa: para aplicações concluídas antes da baixa automática existir
window.baixarEstoqueRetroativo = async function(id) {
  const a = adubacoes.find(x=>x.id===id);
  if (!a) return;
  if (a.estoque_baixado) { toast('Estoque desta aplicação já foi baixado.'); return; }
  const areaHa = areaDoTalhao(a.fazenda, a.talhao);
  const qtd = (parseFloat(a.dose)||0) * areaHa;
  if (!confirm(`Baixar do estoque ${fmt(qtd)} ${a.unidade||''} de "${a.produto}" (${fmt(a.dose)} ${a.unidade||''}/ha × ${fmt(areaHa)} ha em ${a.talhao})?`)) return;
  const baixa = await baixarEstoquePorAplicacao(a);
  if (baixa.ok) toast('Estoque baixado!' + (baixa.semCadastro ? ' (produto sem entrada no estoque — retirada registrada mesmo assim)' : ''));
  else toast(`Não foi possível baixar: ${baixa.motivo}.`, 'erro');
  renderSubabaCaderno();
};

window.concluirDireto = async function(id) {
  const data_conclusao = prompt('Data de conclusão (DD/MM/AAAA ou deixe vazio para hoje):','');
  const dataFinal = data_conclusao ? data_conclusao : hoje();
  try {
    await updateDoc(doc(db,'insumos_campo_adubacao',id), { status: 'concluido', data_conclusao: dataFinal });
    const a = adubacoes.find(x=>x.id===id);
    if (a) { a.status='concluido'; a.data_conclusao=dataFinal; }
    // Baixa automática de estoque
    const baixa = a ? await baixarEstoquePorAplicacao(a) : { ok: false, motivo: 'registro não encontrado' };
    if (baixa.ok) toast('Registrado como concluído! Estoque baixado.' + (baixa.semCadastro ? ' (produto sem entrada no estoque)' : ''));
    else toast(`Concluído, mas estoque NÃO baixado: ${baixa.motivo}.`, 'erro');
    renderSubabaCaderno();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

// ══════════════ PAINEL POR TALHÃO (usa o filtro de safra global do caderno) ══════════════
function renderPainelTalhoes() {
  const el = document.getElementById('caderno-conteudo');
  el.innerHTML = `
    <div class="sec-header">
      <div style="font-size:14px;color:var(--cinza)">Situação de cada talhão — plantio, aplicações e colheita${cadernoSafra?` · safra ${cadernoSafra}`:' · todas as safras'}</div>
    </div>
    <div id="painel-talhoes-lista"></div>`;
  renderListaTalhoes();
}

function filtraSafra(r) { return filtroCadernoSafra(r); }

function renderListaTalhoes() {
  const cont = document.getElementById('painel-talhoes-lista');
  if (!cont) return;

  // Monta a lista de talhões: usa o cadastro; se vazio, deriva dos registros
  let unidades = talhoes.map(t => ({ nome: t.nome, fazenda: t.fazenda||'', area_ha: parseFloat(t.area_ha)||0 }));
  if (unidades.length === 0) {
    const chaves = new Set();
    [...plantios, ...adubacoes, ...colheitas].forEach(r => { if (r.talhao) chaves.add(`${r.fazenda||''}||${r.talhao}`); });
    unidades = [...chaves].map(k => { const [f,n] = k.split('||'); return { nome:n, fazenda:f, area_ha:0 }; });
  }

  // Para cada talhão, coleta os eventos filtrados pela safra
  const cards = unidades.map((u, idx) => {
    const mesmoTalhao = (r) => normalizar(r.talhao||'') === normalizar(u.nome) &&
      (!u.fazenda || normalizar((r.fazenda||'').replace('Fazenda ','')) === normalizar(u.fazenda));
    const pls = plantios.filter(r => mesmoTalhao(r) && filtraSafra(r));
    const aps = adubacoes.filter(r => mesmoTalhao(r) && filtraSafra(r));
    const cols = colheitas.filter(r => mesmoTalhao(r) && filtraSafra(r));
    const totalEventos = pls.length + aps.length + cols.length;
    if (totalEventos === 0) return ''; // não mostra talhão sem nada na safra filtrada

    // Contadores de status das aplicações
    const nPlan = aps.filter(a => a.status==='planejado').length;
    const nLib = aps.filter(a => a.status==='enviado_operador').length;
    const nExec = aps.filter(a => a.status==='execucao').length;
    const nConc = aps.filter(a => a.status==='concluido').length;

    const cardId = `talhao-card-${idx}`;
    return `
      <div class="talhao-card" id="${cardId}">
        <div class="talhao-head" onclick="toggleTalhaoCard('${cardId}')">
          <div>
            <div class="talhao-nome">${u.fazenda?u.fazenda+' · ':''}${u.nome}${u.area_ha>0?` <span class="talhao-area">${fmt(u.area_ha)} ha</span>`:''}</div>
            <div class="talhao-resumo">
              ${pls.length?`<span>🌱 ${pls.length} plantio(s)</span>`:''}
              ${aps.length?`<span>🧪 ${aps.length} aplic.</span>`:''}
              ${cols.length?`<span>🌾 ${cols.length} colheita(s)</span>`:''}
            </div>
          </div>
          <div class="talhao-badges">
            ${nPlan?`<span class="tb tb-plan">${nPlan} plan.</span>`:''}
            ${nLib?`<span class="tb tb-lib">${nLib} liberada(s)</span>`:''}
            ${nExec?`<span class="tb tb-exec">${nExec} em exec.</span>`:''}
            ${nConc?`<span class="tb tb-conc">${nConc} concl.</span>`:''}
            <span class="talhao-seta">▾</span>
          </div>
        </div>
        <div class="talhao-detalhes">
          ${blocoEventoTalhao('🌱 Plantio', [...pls].sort((a,b)=>(a.data||'').localeCompare(b.data||'')).map(p => ({
            dataPlan: p.data,
            dataExec: p.status==='concluido'?(p.data_conclusao||''):'',
            produtos: (()=>{ const cs=cultivaresDoPlantio(p); return cs.length?cs.map(c=>({nome:`${p.cultura||'Plantio'}${c.cultivar?` — ${c.cultivar}`:''}`, dose:c.ciclo_dias?`ciclo ${fmt(c.ciclo_dias)}d`:''})):[{nome:p.cultura||'Plantio',dose:''}]; })(),
            status: p.status
          })))}
          ${blocoEventoTalhao('🧪 Aplicações', [...aps].sort((a,b)=>(a.data||'').localeCompare(b.data||'')).map(a => ({
            dataPlan: a.data,
            dataExec: a.status==='concluido'?(a.data_conclusao||''):'',
            produtos: produtosDaAplicacao(a).map(p=>({nome:p.produto||'—', dose:p.dose?`${fmt(p.dose)} ${p.unidade||''}/ha`:''})),
            descricao: [tipoDaAdubacao(a)==='pulverizacao'?'💧 pulveriz.':'🪨 sólido', a.categoria||''].filter(Boolean).join(' · '),
            status: a.status
          })))}
          ${blocoEventoTalhao('🌾 Colheita', [...cols].sort((a,b)=>(a.data||'').localeCompare(b.data||'')).map(c => ({
            dataPlan: c.data,
            dataExec: c.status==='concluido'?(c.data_conclusao||''):'',
            produtos: [{nome:`${c.cultura||'Colheita'}${c.cultivar?` — ${c.cultivar}`:''}`, dose: c.status==='concluido'&&c.produtividade?`${fmt(c.produtividade)} ${c.unidade_produtividade||'sc/ha'}`:''}],
            status: c.status
          })))}
        </div>
      </div>`;
  }).filter(Boolean).join('');

  cont.innerHTML = cards || `<div style="text-align:center;padding:48px 16px;color:var(--cinza)"><div style="font-size:34px;opacity:.35;margin-bottom:8px">📍</div>Nenhum evento para a safra selecionada</div>`;
}

// Bloco de uma categoria de evento (tabela: Data Plan. | Data Exec. | Produtos/doses | Status)
function blocoEventoTalhao(titulo, eventos) {
  if (!eventos.length) return '';
  const linhas = eventos.map(e => {
    const prodTab = e.produtos && e.produtos.length
      ? `<table class="prod-dose-mini">${e.produtos.map(p=>`<tr><td class="pd-nome">${p.nome}</td><td class="pd-dose">${p.dose||''}</td></tr>`).join('')}</table>`
      : '';
    return `<div class="te-item">
      <div class="te-topo">
        <div class="te-datas">
          <span><span class="te-lbl">Plan.</span> ${fmtDataBR(e.dataPlan)}</span>
          ${e.dataExec?`<span><span class="te-lbl">Exec.</span> ${fmtDataBR(e.dataExec)}</span>`:''}
        </div>

  try {

};

// ══════════════ IMPORTAR / EXPORTAR PLANEJAMENTO (Excel) ══════════════
// Converte a data vinda do Excel para o padrão ISO AAAA-MM-DD.
// Trata: número serial do Excel (ex: 46305), DD/MM/AAAA, AAAA-MM-DD (com/sem aspa), Date.
function normalizarDataExcel(v) {
  if (v == null || v === '') return '';
  // Já é objeto Date
  if (v instanceof Date && !isNaN(v)) {
    return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  }
  // Número serial do Excel (dias desde 1899-12-30)
  if (typeof v === 'number' || (/^\d+(\.\d+)?$/.test(String(v).trim()))) {
    const n = parseFloat(v);
    if (n > 20000 && n < 90000) { // faixa razoável de datas
      const d = new Date(Math.round((n - 25569) * 86400 * 1000)); // 25569 = dias entre 1900 e 1970
      if (!isNaN(d)) return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
    }
  }
  let s = String(v).trim().replace(/'/g,''); // remove aspa que o Excel adiciona
  // AAAA-MM-DD (aceita / ou -)
  let m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
  if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  // DD/MM/AAAA (aceita / ou -)
  m = s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return s; // devolve como veio se não reconhecer
}

window.importarPlanilha = function(input, tipo) {
  const file = input.files[0];
  if (!file) return;
  const m = MODELOS_CADERNO[tipo];
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try {
      const wb = XLSX.read(ev.target.result, { type: 'array', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const linhas = XLSX.utils.sheet_to_json(ws, { defval: '', raw: false });
      if (linhas.length === 0) { toast('Planilha vazia.','erro'); input.value=''; return; }
      let importados = 0, ignorados = 0;
      const batch = writeBatch(db);
      const novosLocais = [];

      if (tipo === 'solido' || tipo === 'pulverizacao') {
        // Agrupa linhas por fazenda+talhão+data+vazão+safra+regra+CATEGORIA -> uma aplicação com vários produtos.
        // A categoria (ex: "Fungicida 1", "Fungicida 2") identifica a aplicação: linhas com categorias
        // diferentes são aplicações diferentes, mesmo que coincidam fazenda/talhão/data/vazão.
        const grupos = {};
        linhas.forEach(row => {
          const reg = m.doExcel(row);
          if (!reg.fazenda || !reg.talhao || !reg.produto) { ignorados++; return; }
          const md = reg.modo_data||'fixa';
          const k = [normalizar(reg.fazenda), normalizar(reg.talhao), reg.data||'', normalizar(reg.vazao||''), normalizar(reg.safra||''), md, reg.dias_apos||0, normalizar(reg.categoria||'')].join('||');
          if (!grupos[k]) {
            grupos[k] = {
              data: reg.data, fazenda: reg.fazenda, talhao: reg.talhao, safra: reg.safra,
              vazao: reg.vazao||'', tipo_aplicacao: reg.tipo_aplicacao,
              obs: reg.obs||'', categoria: reg.categoria||'',
              produtos: [], status: 'planejado', criado_em: Timestamp.now(),
              modo_data: md, dias_apos: reg.dias_apos||0
            };
          }
          grupos[k].produtos.push({ produto: reg.produto, dose: reg.dose||0, unidade: reg.unidade||'', categoria: reg.categoria||'' });
        });
        Object.values(grupos).forEach(g => {
          // Datas relativas: calcula a data a partir do plantio (DAP) ou da 1ª aplicação (DAA) do mesmo talhão
          if (g.modo_data === 'plantio') {
            const pRef = plantios.find(p => normalizar(p.fazenda)===normalizar(g.fazenda) && normalizar(p.talhao)===normalizar(g.talhao));
            if (pRef && pRef.data) { g.data = somarDias(dataBasePlantio(pRef), g.dias_apos); g.ref_plantio_id = pRef.id; }
          } else if (g.modo_data === 'aplicacao') {
            const aRef = adubacoes
              .filter(a => normalizar(a.fazenda)===normalizar(g.fazenda) && normalizar(a.talhao)===normalizar(g.talhao) && a.data)
              .sort((x,y)=>(x.data||'').localeCompare(y.data||''))[0];
            if (aRef) { g.data = somarDias(aRef.data, g.dias_apos); g.ref_aplicacao_id = aRef.id; }
          }
          // pulv_anterior: a data será calculada em cadeia após salvar tudo (recalcularCadeiaDAA)
          // mantém produto/dose/unidade/categoria da 1ª linha para compatibilidade
          g.produto = g.produtos[0].produto;
          g.dose = g.produtos[0].dose;
          g.unidade = g.produtos[0].unidade;
          g.categoria = g.produtos[0].categoria || g.categoria;
          const ref = doc(collection(db, m.colecao));
          batch.set(ref, g);
          novosLocais.push({ id: ref.id, ...g });
          importados++;
        });
      } else {
        // Plantio / colheita: uma linha = um registro
        linhas.forEach(row => {
          const reg = m.doExcel(row);
          const faltando = m.obrigatorios.some(campo => !reg[campo]);
          if (faltando) { ignorados++; return; }
          const ref = doc(collection(db, m.colecao));
          batch.set(ref, reg);
          novosLocais.push({ id: ref.id, ...reg });
          importados++;
        });
      }

      if (importados === 0) { toast('Nenhuma linha válida encontrada — confira as colunas obrigatórias.','erro'); input.value=''; return; }
      await batch.commit();
      if (tipo==='plantio') {
        plantios.unshift(...novosLocais);
        // gera as colheitas de cada plantio importado
        for (const p of novosLocais) { await sincronizarColheitasDoPlantio(p); }
      }
      if (tipo==='solido' || tipo==='pulverizacao') adubacoes.unshift(...novosLocais);
      if (tipo==='colheita') colheitas.unshift(...novosLocais);
      // Após importar pulverizações, recalcula a cadeia DAA de cada talhão (Fung1→Fung2→Fung3...)
      if (tipo==='pulverizacao') {
        const talhoesUnicos = [...new Set(novosLocais.map(a => normalizar(a.fazenda||'')+'||'+normalizar(a.talhao||'')))];
        for (const chave of talhoesUnicos) {
          const amostra = novosLocais.find(a => normalizar(a.fazenda||'')+'||'+normalizar(a.talhao||'') === chave);
          if (amostra) await recalcularCadeiaDAA(amostra.fazenda, amostra.talhao);
        }
      }
      const msgAgrup = (tipo==='solido'||tipo==='pulverizacao') ? ' (linhas do mesmo talhão/data/vazão agrupadas numa aplicação)' : '';
      toast(`${importados} registro(s) importado(s)${msgAgrup}${ignorados>0?`, ${ignorados} ignorado(s)`:''}.`);
      renderSubabaCaderno();
    } catch(e) { toast('Erro ao importar: '+e.message,'erro'); }
    input.value = '';
  };
  reader.readAsArrayBuffer(file);
};

window.exportarCaderno = function(tipo) {
  const m = MODELOS_CADERNO[tipo];
  const lista = m.lista();
  if (lista.length === 0) { toast('Nada para exportar.','erro'); return; }
  try {
    const linhas = lista.map(m.paraExportar);
    const ws = XLSX.utils.json_to_sheet(linhas);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, tipo.substring(0,31));
    XLSX.writeFile(wb, `ACF_${tipo}_${hoje()}.xlsx`);
    toast('Excel gerado!');
  } catch(e) { toast('Erro ao exportar: '+e.message,'erro'); }
};

window.gerarRelatorio = function(tipo) {
  const el = document.getElementById('resultado-relatorio');
  let html = '';
  switch(tipo) {
    case 'custo_talhao': {
      // MELHORIA 7: custo por hectare
      const mapa = {};
      retiradas.forEach(r => {
        const k = `${r.fazenda} / ${r.talhao||'(sem talhão)'}`;
        if (!mapa[k]) mapa[k] = { custo:0, qtd:0, fazenda:r.fazenda, talhao:r.talhao };
        mapa[k].qtd++; mapa[k].custo += r.custo_total||0;
      });
      const rows = Object.entries(mapa).sort((a,b)=>b[1].custo-a[1].custo).map(([k,v]) => {
        const t = talhoes.find(t => normalizar(t.nome) === normalizar(v.talhao||'') && normalizar(t.fazenda||'') === normalizar(v.fazenda||''));
        const area = t ? parseFloat(t.area_ha)||0 : 0;
        const custoHa = area > 0 ? v.custo/area : null;
        return [k, v.qtd, area>0?fmt(area)+' ha':'—', `R$ ${fmt(v.custo)}`, custoHa!==null?`R$ ${fmt(custoHa)}/ha`:'—'];
      });
      html = tabelaRelatorio('🌾 Custo por Talhão', ['Fazenda / Talhão','Registros','Área','Custo Total','Custo/ha'], rows,
        `Total: R$ ${fmt(retiradas.reduce((s,r)=>s+(r.custo_total||0),0))}`);
      relatorioAtual = { titulo:'Custo_por_Talhao', colunas:['Fazenda/Talhão','Registros','Área (ha)','Custo Total (R$)','Custo/ha (R$)'], rows };
      break;
    }
    case 'custo_safra': {
      const mapa = {};
      retiradas.forEach(r => {
        const k = r.safra||'(sem safra)';
        if (!mapa[k]) mapa[k] = { custo:0, qtd:0 };
        mapa[k].custo += r.custo_total||0; mapa[k].qtd++;
      });
      const rows = Object.entries(mapa).sort((a,b)=>b[1].custo-a[1].custo).map(([k,v]) => [k, v.qtd, `R$ ${fmt(v.custo)}`]);
      html = tabelaRelatorio('📅 Custo por Safra', ['Safra','Retiradas','Custo Total'], rows,

      break;
    }
    case 'custo_cultura': {
      const mapa = {};
      retiradas.forEach(r => {
        const k = r.cultura||'(sem cultura)';
        if (!mapa[k]) mapa[k] = { custo:0, qtd:0 };
        mapa[k].custo += r.custo_total||0; mapa[k].qtd++;
      });
      const rows = Object.entries(mapa).sort((a,b)=>b[1].custo-a[1].custo).map(([k,v]) => [k, v.qtd, `R$ ${fmt(v.custo)}`]);
      html = tabelaRelatorio('🌱 Custo por Cultura', ['Cultura','Retiradas','Custo Total'], rows,

        if (!mapa[r.produto]) mapa[r.produto] = { custo:0, qtd:0, unidade:r.unidade };
        mapa[r.produto].custo += r.custo_total||0; mapa[r.produto].qtd += r.quantidade||0;
      });

    case 'estoque_valor': {
      const rows = [...estoque].sort((a,b)=>(b.quantidade*b.custo_medio)-(a.quantidade*a.custo_medio))
        .map(e => [e.produto, fmt(e.quantidade), e.unidade, `R$ ${fmt(e.custo_medio||0)}`, `R$ ${fmt((e.quantidade||0)*(e.custo_medio||0))}`]);

      relatorioAtual = { titulo:'Estoque_Valor', colunas:['Produto','Quantidade','Unidade','Custo Médio (R$)','Valor Total (R$)'], rows };
      break;
    }
    case 'custo_fazenda': {
      const mapa = {};
      retiradas.forEach(r => {
        if (!mapa[r.fazenda]) mapa[r.fazenda] = { custo:0, qtd:0 };
        mapa[r.fazenda].custo += r.custo_total||0; mapa[r.fazenda].qtd++;
      });
      // custo/ha por fazenda usando soma das áreas dos talhões
      const rows = Object.entries(mapa).sort((a,b)=>b[1].custo-a[1].custo).map(([k,v]) => {
        const areaFaz = talhoes.filter(t=>normalizar(t.fazenda||'')===normalizar(k)).reduce((s,t)=>s+(parseFloat(t.area_ha)||0),0);
        return [k, v.qtd, areaFaz>0?fmt(areaFaz)+' ha':'—', `R$ ${fmt(v.custo)}`, areaFaz>0?`R$ ${fmt(v.custo/areaFaz)}/ha`:'—'];
      });
      html = tabelaRelatorio('🏡 Custo por Fazenda', ['Fazenda','Retiradas','Área Total','Custo Total','Custo/ha'], rows,
        `Total: R$ ${fmt(Object.values(mapa).reduce((s,v)=>s+v.custo,0))}`);
      relatorioAtual = { titulo:'Custo_por_Fazenda', colunas:['Fazenda','Retiradas','Área Total (ha)','Custo Total (R$)','Custo/ha (R$)'], rows };
      break;
    }
    case 'safra_plantio': {
      html = gerarRelatorioSafraPlantio();
      break;
    }
    case 'safra_completa': {
      html = gerarRelatorioSafraCompleta();
      break;
    }
    case 'plantabilidade': {
      html = gerarRelatorioPlantabilidade();
      break;
    }
  }
  el.innerHTML = html;
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
};

// ══════════ RELATÓRIOS DE SAFRA (datas vivas: planejada → executada) ══════════
// Retorna a data "viva" de um registro: se concluído, a data de execução; senão, a planejada.
// Também informa se está executado (para pintar de verde).
function dataViva(reg) {
  if (!reg) return { data:'', executado:false };
  if (reg.status === 'concluido' && reg.data_conclusao)
    return { data: String(reg.data_conclusao).slice(0,10), executado:true };
  return { data: reg.data ? String(reg.data).slice(0,10) : '', executado:false };
}
function celData(dv) {
  if (!dv.data) return '<td style="text-align:center;color:#c9d1cc">—</td>';
  const bg = dv.executado ? 'background:#4a9d5f;color:#fff;font-weight:600' : '';
  return `<td style="text-align:center;white-space:nowrap;${bg}">${fmtDataBR(dv.data)}</td>`;
}

function gerarRelatorioSafraPlantio() {
  const lista = plantios.filter(filtroCadernoSafra);
  if (lista.length === 0) return '<div class="tabela-vazia" style="padding:30px;text-align:center">Nenhum plantio cadastrado' + (cadernoSafra?` para a safra ${cadernoSafra}`:'') + '.</div>';
  // Uma linha por cultivar de cada plantio (para casar área/população/ciclo)
  const linhas = [];
  lista.forEach(p => {
    const dvPlant = dataViva(p);
    const cults = cultivaresDoPlantio(p);
    // colheitas ligadas a este plantio
    const colhsPlant = colheitas.filter(c => c.plantio_id === p.id);
    (cults.length?cults:[{cultivar:p.cultura||'',area_ha:0,ciclo_dias:0,populacao:0}]).forEach(cv => {
      // acha a colheita correspondente ao cultivar
      const colh = colhsPlant.find(c => normalizar(c.cultivar||'') === normalizar(cv.cultivar||'')) || colhsPlant[0];
      const dvColh = dataViva(colh);
      linhas.push({
        fazenda: p.fazenda||'', talhao: p.talhao||'',
        area: cv.area_ha>0 ? cv.area_ha : areaDoTalhao(p.fazenda, p.talhao),
        cultura: p.cultura||'', cultivar: cv.cultivar||'',
        dias: cv.ciclo_dias||0, populacao: cv.populacao||0,
        dvPlant, dvColh,
        ordPlant: dvPlant.data||'9999'
      });
    });
  });
  linhas.sort((a,b)=> a.ordPlant.localeCompare(b.ordPlant) || (a.fazenda+a.talhao).localeCompare(b.fazenda+b.talhao));

  const rows = linhas.map((l,i) => `
    <tr>
      <td style="text-align:center">${i+1}</td>
      <td style="white-space:nowrap">${l.fazenda} · ${l.talhao}</td>
      <td style="text-align:center">${l.area?fmt(l.area):'—'}</td>
      <td>${l.cultura||'—'}</td>
      <td style="white-space:nowrap">${l.cultivar||'—'}</td>
      <td style="text-align:center">${l.dias?Math.round(l.dias):'—'}</td>
      <td style="text-align:center">${l.populacao?Math.round(l.populacao).toLocaleString('pt-BR'):'—'}</td>
      ${celData(l.dvPlant)}
      ${celData(l.dvColh)}
    </tr>`).join('');

  const titulo = 'Planejamento de Plantio' + (cadernoSafra?` — ${cadernoSafra}`:'');
  // guarda para exportar
  relatorioAtual = {
    titulo: 'Planejamento_Plantio',
    colunas: ['Ordem','Talhão','Área (ha)','Cultura','Cultivar','Dias','População','Plantio','Colheita'],
    rows: linhas.map((l,i)=>[i+1, `${l.fazenda} · ${l.talhao}`, l.area||'', l.cultura, l.cultivar, l.dias?Math.round(l.dias):'', l.populacao?Math.round(l.populacao):'', l.dvPlant.data?fmtDataBR(l.dvPlant.data):'', l.dvColh.data?fmtDataBR(l.dvColh.data):''])
  };

  return `
    <div class="tabela-wrap" style="overflow-x:auto">
      <div style="padding:16px 20px;font-family:'Syne',sans-serif;font-weight:700;font-size:16px;border-bottom:1px solid var(--creme-escuro);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <span>🌱 ${titulo}</span>
        <button class="btn btn-secondary btn-sm" onclick="exportarRelatorioSafra()">⬇ Exportar Excel</button>
      </div>
      <div style="padding:10px 20px;font-size:12px;color:var(--cinza);border-bottom:1px solid var(--creme-escuro)">
        <span style="display:inline-block;width:14px;height:14px;background:#4a9d5f;border-radius:3px;vertical-align:middle;margin-right:5px"></span> Data em verde = operação já executada &nbsp;·&nbsp; sem cor = data planejada
      </div>
      <table class="rel-safra">
        <thead><tr>
          <th style="text-align:center">Ordem</th><th>Talhão</th><th style="text-align:center">Área (ha)</th>
          <th>Cultura</th><th>Cultivar</th><th style="text-align:center">Dias</th><th style="text-align:center">População</th>
          <th style="text-align:center">Plantio</th><th style="text-align:center">Colheita</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

window.diagnosticoPulv = function() {
  // Lista todas as pulverizações agrupadas por talhão, mostrando categoria e data exatas.
  const linhas = [];
  const porTalhao = {};
  adubacoes.filter(a => tipoDaAdubacao(a)==='pulverizacao' && filtroCadernoSafra(a)).forEach(a => {
    const k = `${a.fazenda} · ${a.talhao}`;
    (porTalhao[k] = porTalhao[k]||[]).push(a);
  });
  Object.entries(porTalhao).forEach(([talhao, aps]) => {
    aps.sort((x,y)=>String(x.data||'').localeCompare(String(y.data||'')));
    linhas.push(`\n📍 ${talhao} (${aps.length} pulverizações):`);
    aps.forEach(a => linhas.push(`   • categoria="${a.categoria||'(vazio)'}" | data=${a.data||'(sem data)'} | status=${a.status||''}`));
  });
  const texto = linhas.join('\n') || 'Nenhuma pulverização.';
  console.log(texto);
  alert(texto.slice(0, 3000)); // mostra na tela (limitado)
};

function gerarRelatorioSafraCompleta() {
  const plantiosSafra = plantios.filter(filtroCadernoSafra);
  if (plantiosSafra.length === 0) return '<div class="tabela-vazia" style="padding:30px;text-align:center">Nenhum plantio cadastrado' + (cadernoSafra?` para a safra ${cadernoSafra}`:'') + '.</div>';

  // Classifica uma operação num TIPO base (sem numeração ainda).
  function tipoBase(ev) {
    if (ev.kind === 'plantio') return 'Plantio';
    if (ev.kind === 'colheita') return 'Colheita';
    const txt = normalizar(ev.a.categoria || '');
    if (txt.includes('corretivo') || txt.includes('calcario') || txt.includes('gesso')) return 'Corretivo';
    if (txt.includes('aduba') || txt.includes('npk') || txt.includes('mono') || txt.includes('map') || txt.includes('formulado')) return 'Adubação';
    if (txt.includes('dessec')) return 'Dessecação';
    if (txt.includes('pre') && txt.includes('emerg')) return 'Pré-emerg.';
    if (txt.includes('pos') && txt.includes('emerg')) return 'Pós-emerg.';
    if (txt.includes('fung')) return 'Fung';
    if (txt.includes('inset')) return 'Insetic.';
    if (txt.includes('herb')) return 'Herbic.';
    return ev.a.tipo_aplicacao==='pulverizacao' ? 'Pulv.' : 'Sólido';
  }
  // Extrai o número que o usuário escreveu na descrição (ex: "Fungicida 4" -> 4), se houver.
  function numeroNaDescricao(ev) {
    const m = normalizar(ev.a.categoria || '').match(/(\d+)/);
    return m ? parseInt(m[1]) : null;
  }

  // Ordem canônica de exibição das colunas (calendário típico da safra).
  // Tipos com posição fixa; os que se repetem (Corretivo, Adubação, Fung...) são numerados e
  // a Dessecação antes do plantio ("Dessecação") é separada da pós-colheita ("Dessec. Soja").
  const ordemBase = ['Corretivo','Adubação','Sólido','Dessecação','Pré-emerg.','Herbic.','Plantio','Pós-emerg.','Fung','Insetic.','Pulv.','Dessec. Soja','Colheita'];
  function rankSlot(base) { const i = ordemBase.indexOf(base); return i<0 ? 99 : i; }

  // Monta a linha do tempo de cada talhão e atribui um SLOT (coluna) a cada evento por tipo.
  const linhas = [];
  const slotsUsados = {}; // slot -> rank para ordenar as colunas depois
  plantiosSafra.forEach(p => {
    const cults = cultivaresDoPlantio(p);
    const cultivarNome = cults.map(c=>c.cultivar).filter(Boolean).join(', ') || (p.cultura||'');
    const eventos = [];
    const dvP = dataViva(p);
    if (dvP.data) eventos.push({ kind:'plantio', dv:dvP, a:p });
    adubacoes
      .filter(a => normalizar(a.fazenda)===normalizar(p.fazenda) && normalizar(a.talhao)===normalizar(p.talhao) && filtroCadernoSafra(a))
      .forEach(a => { const dv = dataViva(a); if (dv.data) eventos.push({ kind:'aplic', dv, a }); });
    const colh = colheitas.filter(c => c.plantio_id === p.id)[0];
    if (colh) { const dvC = dataViva(colh); if (dvC.data) eventos.push({ kind:'colheita', dv:dvC, a:colh }); }
    eventos.sort((x,y)=> x.dv.data.localeCompare(y.dv.data));

    // marca posição do plantio para separar Dessecação (antes) de Dessec. Soja (depois)
    const idxPlantio = eventos.findIndex(e => e.kind==='plantio');
    const mapaSlot = {}; // slot -> evento (um evento por slot dentro do talhão)
    const numeraveis = ['Corretivo','Adubação','Fung','Sólido','Pulv.','Insetic.','Herbic.'];

    // 1º passo: define a base de cada evento (e separa Dessec. Soja)
    eventos.forEach((ev, idx) => {
      let base = tipoBase(ev);
      if (base==='Dessecação' && idxPlantio>=0 && idx>idxPlantio) base = 'Dessec. Soja';
      ev.base = base;
    });

    // 2º passo: numera os tipos que se repetem, SEM colisão.
    // Prioriza o número escrito na descrição ("Fungicida 4" -> Fung 4). Se dois caírem no mesmo
    // número (ou não tiverem número), resolve por ordem cronológica preenchendo os slots livres.
    const porBase = {};
    eventos.forEach(ev => { (porBase[ev.base] = porBase[ev.base] || []).push(ev); });
    Object.entries(porBase).forEach(([base, evs]) => {
      if (numeraveis.includes(base)) {
        // ordena por data para dar sequência estável
        evs.sort((x,y)=> x.dv.data.localeCompare(y.dv.data));
        const usados = new Set();
        // 1ª volta: quem tem número na descrição e o slot está livre, fica com ele
        evs.forEach(ev => {
          const n = numeroNaDescricao(ev);
          if (n != null && !usados.has(n)) { ev.num = n; usados.add(n); }
        });
        // 2ª volta: quem ainda não tem número recebe o menor número livre (1,2,3...)
        evs.forEach(ev => {
          if (ev.num == null) { let n=1; while (usados.has(n)) n++; ev.num = n; usados.add(n); }
          ev.slot = `${base} ${ev.num}`;
        });
      } else {
        if (evs.length === 1) { evs[0].slot = base; evs[0].num = 0; }
        else { evs.sort((x,y)=> x.dv.data.localeCompare(y.dv.data)); evs.forEach((ev,i)=>{ ev.slot = i===0?base:`${base} ${i+1}`; ev.num = i; }); }
      }
    });

    // 3º passo: registra cada evento no mapa e no ranking de colunas
    eventos.forEach(ev => {
      mapaSlot[ev.slot] = ev;
      slotsUsados[ev.slot] = rankSlot(ev.base)*100 + (ev.num||0);
    });
    linhas.push({ fazenda:p.fazenda, talhao:p.talhao, cultivar:cultivarNome, mapaSlot, ordPlant: dvP.data||'9999' });
  });
  linhas.sort((a,b)=> a.ordPlant.localeCompare(b.ordPlant) || (a.fazenda+a.talhao).localeCompare(b.fazenda+b.talhao));

  // colunas finais = todos os slots usados, ordenados pela ordem canônica
  const colunas = Object.keys(slotsUsados).sort((a,b)=> slotsUsados[a]-slotsUsados[b]);
  if (colunas.length === 0) return '<div class="tabela-vazia" style="padding:30px;text-align:center">Nenhuma operação com data para exibir.</div>';

  const thsCols = colunas.map(c => `<th style="text-align:center">${c}</th>`).join('');

  const rows = linhas.map(l => {
    const cels = colunas.map(slot => {
      const ev = l.mapaSlot[slot];
      if (!ev) return '<td style="text-align:center;color:#c9d1cc">—</td>';
      const bg = ev.dv.executado ? 'background:#4a9d5f;color:#fff;font-weight:600' : '';
      let prods = '';
      if (ev.kind==='aplic') prods = (produtosDaAplicacao(ev.a)||[]).map(x=>x.produto).join(', ');
      else if (ev.kind==='plantio') prods = ev.a.cultura||'';
      return `<td style="text-align:center;white-space:nowrap;${bg}" title="${slot}${prods?' — '+prods:''}">${fmtDataBR(ev.dv.data)}</td>`;
    }).join('');
    return `<tr>
      <td style="white-space:nowrap">${l.fazenda} · ${l.talhao}</td>
      <td style="white-space:nowrap">${l.cultivar||'—'}</td>
      ${cels}
    </tr>`;
  }).join('');

  const titulo = 'Planejamento Safra' + (cadernoSafra?` — ${cadernoSafra}`:'');
  const colunasExp = ['Talhão','Cultivar', ...colunas];
  relatorioAtual = {
    titulo: 'Planejamento_Safra', colunas: colunasExp,
    rows: linhas.map(l => {
      const r = [`${l.fazenda} · ${l.talhao}`, l.cultivar];
      colunas.forEach(slot => { const ev = l.mapaSlot[slot]; r.push(ev ? fmtDataBR(ev.dv.data) : ''); });
      return r;
    })
  };

  return `
    <div class="tabela-wrap" style="overflow-x:auto">
      <div style="padding:16px 20px;font-family:'Syne',sans-serif;font-weight:700;font-size:16px;border-bottom:1px solid var(--creme-escuro);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <span>🗓️ ${titulo}</span>
        <button class="btn btn-secondary btn-sm" onclick="exportarRelatorioSafra()">⬇ Exportar Excel</button>
      </div>
      <div style="padding:10px 20px;font-size:12px;color:var(--cinza);border-bottom:1px solid var(--creme-escuro)">
        <span style="display:inline-block;width:14px;height:14px;background:#4a9d5f;border-radius:3px;vertical-align:middle;margin-right:5px"></span> Verde = executada &nbsp;·&nbsp; sem cor = planejada &nbsp;·&nbsp; cada operação na coluna do seu tipo &nbsp;·&nbsp; toque numa data para ver os produtos
      </div>
      <table class="rel-safra">
        <thead><tr>
          <th>Talhão</th><th>Cultivar</th>
          ${thsCols}
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// Estado do filtro de safra no relatório de plantabilidade
let relPlantSafra = '';
window.filtrarRelPlant = function(s) { relPlantSafra = s; const c = document.getElementById('resultado-relatorio'); if (c) c.innerHTML = gerarRelatorioPlantabilidade(); };

function gerarRelatorioPlantabilidade() {
  const safrasOpts = [...new Set(avaliacoesPlant.map(a=>a.safra).filter(Boolean))].sort();
  const lista = avaliacoesPlant
    .filter(a => !relPlantSafra || a.safra === relPlantSafra)
    .sort((a,b)=> {
      const da = a.criado_em?.toDate ? a.criado_em.toDate() : new Date(a.criado_em||0);
      const db2 = b.criado_em?.toDate ? b.criado_em.toDate() : new Date(b.criado_em||0);
      return db2 - da; // mais recentes primeiro
    });

  const fmtDataHoraAv = (v) => {
    if (!v) return '—';
    try { const d = v.toDate ? v.toDate() : new Date(v);
      return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getFullYear()).slice(2)} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    } catch(e) { return '—'; }
  };

  relatorioAtual = {
    titulo: 'Plantabilidade',
    colunas: ['Data/Hora','Safra','Fazenda','Talhão','Cultivar','Plantadeira','Medidas','Falhas','Falhas %','Duplas','Duplas %','CV %'],
    rows: lista.map(a => [fmtDataHoraAv(a.criado_em), a.safra||'', a.fazenda||'', a.talhao||'', a.cultivar||'', a.plantadeira_nome||'', a.n||0, a.falhas||0, fmt(a.pct_falhas||0)+'%', a.duplas||0, fmt(a.pct_duplas||0)+'%', fmt(a.cv||0)+'%'])
  };

  return `
    <div class="tabela-wrap" style="overflow-x:auto">
      <div style="padding:16px 20px;font-family:'Syne',sans-serif;font-weight:700;font-size:16px;border-bottom:1px solid var(--creme-escuro);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <span>🌱 Histórico de Plantabilidade</span>
        <button class="btn btn-secondary btn-sm" onclick="exportarRelatorioSafra()">⬇ Exportar Excel</button>
      </div>
      <div style="padding:12px 20px;border-bottom:1px solid var(--creme-escuro)">
        <select onchange="filtrarRelPlant(this.value)" style="max-width:280px">
          <option value="">Todas as safras</option>
          ${safrasOpts.map(s=>`<option value="${s}" ${relPlantSafra===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <table class="rel-safra">
        <thead><tr>
          <th>Data / Hora</th><th>Safra</th><th>Fazenda</th><th>Talhão</th><th>Cultivar</th><th>Plantadeira</th>
          <th style="text-align:center">Medidas</th><th style="text-align:center">Falhas</th><th style="text-align:center">Duplas</th><th style="text-align:center">CV</th>
        </tr></thead>
        <tbody>
          ${lista.length===0?'<tr><td colspan="10" class="tabela-vazia">Nenhuma avaliação de plantabilidade registrada'+(relPlantSafra?` para a safra ${relPlantSafra}`:'')+'.</td></tr>':
          lista.map(a=>`<tr>
            <td style="white-space:nowrap">${fmtDataHoraAv(a.criado_em)}</td>
            <td>${a.safra||'—'}</td>
            <td>${a.fazenda||'—'}</td>
            <td>${a.talhao||'—'}</td>
            <td>${a.cultivar||'—'}</td>
            <td>${a.plantadeira_nome||'—'}</td>
            <td style="text-align:center">${a.n||0}</td>
            <td style="text-align:center;color:var(--vermelho);font-weight:600">${a.falhas||0} <span style="font-weight:400;color:var(--cinza)">(${fmt(a.pct_falhas||0)}%)</span></td>
            <td style="text-align:center;color:var(--laranja);font-weight:600">${a.duplas||0} <span style="font-weight:400;color:var(--cinza)">(${fmt(a.pct_duplas||0)}%)</span></td>
            <td style="text-align:center;font-weight:600">${fmt(a.cv||0)}%</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

window.exportarRelatorioSafra = function() {
  if (!relatorioAtual.rows || relatorioAtual.rows.length===0) { toast('Nada para exportar.','erro'); return; }
  const dados = [relatorioAtual.colunas, ...relatorioAtual.rows];
  const ws = XLSX.utils.aoa_to_sheet(dados);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Safra');
  XLSX.writeFile(wb, `${relatorioAtual.titulo}_${hoje()}.xlsx`);
};

function tabelaRelatorio(titulo, colunas, rows, rodape) {
  return `
    <div class="relatorio-resultado">
      <div class="relatorio-resultado-titulo">
        ${titulo}
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary btn-sm" onclick="exportarRelatorioAtual()">📥 Excel</button>
          <button class="btn btn-secondary btn-sm" onclick="document.getElementById('resultado-relatorio').innerHTML=''">✕</button>
        </div>
      </div>
      ${rows.length === 0 ? '<div style="text-align:center;padding:30px;color:var(--cinza)">Nenhum dado para exibir.</div>' : `
      <div class="tabela-wrap"><table>
        <thead><tr>${colunas.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
        <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
        ${rodape ? `<tfoot><tr><td colspan="${colunas.length}" style="padding:12px 16px;font-weight:700;background:var(--creme)">${rodape}</td></tr></tfoot>` : ''}
      </table></div>`}
    </div>`;
}

// ── MELHORIA 3: EXPORTAR EXCEL ──
window.exportarRelatorioAtual = function() {
  if (!relatorioAtual.rows.length) { toast('Nada para exportar.','erro'); return; }
  // limpar formatação (R$, badges html) para o Excel
  const rowsLimpos = relatorioAtual.rows.map(r => r.map(c => {
    if (typeof c !== 'string') return c;
    const semHtml = c.replace(/<[^>]*>/g,'').trim();
    const num = semHtml.replace('R$','').trim().replace(/\./g,'').replace(',','.');
    return semHtml.startsWith('R$') && !isNaN(parseFloat(num)) ? parseFloat(num) : semHtml;
  }));
  exportarExcel(relatorioAtual.titulo, relatorioAtual.colunas, rowsLimpos);
};

function exportarExcel(nome, colunas, rows) {
  try {
    const ws = XLSX.utils.aoa_to_sheet([colunas, ...rows]);
    ws['!cols'] = colunas.map((c,i) => ({ wch: Math.max(c.length+2, ...rows.map(r=>String(r[i]||'').length+2), 10) }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, nome.substring(0,31));
    XLSX.writeFile(wb, `ACF_${nome}_${hoje()}.xlsx`);
    toast('Excel gerado!');
  } catch(e) { toast('Erro ao gerar Excel: '+e.message,'erro'); }
}
