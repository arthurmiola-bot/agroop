<style>
  :root {
    --verde: #2d6a4f;
    --verde-claro: #40916c;
    --verde-menta: #74c69d;
    --creme: #f8f4ee;
    --creme-escuro: #ede8e0;
    --terra: #7c5c3e;
    --laranja: #e07c3a;
    --vermelho: #c0392b;
    --azul: #2563eb;
    --cinza: #6b7280;
    --branco: #ffffff;
    --texto: #1a1a1a;
    --sombra: 0 2px 12px rgba(0,0,0,0.08);
    --sombra-forte: 0 8px 32px rgba(0,0,0,0.14);
    --radius: 12px;
    --radius-lg: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--creme); color: var(--texto); min-height: 100vh; }

  /* LOGIN */
  #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(145deg, #1a3a2a 0%, #2d6a4f 60%, #40916c 100%); padding: 24px; }
  .login-card { background: var(--branco); border-radius: var(--radius-lg); padding: 48px 40px; width: 100%; max-width: 400px; box-shadow: var(--sombra-forte); }
  .login-logo { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; color: var(--verde); margin-bottom: 4px; }
  .login-sub { font-size: 13px; color: var(--cinza); margin-bottom: 36px; letter-spacing: 0.5px; }
  .login-card label { display: block; font-size: 12px; font-weight: 500; color: var(--cinza); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
  .login-card input { width: 100%; padding: 12px 16px; border: 2px solid var(--creme-escuro); border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif; font-size: 15px; margin-bottom: 18px; transition: border-color 0.2s; outline: none; }
  .login-card input:focus { border-color: var(--verde-claro); }
  .btn-login { width: 100%; padding: 14px; background: var(--verde); color: white; border: none; border-radius: var(--radius);
    font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; transition: background 0.2s, transform 0.1s; }
  .btn-login:hover { background: var(--verde-claro); }
  .btn-login:active { transform: scale(0.98); }
  .login-erro { color: var(--vermelho); font-size: 13px; margin-top: 10px; text-align: center; }

  /* LAYOUT */
  #app { display: none; min-height: 100vh; flex-direction: column; }
  #app.ativo { display: flex; }
  .header { background: var(--verde); color: white; padding: 0 24px; height: 60px; display: flex; align-items: center;
    justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
  .header-logo { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
  .header-logo span { color: var(--verde-menta); }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .header-user { font-size: 13px; opacity: 0.85; display: flex; align-items: center; gap: 8px; }
  .badge-perfil { background: rgba(255,255,255,0.2); border-radius: 20px; padding: 3px 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .btn-sair { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 6px 14px;
    border-radius: 8px; font-size: 13px; cursor: pointer; transition: background 0.2s; }
  .btn-sair:hover { background: rgba(255,255,255,0.25); }

  .nav { background: var(--branco); border-bottom: 2px solid var(--creme-escuro); padding: 0 24px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav-btn { padding: 14px 16px; background: none; border: none; border-bottom: 3px solid transparent; font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 500; color: var(--cinza); cursor: pointer; white-space: nowrap; transition: all 0.2s; display: flex; align-items: center; gap: 7px; }
  .nav-btn:hover { color: var(--verde); }
  .nav-btn.ativo { color: var(--verde); border-bottom-color: var(--verde); font-weight: 600; }

  .main { flex: 1; padding: 28px 24px; max-width: 1100px; margin: 0 auto; width: 100%; }

  /* OPERADOR */
  .operador-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: calc(100vh - 120px); gap: 20px; padding: 24px; }
  .operador-titulo { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 700; color: var(--verde); text-align: center; }
  .operador-sub { color: var(--cinza); font-size: 14px; text-align: center; }
  .btn-operador { width: 100%; max-width: 320px; padding: 22px; border-radius: var(--radius-lg); border: none;
    font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; cursor: pointer; display: flex; align-items: center;
    gap: 16px; transition: transform 0.15s; box-shadow: var(--sombra); text-align: left; }
  .btn-operador:active { transform: scale(0.97); }
  .btn-operador .op-icon { font-size: 32px; }
  .btn-op-retirar { background: var(--verde); color: white; }
  .btn-op-historico { background: var(--branco); color: var(--verde); border: 2px solid var(--verde); }

  /* CARDS */
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .card-resumo { background: var(--branco); border-radius: var(--radius); padding: 20px; box-shadow: var(--sombra); border-left: 4px solid var(--verde); }
  .card-resumo.alerta { border-left-color: var(--laranja); }
  .card-resumo.perigo { border-left-color: var(--vermelho); }
  .card-resumo.info { border-left-color: var(--azul); }
  .card-resumo-valor { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; color: var(--verde); line-height: 1; }
  .card-resumo.alerta .card-resumo-valor { color: var(--laranja); }
  .card-resumo.perigo .card-resumo-valor { color: var(--vermelho); }
  .card-resumo.info .card-resumo-valor { color: var(--azul); }
  .card-resumo-label { font-size: 12px; color: var(--cinza); margin-top: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }

  .sec-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .sec-titulo { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; color: var(--texto); }

  .btn { padding: 10px 20px; border-radius: var(--radius); border: none; font-family: 'DM Sans', sans-serif; font-size: 14px;
    font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
  .btn-primary { background: var(--verde); color: white; }
  .btn-primary:hover { background: var(--verde-claro); }
  .btn-secondary { background: var(--creme-escuro); color: var(--texto); }
  .btn-secondary:hover { background: #ddd8cf; }
  .btn-danger { background: var(--vermelho); color: white; }
  .btn-sm { padding: 6px 12px; font-size: 13px; }
  .btn-laranja { background: var(--laranja); color: white; }
  .btn-azul { background: var(--azul); color: white; }

  .tabela-wrap { background: var(--branco); border-radius: var(--radius); box-shadow: var(--sombra); overflow: auto; }
  .tabela-wrap table { width: 100%; border-collapse: collapse; }
  .tabela-wrap th { background: var(--verde); color: white; padding: 14px 10px; text-align: left; font-family: 'Syne', sans-serif;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; white-space: normal; line-height: 1.35; vertical-align: middle; max-width: 110px; }
  .tabela-wrap td { padding: 10px 10px; border-bottom: 1px solid var(--creme-escuro); font-size: 13px; vertical-align: middle; }
  .tabela-wrap tr:last-child td { border-bottom: none; }
  .tabela-wrap tbody tr:hover td { background: var(--creme); }
  .tabela-vazia { text-align: center; padding: 40px; color: var(--cinza); font-style: italic; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 500;
    align-items: center; justify-content: center; padding: 16px; }
  .modal-overlay.ativo { display: flex; }
  .modal { background: var(--branco); border-radius: var(--radius-lg); padding: 32px; width: 100%; max-width: 580px;
    max-height: 90vh; overflow-y: auto; box-shadow: var(--sombra-forte); }
  .modal-titulo { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 24px; color: var(--verde); }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--cinza); text-transform: uppercase;
    letter-spacing: 0.6px; margin-bottom: 6px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 11px 14px; border: 2px solid var(--creme-escuro);
    border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; background: var(--branco); }
  .form-group input:focus, .form-group select:focus { border-color: var(--verde-claro); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; }
  .badge-verde { background: #d1fae5; color: #065f46; }
  .badge-laranja { background: #fed7aa; color: #9a3412; }
  .badge-vermelho { background: #fee2e2; color: #991b1b; }
  .badge-azul { background: #dbeafe; color: #1e40af; }
  .badge-cinza { background: #f3f4f6; color: #374151; }
  .badge-amarelo { background: #fef9c3; color: #854d0e; }

  .filtros { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .filtros input, .filtros select { padding: 8px 12px; border: 2px solid var(--creme-escuro); border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; background: var(--branco); }
  .filtros input:focus, .filtros select:focus { border-color: var(--verde-claro); }

  .itens-pedido { border: 2px solid var(--creme-escuro); border-radius: var(--radius); overflow: hidden; margin-top: 8px; }
  .item-pedido-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 8px; align-items: center;
    padding: 10px 12px; border-bottom: 1px solid var(--creme-escuro); font-size: 13px; }
  .item-pedido-row:last-child { border-bottom: none; }
  .item-pedido-row.header-row { background: var(--creme); font-weight: 600; font-size: 11px; text-transform: uppercase;
    color: var(--cinza); letter-spacing: 0.5px; }
  .item-pedido-row input, .item-pedido-row select { padding: 6px 8px; border: 1px solid var(--creme-escuro);
    border-radius: 8px; font-size: 13px; width: 100%; outline: none; }

  .baixa-item-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 8px; align-items: center;
    padding: 10px 12px; border-bottom: 1px solid var(--creme-escuro); font-size: 13px; }
  .baixa-item-row.header-row { background: var(--creme); font-weight: 600; font-size: 11px; text-transform: uppercase; color: var(--cinza); }
  .baixa-item-row input { padding: 6px 8px; border: 1px solid var(--creme-escuro); border-radius: 8px; font-size: 13px; width: 100%; outline: none; }

  .relatorio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .relatorio-card { background: var(--branco); border-radius: var(--radius); padding: 22px; box-shadow: var(--sombra);
    cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; border-top: 4px solid var(--verde); display: flex; flex-direction: column; gap: 8px; }
  .relatorio-card:hover { transform: translateY(-2px); box-shadow: var(--sombra-forte); }
  .relatorio-card.alerta { border-top-color: var(--laranja); }
  .relatorio-card.info { border-top-color: var(--azul); }
  .relatorio-card.terra { border-top-color: var(--terra); }
  .relatorio-card-icon { font-size: 28px; }
  .relatorio-card-titulo { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; }
  .relatorio-card-desc { font-size: 13px; color: var(--cinza); }
  .relatorio-resultado { background: var(--branco); border-radius: var(--radius); padding: 24px; box-shadow: var(--sombra); margin-top: 20px; }
  .relatorio-resultado-titulo { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 16px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }

  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--verde); color: white; padding: 14px 20px;
    border-radius: var(--radius); font-size: 14px; font-weight: 500; z-index: 9999; box-shadow: var(--sombra-forte);
    transform: translateY(80px); opacity: 0; transition: all 0.3s; max-width: 320px; }
  .toast.ativo { transform: translateY(0); opacity: 1; }
  .toast.erro { background: var(--vermelho); }

  .loading { display: flex; align-items: center; justify-content: center; padding: 60px; color: var(--cinza); gap: 12px; }
  .spinner { width: 20px; height: 20px; border: 3px solid var(--creme-escuro); border-top-color: var(--verde);
    border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .venc-hoje { color: var(--vermelho); font-weight: 600; }
  .venc-proximo { color: var(--laranja); font-weight: 600; }
  .venc-ok { color: var(--cinza); }

  /* COBERTURA */
  .cob-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr; gap: 8px; padding: 12px 16px;
    border-bottom: 1px solid var(--creme-escuro); font-size: 14px; align-items: center; }
  .cob-row.header { background: var(--verde); color: white; font-size: 12px; font-weight: 600; text-transform: uppercase;
    font-family: 'Syne', sans-serif; letter-spacing: 0.5px; }


  @media (max-width: 600px) {
    .main { padding: 16px; }
    .form-row { grid-template-columns: 1fr; }
    .header-user { display: none; }
    .modal { padding: 20px; }
    .cob-row { grid-template-columns: 1.5fr 1fr 1fr; }
    .cob-row span:nth-child(3), .cob-row span:nth-child(4) { display: none; }
    .cob-row.header span:nth-child(3), .cob-row.header span:nth-child(4) { display: none; }
  }

  /* ═══════ MODO APLICAÇÕES — visual clean ═══════ */
  :root {
    --aplic-fundo: #f4f6f3;
    --aplic-card: #ffffff;
    --aplic-borda: #e6ebe4;
    --aplic-texto: #1f2a24;
    --aplic-texto2: #5b6b60;
    --aplic-texto3: #9aa89f;
    --aplic-verde: #2f7a55;
    --aplic-verde-suave: #eaf3ee;
    --aplic-ambar: #b9772a;
    --aplic-ambar-suave: #fbf1e3;
    --aplic-azul: #3a6b9c;
    --aplic-azul-suave: #eef3f8;
  }
  .aplic-card {
    background: var(--aplic-card);
    border: 1px solid var(--aplic-borda);
    border-radius: 14px;
    overflow: hidden;
    transition: box-shadow .18s ease, border-color .18s ease;
  }
  .aplic-card:hover { box-shadow: 0 4px 16px rgba(31,42,36,.07); }
  .aplic-card.execucao { border-left: 4px solid var(--aplic-ambar); }
  .aplic-card.concluido { border-left: 4px solid var(--aplic-verde); }
  .aplic-card.planejado, .aplic-card.enviado_operador { border-left: 4px solid var(--aplic-azul); }
  .aplic-card-head {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 16px 18px; cursor: pointer; user-select: none;
  }
  .aplic-card-data {
    font-family: 'DM Mono', ui-monospace, monospace;
    font-size: 12px; color: var(--aplic-texto3);
    letter-spacing: .02em; margin-bottom: 4px;
  }
  .aplic-card-local { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .aplic-card-fazenda { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 16px; color: var(--aplic-texto); }
  .aplic-card-talhao {
    background: var(--aplic-verde-suave); color: var(--aplic-verde);
    font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 6px;
  }
  .aplic-card-resumo { font-size: 14px; color: var(--aplic-texto2); margin-top: 10px; }
  /* Fundo por tipo de aplicação (fácil identificação para o operador) */
  .aplic-card.tipo-solido { background: #faf3d8; border-color: #e3d49c; }
  .aplic-card.tipo-pulv { background: #e0edfb; border-color: #b4d0ec; }
  /* Tabela do tanque: compacta para caber na tela do celular */
  .aplic-tabela-tanque th { padding: 10px 8px; font-size: 10px; white-space: normal; line-height: 1.3; }
  .aplic-tabela-tanque td { padding: 11px 8px; font-size: 15px; }
  .aplic-tabela-tanque td:first-child { padding-left: 18px; }
  .aplic-tabela-tanque th:first-child { padding-left: 18px; }
  /* Cabeçalho com rótulos claros e letras grandes */
  .aplic-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
  .aplic-info-label {
    display: block; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .05em;
    color: var(--aplic-texto3); margin-bottom: 2px;
  }
  .aplic-info-valor {
    display: block; font-size: 20px; font-weight: 700;
    color: var(--aplic-texto); line-height: 1.2; word-break: break-word;
  }
  /* Bloco de cálculo por tanque (pulverização) */
  .aplic-tanque { border-top: 1px solid var(--aplic-borda); padding-top: 4px; }
  .aplic-tanque-titulo {
    font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px;
    padding: 12px 18px 4px; color: var(--aplic-texto);
  }
  .aplic-tanque-resumo {
    padding: 6px 18px 10px; font-size: 14px; color: var(--aplic-texto2);
    display: flex; flex-direction: column; gap: 4px; line-height: 1.5;
  }
  .aplic-tanque-resumo strong { color: var(--aplic-texto); }
  .aplic-tipo {
    display: inline-block; font-size: 12px; font-weight: 600;
    padding: 3px 10px; border-radius: 7px; margin-top: 6px;
  }
  .aplic-tipo-pulv { background: #e7f0f9; color: #2f6299; }
  .aplic-tipo-solido { background: #f4ecdf; color: #8a6524; }
  .aplic-obs-op {
    padding: 14px 18px; border-top: 1px solid var(--aplic-borda);
    display: flex; flex-direction: column; gap: 8px;
  }
  .aplic-obs-op label {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .04em; color: var(--aplic-texto3);
  }
  .aplic-obs-op textarea {
    width: 100%; min-height: 62px; resize: vertical;
    border: 1px solid var(--aplic-borda); border-radius: 10px;
    padding: 10px 12px; font-family: inherit; font-size: 14px;
    color: var(--aplic-texto); background: var(--aplic-fundo);
  }
  .aplic-obs-op textarea:focus { outline: none; border-color: var(--aplic-verde); }
  .aplic-btn-obs {
    align-self: flex-start; border: 1px solid var(--aplic-verde);
    background: #fff; color: var(--aplic-verde);
    border-radius: 9px; font-weight: 600; font-size: 13px;
    padding: 8px 14px; cursor: pointer; transition: background .15s;
  }
  .aplic-btn-obs:hover { background: var(--aplic-verde-suave); }
  .aplic-card-seta { color: var(--aplic-texto3); font-size: 14px; transition: transform .22s ease; }
  .aplic-card.aberto .aplic-card-seta { transform: rotate(180deg); }
  .aplic-chip {
    font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px;
    letter-spacing: .02em; white-space: nowrap;
  }
  .aplic-chip-pend { background: var(--aplic-azul-suave); color: var(--aplic-azul); }
  .aplic-chip-exec { background: var(--aplic-ambar-suave); color: var(--aplic-ambar); }
  .aplic-chip-ok   { background: var(--aplic-verde-suave); color: var(--aplic-verde); }
  .aplic-card-detalhes {
    max-height: 0; overflow: hidden;
    transition: max-height .28s ease;
  }
  .aplic-card.aberto .aplic-card-detalhes {
    max-height: 1400px; border-top: 1px solid var(--aplic-borda);
  }
  .aplic-card-area {
    font-size: 12px; color: var(--aplic-texto2);
    background: var(--aplic-fundo); padding: 2px 9px; border-radius: 6px;
  }
  .aplic-card-area-alerta { color: var(--aplic-ambar); background: var(--aplic-ambar-suave); }
  .aplic-tabela {
    width: 100%; border-collapse: collapse; font-size: 14px; table-layout: fixed;
  }
  .aplic-td-prod { word-break: break-word; }
  .aplic-tabela th {
    text-align: left; font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .03em;
    color: var(--aplic-texto3); padding: 12px 8px 8px;
    border-bottom: 1px solid var(--aplic-borda);
    white-space: normal; line-height: 1.25; vertical-align: bottom;
  }
  .aplic-tabela th:nth-child(1), .aplic-tabela td:nth-child(1) { width: 44%; }
  .aplic-tabela th:nth-child(2), .aplic-tabela td:nth-child(2) { text-align: right; white-space: nowrap; width: 26%; }
  .aplic-tabela th:nth-child(3), .aplic-tabela td:nth-child(3) { text-align: right; white-space: nowrap; width: 30%; }
  .aplic-tabela td { padding: 12px 8px; border-bottom: 1px solid var(--aplic-borda); font-size: 15px; }
  .aplic-tabela td:first-child, .aplic-tabela th:first-child { padding-left: 16px; }
  .aplic-tabela td:last-child, .aplic-tabela th:last-child { padding-right: 16px; }
  .aplic-tabela tr:last-child td { border-bottom: none; }
  .aplic-td-prod { font-weight: 600; color: var(--aplic-texto); }
  .aplic-td-dose { color: var(--aplic-texto2); }
  .aplic-td-total { font-weight: 700; color: var(--aplic-verde); }
  .aplic-extra {
    font-size: 13px; color: var(--aplic-texto2); line-height: 1.55;
    padding: 10px 18px; background: var(--aplic-fundo);
    border-top: 1px solid var(--aplic-borda);
  }
  .aplic-acao-wrap { padding: 14px 18px; display: flex; justify-content: flex-end; }
  .aplic-btn {
    border: none; border-radius: 10px; font-family: 'DM Sans', sans-serif;
    font-weight: 600; font-size: 14px; padding: 11px 20px; cursor: pointer;
    white-space: nowrap; transition: filter .15s ease, transform .1s ease;
  }
  .aplic-btn:active { transform: scale(.97); }
  .aplic-btn-iniciar { background: var(--aplic-ambar); color: #fff; }
  .aplic-btn-iniciar:hover { filter: brightness(1.05); }
  .aplic-btn-concluir { background: var(--aplic-verde); color: #fff; }
  .aplic-btn-concluir:hover { filter: brightness(1.05); }

  /* Coluna de ações alinhada à direita nas tabelas do caderno */
  th.col-acoes, td.col-acoes { text-align: right; white-space: nowrap; }
  .acoes-wrap { display: inline-flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
  /* Cabeçalhos ordenáveis */
  th.th-ord { cursor: pointer; user-select: none; white-space: normal; }
  /* Mini-tabela produto → dose (alinha cada dose na frente do seu produto) */
  .prod-dose-mini { border-collapse: collapse; width: 100%; }
  .prod-dose-mini td { border: none !important; padding: 2px 0 !important; font-size: 13px; vertical-align: top; }
  .prod-dose-mini .pd-nome { padding-right: 14px !important; word-break: break-word; }
  .prod-dose-mini .pd-dose { text-align: right; white-space: nowrap; font-family: 'DM Mono', monospace; color: var(--verde); font-weight: 500; }
  /* Relatórios de safra (plantio/colheita e aplicações) */
  .rel-safra { width:100%; border-collapse:collapse; font-size:13px; }
  .rel-safra th { background:var(--verde); color:#fff; padding:10px 12px; font-family:'Syne',sans-serif; font-weight:600; font-size:12px; white-space:nowrap; text-align:left; border:1px solid rgba(255,255,255,.15); }
  .rel-safra td { padding:9px 12px; border:1px solid var(--creme-escuro); }
  .rel-safra tbody tr:nth-child(even) { background:#faf8f4; }
  .btn-sm { padding:6px 12px; font-size:13px; }
  .cal-topo { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .cal-titulo { font-family:'Syne',sans-serif; font-weight:700; font-size:16px; }
  .cal-legenda { display:flex; gap:16px; justify-content:center; margin-bottom:12px; font-size:12px; color:var(--cinza); }
  .cal-legenda span { display:flex; align-items:center; gap:6px; }
  .cal-bola { width:12px; height:12px; border-radius:3px; display:inline-block; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-cabecalho { margin-bottom:4px; }
  .cal-dow { text-align:center; font-size:11px; font-weight:700; text-transform:uppercase; color:#9aa89f; padding:4px 0; }
  .cal-cel { min-height:64px; border:1px solid #eef1ec; border-radius:8px; padding:4px; background:#fff; overflow:hidden; }
  .cal-vazia { border:none; background:transparent; }
  .cal-hoje { border-color:var(--verde); box-shadow:0 0 0 1px var(--verde) inset; }
  .cal-num { font-size:12px; font-weight:600; color:#5b6b60; margin-bottom:3px; }
  .cal-tags { display:flex; flex-direction:column; gap:2px; }
  .cal-tag { font-size:10px; font-weight:600; padding:2px 4px; border-radius:4px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cal-solido { background:#faf3d8; color:#8a6d1a; }
  .cal-pulv { background:#e0edfb; color:#1e5aa8; }
  .cal-concluido { background:#d1fae5; color:#1f7a55; }
  .cal-vencida { border:1.5px solid var(--vermelho); font-weight:700; }
  .cal-bola.cal-solido { background:#e3d49c; }
  .cal-bola.cal-pulv { background:#b4d0ec; }
  .cal-bola.cal-concluido { background:#6ee7b7; }
  .dash-exp { background:#fff; border:1px solid var(--creme-escuro); border-radius:var(--radius); padding:16px 18px; margin-bottom:20px; box-shadow:var(--sombra); }
  .dash-exp-tit { font-family:'Syne',sans-serif; font-weight:700; font-size:15px; margin-bottom:12px; }
  .dash-exp-item { padding:12px 0; border-bottom:1px solid #f0f3ee; }
  .dash-exp-item:last-child { border-bottom:none; }
  .dash-exp-topo { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .dash-exp-titulo { font-weight:700; font-size:15px; color:#1f2a24; }
  .dash-exp-sub { font-size:12px; color:var(--cinza); margin-top:2px; }
  .dash-exp-datas { display:flex; gap:16px; flex-wrap:wrap; margin-top:6px; font-family:'DM Mono',monospace; font-size:12px; color:#5b6b60; }
  .de-lbl { color:#9aa89f; text-transform:uppercase; font-size:10px; letter-spacing:.03em; display:block; }
  .dash-exp-vazio { color:var(--cinza); font-size:13px; padding:8px 0; }
  .te-corpo .prod-dose-mini { table-layout: fixed; }
  .te-corpo .prod-dose-mini .pd-dose { width: 42%; }
  /* Coluna de produtos no Caderno de Campo: larga o suficiente para o nome não quebrar letra a letra */
  .prod-dose-caderno { min-width: 260px; }
  .prod-dose-caderno .pd-nome { white-space: nowrap; word-break: normal; padding-right: 18px !important; }
  .prod-dose-caderno .pd-dose { min-width: 90px; }
  .prod-dose-mini tr:hover td { background: transparent !important; }
  th.th-ord:hover { background: rgba(255,255,255,0.08); }
  .th-seta { font-size: 10px; opacity: .9; }

  /* Indicador de status offline/sincronização (modo Aplicações) */
  .offline-ind { align-items:center; gap:8px; padding:10px 14px; border-radius:10px; font-size:13px; font-weight:600; margin-bottom:14px; }
  .offline-ind.off  { background:#fdecea; color:#c0392b; border:1px solid #f5c6c0; }
  .offline-ind.pend { background:#fbf1e3; color:#b9772a; border:1px solid #f0dcbf; }
  .offline-ind.sync { background:#eef3f8; color:#3a6b9c; border:1px solid #cfe0f0; }
  .offline-ind.ok   { background:#eaf3ee; color:#2f7a55; border:1px solid #b7dcc6; }
  /* ═══════ PAINEL POR TALHÃO ═══════ */
  .talhao-card { background:#fff; border:1px solid #e6ebe4; border-radius:14px; margin-bottom:10px; overflow:hidden; }
  .talhao-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:16px 18px; cursor:pointer; user-select:none; }
  .talhao-nome { font-family:'Syne',sans-serif; font-weight:700; font-size:16px; color:#1f2a24; }
  .talhao-area { font-family:'DM Mono',monospace; font-size:12px; font-weight:500; color:#5b6b60; background:#f4f6f3; padding:1px 7px; border-radius:5px; margin-left:4px; }
  .talhao-resumo { display:flex; gap:12px; flex-wrap:wrap; font-size:13px; color:#5b6b60; margin-top:6px; }
  .talhao-badges { display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .tb { font-size:11px; font-weight:600; padding:2px 8px; border-radius:20px; white-space:nowrap; }
  .tb-plan { background:#eef3f8; color:#3a6b9c; }
  .tb-lib  { background:#fbf1e3; color:#b9772a; }
  .tb-exec { background:#fbf1e3; color:#b9772a; }
  .tb-conc { background:#eaf3ee; color:#2f7a55; }
  .talhao-seta { color:#9aa89f; font-size:14px; transition:transform .22s ease; margin-left:2px; }
  .talhao-card.aberto .talhao-seta { transform:rotate(180deg); }
  .talhao-detalhes { max-height:0; overflow:hidden; transition:max-height .3s ease; }
  .talhao-card.aberto .talhao-detalhes { max-height:3000px; border-top:1px solid #e6ebe4; }
  .talhao-secao { padding:12px 18px; border-bottom:1px solid #f0f3ee; }
  .talhao-secao:last-child { border-bottom:none; }
  .talhao-secao-titulo { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:#8fa089; margin-bottom:8px; }
  .talhao-evento-tab { width:100%; border-collapse:collapse; }
  .talhao-evento-tab th { text-align:left; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:#9aa89f; padding:4px 8px 6px; border-bottom:1px solid #eef1ec; white-space:nowrap; }
  .talhao-evento-tab td { padding:8px; border-bottom:1px solid #f4f6f3; vertical-align:top; font-size:13px; }
  .talhao-evento-tab tr:last-child td { border-bottom:none; }
  /* Item de evento empilhado (cabe na largura do celular, sem rolagem lateral) */
  .te-item { padding:10px 0; border-bottom:1px solid #f4f6f3; }
  .te-item:last-child { border-bottom:none; }
  .te-topo { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px; flex-wrap:wrap; }
  .te-datas { display:flex; gap:14px; flex-wrap:wrap; font-family:'DM Mono',monospace; font-size:12px; color:#5b6b60; }

// Guarda a lista de aplicações no aparelho e enfileira ações (iniciar/concluir)
// feitas sem internet, com o horário REAL da ação. Sobe tudo quando a rede volta.
const OFFLINE_CACHE_KEY = 'acf_aplic_cache';   // snapshot das adubações p/ ver offline
const OFFLINE_FILA_KEY  = 'acf_aplic_fila';    // ações pendentes de envio
const OFFLINE_TALHOES_KEY = 'acf_talhoes_cache'; // áreas dos talhões (p/ calcular total offline)

function estaOnline() { return navigator.onLine; }

function salvarCacheAplicacoes() {
  try {
    localStorage.setItem(OFFLINE_CACHE_KEY, JSON.stringify(adubacoes.map(a => ({
      id:a.id, fazenda:a.fazenda, talhao:a.talhao, produto:a.produto, dose:a.dose,
      unidade:a.unidade, produtos:a.produtos, categoria:a.categoria, safra:a.safra, data:a.data, status:a.status,
      obs:a.obs, obs_operador:a.obs_operador, tipo_aplicacao:a.tipo_aplicacao, vazao:a.vazao,
      data_conclusao:a.data_conclusao
    }))));
    localStorage.setItem(OFFLINE_TALHOES_KEY, JSON.stringify(talhoes.map(t => ({
      nome:t.nome, fazenda:t.fazenda, area_ha:t.area_ha
    }))));
  } catch(e) { /* localStorage cheio/indisponível — segue sem cache */ }
}

function carregarCacheAplicacoes() {
  try {
    const raw = localStorage.getItem(OFFLINE_CACHE_KEY);
    if (raw) adubacoes = JSON.parse(raw);
    const rawT = localStorage.getItem(OFFLINE_TALHOES_KEY);
    if (rawT && talhoes.length === 0) talhoes = JSON.parse(rawT);
    return !!raw;
  } catch(e) { return false; }
}

function lerFila() {
  try { return JSON.parse(localStorage.getItem(OFFLINE_FILA_KEY) || '[]'); }
  catch(e) { return []; }
}
function salvarFila(fila) {
  try { localStorage.setItem(OFFLINE_FILA_KEY, JSON.stringify(fila)); } catch(e) {}
}
function enfileirarAcao(acao) {
  const fila = lerFila();
  fila.push(acao);
  salvarFila(fila);
  atualizarIndicadorOffline();
}
function contarPendentes() { return lerFila().length; }

// Aplica a ação no estado local (para refletir na tela imediatamente, on/offline)
function aplicarAcaoLocal(acao) {
  const a = adubacoes.find(x=>x.id===acao.id);
  if (!a) return;
  if (acao.tipo === 'iniciar') {
    a.status = 'execucao'; a.iniciado_em = acao.ts;
  } else if (acao.tipo === 'concluir') {
    a.status = 'concluido'; a.data_conclusao = acao.data_conclusao;
    if (acao.obs_operador) a.obs_operador = acao.obs_operador;
  } else if (acao.tipo === 'obs') {
    a.obs_operador = acao.obs_operador;
  }
}

// Envia uma ação para o Firestore (usada no flush da fila)
async function enviarAcao(acao) {
  if (acao.tipo === 'iniciar') {
    await updateDoc(doc(db,'insumos_campo_adubacao',acao.id), {
      status:'execucao', iniciado_em: Timestamp.fromMillis(acao.ts)
    });
  } else if (acao.tipo === 'concluir') {
    const upd = { status:'concluido', data_conclusao: acao.data_conclusao };
    if (acao.obs_operador) upd.obs_operador = acao.obs_operador;
    if (acao.iniciado_em_ts) upd.iniciado_em = Timestamp.fromMillis(acao.iniciado_em_ts);
    await updateDoc(doc(db,'insumos_campo_adubacao',acao.id), upd);
    // baixa de estoque ao concluir (se a regra permitir)
    const a = adubacoes.find(x=>x.id===acao.id);
    if (a) { try { await baixarEstoquePorAplicacao(a); } catch(e){} }
  } else if (acao.tipo === 'obs') {
    await updateDoc(doc(db,'insumos_campo_adubacao',acao.id), { obs_operador: acao.obs_operador });
  }
}

let sincronizando = false;
window.sincronizarFila = sincronizarFila;
async function sincronizarFila(silencioso) {
  if (sincronizando) return;
  if (!estaOnline()) return;
  const fila = lerFila();
  if (fila.length === 0) return;
  sincronizando = true;
  atualizarIndicadorOffline('Sincronizando...');
  const restantes = [];
  let enviadas = 0;
  for (const acao of fila) {
    try { await enviarAcao(acao); enviadas++; }
    catch(e) { restantes.push(acao); } // falhou: mantém na fila p/ tentar depois
  }
  salvarFila(restantes);
  sincronizando = false;
  atualizarIndicadorOffline();
  if (enviadas > 0 && !silencioso) toast(`${enviadas} ação(ões) sincronizada(s) com o servidor.`);
  if (modoAtual === 'aplicacoes') renderModoAplicacoes();
}

function atualizarIndicadorOffline(textoForcado) {
  const el = document.getElementById('offline-indicador');
  if (!el) return;
  const pend = contarPendentes();
  const online = estaOnline();
  if (textoForcado) {
    el.className = 'offline-ind sync';
    el.innerHTML = `🔄 ${textoForcado}`;
    el.style.display = 'flex';
    return;
  }
  if (!online) {
    el.className = 'offline-ind off';
    el.innerHTML = `📴 Offline${pend>0?` · ${pend} pendente(s)`:''}`;
    el.style.display = 'flex';
  } else if (pend > 0) {
    el.className = 'offline-ind pend';
    el.innerHTML = `🔄 ${pend} pendente(s) — <span style="text-decoration:underline;cursor:pointer" onclick="sincronizarFila()">sincronizar agora</span>`;
    el.style.display = 'flex';
  } else {
    el.className = 'offline-ind ok';
    el.innerHTML = `✅ Tudo sincronizado`;
    el.style.display = 'flex';
    setTimeout(()=>{ if(el && contarPendentes()===0 && estaOnline()) el.style.display='none'; }, 2500);
  }
}

// ── ORDENAÇÃO DE TABELAS DO CADERNO ──
// Guarda o critério de cada tabela: { campo, dir } (dir: 1 asc, -1 desc)
const ordenacaoCaderno = {
  plantio:   { campo: 'data', dir: 1 },
  pulverizacao: { campo: 'data', dir: 1 },
  solido:    { campo: 'data', dir: 1 },
  colheita:  { campo: 'data', dir: 1 }
};

// Ordena uma lista conforme o critério da tabela. getVal(item, campo) retorna o valor comparável.
function ordenarLista(lista, tabela, getVal) {
  const o = ordenacaoCaderno[tabela];
  if (!o || !o.campo) return lista;
  return [...lista].sort((a, b) => {
    let va = getVal(a, o.campo), vb = getVal(b, o.campo);
    if (va == null) va = '';
    if (vb == null) vb = '';
    // números comparam como número; resto como texto
    if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * o.dir;
    return String(va).localeCompare(String(vb), 'pt', {numeric:true}) * o.dir;
  });
}

// Clique no cabeçalho: alterna asc/desc e re-renderiza
window.ordenarCaderno = function(tabela, campo) {
  const o = ordenacaoCaderno[tabela];
  if (o.campo === campo) o.dir *= -1; else { o.campo = campo; o.dir = 1; }
  renderSubabaCaderno();
};

// Monta um <th> clicável com seta indicando a ordenação atual
function thOrd(tabela, campo, rotulo, extraClass) {
  const o = ordenacaoCaderno[tabela];
  const seta = o.campo === campo ? (o.dir === 1 ? ' ▲' : ' ▼') : '';
  return `<th class="th-ord${extraClass?' '+extraClass:''}" onclick="ordenarCaderno('${tabela}','${campo}')">${rotulo}<span class="th-seta">${seta}</span></th>`;
}
// Converte uma data "AAAA-MM-DD" para exibição "DD-MM-AA". Deixa passar o que não casar.
function fmtDataBR(dataStr) {
  if (!dataStr) return '—';
  const m = String(dataStr).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return dataStr;
  return `${m[3]}-${m[2]}-${m[1].slice(2)}`;
}
function somarDias(dataStr, dias) {
  if (!dataStr) return '';
  const d = new Date(dataStr + 'T12:00:00');
  d.setDate(d.getDate() + (parseInt(dias)||0));
  return d.toISOString().split('T')[0];
}

// Interpreta o texto da coluna Vencimento. Retorna:
//  { tipo:'data', data:'AAAA-MM-DD', texto }            -> data fixa informada
//  { tipo:'ddf', dias:30, texto:'30 DDF' }              -> dias após faturamento (calcula no recebimento)
//  { tipo:'texto', texto:'Barter' }                     -> condição sem data (ex: barter)
//  null                                                  -> vazio
function interpretarCondicaoPagamento(valor) {
  const txt = (valor==null?'':valor).toString().trim();
  if (!txt) return null;
  // data ISO AAAA-MM-DD
  if (/^\d{4}-\d{2}-\d{2}/.test(txt)) return { tipo:'data', data: txt.split('T')[0].substring(0,10), texto: txt };
  // data BR DD/MM/AAAA
  const br = txt.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (br) return { tipo:'data', data: `${br[3]}-${br[2]}-${br[1]}`, texto: txt };
  // "30 DDF", "360 ddf", "30DDF", "30 dias" etc -> extrai o número de dias
  const ddf = txt.match(/(\d+)\s*(ddf|dias|d)\b/i);
  if (ddf) return { tipo:'ddf', dias: parseInt(ddf[1]), texto: txt };
  // qualquer outro texto (Barter, "à vista", "a combinar"...)
  return { tipo:'texto', texto: txt };
}

function diasAte(ts) {
  if (!ts) return 9999;
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return Math.ceil((d - new Date()) / 86400000);
}
function classeVenc(ts) {
  const d = diasAte(ts);
  if (d < 0) return 'venc-hoje';
  if (d <= 7) return 'venc-proximo';
  return 'venc-ok';
}
function labelVenc(ts) {
  const d = diasAte(ts);
  if (d < 0) return `Vencido há ${Math.abs(d)}d`;
  if (d === 0) return 'Vence hoje!';
  if (d <= 7) return `Vence em ${d}d`;
  return fmtData(ts);
}
function toast(msg, tipo='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ativo' + (tipo==='erro' ? ' erro' : '');
  setTimeout(() => el.className = 'toast', 3500);
}
function normalizar(s) { return (s||'').toString().trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

// ══════════════ PLANTABILIDADE ══════════════
// Calcula falhas, duplas e CV a partir das distâncias entre sementes.
// população (sementes/ha), espaçamento entre linhas (cm), lista de distâncias medidas (cm).
function calcularPlantabilidade(populacao, espacamentoLinhaCm, medidas) {
  const vals = (medidas||[]).map(Number).filter(v => v > 0);
  const n = vals.length;
  // distância ideal entre sementes (cm) = (10000 m²/ha × espaç_linha_m) / população × 100
  // sementes por metro linear = população × espaç_linha_m / 10000 ; distância ideal = 100 / sem_por_metro
  const espLinhaM = espacamentoLinhaCm / 100;
  const semPorMetro = populacao * espLinhaM / 10000;
  const distIdeal = semPorMetro > 0 ? 100 / semPorMetro : 0;
  if (n === 0 || distIdeal === 0) {
    return { n, distIdeal, media:0, desvio:0, cv:0, falhas:0, duplas:0, normais:0, pctFalhas:0, pctDuplas:0, pctNormais:0 };
  }
  // classificação: falha > 1,5× ideal ; dupla < 0,5× ideal ; normal entre
  let falhas = 0, duplas = 0, normais = 0;
  vals.forEach(d => {
    if (d > 1.5 * distIdeal) falhas++;
    else if (d < 0.5 * distIdeal) duplas++;
    else normais++;
  });
  // estatística
  const media = vals.reduce((s,v)=>s+v,0) / n;
  const variancia = vals.reduce((s,v)=>s+Math.pow(v-media,2),0) / n;
  const desvio = Math.sqrt(variancia);
  const cv = media > 0 ? (desvio/media)*100 : 0;
  return {
    n, distIdeal, media, desvio, cv,
    falhas, duplas, normais,
    pctFalhas: (falhas/n)*100, pctDuplas: (duplas/n)*100, pctNormais: (normais/n)*100
  };
}

window.mudarPlantAba = function(aba) {
  plantAba = aba;
  renderPlantabilidade();
};

// ── ABA 1: Planejamento (tabela safra, talhão, cultivar, população) ──
function renderPlantPlanejamento() {
  const el = document.getElementById('plant-aba-conteudo');
  if (!el) return;
  const safrasOpts = safrasDisponiveis();
  // monta linhas: uma por cultivar de cada plantio
  const linhas = [];
  plantios.filter(p => !plantSafra || p.safra === plantSafra).forEach(p => {
    cultivaresDoPlantio(p).forEach(cv => {
      linhas.push({ safra:p.safra||'—', fazenda:p.fazenda||'', talhao:p.talhao||'', cultivar:cv.cultivar||'—', populacao:cv.populacao||0 });
    });
  });
  linhas.sort((a,b)=> (a.fazenda+a.talhao).localeCompare(b.fazenda+b.talhao));
  el.innerHTML = `
    <div class="form-group" style="max-width:320px">
      <label>Safra</label>
      <select onchange="filtrarPlantSafra(this.value)">
        <option value="">Todas as safras</option>
        ${safrasOpts.map(s=>`<option value="${s}" ${plantSafra===s?'selected':''}>${s}</option>`).join('')}
      </select>
    </div>
    <div class="tabela-wrap"><table>
      <thead><tr><th>Safra</th><th>Fazenda</th><th>Talhão</th><th>Cultivar</th><th>População</th></tr></thead>
      <tbody>
        ${linhas.length===0?'<tr><td colspan="5" class="tabela-vazia">Nenhum plantio cadastrado para esta safra</td></tr>':
        linhas.map(l=>`<tr><td>${l.safra}</td><td>${l.fazenda}</td><td>${l.talhao}</td><td>${l.cultivar}</td><td>${l.populacao?Math.round(l.populacao).toLocaleString('pt-BR'):'—'}</td></tr>`).join('')}
      </tbody>
    </table></div>`;
}

window.filtrarPlantSafra = function(s) {
  plantSafra = s;
  if (plantAba==='planejamento') renderPlantPlanejamento();
  else renderPlantAvaliar();
};

// ── ABA 2: Avaliar plantabilidade ──
function renderPlantAvaliar() {
  const el = document.getElementById('plant-aba-conteudo');

  const safrasOpts = safrasDisponiveis();

  )].map(k => { const [f,t] = k.split('||'); return {fazenda:f, talhao:t}; });

  el.innerHTML = `
    <div style="background:var(--branco);border-radius:var(--radius);padding:16px;box-shadow:var(--sombra);margin-bottom:16px">
      <div class="form-group">
        <label>Safra</label>
        <select id="pav-safra" onchange="filtrarPlantSafra(this.value)">
          <option value="">Selecione a safra</option>
          ${safrasOpts.map(s=>`<option value="${s}" ${plantSafra===s?'selected':''}>${s}</option>`).join('')}

      </div>
      <div class="form-group">
        <label>Talhão</label>
        <select id="pav-talhao" onchange="selecionarTalhaoPlant()">

        <label>Plantadeira</label>
        <select id="pav-plantadeira" onchange="selecionarPlantadeira()">
          <option value="">Selecione a plantadeira</option>

window.selecionarTalhaoPlant = function() {
  const v = document.getElementById('pav-talhao').value;
  const area = document.getElementById('pav-cultivar-area');
  if (!v) { area.innerHTML = ''; return; }
  const [fazenda, talhao] = v.split('||');
  // acha os plantios desse talhão na safra e os cultivares
  const cults = [];
  plantios.filter(p => normalizar(p.fazenda)===normalizar(fazenda) && normalizar(p.talhao)===normalizar(talhao) && (!plantSafra||p.safra===plantSafra))
    .forEach(p => cultivaresDoPlantio(p).forEach(cv => { if (cv.cultivar) cults.push({cultivar:cv.cultivar, populacao:cv.populacao||0}); }));
  if (cults.length === 0) {
    area.innerHTML = '<div style="color:var(--vermelho);font-size:13px">Nenhum cultivar cadastrado para este talhão.</div>';
    return;
  }
  if (cults.length === 1) {
    // 1 cultivar: já seleciona automaticamente
    area.innerHTML = `
      <div class="form-group">
        <label>Cultivar</label>
        <input type="text" value="${cults[0].cultivar}" readonly style="background:var(--creme)">
        <input type="hidden" id="pav-cultivar" value="${cults[0].cultivar}">
        <input type="hidden" id="pav-populacao" value="${cults[0].populacao}">
      </div>
      <div style="font-size:13px;color:var(--cinza)">População: <b>${cults[0].populacao?Math.round(cults[0].populacao).toLocaleString('pt-BR'):'—'}</b> sementes/ha</div>`;
  } else {
    // vários cultivares: operador escolhe
    area.innerHTML = `
      <div class="form-group">
        <label>Cultivar (este talhão tem mais de um)</label>
        <select id="pav-cultivar-sel" onchange="selecionarCultivarPlant()">
          <option value="">Selecione o cultivar</option>
          ${cults.map((c,i)=>`<option value="${i}" data-pop="${c.populacao}">${c.cultivar} (${c.populacao?Math.round(c.populacao).toLocaleString('pt-BR'):'—'} sem/ha)</option>`).join('')}
        </select>
        <input type="hidden" id="pav-cultivar" value="">
        <input type="hidden" id="pav-populacao" value="">
      </div>
      <div id="pav-pop-info"></div>`;
  }
  renderMedidasArea();
};

window.selecionarCultivarPlant = function() {
  const sel = document.getElementById('pav-cultivar-sel');
  const opt = sel.options[sel.selectedIndex];
  const pop = opt.getAttribute('data-pop')||'';
  document.getElementById('pav-cultivar').value = opt.textContent.split(' (')[0];
  document.getElementById('pav-populacao').value = pop;
  const info = document.getElementById('pav-pop-info');
  if (info) info.innerHTML = pop ? `<div style="font-size:13px;color:var(--cinza)">População: <b>${Math.round(pop).toLocaleString('pt-BR')}</b> sementes/ha</div>` : '';
  renderMedidasArea();
};

window.selecionarPlantadeira = function() { renderMedidasArea(); };

// Área para digitar as distâncias entre sementes

  const area = document.getElementById('pav-medidas-area');
  if (!area) return;
  const temTalhao = document.getElementById('pav-talhao')?.value;
  const temPlantadeira = document.getElementById('pav-plantadeira')?.value;
  const temCultivar = document.getElementById('pav-cultivar')?.value;
  if (!temTalhao || !temPlantadeira || !temCultivar) { area.innerHTML = ''; renderResultado(); return; }
  area.innerHTML = `
    <div style="background:var(--branco);border-radius:var(--radius);padding:16px;box-shadow:var(--sombra);margin-bottom:16px">
      <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:15px;margin-bottom:10px">📏 Distâncias entre sementes (cm)</div>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <input type="number" id="pav-nova-medida" min="0" step="0.1" placeholder="Ex: 5.5" style="flex:1" onkeydown="if(event.key==='Enter'){adicionarMedida();event.preventDefault();}">
        <button class="btn btn-primary" onclick="adicionarMedida()">+ Adicionar</button>
      </div>
      <div id="pav-lista-medidas" style="display:flex;flex-wrap:wrap;gap:6px">
        ${plantMedidas.map((m,i)=>`<span style="background:var(--creme);border:1px solid var(--creme-escuro);border-radius:8px;padding:5px 10px;font-family:'DM Mono',monospace;font-size:13px">${m} <span onclick="removerMedida(${i})" style="color:var(--vermelho);cursor:pointer;font-weight:700;margin-left:4px">✕</span></span>`).join('')}
      </div>
      ${plantMedidas.length>0?`<div style="font-size:12px;color:var(--cinza);margin-top:8px">${plantMedidas.length} medida(s) registrada(s)</div>`:'<div style="font-size:12px;color:var(--cinza);margin-top:8px">Adicione as distâncias medidas no campo, uma a uma.</div>'}

}

window.adicionarMedida = function() {
  const inp = document.getElementById('pav-nova-medida');
  const v = parseFloat(inp.value);
  if (!v || v <= 0) { toast('Digite uma distância válida.','erro'); return; }
  plantMedidas.push(v);
  inp.value = '';
  inp.focus();
  renderMedidasArea();
};

window.removerMedida = function(i) {
  plantMedidas.splice(i,1);
  renderMedidasArea();
};

window.salvarAvaliacaoPlant = async function() {
  const v = document.getElementById('pav-talhao')?.value;
  const pdId = document.getElementById('pav-plantadeira')?.value;
  const cultivar = document.getElementById('pav-cultivar')?.value;
  const pop = parseFloat(document.getElementById('pav-populacao')?.value)||0;
  if (!v || !pdId || !cultivar || plantMedidas.length < 2) { toast('Complete a avaliação antes de salvar.','erro'); return; }
  const [fazenda, talhao] = v.split('||');
  const pd = plantadeiras.find(x=>x.id===pdId);
  const r = calcularPlantabilidade(pop, pd.espacamento_linha, plantMedidas);
  const registro = {
    safra: plantSafra||'', fazenda, talhao, cultivar, populacao: pop,
    plantadeira_id: pdId, plantadeira_nome: pd.nome, espacamento_linha: pd.espacamento_linha,
    medidas: plantMedidas.slice(), n: r.n, dist_ideal: r.distIdeal,
    falhas: r.falhas, duplas: r.duplas, normais: r.normais,
    pct_falhas: r.pctFalhas, pct_duplas: r.pctDuplas, cv: r.cv,
    media: r.media, desvio: r.desvio,
    criado_em: Timestamp.now()
  };
  try {
    const ref = await addDoc(collection(db,'insumos_plantabilidade'), registro);
    avaliacoesPlant.push({ id: ref.id, ...registro });
    plantMedidas = [];
    toast('Avaliação salva com sucesso!');
    renderPlantAvaliar();
  } catch(e) { toast('Erro ao salvar: '+e.message,'erro'); }
};

function renderSubabaAplic() {
  const el = document.getElementById('aplic-conteudo');
  let lista, vazio;
  if (aplicSubaba === 'pendentes') {
    lista = adubacoes.filter(a => a.status==='planejado' || a.status==='enviado_operador');
    vazio = 'Nenhuma aplicação pendente';
  } else if (aplicSubaba === 'execucao') {
    lista = adubacoes.filter(a => a.status==='execucao');
    vazio = 'Nenhuma aplicação em execução';
  } else {
    lista = adubacoes.filter(a => a.status==='concluido');
    vazio = 'Nenhuma aplicação concluída';
  }
  if (lista.length === 0) {
    el.innerHTML = `<div style="text-align:center;padding:56px 16px;color:var(--aplic-texto3)"><div style="font-size:34px;opacity:.35;margin-bottom:10px">🌾</div>${vazio}</div>`;
    return;
  }

  // Cada registro é seu próprio card (sem agrupamento por data/talhão).
  // Agora que cada registro já pode ter múltiplos produtos dentro, agrupar
  // registros diferentes causaria mistura de aplicações separadas.
  const ordenados = lista.map(a => ({
    data: a.data||'', fazenda: a.fazenda||'—', talhao: a.talhao||'—',
    status: a.status, itens: [a]
  })).sort((a,b) => {
    if ((a.data||'') !== (b.data||'')) return (a.data||'').localeCompare(b.data||'');
    if (normalizar(a.fazenda) !== normalizar(b.fazenda)) return a.fazenda.localeCompare(b.fazenda);
    return a.talhao.localeCompare(b.talhao);
  });
  if (aplicSubaba === 'concluidas') ordenados.reverse();

  el.innerHTML = `<div style="display:flex;flex-direction:column;gap:10px">${ordenados.map((g,i) => cardAplicacao(g,i)).join('')}</div>`;
}

// Card compacto e clean; expande ao clicar mostrando produtos e observações
function cardAplicacao(g, idx) {
  const cardId = `aplic-card-${idx}`;
  const acaoTopo = g.status === 'execucao'
    ? `<span class="aplic-chip aplic-chip-exec">Em execução</span>`
    : g.status === 'concluido'
      ? `<span class="aplic-chip aplic-chip-ok">Concluída</span>`
      : `<span class="aplic-chip aplic-chip-pend">Pendente</span>`;

  // Área do talhão (do cadastro) — usada para calcular o total por produto
  const areaHa = areaDoTalhao(g.fazenda, g.talhao);

  // Linhas da tabela: Produto | Dose (un/ha) | Total (un) — expande múltiplos produtos por item
  const linhas = g.itens.map(it => {
    return produtosDaAplicacao(it).map(p => {
      const un = p.unidade || '';
      const dose = p.dose ? `${fmt(p.dose)} ${un}/ha` : '—';
      const total = (p.dose && areaHa > 0) ? `${fmt(p.dose * areaHa)} ${un}` : '—';
      return `
      <tr>
        <td class="aplic-td-prod">${p.produto||'—'}</td>
        <td class="aplic-td-dose">${dose}</td>
        <td class="aplic-td-total">${total}</td>
      </tr>`;
    }).join('');
  }).join('');

  // Observações do planejamento (uma por produto, se houver) + timestamps
  const extras = g.itens.map(it => {
    const partes = [];
    if (it.obs) partes.push(`📝 ${it.produto ? `<strong>${it.produto}:</strong> ` : ''}${it.obs}`);
    if (it.iniciado_em) partes.push(`Início: ${fmtDataHora(it.iniciado_em)}`);
    if (it.data_conclusao) partes.push(`Concluído: ${it.data_conclusao}`);
    return partes.length ? `<div class="aplic-extra">${partes.join('<br>')}</div>` : '';
  }).join('');

  // Observação do operador (mostrada quando concluída ou já preenchida)
  const obsOp = g.itens.map(it => it.obs_operador).find(Boolean) || '';
  const extraObsOp = (obsOp && g.status === 'concluido')
    ? `<div class="aplic-extra">🧑‍🌾 <strong>Operador:</strong> ${obsOp.replace(/</g,'&lt;')}</div>` : '';

  // Botão de ação da operação inteira (todos os produtos do card mudam juntos)
  let botaoOperacao = '';
  const temPendente = g.itens.some(it => it.status === 'planejado' || it.status === 'enviado_operador');
  const temExecucao = g.itens.some(it => it.status === 'execucao');
  if (temPendente) {
    botaoOperacao = `<button class="aplic-btn aplic-btn-iniciar" onclick="event.stopPropagation();aplicIniciarGrupo('${cardId}')">▶ Iniciar aplicação</button>`;
  } else if (temExecucao) {
    botaoOperacao = `<button class="aplic-btn aplic-btn-concluir" onclick="event.stopPropagation();aplicConcluirGrupo('${cardId}')">■ Concluir aplicação</button>`;
  }
  // Guarda os ids dos itens do grupo para as ações em lote
  const idsGrupo = g.itens.map(it => it.id).join(',');

  const cabecalhoArea = areaHa > 0
    ? `<span class="aplic-card-area">${fmt(areaHa)} ha</span>`
    : `<span class="aplic-card-area aplic-card-area-alerta" title="Cadastre a área do talhão em Cadastros para calcular o total">área não cadastrada</span>`;

  // Tipo da operação (selo colorido + cor de fundo do card)
  const ehPulv = g.itens.some(it => tipoDaAdubacao(it) === 'pulverizacao');
  const vazaoGrupo = (g.itens.find(it => it.vazao) || {}).vazao || '';
  const seloTipo = ehPulv
    ? `<span class="aplic-tipo aplic-tipo-pulv">💧 Pulverização${vazaoGrupo?` · ${vazaoGrupo}`:''}</span>`
    : `<span class="aplic-tipo aplic-tipo-solido">🪨 Sólidos</span>`;

  // ── CÁLCULO POR TANQUE (só pulverização, tanque de 3.100 L) ──
  // Área coberta por tanque = capacidade ÷ vazão (L/ha).
  // Volume de cada produto por tanque = dose × área coberta.
  // Último tanque: área que sobra depois dos tanques cheios, com volumes proporcionais.
  const TANQUE_L = 3100;
  const vazaoNum = parseFloat(((String(vazaoGrupo).match(/\d+[.,]?\d*/)||[''])[0]).replace(',','.')) || 0;
  let blocoTanque = '';
  if (ehPulv && vazaoNum > 0) {
    const areaPorTanque = TANQUE_L / vazaoNum;
    const prods = g.itens.flatMap(it => produtosDaAplicacao(it)).filter(p => p.produto);
    let infoTanques = '', colUltimo = '', linhasUltimo = false, restoHa = 0, nCheios = 0;
    if (areaHa > 0) {
      nCheios = Math.floor(areaHa / areaPorTanque + 1e-9);
      restoHa = areaHa - nCheios * areaPorTanque;
      if (restoHa < 0.005) { restoHa = 0; }
      linhasUltimo = restoHa > 0;
      infoTanques = `
        <div class="aplic-tanque-resumo">
          <div>🛢 Cada tanque cheio (${fmt(TANQUE_L)} L) cobre <strong>${fmt(areaPorTanque)} ha</strong></div>
          <div>➡️ Neste talhão: <strong>${nCheios} tanque(s) cheio(s)</strong>${linhasUltimo?` + <strong>último tanque de ${fmt(restoHa)} ha</strong> (${fmt(restoHa*vazaoNum)} L de calda)`:' (fecha exato, sem sobra)'}</div>
        </div>`;
    } else {
      infoTanques = `
        <div class="aplic-tanque-resumo">
          <div>🛢 Cada tanque cheio (${fmt(TANQUE_L)} L) cobre <strong>${fmt(areaPorTanque)} ha</strong></div>
          <div style="color:var(--aplic-ambar)">⚠️ Sem área do talhão cadastrada — não dá pra calcular o último tanque.</div>
        </div>`;
    }
    const linhasTanque = prods.map(p => {
      const porTanque = p.dose * areaPorTanque;
      const noUltimo = linhasUltimo ? p.dose * restoHa : 0;
      return `<tr>
        <td class="aplic-td-prod">${p.produto}</td>
        <td class="aplic-td-total">${fmt(porTanque)} ${p.unidade||''}</td>
        ${linhasUltimo?`<td class="aplic-td-total">${fmt(noUltimo)} ${p.unidade||''}</td>`:''}
      </tr>`;
    }).join('');
    blocoTanque = `
      <div class="aplic-tanque">
        <div class="aplic-tanque-titulo">🛢 Volume por tanque</div>
        ${infoTanques}
        <table class="aplic-tabela aplic-tabela-tanque">
          <thead><tr><th>Produto</th><th>Tanque cheio</th>${linhasUltimo?`<th>Último tanque</th>`:''}</tr></thead>
          <tbody>${linhasTanque}</tbody>
        </table>
      </div>`;
  }

  // Campo de observação do operador (sempre visível quando em execução).
  // Salva no primeiro item do grupo (obs_operador).
  const primeiroId = g.itens[0]?.id || '';
  const obsOperadorAtual = g.itens.map(it => it.obs_operador).find(Boolean) || '';
  const blocoObsOperador = temExecucao ? `
    <div class="aplic-obs-op">
      <label>Observação do operador</label>

// Busca a área (ha) de um talhão pelo cadastro, casando fazenda + nome do talhão
function areaDoTalhao(fazenda, talhao) {
  if (!talhao) return 0;
  const t = talhoes.find(t =>
    normalizar(t.nome) === normalizar(talhao) &&
    (!fazenda || normalizar(t.fazenda||'') === normalizar((fazenda||'').replace('Fazenda ','')))
  );
  return t ? (parseFloat(t.area_ha) || 0) : 0;
}

// ── BAIXA AUTOMÁTICA DE ESTOQUE ──
// Ao concluir uma aplicação, gera a retirada correspondente (dose × área do talhão)
// e vincula à aplicação (aplicacao_id) para não duplicar nem perder rastreio.
async function baixarEstoquePorAplicacao(a) {
  if (!a || a.estoque_baixado) return { ok: true }; // já baixado
  const areaHa = areaDoTalhao(a.fazenda, a.talhao);
  if (areaHa <= 0) return { ok: false, motivo: 'talhão sem área cadastrada' };
  const prods = produtosDaAplicacao(a).filter(p => (parseFloat(p.dose)||0) > 0);
  if (prods.length === 0) return { ok: false, motivo: 'sem dose' };

  const retirada_ids = [];
  let algumSemCadastro = false;
  try {
    for (const p of prods) {
      const dose = parseFloat(p.dose) || 0;
      const qtd = dose * areaHa;
      // Casa o produto com o estoque (match exato ou parcial)
      const alvo = normalizar(p.produto || '');
      let est = estoque.find(e => normalizar(e.produto) === alvo);
      if (!est) est = estoque.find(e => normalizar(e.produto).includes(alvo) || alvo.includes(normalizar(e.produto)));
      if (!est) algumSemCadastro = true;
      const retirada = {
        produto: est ? est.produto : (p.produto || ''),
        unidade: est ? est.unidade : (p.unidade || ''),
        quantidade: qtd,
        fazenda: a.fazenda || '', talhao: a.talhao || '',
        cultura: '', safra: a.safra || '',
        obs: `Baixa automática — aplicação concluída (${fmt(dose)} ${p.unidade||''}/ha × ${fmt(areaHa)} ha)`,
        custo_unitario: est ? (est.custo_medio||0) : 0,
        custo_total: qtd * (est ? (est.custo_medio||0) : 0),
        data: Timestamp.now(), operador_uid: usuarioAtual?.uid || '',
        origem: 'aplicacao', aplicacao_id: a.id
      };
      const ref = await addDoc(collection(db,'insumos_retiradas'), retirada);
      retiradas.unshift({id: ref.id, ...retirada});
      retirada_ids.push(ref.id);
    }
    await updateDoc(doc(db,'insumos_campo_adubacao',a.id), { estoque_baixado: true, retirada_ids });
    a.estoque_baixado = true; a.retirada_ids = retirada_ids;
    recalcularEstoque();
    return { ok: true, semCadastro: algumSemCadastro };
  } catch(e) {
    return { ok: false, motivo: e.message };
  }
}

// Reverte a baixa (usado quando o master volta o status de "concluído")
async function reverterBaixaAplicacao(a) {
  if (!a || !a.estoque_baixado) return;
  // suporta formato novo (retirada_ids[]) e antigo (retirada_id)
  const ids = Array.isArray(a.retirada_ids) ? a.retirada_ids : (a.retirada_id ? [a.retirada_id] : []);
  try {
    for (const rid of ids) {
      await deleteDoc(doc(db,'insumos_retiradas',rid));
      const i = retiradas.findIndex(r=>r.id===rid);
      if (i>=0) retiradas.splice(i,1);
    }
    await updateDoc(doc(db,'insumos_campo_adubacao',a.id), { estoque_baixado: false, retirada_ids: [], retirada_id: '' });
    a.estoque_baixado = false; a.retirada_ids = []; a.retirada_id = '';
    recalcularEstoque();
  } catch(e) { /* silencioso */ }
}

window.aplicConcluir = async function(id, emLote, obsOperador) {
  const a = adubacoes.find(x=>x.id===id);
  if (!a) return;
  if (!emLote && !confirm(`Concluir a aplicação de "${a.produto}" em ${a.talhao}?`)) return;
  const data_conclusao = hoje();
  const iniciado_em_ts = (typeof a.iniciado_em === 'number') ? a.iniciado_em : (a.iniciado_em?.toMillis ? a.iniciado_em.toMillis() : null);
  // aplica local na hora
  a.status = 'concluido'; a.data_conclusao = data_conclusao;
  if (obsOperador != null && obsOperador !== '') a.obs_operador = obsOperador;
  const acao = { tipo:'concluir', id, data_conclusao, obs_operador: obsOperador||'', iniciado_em_ts };
  if (estaOnline()) {
    try {
      const upd = { status:'concluido', data_conclusao };
      if (obsOperador != null && obsOperador !== '') upd.obs_operador = obsOperador;
      await updateDoc(doc(db,'insumos_campo_adubacao',id), upd);
      const baixa = await baixarEstoquePorAplicacao(a);

        else toast(`Concluída, mas estoque NÃO baixado: ${baixa.motivo}.`, 'erro');
      }
    } catch(e) {
      enfileirarAcao(acao); // falhou online: enfileira
      if (!emLote) toast('Concluída (será sincronizada em breve).');
    }
  } else {
    enfileirarAcao(acao); // offline
    if (!emLote) toast('Concluída (offline) — vai sincronizar ao voltar a rede.');
  }
  salvarCacheAplicacoes();
  if (!emLote) renderModoAplicacoes();
};

// Estoque real = soma das entradas (compras) do ACF Estoque, menos as retiradas lançadas aqui no Insumos.
// O ACF Estoque nunca teve "saídas" para insumos — essa é a peça que o ACF Gestão adiciona.
function recalcularEstoque() {
  const mapa = {};
  entradasRaw.forEach(e => {
    const nome = (e.prodNome || '').trim();
    if (!nome) return;
    const k = normalizar(nome);
    if (!mapa[k]) mapa[k] = { produto: nome, unidade: e.unid||'', qtdEntradas:0, valorEntradas:0, prodId: e.prodId||'' };
    const qtd = parseFloat(e.qtd)||0;
    const preco = parseFloat(e.preco)||0;
    mapa[k].qtdEntradas += qtd;
    mapa[k].valorEntradas += qtd*preco;
    if (e.unid) mapa[k].unidade = e.unid;
    if (e.prodId) mapa[k].prodId = e.prodId;
    const dtVal = e.dt?.toDate ? e.dt.toDate() : (e.dt ? new Date(e.dt) : null);
    if (dtVal && (!mapa[k].ultimaEntradaDt || dtVal > mapa[k].ultimaEntradaDt)) mapa[k].ultimaEntradaDt = dtVal;
  });
  const qtdRetiradaPorProduto = {};
  retiradas.forEach(r => {
    const k = normalizar(r.produto);
    qtdRetiradaPorProduto[k] = (qtdRetiradaPorProduto[k]||0) + (parseFloat(r.quantidade)||0);
  });
  estoque = Object.entries(mapa).map(([k, m]) => ({
    id: k, produto: m.produto, unidade: m.unidade, prodId: m.prodId,
    custo_medio: m.qtdEntradas>0 ? m.valorEntradas/m.qtdEntradas : 0,
    quantidade: m.qtdEntradas - (qtdRetiradaPorProduto[k]||0),
    ultima_entrada: m.ultimaEntradaDt ? m.ultimaEntradaDt.toLocaleDateString('pt-BR') : ''
  })).sort((a,b) => a.produto.localeCompare(b.produto));
}

// ══════════════ DASHBOARD ══════════════
function renderDashboard() {
  const hojeStr = hoje();
  // Junta todas as operações do caderno num formato comum
  const ops = [];
  // Converte iniciado_em (Timestamp ou número) para data ISO
  const dataInicio = (v) => {
    if (!v) return '';
    try { const d = v.toDate ? v.toDate() : new Date(v); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    catch(e) { return ''; }
  };
  plantios.forEach(p => { const cs = cultivaresDoPlantio(p); const nomes = cs.map(c=>c.cultivar).filter(Boolean).join(', '); ops.push({ tipo:'Plantio', icone:'🌱', data:p.data, iniciado:dataInicio(p.iniciado_em), data_conclusao:p.data_conclusao||'', fazenda:p.fazenda, talhao:p.talhao, status:p.status, desc:`${p.cultura||'Plantio'}${nomes?` (${nomes})`:''}`, descricao:p.cultura||'', produtos: cs.map(c=>({produto:`${c.cultivar||p.cultura||'—'}`, dose:c.ciclo_dias?`ciclo ${fmt(c.ciclo_dias)}d`:'', unidade:''})) }); });
  adubacoes.forEach(a => ops.push({ tipo: tipoDaAdubacao(a)==='pulverizacao'?'Pulverização':'Sólidos', icone: tipoDaAdubacao(a)==='pulverizacao'?'💧':'🪨', data:a.data, iniciado:dataInicio(a.iniciado_em), data_conclusao:a.data_conclusao||'', fazenda:a.fazenda, talhao:a.talhao, status:a.status, desc: resumoProdutos(a), descricao: a.categoria||(tipoDaAdubacao(a)==='pulverizacao'?'Pulverização':'Sólido'), produtos: produtosDaAplicacao(a) }));
  colheitas.forEach(c => ops.push({ tipo:'Colheita', icone:'🌾', data:c.data, iniciado:dataInicio(c.iniciado_em), data_conclusao:c.data_conclusao||'', fazenda:c.fazenda, talhao:c.talhao, status:c.status, desc:`${c.cultura||'Colheita'}`, descricao:c.cultura||'Colheita', produtos: c.produtividade?[{produto:c.cultura||'Colheita', dose:`${fmt(c.produtividade)} ${c.unidade_produtividade||'sc/ha'}`, unidade:''}]:[] }));

  // Contadores por status
  const nPlanejadas = ops.filter(o => o.status==='planejado' || o.status==='enviado_operador').length;
  const nExecucao = ops.filter(o => o.status==='execucao').length;
  const nConcluidas = ops.filter(o => o.status==='concluido').length;

  // ATRASADA = concluída DEPOIS da data planejada. Dias de atraso = execução − planejada.
  // Planejadas / em execução NÃO contam como atrasadas.
  function diasEntre(d1, d2) { // d2 - d1 em dias (datas ISO)
    const a = new Date(d1+'T00:00:00'), b = new Date(d2+'T00:00:00');
    return Math.round((b - a) / 86400000);
  }
  const atrasadas = ops
    .filter(o => o.status==='concluido' && o.data && o.data_conclusao && o.data_conclusao > o.data)
    .map(o => ({ ...o, diasAtraso: diasEntre(o.data, o.data_conclusao) }))
    .filter(o => o.diasAtraso > 0)
    .sort((a,b)=> b.diasAtraso - a.diasAtraso);

  // Agrupa por dias de atraso (ex: "3 atrasadas 2 dias")
  const porDias = {};
  atrasadas.forEach(o => { porDias[o.diasAtraso] = (porDias[o.diasAtraso]||0) + 1; });
  const resumoAtraso = Object.keys(porDias).map(Number).sort((a,b)=>b-a)
    .map(d => `${porDias[d]} atrasada${porDias[d]>1?'s':''} ${d} dia${d>1?'s':''}`).join(' · ');

  // Próximas 5 planejadas (data >= hoje, não concluídas)
  const proximas = ops.filter(o => o.status!=='concluido' && o.data && o.data >= hojeStr)
    .sort((a,b)=>(a.data||'').localeCompare(b.data||''))
    .slice(0,5);

  // Listas para os cards expansíveis
  const emExecucao = ops.filter(o => o.status==='execucao');
  const executadas = ops.filter(o => o.status==='concluido').sort((a,b)=>(b.data_conclusao||'').localeCompare(a.data_conclusao||''));
  const ultimas6 = executadas.slice(0,6);
  // Pendentes vencidas: planejadas/em execução com data já passada e não concluídas
  const pendentesVencidas = ops
    .filter(o => o.status!=='concluido' && o.data && o.data < hojeStr)
    .map(o => ({ ...o, diasVencida: diasEntre(o.data, hojeStr) }))
    .sort((a,b)=> b.diasVencida - a.diasVencida);

  // Monta um painel de detalhes (lista de operações com fazenda, talhão, tipo e as 3 datas + produtos)
  const painelOps = (lista, corData) => lista.length===0

// ── Calendário mensal de aplicações no dashboard ──
// Amarelo = sólidos, Azul = pulverização. Mostra só o talhão nos dias com aplicação.
let calMesAtual = null; // {ano, mes} — mes 0-11
window.mudarMesCalendario = function(delta) {
  if (!calMesAtual) return;
  let m = calMesAtual.mes + delta, a = calMesAtual.ano;
  if (m < 0) { m = 11; a--; } else if (m > 11) { m = 0; a++; }
  calMesAtual = { ano: a, mes: m };
  renderCalendarioDash();
};

function renderCalendarioDash() {
  const cont = document.getElementById('dash-calendario');
  if (!cont) return;
  // Mês inicial: o atual
  if (!calMesAtual) { const h = new Date(); calMesAtual = { ano: h.getFullYear(), mes: h.getMonth() }; }
  const { ano, mes } = calMesAtual;

  // Junta aplicações por dia. Concluídas entram em VERDE na data de execução;
  // as demais entram na cor do tipo (amarelo=sólido, azul=pulverização) na data planejada.
  // Pendentes cuja data já passou recebem marca de vencida (borda vermelha).
  const hojeCal = hoje();
  const porDia = {}; // 'AAAA-MM-DD' -> [{talhao, classe, vencida}]
  adubacoes.forEach(a => {
    let dref, classe, vencida = false;
    if (a.status === 'concluido' && a.data_conclusao) {
      dref = String(a.data_conclusao).slice(0,10);
      classe = 'cal-concluido';
    } else {
      if (!a.data) return;
      dref = String(a.data).slice(0,10);
      classe = tipoDaAdubacao(a)==='pulverizacao' ? 'cal-pulv' : 'cal-solido';
      vencida = dref < hojeCal; // planejada/em execução com data já passada
    }
    if (!porDia[dref]) porDia[dref] = [];
    porDia[dref].push({ talhao: a.talhao||'—', classe, vencida });
  });

  const nomesMeses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const primeiroDia = new Date(ano, mes, 1).getDay(); // 0=domingo
  const diasNoMes = new Date(ano, mes+1, 0).getDate();
  const hojeISO = hoje();

  let celulas = '';
  // espaços vazios antes do dia 1
  for (let i=0;i<primeiroDia;i++) celulas += `<div class="cal-cel cal-vazia"></div>`;
  for (let dia=1; dia<=diasNoMes; dia++) {
    const iso = `${ano}-${String(mes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
    const evs = porDia[iso] || [];
    const ehHoje = iso === hojeISO;
    const tags = evs.map(e => `<span class="cal-tag ${e.classe}${e.vencida?' cal-vencida':''}">${e.vencida?'⚠ ':''}${e.talhao}</span>`).join('');
    celulas += `<div class="cal-cel ${ehHoje?'cal-hoje':''}">
      <div class="cal-num">${dia}</div>
      <div class="cal-tags">${tags}</div>
    </div>`;
  }

  cont.innerHTML = `
    <div class="cal-topo">
      <button class="btn btn-sm btn-secondary" onclick="mudarMesCalendario(-1)">◀</button>
      <div class="cal-titulo">${nomesMeses[mes]} ${ano}</div>
      <button class="btn btn-sm btn-secondary" onclick="mudarMesCalendario(1)">▶</button>
    </div>
    <div class="cal-legenda">
      <span><span class="cal-bola cal-solido"></span> Sólidos</span>
      <span><span class="cal-bola cal-pulv"></span> Pulverização</span>
      <span><span class="cal-bola cal-concluido"></span> Concluída</span>
      <span><span class="cal-bola" style="background:#fff;border:2px solid var(--vermelho)"></span> Vencida</span>
    </div>
    <div class="cal-grid cal-cabecalho">
      ${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
    </div>
    <div class="cal-grid">${celulas}</div>`;
}

window.toggleDashCard = function(qual) {
  const el = document.getElementById('dashexp-'+qual);
  const seta = document.getElementById('seta-'+qual);
  if (!el) return;
  // fecha os outros
  ['exec','exec-done','atraso','vencidas'].forEach(q => {
    if (q !== qual) {
      const outro = document.getElementById('dashexp-'+q); if (outro) outro.style.display='none';
      const s = document.getElementById('seta-'+q); if (s) s.textContent='▾';
    }
  });
  const abrir = el.style.display === 'none';
  el.style.display = abrir ? 'block' : 'none';
  if (seta) seta.textContent = abrir ? '▴' : '▾';
};

window.toggleDashOp = function(idx) {
  const det = document.getElementById('dashdet-'+idx);
  const seta = document.getElementById('dashseta-'+idx);
  if (!det) return;
  const abrir = det.style.display === 'none';
  det.style.display = abrir ? 'table-row' : 'none';
  if (seta) seta.textContent = abrir ? '▴' : '▾';
};

// ══════════════ PREVISÃO DE COBERTURA ══════════════
window.renderCobertura = renderCobertura;
let coberturaJanela = 0; // 0 = tudo; ou 3, 7, 10, 15 dias
window.mudarJanelaCobertura = function(dias) { coberturaJanela = parseInt(dias)||0; renderCobertura(); };

async function renderCobertura() {
  const alvo = () => document.getElementById('estoque-conteudo') || document.getElementById('main-content');
  alvo().innerHTML = `<div class="loading"><div class="spinner"></div> Cruzando planejamento e estoque...</div>`;

  const hojeStr = hoje();
  const limite = coberturaJanela > 0 ? somarDias(hojeStr, coberturaJanela) : null;

  // Aplicações que entram no cálculo: não concluídas E (atrasadas OU dentro da janela).
  // Atrasadas (data < hoje) sempre entram. Se janela = "Tudo", entram todas as não concluídas.
  const planejadasBrutas = adubacoes.filter(a => {
    if (a.status === 'concluido') return false;
    if (!limite) return true;                    // "Tudo"
    if (!a.data) return true;                     // sem data: mantém para não sumir
    if (a.data < hojeStr) return true;            // atrasada: sempre entra
    return a.data <= limite;                      // dentro da janela
  });

  const planejadas = planejadasBrutas.map(a => ({
    talhao: a.talhao, fazenda: a.fazenda,
    produtos: produtosDaAplicacao(a).map(p => ({ produto: p.produto, dose: p.dose }))
  }));

  // Necessidade por produto: dose × área
  const necessidade = {};
  planejadas.forEach(a => {
    let areaHa = parseFloat(a.area || a.areaHa || a.area_ha || a.hectares) || 0;
    if (!areaHa && a.talhao) {
      const t = talhoes.find(t => normalizar(t.nome) === normalizar(a.talhao) && (!a.fazenda || normalizar(t.fazenda||'') === normalizar((a.fazenda||'').replace('Fazenda ',''))));
      if (t) areaHa = parseFloat(t.area_ha) || 0;
    }
    (a.produtos||[]).forEach(p => {
      const nome = p.produto || p.nome || '';
      if (!nome) return;
      const k = normalizar(nome);
      if (!necessidade[k]) necessidade[k] = { produto: nome, total: 0, aplicacoesSemArea: 0, dosesSemArea: [] };
      const dose = parseFloat(String(p.dose).replace(',','.')) || 0;
      if (areaHa > 0) necessidade[k].total += dose * areaHa;
      else { necessidade[k].aplicacoesSemArea++; necessidade[k].dosesSemArea.push(dose); }
    });
  });

  // Pendente nos pedidos (a receber)
  const pendentePedidos = {};
  pedidos.filter(p => p.status !== 'entregue_total' && p.status !== 'cancelado').forEach(p => {
    (p.itens||[]).forEach(it => {
      const k = normalizar(it.produto);
      const pend = (it.quantidade||0) - (it.quantidade_recebida||0);
      if (pend > 0) pendentePedidos[k] = (pendentePedidos[k]||0) + pend;
    });
  });

  // Montar linhas com dois saldos: só estoque, e estoque + pedidos
  const chaves = Object.keys(necessidade);
  let rows = chaves.map(k => {
    const n = necessidade[k];
    const est = estoque.find(e => normalizar(e.produto) === k);
    const emEstoque = est ? (est.quantidade||0) : 0;
    const unidade = est ? est.unidade : '';
    const aChegar = pendentePedidos[k] || 0;
    const saldoEstoque = emEstoque - n.total;             // só o que tenho hoje
    const saldoComPedidos = emEstoque + aChegar - n.total; // contando o que vai chegar
    return { ...n, emEstoque, aChegar, saldoEstoque, saldoComPedidos, unidade, k };
  }).sort((a,b) => a.saldoEstoque - b.saldoEstoque);

  const faltando = rows.filter(r => r.saldoEstoque < 0).length;           // falta no estoque físico
  const semArea = rows.filter(r => r.aplicacoesSemArea > 0).length;

  const nQ = planejadasBrutas.length;
  const rotuloJanela = coberturaJanela > 0 ? `próximos ${coberturaJanela} dias + atrasadas` : 'todas as aplicações não concluídas';

  const botaoJanela = (dias, rotulo) =>
    `<button class="btn btn-sm ${coberturaJanela===dias?'btn-primary':'btn-secondary'}" onclick="mudarJanelaCobertura(${dias})">${rotulo}</button>`;

  alvo().innerHTML = `
    <div class="sec-header">
      <div class="sec-titulo">🔮 Previsão de Cobertura de Estoque</div>
      <button class="btn btn-secondary btn-sm" onclick="renderCobertura()">↻ Atualizar</button>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center">
      <span style="font-size:13px;color:var(--cinza);margin-right:4px">Janela:</span>
      ${botaoJanela(3,'3 dias')}
      ${botaoJanela(7,'7 dias')}
      ${botaoJanela(10,'10 dias')}
      ${botaoJanela(15,'15 dias')}
      ${botaoJanela(0,'Tudo')}
    </div>
    <p style="font-size:13px;color:var(--cinza);margin-bottom:16px">
      Necessidade de <strong>${nQ}</strong> aplicação(ões) — ${rotuloJanela}.
      <strong>Saldo</strong> = estoque − necessário. A coluna "A receber" mostra os pedidos em aberto (não entram no saldo).
    </p>
    ${faltando > 0 ? `
    <div style="background:#fee2e2;border:1px solid #fca5a5;border-radius:var(--radius);padding:14px 18px;margin-bottom:16px">
      🔴 <strong>${faltando} produto(s) sem cobertura no estoque</strong> para esta janela — considere fazer pedido de compra.
    </div>` : chaves.length > 0 ? `
    <div style="background:#d1fae5;border:1px solid #6ee7b7;border-radius:var(--radius);padding:14px 18px;margin-bottom:16px">
      ✅ <strong>Todos os produtos têm cobertura no estoque para esta janela!</strong>
    </div>` : ''}
    ${semArea > 0 ? `
    <div style="background:#fef3c7;border:1px solid #fcd34d;border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;font-size:13px">
      ⚠️ ${semArea} produto(s) têm aplicações sem área definida — a necessidade pode estar subestimada. Cadastre a área dos talhões em <strong>⚙️ Cadastros</strong>.
    </div>` : ''}

    ${chaves.length === 0 ? `
    <div class="tabela-wrap"><div class="tabela-vazia">Nenhuma aplicação ${coberturaJanela>0?'nesta janela':'planejada'}.<br>
    ${coberturaJanela>0?'Tente uma janela maior ou "Tudo".':'Crie um planejamento em 📓 Caderno de Campo.'}</div></div>` : `
    <div class="tabela-wrap"><table>
      <thead><tr><th>Produto</th><th>Necessário</th><th>Em Estoque</th><th>A Receber</th><th>Saldo</th></tr></thead>
      <tbody>
      ${rows.map(r => `
        <tr style="${r.saldoEstoque<0?'background:#fef2f2':''}">
          <td><strong>${r.produto}</strong>${r.aplicacoesSemArea>0?` <span class="badge badge-amarelo" title="aplicações sem área">⚠ s/área</span>`:''}</td>
          <td>${fmt(r.total)} ${r.unidade}</td>
          <td>${fmt(r.emEstoque)}</td>
          <td style="color:var(--azul)">${r.aChegar>0?'+'+fmt(r.aChegar):'—'}</td>
          <td style="font-weight:700;color:${r.saldoEstoque<0?'var(--vermelho)':'var(--verde)'}">${r.saldoEstoque<0?'🔴 Faltam '+fmt(Math.abs(r.saldoEstoque)):'✅ +'+fmt(r.saldoEstoque)}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>
    <div style="margin-top:16px">
      <button class="btn btn-primary" onclick="exportarCobertura()">📥 Exportar Excel</button>
    </div>`}
  `;
  window._coberturaRows = rows;
}

  );
};
