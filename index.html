window.ordenarPedidos = function(campo) {
  if (ordenacaoPedidos.campo === campo) ordenacaoPedidos.dir *= -1;
  else { ordenacaoPedidos.campo = campo; ordenacaoPedidos.dir = 1; }
  filtrarPedidos();
};

function thOrdPed(campo, rotulo) {
  const seta = ordenacaoPedidos.campo === campo ? (ordenacaoPedidos.dir===1?' ▲':' ▼') : '';
  return `<th class="th-ord" onclick="ordenarPedidos('${campo}')">${rotulo}<span class="th-seta">${seta}</span></th>`;
}

window.filtrarPedidos = function() {
  const statusF = document.getElementById('filtro-status-pedido')?.value || '';
  const safraF = document.getElementById('filtro-safra-pedido')?.value || '';
  const fornF = document.getElementById('filtro-fornecedor')?.value || '';
  const prodF = (document.getElementById('filtro-produto')?.value || '').toLowerCase();
  const lista = pedidos.filter(p => (!statusF || p.status === statusF) && (!fornF || p.fornecedor === fornF));
  const el = document.getElementById('lista-pedidos');
  if (!el) return;

  // Achata pedidos -> um item por linha (filtra safra e produto no nível do item)
  const linhas = [];
  lista.forEach(p => {
    (p.itens||[]).forEach(it => {
      if (safraF && normalizar(it.safra||'') !== normalizar(safraF)) return;
      if (prodF && !(it.produto||'').toLowerCase().includes(prodF)) return;
      const saldo = (it.quantidade||0) - (it.quantidade_recebida||0);
      const statusItem = saldo<=0 ? 'entregue_total' : (it.quantidade_recebida||0)>0 ? 'parcial' : 'pendente';
      linhas.push({ pedidoId: p.id, pedidoStatus: p.status, fornecedor: p.fornecedor, produto: it.produto,
        unidade: it.unidade, volumeCompra: it.quantidade||0, volumeRecebido: it.quantidade_recebida||0, saldo, statusItem,
        precoUnit: it.preco_unit||0 });
    });
  });
  if (linhas.length === 0) { el.innerHTML = `<div class="tabela-wrap"><div class="tabela-vazia">Nenhum pedido encontrado</div></div>`; return; }

  // Ordenação clicável
  const o = ordenacaoPedidos;
  const numericos = ['volumeCompra','volumeRecebido','saldo','precoUnit'];
  linhas.sort((a,b) => {
    let va = a[o.campo], vb = b[o.campo];
    if (o.campo === 'status') { va = a.statusItem; vb = b.statusItem; }
    if (numericos.includes(o.campo)) return ((va||0)-(vb||0)) * o.dir;
    return String(va||'').localeCompare(String(vb||''), 'pt', {numeric:true}) * o.dir;
  });

  el.innerHTML = `
    <div class="tabela-wrap"><table>
      <thead><tr>
        ${thOrdPed('fornecedor','Fornecedor')}
        ${thOrdPed('produto','Produto')}
        ${thOrdPed('volumeCompra','Compra')}
        ${thOrdPed('volumeRecebido','Recebido')}
        ${thOrdPed('saldo','Saldo')}
        ${thOrdPed('precoUnit','Valor/un')}
        ${thOrdPed('status','Status')}
        <th class="col-acoes">Ações</th>
      </tr></thead>
      <tbody>
        ${linhas.map(l => `
          <tr>
            <td><strong>${l.fornecedor}</strong></td>
            <td>${l.produto}</td>
            <td>${fmt(l.volumeCompra)} ${l.unidade}</td>
            <td>${fmt(l.volumeRecebido)} ${l.unidade}</td>
            <td style="font-weight:700;color:${l.saldo>0?'var(--laranja)':'var(--verde)'}">${fmt(l.saldo)} ${l.unidade}</td>
            <td>${l.precoUnit>0?'R$ '+fmt(l.precoUnit):'—'}</td>
            <td>${badgeStatus(l.statusItem)}</td>
            <td class="col-acoes"><div class="acoes-wrap">
              <button class="btn btn-sm btn-secondary" onclick="verPedido('${l.pedidoId}')">Ver</button>
              ${l.pedidoStatus !== 'entregue_total' && l.pedidoStatus !== 'cancelado' ?
                `<button class="btn btn-sm btn-laranja" onclick="abrirBaixa('${l.pedidoId}')">Receber</button>` : ''}
            </div></td>
          </tr>`).join('')}
      </tbody>
    </table></div>`;
};

const COLUNAS_PEDIDOS = ['Safra','Grupo','Fornecedor','Produto','Volume','Unidade (L, Kg, Ton, Bag, sc)','R$/unidade','R$ Total','Vencimento (data, "Barter" ou "30 DDF")'];
const EXEMPLO_PEDIDOS = ['Soja 26/27','Herbicida','Agro Insumos Ltda','Glifosato 480','200','L','32.50','6500','30 DDF'];

window.baixarModeloPedidos = function() {
  try {
    const ws = XLSX.utils.aoa_to_sheet([COLUNAS_PEDIDOS, EXEMPLO_PEDIDOS]);
    ws['!cols'] = COLUNAS_PEDIDOS.map(c => ({ wch: Math.max(c.length+2, 16) }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Modelo');
    XLSX.writeFile(wb, `ACF_Modelo_Pedidos.xlsx`);
  } catch(e) { toast('Erro ao gerar modelo: '+e.message,'erro'); }
};

window.importarPedidosExcel = function(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try {
      await carregarCompendio();
      const wb = XLSX.read(ev.target.result, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const linhas = XLSX.utils.sheet_to_json(ws, { defval: '' });
      if (linhas.length === 0) { toast('Planilha vazia.','erro'); input.value=''; return; }

      // 1ª passada: ler e agrupar por fornecedor
      const gruposPorFornecedor = {}; // fornecedor -> { itens:[...], vencimentos:[{produto,valor,vencimento}] }
      let ignorados = 0;
      linhas.forEach(row => {
        const fornecedor = (row['Fornecedor']||'').toString().trim();
        const produto = (row['Produto']||'').toString().trim();
        const volume = parseFloat(row['Volume'])||0;
        const unidade = (row['Unidade (L, Kg, Ton, Bag, sc)']||row['Unidade']||'').toString().trim();
        if (!fornecedor || !produto || volume<=0 || !unidade) { ignorados++; return; }

        const grupo = (row['Grupo']||'').toString().trim();
        const safra = (row['Safra']||'').toString().trim();
        let precoUnit = parseFloat(row['R$/unidade'])||0;
        let valorTotal = parseFloat(row['R$ Total'])||0;
        if (!precoUnit && valorTotal) precoUnit = valorTotal/volume;
        if (!valorTotal && precoUnit) valorTotal = precoUnit*volume;
        const condTxt = (row['Vencimento (data, "Barter" ou "30 DDF")']||row['Vencimento (AAAA-MM-DD)']||row['Vencimento']||'').toString().trim();
        const cond = interpretarCondicaoPagamento(condTxt);

        if (!gruposPorFornecedor[fornecedor]) gruposPorFornecedor[fornecedor] = { itens: [], vencimentos: [] };
        gruposPorFornecedor[fornecedor].itens.push({
          produto, categoria: grupo, safra, quantidade: volume, quantidade_recebida: 0,
          unidade, preco_unit: precoUnit, total: valorTotal,
          cond_pagamento: cond ? cond.texto : '',
          cond_tipo: cond ? cond.tipo : '',
          cond_dias: cond && cond.tipo==='ddf' ? cond.dias : 0
        });
        // Só cria conta com vencimento em data se o texto já for uma data.
        // "X DDF" vira conta na hora do recebimento; "Barter"/texto não gera vencimento.
        if (cond && cond.tipo==='data') {
          gruposPorFornecedor[fornecedor].vencimentos.push({ produto, valor: valorTotal, vencimento: cond.data, cond: cond.texto });
        }
      });

      const fornecedoresImportados = Object.keys(gruposPorFornecedor);
      if (fornecedoresImportados.length === 0) { toast('Nenhuma linha válida — confira Fornecedor, Produto, Volume e Unidade.','erro'); input.value=''; return; }

      // 2ª passada: gravar 1 pedido por fornecedor (com todos os itens) + 1 conta por item com vencimento
      const novosPedidos = [];
      const novasContas = [];
      let batch = writeBatch(db);
      let contadorBatch = 0;
      let itensImportados = 0;

      for (const fornecedor of fornecedoresImportados) {
        const grupo = gruposPorFornecedor[fornecedor];
        const valor_total = grupo.itens.reduce((s,it) => s+it.total, 0);
        const pedido = {
          fornecedor, fazenda: '', data_pedido: hoje(), previsao_entrega: '', obs: '',
          itens: grupo.itens, valor_total, status: 'pendente',
          criado_em: Timestamp.now(), criado_por: usuarioAtual.uid
        };
        const pRef = doc(collection(db,'insumos_pedidos'));
        batch.set(pRef, pedido);
        novosPedidos.push({ id: pRef.id, ...pedido });
        contadorBatch++;
        itensImportados += grupo.itens.length;

        grupo.vencimentos.forEach(v => {
          const conta = {
            fornecedor, descricao: `${v.produto} (importado)${v.cond?` — ${v.cond}`:''}`, valor_total: v.valor,
            vencimento: Timestamp.fromDate(new Date(v.vencimento+'T12:00:00')),
            pedido_id: pRef.id, pago: false, criado_em: Timestamp.now()
          };
          const cRef = doc(collection(db,'insumos_contas'));
          batch.set(cRef, conta);
          novasContas.push({ id: cRef.id, ...conta });
          contadorBatch++;
        });

        // Firestore limita 500 operações por batch — fecha e abre um novo a cada 400
        if (contadorBatch >= 400) {
          await batch.commit();
          batch = writeBatch(db);
          contadorBatch = 0;
        }
      }

      if (contadorBatch > 0) await batch.commit();

      pedidos.unshift(...novosPedidos);
      contas.push(...novasContas);
      contas.sort((a,b) => (a.vencimento?.toDate?a.vencimento.toDate():new Date(a.vencimento)) - (b.vencimento?.toDate?b.vencimento.toDate():new Date(b.vencimento)));

      toast(`${fornecedoresImportados.length} pedido(s) criado(s) (${itensImportados} ite${itensImportados>1?'ns':'m'}) como Pendente${novasContas.length>0?`, ${novasContas.length} conta(s) a pagar gerada(s)`:''}${ignorados>0?`. ${ignorados} linha(s) ignorada(s)`:''}.`);
      renderPedidos();
    } catch(e) { toast('Erro ao importar: '+e.message,'erro'); }
    input.value = '';
  };
  reader.readAsArrayBuffer(file);
};

function badgeStatus(s) {

  const [cls, label] = map[s] || ['badge-cinza', s];
  return `<span class="badge ${cls}">${label}</span>`;
}

window.salvarPedido = async function() {
  const fornecedor = document.getElementById('ped-fornecedor').value.trim();
  if (!fornecedor) { toast('Informe o fornecedor.', 'erro'); return; }
  const itensValidos = itensPedidoTemp.filter(i => i.produto && i.quantidade);
  if (itensValidos.length === 0) { toast('Adicione pelo menos um item.', 'erro'); return; }
  // Vencimento do pedido (data fixa ou prazo em dias após a entrega)
  const vencTipo = document.getElementById('ped-venc-tipo').value;
  let vencData = '', vencDias = 0;
  if (vencTipo === 'data') {
    vencData = document.getElementById('ped-venc-data')?.value || '';
    if (!vencData) { toast('Informe a data de vencimento.','erro'); return; }
  } else if (vencTipo === 'ddf') {
    vencDias = parseFloat(document.getElementById('ped-venc-dias')?.value)||0;
    if (!vencDias) { toast('Informe os dias após a entrega.','erro'); return; }
  }
  const itens = itensValidos.map(i => ({
    produto: i.produto.trim(), quantidade: parseFloat(i.quantidade)||0, quantidade_recebida: 0,
    unidade: i.unidade, preco_unit: parseFloat(i.preco_unit)||0,
    total: (parseFloat(i.quantidade)||0)*(parseFloat(i.preco_unit)||0),
    // guarda a condição no item para gerar a conta no recebimento (DDF)
    cond_tipo: vencTipo==='ddf' ? 'ddf' : '', cond_dias: vencTipo==='ddf' ? vencDias : 0
  }));
  const valor_total = itens.reduce((s,i) => s+i.total, 0);
  const pedido = {
    fornecedor, fazenda: document.getElementById('ped-fazenda').value,
    data_pedido: document.getElementById('ped-data').value,
    previsao_entrega: document.getElementById('ped-entrega').value,
    obs: document.getElementById('ped-obs').value,
    venc_tipo: vencTipo, venc_data: vencData, venc_dias: vencDias,
    itens, valor_total, status: 'pendente',
    criado_em: Timestamp.now(), criado_por: usuarioAtual.uid
  };
  try {
    const ref = await addDoc(collection(db, 'insumos_pedidos'), pedido);
    pedidos.unshift({id: ref.id, ...pedido});
    fecharModal('modal-pedido');
    toast('Pedido criado com sucesso!');
    if (valor_total > 0 && vencTipo === 'data') {
      // Data fixa: gera a conta a pagar direto com essa data
      const conta = {
        descricao: `Pedido ${fornecedor}`, fornecedor, categoria: 'Insumos',
        valor_total, vencimento: Timestamp.fromDate(new Date(vencData+'T12:00:00')),
        pago: false, pedido_id: ref.id, criado_em: Timestamp.now()
      };
      const cref = await addDoc(collection(db,'insumos_contas'), conta);
      contas.push({id: cref.id, ...conta});
      contas.sort((a,b) => (a.vencimento?.toDate?a.vencimento.toDate():new Date(a.vencimento)) - (b.vencimento?.toDate?b.vencimento.toDate():new Date(b.vencimento)));
      toast('Conta a pagar gerada com vencimento em '+fmtDataBR(vencData)+'.');
      renderPedidos();
    } else if (vencTipo === 'ddf') {
      // Prazo DDF: a conta será gerada automaticamente no recebimento
      toast(`Conta será gerada no recebimento (${vencDias} dias após a entrega).`);
      renderPedidos();
    } else if (valor_total > 0) {
      // Sem vencimento definido: oferece o fluxo de conta automática (parcelas)
      abrirContaAutomatica(ref.id, fornecedor, valor_total);
    } else {
      renderPedidos();
    }
  } catch(e) { toast('Erro ao salvar: ' + e.message, 'erro'); }
};

window.salvarContaAutomatica = async function(pedidoId, fornecedor, valor) {
  const venc = document.getElementById('ca-venc').value;
  const parcelas = parseInt(document.getElementById('ca-parcelas').value)||1;
  if (!venc) { toast('Informe o vencimento.','erro'); return; }
  try {
    for (let i = 0; i < parcelas; i++) {
      const dataVenc = new Date(venc + 'T12:00:00');
      dataVenc.setMonth(dataVenc.getMonth() + i);
      const conta = {
        fornecedor, descricao: `Pedido de compra${parcelas>1?` (${i+1}/${parcelas})`:''}`,
        valor_total: valor/parcelas, vencimento: Timestamp.fromDate(dataVenc),
        pedido_id: pedidoId, pago: false, criado_em: Timestamp.now()
      };
      const ref = await addDoc(collection(db,'insumos_contas'), conta);
      contas.push({id: ref.id, ...conta});
    }
    contas.sort((a,b) => (a.vencimento?.toDate?a.vencimento.toDate():new Date(a.vencimento)) - (b.vencimento?.toDate?b.vencimento.toDate():new Date(b.vencimento)));
    fecharModal('modal-conta-auto');
    toast(parcelas>1?`${parcelas} parcelas geradas no contas a pagar!`:'Conta a pagar gerada!');
    renderPedidos();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

// Recalcula valor_total e status de um pedido a partir dos itens, grava e atualiza a lista local
async function salvarItensPedido(pedidoId, novosItens) {
  const valor_total = novosItens.reduce((s,x) => s+(x.total||0), 0);
  const todosEntregues = novosItens.length>0 && novosItens.every(x => (x.quantidade_recebida||0) >= (x.quantidade||0));
  const algumEntregue = novosItens.some(x => (x.quantidade_recebida||0) > 0);
  const status = todosEntregues ? 'entregue_total' : algumEntregue ? 'parcial' : 'pendente';
  await updateDoc(doc(db,'insumos_pedidos',pedidoId), { itens: novosItens, valor_total, status });
  const p = pedidos.find(x=>x.id===pedidoId);
  if (p) { p.itens = novosItens; p.valor_total = valor_total; p.status = status; }
}

window.confirmarBaixa = async function(id) {
  const p = pedidos.find(x => x.id === id);
  if (!p) return;
  const btn = document.getElementById('btn-confirma-baixa');
  btn.disabled = true; btn.textContent = 'Salvando...';
  const itensPend = (p.itens||[]).filter(it => (it.quantidade||0) - (it.quantidade_recebida||0) > 0);
  const dataReceb = document.getElementById('baixa-data').value;
  const batch = writeBatch(db);
  let totalRecebido = 0;
  const novosItens = [...p.itens];

  const novosContasLocais = [];
  itensPend.forEach((it, i) => {
    const qtdReceber = parseFloat(document.getElementById(`baixa-qtd-${i}`)?.value) || 0;
    if (qtdReceber <= 0) return;
    totalRecebido += qtdReceber;
    const idx = novosItens.findIndex(x => x.produto === it.produto);
    if (idx >= 0) novosItens[idx] = { ...novosItens[idx], quantidade_recebida: (novosItens[idx].quantidade_recebida||0) + qtdReceber };
    // tenta casar com o compêndio pra herdar prodId/cat/ia (opcional, não bloqueia se não achar)
    const match = (compendioDetalhado||[]).find(c => normalizar(c.nome||'') === normalizar(it.produto));
    const novaEntrada = {
      cat: match?.cat || it.categoria || '', dt: Timestamp.now(), forn: p.fornecedor, funcId: '', funcNome: '',
      ia: match?.ia || '', nf: '', preco: it.preco_unit||0, prodId: match?.id || '',
      prodNome: it.produto, qtd: qtdReceber, unid: it.unidade
    };
    const eRef = doc(collection(db, 'estoque_ins_entradas'));
    batch.set(eRef, novaEntrada);
    entradasRaw.push({ id: eRef.id, ...novaEntrada });

    // Condição "X DDF": gera conta a pagar com vencimento = recebimento + X dias.
    // Faz isso só uma vez por item (na 1ª vez que ele é recebido), pra não duplicar em baixas parciais.
    if (it.cond_tipo === 'ddf' && it.cond_dias > 0 && !it.conta_gerada) {
      const venc = somarDias(dataReceb, it.cond_dias);
      const conta = {
        fornecedor: p.fornecedor, descricao: `${it.produto} — ${it.cond_pagamento} (receb. ${dataReceb})`,
        valor_total: it.total || 0, vencimento: Timestamp.fromDate(new Date(venc+'T12:00:00')),
        pedido_id: id, pago: false, criado_em: Timestamp.now()
      };
      const cRef = doc(collection(db, 'insumos_contas'));
      batch.set(cRef, conta);
      novosContasLocais.push({ id: cRef.id, ...conta });
      if (idx >= 0) novosItens[idx] = { ...novosItens[idx], conta_gerada: true };
    }
  });

  if (totalRecebido === 0) { toast('Informe a quantidade a receber.', 'erro'); btn.disabled=false; btn.textContent='Confirmar Recebimento'; return; }

  const todosEntregues = novosItens.every(it => (it.quantidade_recebida||0) >= (it.quantidade||0));
  const novoStatus = todosEntregues ? 'entregue_total' : 'parcial';

  batch.update(doc(db, 'insumos_pedidos', id), { itens: novosItens, status: novoStatus });
  try {
    await batch.commit();
    const pi = pedidos.findIndex(x => x.id === id);
    if (pi >= 0) { pedidos[pi].itens = novosItens; pedidos[pi].status = novoStatus; }
    if (novosContasLocais.length > 0) {
      contas.push(...novosContasLocais);
      contas.sort((a,b) => (a.vencimento?.toDate?a.vencimento.toDate():new Date(a.vencimento)) - (b.vencimento?.toDate?b.vencimento.toDate():new Date(b.vencimento)));
    }
    recalcularEstoque();
    fecharModal('modal-baixa');
    toast(`Recebimento registrado no ACF Estoque!${novosContasLocais.length>0?` ${novosContasLocais.length} conta(s) a pagar gerada(s).`:''}`);
    renderPedidos();
  } catch(e) { toast('Erro: ' + e.message, 'erro'); btn.disabled=false; btn.textContent='Confirmar Recebimento'; }
};

window.salvarEdicaoLote = async function(loteId) {
  const l = entradasRaw.find(e => e.id === loteId);
  if (!l) return;
  const prodNome = document.getElementById('el-produto').value.trim();
  const qtd = parseFloat(document.getElementById('el-qtd').value)||0;
  if (!prodNome || qtd<=0) { toast('Preencha produto e quantidade.','erro'); return; }
  const upd = {
    prodNome, qtd, unid: document.getElementById('el-unid').value,
    preco: parseFloat(document.getElementById('el-preco').value)||0,
    dt: Timestamp.fromDate(new Date(document.getElementById('el-data').value+'T12:00:00')),
    forn: document.getElementById('el-forn').value
  };
  try {
    await updateDoc(doc(db,'estoque_ins_entradas',loteId), upd);
    Object.assign(l, upd);
    recalcularEstoque();
    fecharModal('modal-editar-lote');
    fecharModal('modal-lotes');
    abrirLotesProduto(prodNome);
    filtrarEstoque();
    toast('Lote atualizado! Saldo e custo médio recalculados.');
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

window.removerLote = async function(loteId, produtoNome) {
  if(!exigirMaster())return;
  if (!confirm('Excluir este lote de entrada? O saldo do produto vai diminuir e o custo médio será recalculado.')) return;
  try {
    await deleteDoc(doc(db,'estoque_ins_entradas',loteId));
    const i = entradasRaw.findIndex(e => e.id === loteId);
    if (i>=0) entradasRaw.splice(i,1);
    recalcularEstoque();
    fecharModal('modal-lotes');
    const aindaTem = entradasRaw.some(e => normalizar(e.prodNome||'')===normalizar(produtoNome));
    if (aindaTem) abrirLotesProduto(produtoNome);
    filtrarEstoque();
    toast('Lote excluído. Estoque recalculado.');
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

// ══════════════ IMPORTAÇÃO DE NF-e (XML) → ENTRADA DE INSUMOS ══════════════
let nfItensTemp = [];   // itens lidos do XML, prontos para conferência
let nfDadosTemp = {};   // { numero, emitente, data }

window.abrirImportarNF = function() {
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay ativo" id="modal-nf">
      <div class="modal" style="max-width:640px">
        <div class="modal-titulo">📄 Importar NF-e (XML)</div>
        <div style="font-size:13px;color:var(--cinza);margin-bottom:14px;line-height:1.5">
          Selecione o arquivo <b>XML</b> da nota fiscal (baixado do portal da SEFAZ, do seu emissor ou enviado pelo fornecedor).
          O app vai ler os produtos, quantidades e valores para você conferir antes de dar entrada no estoque.
        </div>
        <div class="form-group">
          <label>Arquivo XML da NF-e</label>
          <input type="file" id="nf-arquivo" accept=".xml,text/xml" onchange="processarXmlNF()">
        </div>
        <div id="nf-conferencia"></div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="fecharModal('modal-nf')">Cancelar</button>
          <button class="btn btn-primary" id="nf-btn-confirmar" onclick="confirmarImportacaoNF()" style="display:none">Confirmar Entrada</button>
        </div>
      </div>
    </div>`);
  carregarCompendio(); // garante compêndio carregado para casar produtos
};

window.processarXmlNF = function() {
  const inp = document.getElementById('nf-arquivo');
  const file = inp.files && inp.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      await carregarCompendio(); // garante compêndio para casar produtos
      const parser = new DOMParser();
      const xml = parser.parseFromString(e.target.result, 'text/xml');
      if (xml.querySelector('parsererror')) { toast('Arquivo XML inválido.', 'erro'); return; }
      // pega elemento por nome de tag ignorando namespace
      const tag = (root, nome) => { const els = root.getElementsByTagName(nome); return els.length? els[0] : null; };
      const txt = (root, nome) => { const el = tag(root, nome); return el ? el.textContent.trim() : ''; };

      // Cabeçalho: número da NF e emitente
      const ide = xml.getElementsByTagName('ide')[0];
      const emit = xml.getElementsByTagName('emit')[0];
      nfDadosTemp = {
        numero: ide ? txt(ide, 'nNF') : '',
        data: ide ? (txt(ide,'dhEmi')||txt(ide,'dEmi')).slice(0,10) : '',
        emitente: emit ? (txt(emit,'xNome')||txt(emit,'xFant')) : ''
      };

      // Itens: cada <det> tem um <prod>
      const dets = xml.getElementsByTagName('det');
      nfItensTemp = [];
      for (let i=0;i<dets.length;i++) {
        const prod = dets[i].getElementsByTagName('prod')[0];
        if (!prod) continue;
        const nome = txt(prod,'xProd');
        const qtd = parseFloat(txt(prod,'qCom')) || 0;
        const und = (txt(prod,'uCom')||'').toUpperCase();
        const vUn = parseFloat(txt(prod,'vUnCom')) || 0;
        // tenta casar com o compêndio pelo nome
        const match = (compendioDetalhado||[]).find(c => normalizar(c.nome||'') === normalizar(nome));
        nfItensTemp.push({
          nomeXml: nome,
          produto: match ? match.nome : nome,  // nome final (editável)
          matchId: match ? match.id : '',
          cat: match ? (match.cat||'') : '',
          ia: match ? (match.ia||'') : '',
          qtd, unidade: normalizarUnidadeNF(und), custo: vUn,
          casado: !!match
        });
      }
      if (nfItensTemp.length === 0) { toast('Nenhum produto encontrado no XML.', 'erro'); return; }
      renderConferenciaNF();
    } catch(err) {
      toast('Erro ao ler o XML: '+err.message, 'erro');
    }
  };
  reader.readAsText(file);
};

// Converte unidade da NF (ex: KG, LT, TON, UN, CX) para as unidades do app
function normalizarUnidadeNF(u) {
  const map = { 'KG':'kg','QUILO':'kg','QUILOS':'kg','L':'L','LT':'L','LITRO':'L','LITROS':'L','LTS':'L',
    'SC':'sc','SACA':'sc','SACAS':'sc','UN':'un','UND':'un','UNID':'un','PC':'un','PÇ':'un',
    'CX':'cx','CAIXA':'cx','G':'g','GR':'g','GRAMA':'g','ML':'mL','TON':'ton','TONELADA':'ton','T':'ton' };
  return map[u] || (UNIDADES.includes(u) ? u : 'un');
}

function renderConferenciaNF() {
  const div = document.getElementById('nf-conferencia');
  if (!div) return;
  const totalNF = nfItensTemp.reduce((s,it)=> s + it.qtd*it.custo, 0);
  div.innerHTML = `
    <div style="background:var(--creme);border-radius:10px;padding:12px 14px;margin:14px 0;font-size:13px">
      <div><b>NF nº:</b> ${nfDadosTemp.numero||'—'} &nbsp;·&nbsp; <b>Emitente:</b> ${nfDadosTemp.emitente||'—'}</div>
      ${nfDadosTemp.data?`<div style="color:var(--cinza);margin-top:2px">Emissão: ${fmtDataBR(nfDadosTemp.data)}</div>`:''}
    </div>
    <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:14px;margin-bottom:8px">Itens da nota (${nfItensTemp.length}) — confira antes de confirmar</div>
    <div style="font-size:12px;color:var(--cinza);margin-bottom:10px">🟢 = produto encontrado no compêndio · 🟡 = novo (será criado como digitado). Você pode ajustar quantidade, unidade e custo.</div>
    <div style="max-height:340px;overflow-y:auto">
      ${nfItensTemp.map((it,idx)=>`
        <div style="border:1px solid var(--creme-escuro);border-radius:10px;padding:12px;margin-bottom:10px">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
            <span title="${it.casado?'Encontrado no compêndio':'Produto novo'}">${it.casado?'🟢':'🟡'}</span>
            <input type="text" value="${(it.produto||'').replace(/"/g,'&quot;')}" oninput="editarItemNF(${idx},'produto',this.value)" style="flex:1;font-weight:600" list="compendio-datalist-nf">
          </div>
          <div style="font-size:11px;color:var(--cinza);margin-bottom:8px">No XML: ${it.nomeXml}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
            <div><label style="font-size:11px;color:var(--cinza)">Qtd</label><input type="number" value="${it.qtd}" step="0.01" min="0" oninput="editarItemNF(${idx},'qtd',this.value)"></div>
            <div><label style="font-size:11px;color:var(--cinza)">Unid.</label><select onchange="editarItemNF(${idx},'unidade',this.value)">${UNIDADES.map(u=>`<option ${u===it.unidade?'selected':''}>${u}</option>`).join('')}</select></div>
            <div><label style="font-size:11px;color:var(--cinza)">Custo unit. R$</label><input type="number" value="${it.custo}" step="0.01" min="0" oninput="editarItemNF(${idx},'custo',this.value)"></div>
          </div>
        </div>`).join('')}
    </div>
    <datalist id="compendio-datalist-nf"></datalist>
    <div style="text-align:right;font-weight:700;margin-top:8px">Total da NF: R$ ${fmt(totalNF)}</div>`;
  document.getElementById('nf-btn-confirmar').style.display = 'inline-flex';
  // popula datalist do compêndio para facilitar correções
  carregarCompendio().then(lista => {
    const dl = document.getElementById('compendio-datalist-nf');
    if (dl) dl.innerHTML = [...new Set([...estoque.map(e=>e.produto), ...lista])].sort().map(n=>`<option value="${n.replace(/"/g,'&quot;')}">`).join('');
  });
}

window.editarItemNF = function(idx, campo, valor) {
  if (!nfItensTemp[idx]) return;
  if (campo==='qtd' || campo==='custo') nfItensTemp[idx][campo] = parseFloat(valor)||0;
  else nfItensTemp[idx][campo] = valor;
  if (campo==='produto') {
    const match = (compendioDetalhado||[]).find(c => normalizar(c.nome||'') === normalizar(valor));
    nfItensTemp[idx].matchId = match ? match.id : '';
    nfItensTemp[idx].cat = match ? (match.cat||'') : '';
    nfItensTemp[idx].ia = match ? (match.ia||'') : '';
    nfItensTemp[idx].casado = !!match;
  }
  // recalcula total sem re-renderizar tudo (mantém foco); atualiza só o total
  const totalNF = nfItensTemp.reduce((s,it)=> s + it.qtd*it.custo, 0);
  const el = document.querySelector('#nf-conferencia > div:last-child');
  if (el) el.textContent = 'Total da NF: R$ ' + fmt(totalNF);
};

window.confirmarImportacaoNF = async function() {
  const validos = nfItensTemp.filter(it => it.produto && it.qtd > 0);
  if (validos.length === 0) { toast('Nenhum item válido para importar.', 'erro'); return; }
  const btn = document.getElementById('nf-btn-confirmar');
  if (btn) { btn.disabled = true; btn.textContent = 'Salvando...'; }
  try {
    const dtNF = nfDadosTemp.data ? Timestamp.fromDate(new Date(nfDadosTemp.data+'T12:00:00')) : Timestamp.now();
    for (const it of validos) {
      const novaEntrada = {
        cat: it.cat||'', dt: dtNF, forn: nfDadosTemp.emitente||'', funcId:'', funcNome:'',
        ia: it.ia||'', nf: nfDadosTemp.numero||'', preco: it.custo||0, prodId: it.matchId||'',
        prodNome: it.produto, qtd: it.qtd, unid: it.unidade
      };
      const ref = await addDoc(collection(db,'estoque_ins_entradas'), novaEntrada);
      entradasRaw.push({ id: ref.id, ...novaEntrada });
    }
    recalcularEstoque();
    fecharModal('modal-nf');
    toast(`${validos.length} ${validos.length>1?'itens importados':'item importado'} da NF ${nfDadosTemp.numero||''}!`);
    renderEstoque();
  } catch(e) {
    toast('Erro ao importar: '+e.message, 'erro');
    if (btn) { btn.disabled = false; btn.textContent = 'Confirmar Entrada'; }
  }
};

      <input type="date" id="filt-ret-ate" oninput="filtrarRetiradas()">
      <select id="filt-ret-fazenda" onchange="filtrarRetiradas()">
        <option value="">Todas as fazendas</option>${nomesFazendas().map(f=>`<option>${f}</option>`).join('')}

      <input type="text" id="filt-ret-produto" oninput="filtrarRetiradas()" placeholder="Produto...">

window.filtrarRetiradas = function() {
  const de = document.getElementById('filt-ret-de')?.value;
  const ate = document.getElementById('filt-ret-ate')?.value;
  const faz = document.getElementById('filt-ret-fazenda')?.value||'';
  const prod = (document.getElementById('filt-ret-produto')?.value||'').toLowerCase();
  const lista = retiradas.filter(r => {
    const d = r.data?.toDate ? r.data.toDate() : new Date(r.data);
    const dStr = d.toISOString().split('T')[0];
    return (!de || dStr >= de) && (!ate || dStr <= ate) && (!faz || r.fazenda === faz) && (!prod || r.produto.toLowerCase().includes(prod));
  });
  const el = document.getElementById('lista-retiradas');
  if (!el) return;
  const totalCusto = lista.reduce((s,r)=>s+(r.custo_total||0),0);
  if (lista.length === 0) { el.innerHTML = `<div class="tabela-wrap"><div class="tabela-vazia">Nenhuma retirada encontrada</div></div>`; return; }
  el.innerHTML = `
    <div style="margin-bottom:12px;font-size:13px;color:var(--cinza)">${lista.length} registros — Custo total: <strong>R$ ${fmt(totalCusto)}</strong></div>
    <div class="tabela-wrap"><table>
      <thead><tr><th>Data</th><th>Produto</th><th>Qtd</th><th>Fazenda</th><th>Talhão</th><th>Cultura</th><th>Safra</th><th>Origem</th><th>Custo</th><th class="col-acoes">Ações</th></tr></thead>
      <tbody>
        ${lista.map(r => `<tr><td>${fmtData(r.data)}</td><td>${r.produto}</td><td>${fmt(r.quantidade)} ${r.unidade}</td>
        <td>${r.fazenda}</td><td>${r.talhao||'—'}</td><td>${r.cultura||'—'}</td><td>${r.safra||'—'}</td>
        <td>${r.origem==='aplicacao'?'<span style="font-size:11px;color:var(--cinza)">🚜 Aplicação</span>':'<span style="font-size:11px;color:var(--cinza)">Manual</span>'}</td>
        <td>R$ ${fmt(r.custo_total)}</td>
        <td class="col-acoes"><div class="acoes-wrap">
          <button class="btn btn-sm btn-secondary" onclick="abrirEditarRetirada('${r.id}')" title="Editar">✏️</button>
          <button class="btn btn-sm btn-secondary" onclick="excluirRetirada('${r.id}')" title="Excluir">✕</button>
        </div></td></tr>`).join('')}
      </tbody>
    </table></div>
    <div style="margin-top:14px"><button class="btn btn-secondary btn-sm" onclick="exportarRetiradas()">📥 Exportar Excel</button></div>`;
  window._retiradasFiltradas = lista;
};

window.abrirEditarRetirada = function(id) {
  if(!exigirMaster())return;
  const r = retiradas.find(x=>x.id===id);
  if (!r) return;
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay ativo" id="modal-editar-retirada">
      <div class="modal" style="max-width:440px">
        <div class="modal-titulo">✏️ Editar Retirada</div>
        <div style="font-size:13px;color:var(--cinza);margin-bottom:12px"><strong>${r.produto}</strong>${r.origem==='aplicacao'?' — gerada por uma aplicação concluída':''}</div>
        <div class="form-row">
          <div class="form-group"><label>Quantidade *</label><input type="number" id="edr-qtd" value="${r.quantidade||0}" min="0" step="0.01"></div>
          <div class="form-group"><label>Unidade</label><input type="text" id="edr-unidade" value="${r.unidade||''}"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Fazenda</label><input type="text" id="edr-fazenda" value="${(r.fazenda||'').replace(/"/g,'&quot;')}"></div>
          <div class="form-group"><label>Talhão</label><input type="text" id="edr-talhao" value="${(r.talhao||'').replace(/"/g,'&quot;')}"></div>
        </div>

        </div>
      </div>
    </div>`);
};

window.salvarEdicaoRetirada = async function(id) {
  const r = retiradas.find(x=>x.id===id);
  if (!r) return;
  const qtd = parseFloat(document.getElementById('edr-qtd').value)||0;
  const upd = {
    quantidade: qtd,
    unidade: document.getElementById('edr-unidade').value.trim(),
    fazenda: document.getElementById('edr-fazenda').value.trim(),
    talhao: document.getElementById('edr-talhao').value.trim(),
    obs: document.getElementById('edr-obs').value.trim(),
    custo_total: qtd * (r.custo_unitario||0)
  };
  try {
    await updateDoc(doc(db,'insumos_retiradas',id), upd);
    Object.assign(r, upd);
    recalcularEstoque();
    fecharModal('modal-editar-retirada');
    toast('Retirada atualizada! Estoque recalculado.');
    filtrarRetiradas();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

window.excluirRetirada = async function(id) {
  if(!exigirMaster())return;
  const r = retiradas.find(x=>x.id===id);
  if (!r) return;
  const aviso = r.origem==='aplicacao'
    ? `Excluir esta retirada (gerada pela aplicação de "${r.produto}")? O produto volta ao estoque e a aplicação vinculada é marcada como não-baixada.`
    : `Excluir a retirada de "${r.produto}"? O produto volta ao estoque.`;
  if (!confirm(aviso)) return;
  try {
    await deleteDoc(doc(db,'insumos_retiradas',id));
    const i = retiradas.findIndex(x=>x.id===id); if (i>=0) retiradas.splice(i,1);
    // Se veio de uma aplicação, limpa o vínculo para permitir baixar de novo se quiser
    if (r.origem === 'aplicacao' && r.aplicacao_id) {
      const a = adubacoes.find(x=>x.id===r.aplicacao_id);
      if (a) {
        const idsRest = (a.retirada_ids||[]).filter(x=>x!==id);
        const aindaTem = idsRest.length > 0;
        try {
          await updateDoc(doc(db,'insumos_campo_adubacao',a.id), { retirada_ids: idsRest, estoque_baixado: aindaTem });
          a.retirada_ids = idsRest; a.estoque_baixado = aindaTem;
        } catch(e){}
      }
    }
    recalcularEstoque();
    toast('Retirada excluída. Estoque recalculado.');
    filtrarRetiradas();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

window.exportarRetiradas = function() {
  const lista = window._retiradasFiltradas || retiradas;
  exportarExcel('Retiradas', ['Data','Produto','Quantidade','Unidade','Fazenda','Talhão','Cultura','Safra','Custo Unit (R$)','Custo Total (R$)'],
    lista.map(r => [fmtData(r.data), r.produto, r.quantidade||0, r.unidade, r.fazenda, r.talhao||'', r.cultura||'', r.safra||'', r.custo_unitario||0, r.custo_total||0]));
};

window.atualizarTalhoes = function() {
  const faz = document.getElementById('ret-fazenda').value;

window.atualizarInfoEstoque = function() {
  const sel = document.getElementById('ret-produto').value;
  const el = document.getElementById('ret-info');
  if (!sel) { el.style.display='none'; return; }
  const est = estoque.find(e => e.id === sel);
  if (!est) return;
  el.style.display = 'block';
  document.getElementById('ret-info-qtd').textContent = `${fmt(est.quantidade)} ${est.unidade}`;
  const custoEl = document.getElementById('ret-info-custo');
  if (custoEl) custoEl.textContent = `R$ ${fmt(est.custo_medio||0)}/${est.unidade}`;
};

window.confirmarRetirada = async function() {
  const prodId = document.getElementById('ret-produto').value;
  const qtd = parseFloat(document.getElementById('ret-qtd').value)||0;
  const fazenda = document.getElementById('ret-fazenda').value;
  if (!prodId) { toast('Selecione o produto.','erro'); return; }
  if (qtd <= 0) { toast('Informe a quantidade.','erro'); return; }
  if (!fazenda) { toast('Selecione a fazenda.','erro'); return; }
  const est = estoque.find(e => e.id === prodId);
  if (!est) return;
  if (qtd > est.quantidade) { toast(`Quantidade maior que o disponível (${fmt(est.quantidade)} ${est.unidade}).`,'erro'); return; }
  const custo_total = qtd * (est.custo_medio||0);
  const retirada = {
    produto: est.produto, unidade: est.unidade, quantidade: qtd, fazenda,
    talhao: document.getElementById('ret-talhao')?.value||'',
    cultura: document.getElementById('ret-cultura')?.value||'',
    safra: document.getElementById('ret-safra')?.value||'',
    obs: document.getElementById('ret-obs')?.value||'',
    custo_unitario: est.custo_medio||0, custo_total,
    data: Timestamp.now(), operador_uid: usuarioAtual.uid
  };
  try {
    const ref = await addDoc(collection(db,'insumos_retiradas'), retirada);
    retiradas.unshift({id: ref.id, ...retirada});
    recalcularEstoque();
    fecharModal('modal-retirada');
    toast('Retirada registrada com sucesso!');
    renderRetiradas();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

  el.innerHTML = `
    <div style="margin-bottom:12px;font-size:13px;color:var(--cinza)">${lista.length} registros ${totalPend>0?`— Pendente: <strong>R$ ${fmt(totalPend)}</strong>`:''}</div>
    <div class="tabela-wrap"><table>
      <thead><tr><th>Fornecedor</th><th>Descrição</th><th>Valor</th><th>Vencimento</th><th>Status</th><th>Ações</th></tr></thead>
      <tbody>
        ${lista.length === 0 ? '<tr><td colspan="6" class="tabela-vazia">Nenhuma conta encontrada</td></tr>' :
        lista.map(c => `<tr>
          <td>${c.fornecedor||'—'}</td><td>${c.descricao||'—'}</td>
          <td style="font-weight:600">R$ ${fmt(c.valor_total)}</td>

          <td style="white-space:nowrap">
            ${!c.pago ? `<button class="btn btn-sm btn-primary" onclick="marcarPago('${c.id}')">Pagar</button>` : ''}
            <button class="btn btn-sm btn-secondary" style="margin-left:6px" onclick="excluirConta('${c.id}')">✕</button>
          </td></tr>`).join('')}

window.abrirModalConta = function() {
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay ativo" id="modal-conta">
      <div class="modal">
        <div class="modal-titulo">💰 Nova Conta a Pagar</div>
        <div class="form-group"><label>Fornecedor *</label><input type="text" id="cnt-forn" placeholder="Nome do fornecedor"></div>
        <div class="form-group"><label>Descrição</label><input type="text" id="cnt-desc" placeholder="Ex: NF 456"></div>
        <div class="form-row">
          <div class="form-group"><label>Valor Total (R$) *</label><input type="number" id="cnt-valor" min="0" step="0.01"></div>
          <div class="form-group"><label>1º Vencimento *</label><input type="date" id="cnt-venc"></div>
        </div>
        <div class="form-group"><label>Nº Parcelas</label><input type="number" id="cnt-parcelas" value="1" min="1" max="12"></div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="fecharModal('modal-conta')">Cancelar</button>
          <button class="btn btn-primary" onclick="salvarConta()">Salvar</button>
        </div>
      </div>
    </div>`);
};

window.salvarConta = async function() {
  const forn = document.getElementById('cnt-forn').value.trim();
  const valor = parseFloat(document.getElementById('cnt-valor').value)||0;
  const venc = document.getElementById('cnt-venc').value;
  const parcelas = parseInt(document.getElementById('cnt-parcelas').value)||1;
  if (!forn || !valor || !venc) { toast('Preencha fornecedor, valor e vencimento.','erro'); return; }
  try {
    for (let i = 0; i < parcelas; i++) {
      const dataVenc = new Date(venc + 'T12:00:00');
      dataVenc.setMonth(dataVenc.getMonth() + i);
      const conta = {
        fornecedor: forn,
        descricao: document.getElementById('cnt-desc').value + (parcelas>1?` (${i+1}/${parcelas})`:''),
        valor_total: valor/parcelas, vencimento: Timestamp.fromDate(dataVenc),
        pago: false, criado_em: Timestamp.now()
      };
      const ref = await addDoc(collection(db,'insumos_contas'), conta);
      contas.push({id: ref.id, ...conta});
    }
    contas.sort((a,b) => (a.vencimento?.toDate?a.vencimento.toDate():new Date(a.vencimento)) - (b.vencimento?.toDate?b.vencimento.toDate():new Date(b.vencimento)));
    fecharModal('modal-conta');
    toast(parcelas>1?`${parcelas} parcelas criadas!`:'Conta registrada!');
    renderContas();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

window.marcarPago = async function(id) {
  try {
    await updateDoc(doc(db,'insumos_contas',id), { pago: true, data_pagamento: Timestamp.now() });
    const c = contas.find(x=>x.id===id);
    if (c) c.pago = true;
    toast('Conta marcada como paga!');
    renderContas();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

window.excluirConta = async function(id) {
  if(!exigirMaster())return;
  if (!confirm('Excluir esta conta?')) return;
  try {
    await deleteDoc(doc(db,'insumos_contas',id));
    contas.splice(contas.findIndex(x=>x.id===id),1);
    toast('Conta excluída.');
    renderContas();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

// Conta quantos registros (plantio + aplicação + colheita) usam uma safra
function contarRegistrosSafra(nome) {
  const n = normalizar(nome);
  const c = [...plantios, ...adubacoes, ...colheitas].filter(r => normalizar(r.safra||'') === n).length;
  return c;
}

// Aplica a troca de nome de safra em todas as coleções de registros
async function reescreverSafraNosRegistros(nomeAntigo, nomeNovo) {
  const na = normalizar(nomeAntigo);
  const alvos = [
    { arr: plantios, col: 'insumos_campo_plantio' },
    { arr: adubacoes, col: 'insumos_campo_adubacao' },
    { arr: colheitas, col: 'insumos_campo_colheita' }
  ];
  let batch = writeBatch(db), n = 0, total = 0;
  for (const {arr, col} of alvos) {
    for (const r of arr) {
      if (normalizar(r.safra||'') === na) {
        batch.update(doc(db, col, r.id), { safra: nomeNovo });
        r.safra = nomeNovo; // atualiza local
        n++; total++;
        if (n >= 400) { await batch.commit(); batch = writeBatch(db); n = 0; }
      }
    }
  }
  if (n > 0) await batch.commit();
  return total;
}

window.renomearSafra = async function(id) {
  const s = safras.find(x=>x.id===id);
  if (!s) return;
  const novo = document.getElementById('rs-nome').value.trim();
  if (!novo) { toast('Informe o novo nome.','erro'); return; }
  if (novo === s.nome) { fecharModal('modal-renomear-safra'); return; }
  // Se já existe outra safra com esse nome, isso vira uma unificação
  const jaExiste = safras.find(x => x.id!==id && normalizar(x.nome)===normalizar(novo));
  try {
    const nomeAntigo = s.nome;
    const total = await reescreverSafraNosRegistros(nomeAntigo, novo);
    await updateDoc(doc(db,'insumos_safras',id), { nome: novo });
    s.nome = novo;
    // se colidiu com outra safra existente, remove a duplicata do cadastro
    if (jaExiste) {
      await deleteDoc(doc(db,'insumos_safras',jaExiste.id));
      safras.splice(safras.findIndex(x=>x.id===jaExiste.id),1);
    }
    safras.sort((a,b)=>a.nome.localeCompare(b.nome));
    fecharModal('modal-renomear-safra');
    toast(`Safra renomeada em ${total} registro(s).`);
    renderCadastros();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

        <div class="form-group"><label>Origem (será unificada) *</label><select id="uni-origem">${opcoes}</select></div>
        <div class="form-group"><label>Destino (safra que fica) *</label><select id="uni-destino">${opcoes}</select></div>

window.unificarSafras = async function() {
  const nomeOrigem = document.getElementById('uni-origem').value;
  const nomeDestino = document.getElementById('uni-destino').value;
  if (normalizar(nomeOrigem) === normalizar(nomeDestino)) { toast('Escolha safras diferentes.','erro'); return; }
  if (!confirm(`Unificar "${nomeOrigem}" em "${nomeDestino}"? Todos os registros de "${nomeOrigem}" passarão para "${nomeDestino}".`)) return;
  try {
    const total = await reescreverSafraNosRegistros(nomeOrigem, nomeDestino);
    // Remove a safra de origem do cadastro, se existir lá
    const sOrigem = safras.find(s => normalizar(s.nome) === normalizar(nomeOrigem));
    if (sOrigem) {
      await deleteDoc(doc(db,'insumos_safras',sOrigem.id));
      safras.splice(safras.findIndex(x=>x.id===sOrigem.id),1);
    }
    // Garante que o destino exista no cadastro
    if (!safras.find(s => normalizar(s.nome) === normalizar(nomeDestino))) {
      const ref = await addDoc(collection(db,'insumos_safras'), { nome: nomeDestino });
      safras.push({ id: ref.id, nome: nomeDestino });
      safras.sort((a,b)=>a.nome.localeCompare(b.nome));
    }
    fecharModal('modal-unificar-safra');
    toast(`${total} registro(s) movidos para "${nomeDestino}". Safra "${nomeOrigem}" removida.`);
    renderCadastros();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

// ══════════════ CADERNO DE CAMPO ══════════════
let cadernoSubaba = 'talhoes';
let cadernoSafra = '';  // '' = todas as safras (filtro global do caderno)

// Lista de safras disponíveis (cadastro + as que aparecem em registros)
function safrasDisponiveis() {
  const s = new Set();
  [...plantios, ...adubacoes, ...colheitas].forEach(r => { if (r.safra) s.add(r.safra); });
  safras.forEach(x => s.add(x.nome));
  return [...s].filter(Boolean).sort();
}
// Aplica o filtro global de safra (usado por plantio/adubação/colheita)
function filtroCadernoSafra(r) { return !cadernoSafra || r.safra === cadernoSafra; }

      <button class="nav-btn ${cadernoSubaba==='plantio'?'ativo':''}" onclick="mudarSubabaCaderno('plantio')">🌱 Plantio</button>
      <button class="nav-btn ${cadernoSubaba==='pulverizacao'?'ativo':''}" onclick="mudarSubabaCaderno('pulverizacao')">💧 Pulverização</button>
      <button class="nav-btn ${cadernoSubaba==='solido'?'ativo':''}" onclick="mudarSubabaCaderno('solido')">🪨 Sólidos</button>

}

window.mudarSafraCaderno = function(v) {
  cadernoSafra = v;
  renderSubabaCaderno();
};

window.mudarSubabaCaderno = function(sub) { cadernoSubaba = sub; renderCaderno(); };

function renderSubabaCaderno() {
  switch(cadernoSubaba) {
    case 'plantio': renderPlantio(); break;
    case 'pulverizacao': renderAdubacao('pulverizacao'); break;
    case 'solido': renderAdubacao('solido'); break;
    case 'colheita': renderColheita(); break;
    case 'talhoes': renderPainelTalhoes(); break;
  }
}

// ── PLANTIO ──
// ══════════ SELEÇÃO MÚLTIPLA (excluir vários planejamentos de uma vez) ══════════
// Guarda os IDs selecionados por tipo de aba do caderno.
const selecaoCaderno = { plantio: new Set(), solido: new Set(), pulverizacao: new Set() };

window.toggleSelCaderno = function(tipo, id) {
  const s = selecaoCaderno[tipo];
  if (s.has(id)) s.delete(id); else s.add(id);
  atualizarBarraSelecao(tipo);
};

window.toggleSelTodosCaderno = function(tipo, marcar) {
  const s = selecaoCaderno[tipo];
  document.querySelectorAll(`input[data-selcad="${tipo}"]`).forEach(cb => {
    cb.checked = marcar;
    if (marcar) s.add(cb.value); else s.delete(cb.value);
  });
  atualizarBarraSelecao(tipo);
};

function atualizarBarraSelecao(tipo) {
  const barra = document.getElementById(`sel-barra-${tipo}`);
  const n = selecaoCaderno[tipo].size;
  if (barra) {
    barra.style.display = n>0 ? 'flex' : 'none';
    const cont = document.getElementById(`sel-cont-${tipo}`);
    if (cont) cont.textContent = n;
  }
  // sincroniza o "selecionar tudo"
  const todos = document.querySelectorAll(`input[data-selcad="${tipo}"]`);
  const master = document.getElementById(`sel-todos-${tipo}`);
  if (master && todos.length) master.checked = (n === todos.length && n > 0);
}

// Coluna de checkbox (cabeçalho e célula)
function thSelCaderno(tipo) {
  return `<th style="width:34px;text-align:center"><input type="checkbox" id="sel-todos-${tipo}" onchange="toggleSelTodosCaderno('${tipo}',this.checked)" title="Selecionar todos"></th>`;
}
function tdSelCaderno(tipo, id) {
  const marcado = selecaoCaderno[tipo].has(id) ? 'checked' : '';
  return `<td style="text-align:center"><input type="checkbox" data-selcad="${tipo}" value="${id}" ${marcado} onchange="toggleSelCaderno('${tipo}','${id}')"></td>`;
}
// Barra de ações em massa (aparece quando há itens selecionados)
function barraSelCaderno(tipo, colecao) {
  return `<div id="sel-barra-${tipo}" style="display:none;align-items:center;gap:12px;background:#fdecea;border:1px solid #f5c6c2;border-radius:10px;padding:10px 14px;margin-bottom:12px">
    <span style="font-size:14px;color:var(--vermelho);font-weight:600"><span id="sel-cont-${tipo}">0</span> selecionado(s)</span>
    <button class="btn btn-sm" style="background:var(--vermelho);color:#fff" onclick="excluirSelecionadosCaderno('${tipo}','${colecao}')">🗑 Excluir selecionados</button>
    <button class="btn btn-sm btn-secondary" onclick="limparSelecaoCaderno('${tipo}')">Cancelar</button>
  </div>`;
}
window.limparSelecaoCaderno = function(tipo) {
  selecaoCaderno[tipo].clear();
  document.querySelectorAll(`input[data-selcad="${tipo}"]`).forEach(cb => cb.checked=false);
  const master = document.getElementById(`sel-todos-${tipo}`); if (master) master.checked=false;
  atualizarBarraSelecao(tipo);
};

window.excluirSelecionadosCaderno = async function(tipo, colecao) {
  const ids = [...selecaoCaderno[tipo]];
  if (ids.length === 0) return;
  const ok = await window.exigirMaster();
  if (!ok) return;
  if (!confirm(`Excluir ${ids.length} planejamento(s) selecionado(s)? Esta ação não pode ser desfeita.`)) return;
  let apagados = 0;
  for (const id of ids) {
    try {
      await deleteDoc(doc(db, colecao, id));
      // remove do array local correspondente
      if (colecao === 'insumos_campo_plantio') {
        const idx = plantios.findIndex(x=>x.id===id);
        if (idx>=0) { removerColheitasDoPlantio(id); plantios.splice(idx,1); }
      } else if (colecao === 'insumos_campo_adubacao') {
        const idx = adubacoes.findIndex(x=>x.id===id); if (idx>=0) adubacoes.splice(idx,1);
      }
      apagados++;
    } catch(e) { /* continua os demais */ }
  }
  selecaoCaderno[tipo].clear();
  toast(`${apagados} planejamento(s) excluído(s).`);
  // re-renderiza a aba certa
  if (tipo==='plantio') renderPlantio();
  else renderAdubacao(tipo);
};

function renderPlantio() {
  const el = document.getElementById('caderno-conteudo');
  const lista = plantios.filter(filtroCadernoSafra);
  el.innerHTML = `
    <div class="sec-header"><div style="font-size:14px;color:var(--cinza)">${lista.length} registro(s)${cadernoSafra?` — ${cadernoSafra}`:''}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-secondary btn-sm" onclick="baixarModelo('plantio')">📋 Baixar Modelo</button>
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('import-plantio').click()">📤 Importar Excel</button>
        <input type="file" id="import-plantio" accept=".xlsx,.xls" style="display:none" onchange="importarPlanilha(this,'plantio')">
        <button class="btn btn-secondary btn-sm" onclick="exportarCaderno('plantio')">📥 Exportar Excel</button>
        <button class="btn btn-primary" onclick="abrirModalPlantio()">+ Novo Plantio</button>
      </div></div>
    <div class="tabela-wrap">${barraSelCaderno('plantio','insumos_campo_plantio')}<table>
      <thead><tr>
        ${thSelCaderno('plantio')}
        ${thOrd('plantio','data','Data Planejada')}
        ${thOrd('plantio','data_conclusao','Data Execução')}
        ${thOrd('plantio','fazenda','Fazenda')}
        ${thOrd('plantio','talhao','Talhão')}
        ${thOrd('plantio','cultura','Cultura')}
        ${thOrd('plantio','safra','Safra')}
        ${thOrd('plantio','cultivar','Cultivar')}
        ${thOrd('plantio','ciclo_dias','Ciclo')}
        ${thOrd('plantio','data_prevista_colheita','Previsão Colheita')}
        ${thOrd('plantio','status','Status')}
        <th class="col-acoes">Ações</th>
      </tr></thead>
      <tbody>
        ${lista.length===0?'<tr><td colspan="12" class="tabela-vazia">Nenhum plantio registrado</td></tr>':
        ordenarLista(lista,'plantio',(p,c)=>{
          if(c==='ciclo_dias') return parseFloat(p.ciclo_dias)||0;
          return p[c]||'';
        }).map(p=>{
          const cs = cultivaresDoPlantio(p);
          const cultCell = cs.length===0 ? '—' : cs.map(c=>`${c.cultivar||'—'}${c.area_ha>0?` <span style="font-size:11px;color:var(--cinza)">(${fmt(c.area_ha)} ha)</span>`:''}`).join('<br>');
          const cicloCell = cs.length===0 ? '—' : cs.map(c=>c.ciclo_dias>0?fmt(c.ciclo_dias)+'d':'—').join('<br>');
          const prevCell = cs.length===0 ? '—' : cs.map(c=>fmtDataBR(c.data_prevista_colheita)).join('<br>');
          return `<tr>${tdSelCaderno('plantio',p.id)}<td>${fmtDataBR(p.data)}</td><td>${p.data_conclusao?fmtDataBR(p.data_conclusao):'—'}</td><td>${p.fazenda||'—'}</td><td>${p.talhao||'—'}</td><td>${p.cultura||'—'}</td>
        <td>${p.safra||'—'}</td><td>${cultCell}</td><td>${cicloCell}</td>
        <td>${prevCell}</td><td>${badgeStatusCampo(p.status)}</td>
        <td class="col-acoes"><div class="acoes-wrap">
          ${p.status!=='concluido'?`<button class="btn btn-sm btn-primary" onclick="abrirConcluirPlantio('${p.id}')">✅ Concluir</button>`:''}
          <button class="btn btn-sm btn-secondary" onclick="abrirModalPlantio('${p.id}')">✏️</button>
          <button class="btn btn-sm btn-secondary" onclick="excluirRegistroCampo('insumos_campo_plantio','${p.id}','plantio')">✕</button>
        </div></td></tr>`;}).join('')}
      </tbody>
    </table></div>`;
}

function badgeStatusCampo(status) {
  if (status === 'concluido') return '<span class="badge badge-verde">Concluído</span>';
  if (status === 'execucao') return '<span class="badge badge-laranja">Em execução</span>';
  if (status === 'enviado_operador') return '<span class="badge badge-laranja">Enviado ao Operador</span>';
  return '<span class="badge badge-azul">Planejado</span>';
}

// Lê as cultivares de um plantio de forma retrocompatível:
// - formato novo: p.cultivares = [{cultivar, area_ha, ciclo_dias, data_prevista_colheita}]
// - formato antigo: p.cultivar / p.ciclo_dias / p.data_prevista_colheita (única)
function cultivaresDoPlantio(p) {
  if (Array.isArray(p.cultivares) && p.cultivares.length > 0) {
    return p.cultivares.map(c => ({
      cultivar: c.cultivar||'', area_ha: parseFloat(c.area_ha)||0,
      ciclo_dias: parseFloat(c.ciclo_dias)||0, data_prevista_colheita: c.data_prevista_colheita||'',
      populacao: parseFloat(c.populacao)||0, obs: c.obs||''
    }));
  }
  if (p.cultivar || p.ciclo_dias) return [{
    cultivar: p.cultivar||'', area_ha: 0,
    ciclo_dias: parseFloat(p.ciclo_dias)||0, data_prevista_colheita: p.data_prevista_colheita||'',
    populacao: parseFloat(p.populacao)||0, obs: p.obs||''
  }];
  return [];
}

          <div class="form-group"><label>Fazenda *</label><select id="pl-fazenda" onchange="atualizarTalhoesCampo('pl')"><option value="">Selecione...</option>${nomesFazendas().map(f=>`<option ${f===p?.fazenda?'selected':''}>${f}</option>`).join('')}</select></div>

          <div id="pl-cultivares-lista"></div>
          <button type="button" class="btn btn-secondary btn-sm" style="margin-top:8px" onclick="adicionarLinhaCultivar()">+ Adicionar cultivar</button>
        </div>
        <div class="form-group"><label>Espaçamento (cm)</label><input type="number" id="pl-espacamento" value="${p?.espacamento||''}" min="0" step="0.1" placeholder="Geral do plantio"></div>

// Renderiza as linhas de cultivar preservando o que foi digitado
function renderLinhasCultivar() {
  const cont = document.getElementById('pl-cultivares-lista');
  if (!cont) return;
  const lista = window._plCultivares || [];
  cont.innerHTML = lista.map((c, i) => `
    <div class="pl-cult-linha" style="border:1px solid var(--creme-escuro);border-radius:10px;padding:10px;margin-bottom:8px">
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <input type="text" class="pl-cult-nome" value="${(c.cultivar||'').replace(/"/g,'&quot;')}" placeholder="Cultivar (ex: TMG 7062)" style="flex:2;min-width:130px">
        <input type="number" class="pl-cult-area" value="${c.area_ha||''}" placeholder="Área (ha) — vazio = talhão todo" min="0" step="0.01" style="flex:1;min-width:85px">
        <input type="number" class="pl-cult-ciclo" value="${c.ciclo_dias||''}" placeholder="Ciclo (dias)" min="0" step="1" oninput="atualizarPrevisaoColheita()" style="flex:1;min-width:85px">
        ${lista.length>1?`<button type="button" class="btn btn-sm btn-secondary" onclick="removerLinhaCultivar(${i})" title="Remover">✕</button>`:''}
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px">
        <input type="number" class="pl-cult-pop" value="${c.populacao||''}" placeholder="População (sementes/ha)" min="0" step="1" style="flex:1;min-width:150px">
        <input type="text" class="pl-cult-obs" value="${(c.obs||'').replace(/"/g,'&quot;')}" placeholder="Observação desta cultivar" style="flex:2;min-width:150px">
      </div>
      <div class="pl-cult-prev" style="font-size:12px;color:var(--cinza);margin-top:6px">Previsão de colheita: —</div>
    </div>`).join('');
  atualizarPrevisaoColheita();
}

function coletarLinhasCultivar() {
  const cont = document.getElementById('pl-cultivares-lista');
  if (!cont) return;
  const linhas = [];
  cont.querySelectorAll('.pl-cult-linha').forEach(div => {
    linhas.push({
      cultivar: div.querySelector('.pl-cult-nome').value.trim(),
      area_ha: div.querySelector('.pl-cult-area').value,
      ciclo_dias: div.querySelector('.pl-cult-ciclo').value,
      populacao: div.querySelector('.pl-cult-pop').value,
      obs: div.querySelector('.pl-cult-obs').value
    });
  });
  window._plCultivares = linhas;
}

window.adicionarLinhaCultivar = function() {
  coletarLinhasCultivar();
  window._plCultivares.push({cultivar:'',area_ha:'',ciclo_dias:'',populacao:'',obs:''});
  renderLinhasCultivar();
};

window.removerLinhaCultivar = function(i) {
  coletarLinhasCultivar();
  window._plCultivares.splice(i,1);
  if (window._plCultivares.length === 0) window._plCultivares.push({cultivar:'',area_ha:'',ciclo_dias:'',populacao:'',obs:''});
  renderLinhasCultivar();
};

// Recalcula a previsão de colheita de cada cultivar (data do plantio + ciclo) em tempo real
window.atualizarPrevisaoColheita = function() {
  const data = document.getElementById('pl-data')?.value;
  document.querySelectorAll('.pl-cult-linha').forEach(div => {
    const ciclo = parseFloat(div.querySelector('.pl-cult-ciclo')?.value)||0;
    const span = div.querySelector('.pl-cult-prev');
    if (span) span.textContent = 'Previsão de colheita: ' + ((data && ciclo>0) ? fmtDataBR(somarDias(data, ciclo)) : '—');
  });
};

window.salvarPlantio = async function(id) {
  const fazenda = document.getElementById('pl-fazenda').value;
  const talhao = document.getElementById('pl-talhao').value;
  const cultura = document.getElementById('pl-cultura').value;
  if (!fazenda || !talhao || !cultura) { toast('Preencha fazenda, talhão e cultura.','erro'); return; }
  const data = document.getElementById('pl-data').value;
  // Coleta as cultivares e valida
  coletarLinhasCultivar();
  const cultivares = (window._plCultivares||[])
    .map(c => ({
      cultivar: (c.cultivar||'').trim(),
      area_ha: parseFloat(c.area_ha)||0,
      ciclo_dias: parseFloat(c.ciclo_dias)||0,
      populacao: parseFloat(c.populacao)||0,
      obs: (c.obs||'').trim(),
      data_prevista_colheita: (data && (parseFloat(c.ciclo_dias)||0)>0) ? somarDias(data, parseFloat(c.ciclo_dias)) : ''
    }))
    .filter(c => c.cultivar);
  if (cultivares.length === 0) { toast('Informe ao menos uma cultivar.','erro'); return; }
  // Se houver só uma cultivar e a área não foi informada, assume a área do talhão
  if (cultivares.length === 1 && !cultivares[0].area_ha) {
    const areaTal = areaDoTalhao(fazenda, talhao);
    if (areaTal > 0) cultivares[0].area_ha = areaTal;
  }

  const reg = {
    data, fazenda, talhao, cultura,
    safra: document.getElementById('pl-safra').value,
    // Formato novo: lista de cultivares (cada uma com área, ciclo, população e obs).
    // Mantém campos antigos com a 1ª cultivar para compatibilidade.
    cultivares,
    cultivar: cultivares[0].cultivar,
    ciclo_dias: cultivares[0].ciclo_dias,
    data_prevista_colheita: cultivares[0].data_prevista_colheita,
    populacao: cultivares[0].populacao,
    obs: cultivares[0].obs,
    espacamento: parseFloat(document.getElementById('pl-espacamento').value)||0
  };
  try {
    if (id) {
      await updateDoc(doc(db,'insumos_campo_plantio',id), reg);
      const i = plantios.findIndex(x=>x.id===id);
      if (i>=0) plantios[i] = { ...plantios[i], ...reg };
      await sincronizarColheitasDoPlantio(plantios[i>=0?i:0]);
      toast('Plantio atualizado! Colheitas sincronizadas.');
    } else {
      reg.status = 'planejado'; reg.criado_em = Timestamp.now();
      const ref = await addDoc(collection(db,'insumos_campo_plantio'), reg);
      const novoPlantio = {id: ref.id, ...reg};
      plantios.unshift(novoPlantio);
      await sincronizarColheitasDoPlantio(novoPlantio);
      toast('Plantio planejado! Colheita(s) gerada(s) automaticamente.');
    }
    fecharModal('modal-plantio');
    renderPlantio();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

window.abrirConcluirPlantio = function(id) {
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay ativo" id="modal-concluir-plantio">
      <div class="modal" style="max-width:380px">
        <div class="modal-titulo">✅ Concluir Plantio</div>
        <div class="form-group"><label>Data de Conclusão *</label><input type="date" id="cpl-data" value="${hoje()}"></div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="fecharModal('modal-concluir-plantio')">Cancelar</button>
          <button class="btn btn-primary" onclick="confirmarConcluirPlantio('${id}')">Confirmar</button>
        </div>
      </div>
    </div>`);
};

window.confirmarConcluirPlantio = async function(id) {
  const data_conclusao = document.getElementById('cpl-data').value;
  try {
    await updateDoc(doc(db,'insumos_campo_plantio',id), { status: 'concluido', data_conclusao });
    const p = plantios.find(x=>x.id===id);
    if (p) { p.status='concluido'; p.data_conclusao=data_conclusao; await sincronizarColheitasDoPlantio(p); }
    fecharModal('modal-concluir-plantio');
    toast('Plantio concluído! Datas de colheita atualizadas.');
    renderPlantio();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

// Regulariza: gera as colheitas de todos os plantios que ainda não têm (plantios antigos)
window.gerarColheitasFaltantes = async function() {
  if(!exigirMaster())return;
  const semColheita = plantios.filter(p => !colheitas.some(c => c.plantio_id === p.id));
  if (semColheita.length === 0 && plantios.length > 0) {
    // Mesmo que todos tenham, ressincroniza para atualizar datas/cultivares
    if (!confirm('Todos os plantios já têm colheita. Deseja ressincronizar as datas e cultivares mesmo assim?')) return;
  } else if (plantios.length === 0) {
    toast('Nenhum plantio cadastrado.','erro'); return;
  } else {
    if (!confirm(`Gerar colheitas para ${semColheita.length} plantio(s) que ainda não têm? (uma colheita por cultivar)`)) return;
  }
  let total = 0;
  for (const p of plantios) {
    const antes = colheitas.filter(c => c.plantio_id === p.id).length;
    await sincronizarColheitasDoPlantio(p);
    const depois = colheitas.filter(c => c.plantio_id === p.id).length;
    total += Math.max(0, depois - antes);
  }
  toast(`${total} colheita(s) gerada(s).`);
  renderSubabaCaderno();
};

// A data-base da colheita é a data de EXECUÇÃO do plantio; se ainda não executado, a planejada.
function dataBasePlantio(p) {
  return (p.status === 'concluido' && p.data_conclusao) ? p.data_conclusao : p.data;
}

// Cria/atualiza/remove as colheitas de um plantio — uma por cultivar.
// Vincula por plantio_id + cultivar. A data planejada = data-base + ciclo da cultivar.
// Campos de execução (produtividade, umidade, PMS, stand_final) NÃO são tocados aqui.
async function sincronizarColheitasDoPlantio(p) {
  if (!p || !p.id) return;
  const base = dataBasePlantio(p);
  let cults = cultivaresDoPlantio(p);
  // Plantio antigo sem cultivar cadastrada: gera uma colheita "genérica" pela cultura,
  // usando o ciclo/previsão que o plantio tiver (marcada com cultivar vazio).
  if (cults.length === 0) {
    cults = [{
      cultivar: '', area_ha: areaDoTalhao(p.fazenda, p.talhao) || 0,
      ciclo_dias: parseFloat(p.ciclo_dias)||0, data_prevista_colheita: p.data_prevista_colheita||'',
      populacao: 0, obs: ''
    }];
  }
  const existentes = colheitas.filter(c => c.plantio_id === p.id);

  // Remove colheitas de cultivares que não existem mais (só se ainda não colhidas)
  for (const c of existentes) {
    const aindaExiste = cults.some(cu => normalizar(cu.cultivar) === normalizar(c.cultivar));
    if (!aindaExiste && c.status !== 'concluido') {
      try { await deleteDoc(doc(db,'insumos_campo_colheita',c.id)); } catch(e){}
      const i = colheitas.findIndex(x=>x.id===c.id); if (i>=0) colheitas.splice(i,1);
    }
  }

  // Cria/atualiza uma colheita por cultivar
  for (const cu of cults) {
    const dataPrev = (base && cu.ciclo_dias>0) ? somarDias(base, cu.ciclo_dias) : (cu.data_prevista_colheita||'');
    const jaTem = colheitas.find(c => c.plantio_id === p.id && normalizar(c.cultivar) === normalizar(cu.cultivar));
    if (jaTem) {
      // Atualiza só os campos vindos do plantio; preserva execução
      const upd = {
        data: dataPrev, fazenda: p.fazenda, talhao: p.talhao, cultura: p.cultura,
        safra: p.safra, cultivar: cu.cultivar, area_ha: cu.area_ha, ciclo_dias: cu.ciclo_dias
      };
      // não recalcula data se a colheita já foi concluída
      if (jaTem.status === 'concluido') delete upd.data;
      try {
        await updateDoc(doc(db,'insumos_campo_colheita',jaTem.id), upd);
        Object.assign(jaTem, upd);
      } catch(e){}
    } else {
      const nova = {
        plantio_id: p.id, data: dataPrev, fazenda: p.fazenda, talhao: p.talhao,
        cultura: p.cultura, safra: p.safra, cultivar: cu.cultivar, area_ha: cu.area_ha,
        ciclo_dias: cu.ciclo_dias, status: 'planejado',
        produtividade: 0, umidade: 0, pms: 0, stand_final: 0,
        criado_em: Timestamp.now()
      };
      try {
        const ref = await addDoc(collection(db,'insumos_campo_colheita'), nova);
        colheitas.unshift({id: ref.id, ...nova});
      } catch(e){}
    }
  }
}

// Remove todas as colheitas vinculadas a um plantio (usado ao excluir o plantio)
async function removerColheitasDoPlantio(plantioId) {
  const vinculadas = colheitas.filter(c => c.plantio_id === plantioId);
  for (const c of vinculadas) {
    try { await deleteDoc(doc(db,'insumos_campo_colheita',c.id)); } catch(e){}
    const i = colheitas.findIndex(x=>x.id===c.id); if (i>=0) colheitas.splice(i,1);
  }
}

// ── APLICAÇÕES: PULVERIZAÇÃO (líquidos, com vazão) e SÓLIDOS (corretivos/adubação) ──
// tipo: 'pulverizacao' | 'solido'. Registros antigos sem tipo contam como 'solido'.
function tipoDaAdubacao(a) { return a.tipo_aplicacao === 'pulverizacao' ? 'pulverizacao' : 'solido'; }

// Lê os produtos de uma aplicação de forma retrocompatível:
// - formato novo: a.produtos = [{produto, dose, unidade}, ...]
// - formato antigo: a.produto / a.dose / a.unidade (produto único)
function produtosDaAplicacao(a) {
  if (Array.isArray(a.produtos) && a.produtos.length > 0) {
    return a.produtos.map(p => ({ produto: p.produto||'', dose: parseFloat(p.dose)||0, unidade: p.unidade||'' }));
  }
  if (a.produto) return [{ produto: a.produto, dose: parseFloat(a.dose)||0, unidade: a.unidade||'' }];
  return [];
}
// Texto resumido dos produtos (para tabelas): "Produto A, Produto B (+1)"
function resumoProdutos(a) {
  const lista = produtosDaAplicacao(a);
  if (lista.length === 0) return '—';
  if (lista.length === 1) return lista[0].produto || '—';
  return `${lista[0].produto} +${lista.length-1}`;
}

// Gera o HTML dos campos de data (fixa / X dias após plantio / X dias após outra aplicação)
function renderModoDataCampos(valores) {
  valores = valores || {};
  const fazenda = document.getElementById('ad-fazenda')?.value||'';
  const talhao = document.getElementById('ad-talhao')?.value||'';
  const modo = document.getElementById('ad-modo-data')?.value || valores.modo_data || 'fixa';
  if (modo === 'plantio') {
    const opcoes = plantios.filter(p => normalizar(p.fazenda||'')===normalizar(fazenda) && normalizar(p.talhao||'')===normalizar(talhao));
    if (opcoes.length===0) return `<p style="font-size:12px;color:var(--laranja)">Nenhum plantio cadastrado para esse talhão ainda. Cadastre o plantio primeiro, ou use Data fixa.</p>`;
    return `
      <div class="form-row">
        <div class="form-group"><label>Plantio de referência</label>
          <select id="ad-ref-plantio">${opcoes.map(p=>`<option value="${p.id}" ${p.id===valores.ref_plantio_id?'selected':''}>${p.cultura||'Plantio'} — ${p.data} (${p.cultivar||''})</option>`).join('')}</select></div>
        <div class="form-group"><label>Dias após o plantio</label><input type="number" id="ad-dias-apos" value="${valores.dias_apos!=null?valores.dias_apos:''}" min="0" step="1"></div>
      </div>`;
  }
  if (modo === 'pulv_anterior') {
    return `
      <div class="form-group"><label>Dias após a pulverização anterior</label>
        <input type="number" id="ad-dias-apos" value="${valores.dias_apos!=null?valores.dias_apos:''}" min="0" step="1" placeholder="Ex: 14">
        <div style="font-size:11px;color:var(--cinza);margin-top:4px">A data será calculada a partir da última pulverização (por data) nesse talhão. Ex: Fung 2 conta a partir do Fung 1, Fung 3 a partir do Fung 2, e assim por diante.</div>
      </div>`;
  }
  if (modo === 'aplicacao') {
    const opcoes = adubacoes.filter(a => normalizar(a.fazenda||'')===normalizar(fazenda) && normalizar(a.talhao||'')===normalizar(talhao) && a.id!==valores.idAtual);
    if (opcoes.length===0) return `<p style="font-size:12px;color:var(--laranja)">Nenhum outro planejamento nesse talhão ainda para usar como referência.</p>`;
    return `
      <div class="form-row">
        <div class="form-group"><label>Aplicação de referência</label>
          <select id="ad-ref-aplicacao">${opcoes.map(a=>`<option value="${a.id}" ${a.id===valores.ref_aplicacao_id?'selected':''}>${a.produto} — ${a.data}</option>`).join('')}</select></div>
        <div class="form-group"><label>Dias após essa aplicação</label><input type="number" id="ad-dias-apos" value="${valores.dias_apos!=null?valores.dias_apos:''}" min="0" step="1"></div>
      </div>`;
  }
  return `<div class="form-group"><label>Data Planejada *</label><input type="date" id="ad-data" value="${valores.data||hoje()}"></div>`;
}
