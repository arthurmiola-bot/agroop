<style>
  :root {
    --verde: #2d6a4f;
    --verde-claro: #40916c;
    --verde-menta: #74c69d;
    --creme: #f8f4ee;
    --creme-escuro: #ede8e0;
    --terra: #7c5c3e;
    --laranja: #e07c3a;
    --vermelho: #c0392b;
    --azul: #2563eb;
    --cinza: #6b7280;
    --branco: #ffffff;
    --texto: #1a1a1a;
    --sombra: 0 2px 12px rgba(0,0,0,0.08);
    --sombra-forte: 0 8px 32px rgba(0,0,0,0.14);
    --radius: 12px;
    --radius-lg: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--creme); color: var(--texto); min-height: 100vh; }

  /* LOGIN */
  #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(145deg, #1a3a2a 0%, #2d6a4f 60%, #40916c 100%); padding: 24px; }
  .login-card { background: var(--branco); border-radius: var(--radius-lg); padding: 48px 40px; width: 100%; max-width: 400px; box-shadow: var(--sombra-forte); }
  .login-logo { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; color: var(--verde); margin-bottom: 4px; }
  .login-sub { font-size: 13px; color: var(--cinza); margin-bottom: 36px; letter-spacing: 0.5px; }
  .login-card label { display: block; font-size: 12px; font-weight: 500; color: var(--cinza); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
  .login-card input { width: 100%; padding: 12px 16px; border: 2px solid var(--creme-escuro); border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif; font-size: 15px; margin-bottom: 18px; transition: border-color 0.2s; outline: none; }
  .login-card input:focus { border-color: var(--verde-claro); }
  .btn-login { width: 100%; padding: 14px; background: var(--verde); color: white; border: none; border-radius: var(--radius);
    font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; transition: background 0.2s, transform 0.1s; }
  .btn-login:hover { background: var(--verde-claro); }
  .btn-login:active { transform: scale(0.98); }
  .login-erro { color: var(--vermelho); font-size: 13px; margin-top: 10px; text-align: center; }

  /* LAYOUT */
  #app { display: none; min-height: 100vh; flex-direction: column; }
  #app.ativo { display: flex; }
  .header { background: var(--verde); color: white; padding: 0 24px; height: 60px; display: flex; align-items: center;
    justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
  .header-logo { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
  .header-logo span { color: var(--verde-menta); }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .header-user { font-size: 13px; opacity: 0.85; display: flex; align-items: center; gap: 8px; }
  .badge-perfil { background: rgba(255,255,255,0.2); border-radius: 20px; padding: 3px 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .btn-sair { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 6px 14px;
    border-radius: 8px; font-size: 13px; cursor: pointer; transition: background 0.2s; }
  .btn-sair:hover { background: rgba(255,255,255,0.25); }

  .nav { background: var(--branco); border-bottom: 2px solid var(--creme-escuro); padding: 0 24px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav-btn { padding: 14px 16px; background: none; border: none; border-bottom: 3px solid transparent; font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 500; color: var(--cinza); cursor: pointer; white-space: nowrap; transition: all 0.2s; display: flex; align-items: center; gap: 7px; }
  .nav-btn:hover { color: var(--verde); }
  .nav-btn.ativo { color: var(--verde); border-bottom-color: var(--verde); font-weight: 600; }

  .main { flex: 1; padding: 28px 24px; max-width: 1100px; margin: 0 auto; width: 100%; }

  /* OPERADOR */
  .operador-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: calc(100vh - 120px); gap: 20px; padding: 24px; }
  .operador-titulo { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 700; color: var(--verde); text-align: center; }
  .operador-sub { color: var(--cinza); font-size: 14px; text-align: center; }
  .btn-operador { width: 100%; max-width: 320px; padding: 22px; border-radius: var(--radius-lg); border: none;
    font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; cursor: pointer; display: flex; align-items: center;
    gap: 16px; transition: transform 0.15s; box-shadow: var(--sombra); text-align: left; }
  .btn-operador:active { transform: scale(0.97); }
  .btn-operador .op-icon { font-size: 32px; }
  .btn-op-retirar { background: var(--verde); color: white; }
  .btn-op-historico { background: var(--branco); color: var(--verde); border: 2px solid var(--verde); }

  /* CARDS */
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .card-resumo { background: var(--branco); border-radius: var(--radius); padding: 20px; box-shadow: var(--sombra); border-left: 4px solid var(--verde); }
  .card-resumo.alerta { border-left-color: var(--laranja); }
  .card-resumo.perigo { border-left-color: var(--vermelho); }
  .card-resumo.info { border-left-color: var(--azul); }
  .card-resumo-valor { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; color: var(--verde); line-height: 1; }
  .card-resumo.alerta .card-resumo-valor { color: var(--laranja); }
  .card-resumo.perigo .card-resumo-valor { color: var(--vermelho); }
  .card-resumo.info .card-resumo-valor { color: var(--azul); }
  .card-resumo-label { font-size: 12px; color: var(--cinza); margin-top: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }

  .sec-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .sec-titulo { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; color: var(--texto); }

  .btn { padding: 10px 20px; border-radius: var(--radius); border: none; font-family: 'DM Sans', sans-serif; font-size: 14px;
    font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
  .btn-primary { background: var(--verde); color: white; }
  .btn-primary:hover { background: var(--verde-claro); }
  .btn-secondary { background: var(--creme-escuro); color: var(--texto); }
  .btn-secondary:hover { background: #ddd8cf; }
  .btn-danger { background: var(--vermelho); color: white; }
  .btn-sm { padding: 6px 12px; font-size: 13px; }
  .btn-laranja { background: var(--laranja); color: white; }
  .btn-azul { background: var(--azul); color: white; }

  .tabela-wrap { background: var(--branco); border-radius: var(--radius); box-shadow: var(--sombra); overflow: auto; }
  .tabela-wrap table { width: 100%; border-collapse: collapse; }
  .tabela-wrap th { background: var(--verde); color: white; padding: 14px 10px; text-align: left; font-family: 'Syne', sans-serif;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; white-space: normal; line-height: 1.35; vertical-align: middle; max-width: 110px; }
  .tabela-wrap td { padding: 10px 10px; border-bottom: 1px solid var(--creme-escuro); font-size: 13px; vertical-align: middle; }
  .tabela-wrap tr:last-child td { border-bottom: none; }
  .tabela-wrap tbody tr:hover td { background: var(--creme); }
  .tabela-vazia { text-align: center; padding: 40px; color: var(--cinza); font-style: italic; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 500;
    align-items: center; justify-content: center; padding: 16px; }
  .modal-overlay.ativo { display: flex; }
  .modal { background: var(--branco); border-radius: var(--radius-lg); padding: 32px; width: 100%; max-width: 580px;
    max-height: 90vh; overflow-y: auto; box-shadow: var(--sombra-forte); }
  .modal-titulo { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 24px; color: var(--verde); }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--cinza); text-transform: uppercase;
    letter-spacing: 0.6px; margin-bottom: 6px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 11px 14px; border: 2px solid var(--creme-escuro);
    border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; background: var(--branco); }
  .form-group input:focus, .form-group select:focus { border-color: var(--verde-claro); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; }
  .badge-verde { background: #d1fae5; color: #065f46; }
  .badge-laranja { background: #fed7aa; color: #9a3412; }
  .badge-vermelho { background: #fee2e2; color: #991b1b; }
  .badge-azul { background: #dbeafe; color: #1e40af; }
  .badge-cinza { background: #f3f4f6; color: #374151; }
  .badge-amarelo { background: #fef9c3; color: #854d0e; }

  .filtros { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .filtros input, .filtros select { padding: 8px 12px; border: 2px solid var(--creme-escuro); border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; background: var(--branco); }
  .filtros input:focus, .filtros select:focus { border-color: var(--verde-claro); }

let sincronizando = false;

async function sincronizarFila(silencioso) {

  if (fila.length === 0) return;
  sincronizando = true;
  atualizarIndicadorOffline('Sincronizando...');

  let enviadas = 0;
  for (const acao of fila) {
    try { await enviarAcao(acao); enviadas++; }
    catch(e) { restantes.push(acao); } // falhou: mantém na fila p/ tentar depois

  atualizarIndicadorOffline();

// ── ORDENAÇÃO DE TABELAS DO CADERNO ──
// Guarda o critério de cada tabela: { campo, dir } (dir: 1 asc, -1 desc)
const ordenacaoCaderno = {
  plantio:   { campo: 'data', dir: 1 },
  pulverizacao: { campo: 'data', dir: 1 },
  solido:    { campo: 'data', dir: 1 },
  colheita:  { campo: 'data', dir: 1 }
};

// Ordena uma lista conforme o critério da tabela. getVal(item, campo) retorna o valor comparável.
function ordenarLista(lista, tabela, getVal) {
  const o = ordenacaoCaderno[tabela];
  if (!o || !o.campo) return lista;
  return [...lista].sort((a, b) => {
    let va = getVal(a, o.campo), vb = getVal(b, o.campo);
    if (va == null) va = '';
    if (vb == null) vb = '';
    // números comparam como número; resto como texto
    if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * o.dir;
    return String(va).localeCompare(String(vb), 'pt', {numeric:true}) * o.dir;
  });
}

// Clique no cabeçalho: alterna asc/desc e re-renderiza
window.ordenarCaderno = function(tabela, campo) {
  const o = ordenacaoCaderno[tabela];
  if (o.campo === campo) o.dir *= -1; else { o.campo = campo; o.dir = 1; }
  renderSubabaCaderno();
};

// Monta um <th> clicável com seta indicando a ordenação atual
function thOrd(tabela, campo, rotulo, extraClass) {

  const seta = o.campo === campo ? (o.dir === 1 ? ' ▲' : ' ▼') : '';
  return `<th class="th-ord${extraClass?' '+extraClass:''}" onclick="ordenarCaderno('${tabela}','${campo}')">${rotulo}<span class="th-seta">${seta}</span></th>`;
}
// Converte uma data "AAAA-MM-DD" para exibição "DD-MM-AA". Deixa passar o que não casar.
function fmtDataBR(dataStr) {
  if (!dataStr) return '—';
  const m = String(dataStr).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return dataStr;
  return `${m[3]}-${m[2]}-${m[1].slice(2)}`;
}
function somarDias(dataStr, dias) {
  if (!dataStr) return '';
  const d = new Date(dataStr + 'T12:00:00');
  d.setDate(d.getDate() + (parseInt(dias)||0));
  return d.toISOString().split('T')[0];
}

// Interpreta o texto da coluna Vencimento. Retorna:
//  { tipo:'data', data:'AAAA-MM-DD', texto }            -> data fixa informada
//  { tipo:'ddf', dias:30, texto:'30 DDF' }              -> dias após faturamento (calcula no recebimento)
//  { tipo:'texto', texto:'Barter' }                     -> condição sem data (ex: barter)
//  null                                                  -> vazio
function interpretarCondicaoPagamento(valor) {
  const txt = (valor==null?'':valor).toString().trim();
  if (!txt) return null;
  // data ISO AAAA-MM-DD
  if (/^\d{4}-\d{2}-\d{2}/.test(txt)) return { tipo:'data', data: txt.split('T')[0].substring(0,10), texto: txt };
  // data BR DD/MM/AAAA
  const br = txt.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (br) return { tipo:'data', data: `${br[3]}-${br[2]}-${br[1]}`, texto: txt };
  // "30 DDF", "360 ddf", "30DDF", "30 dias" etc -> extrai o número de dias
  const ddf = txt.match(/(\d+)\s*(ddf|dias|d)\b/i);
  if (ddf) return { tipo:'ddf', dias: parseInt(ddf[1]), texto: txt };
  // qualquer outro texto (Barter, "à vista", "a combinar"...)
  return { tipo:'texto', texto: txt };
}

function diasAte(ts) {
  if (!ts) return 9999;
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return Math.ceil((d - new Date()) / 86400000);
}
function classeVenc(ts) {
  const d = diasAte(ts);
  if (d < 0) return 'venc-hoje';
  if (d <= 7) return 'venc-proximo';
  return 'venc-ok';
}
function labelVenc(ts) {
  const d = diasAte(ts);
  if (d < 0) return `Vencido há ${Math.abs(d)}d`;
  if (d === 0) return 'Vence hoje!';
  if (d <= 7) return `Vence em ${d}d`;
  return fmtData(ts);
}
function toast(msg, tipo='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ativo' + (tipo==='erro' ? ' erro' : '');
  setTimeout(() => el.className = 'toast', 3500);
}
function normalizar(s) { return (s||'').toString().trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

  }

  // Cada registro é seu próprio card (sem agrupamento por data/talhão).
  // Agora que cada registro já pode ter múltiplos produtos dentro, agrupar
  // registros diferentes causaria mistura de aplicações separadas.
  const ordenados = lista.map(a => ({
    data: a.data||'', fazenda: a.fazenda||'—', talhao: a.talhao||'—',
    status: a.status, itens: [a]
  })).sort((a,b) => {
    if ((a.data||'') !== (b.data||'')) return (a.data||'').localeCompare(b.data||'');
    if (normalizar(a.fazenda) !== normalizar(b.fazenda)) return a.fazenda.localeCompare(b.fazenda);
    return a.talhao.localeCompare(b.talhao);
  });
  if (aplicSubaba === 'concluidas') ordenados.reverse();

  el.innerHTML = `<div style="display:flex;flex-direction:column;gap:10px">${ordenados.map((g,i) => cardAplicacao(g,i)).join('')}</div>`;
}

// Card compacto e clean; expande ao clicar mostrando produtos e observações
function cardAplicacao(g, idx) {
  const cardId = `aplic-card-${idx}`;
  const acaoTopo = g.status === 'execucao'
    ? `<span class="aplic-chip aplic-chip-exec">Em execução</span>`
    : g.status === 'concluido'
      ? `<span class="aplic-chip aplic-chip-ok">Concluída</span>`
      : `<span class="aplic-chip aplic-chip-pend">Pendente</span>`;

  // Área do talhão (do cadastro) — usada para calcular o total por produto
  const areaHa = areaDoTalhao(g.fazenda, g.talhao);

  // Linhas da tabela: Produto | Dose (un/ha) | Total (un) — expande múltiplos produtos por item
  const linhas = g.itens.map(it => {
    return produtosDaAplicacao(it).map(p => {
      const un = p.unidade || '';
      const dose = p.dose ? `${fmt(p.dose)} ${un}/ha` : '—';
      const total = (p.dose && areaHa > 0) ? `${fmt(p.dose * areaHa)} ${un}` : '—';
      return `
      <tr>
        <td class="aplic-td-prod">${p.produto||'—'}</td>
        <td class="aplic-td-dose">${dose}</td>
        <td class="aplic-td-total">${total}</td>
      </tr>`;
    }).join('');
  }).join('');

  // Observações do planejamento (uma por produto, se houver) + timestamps
  const extras = g.itens.map(it => {
    const partes = [];
    if (it.obs) partes.push(`📝 ${it.produto ? `<strong>${it.produto}:</strong> ` : ''}${it.obs}`);
    if (it.iniciado_em) partes.push(`Início: ${fmtDataHora(it.iniciado_em)}`);
    if (it.data_conclusao) partes.push(`Concluído: ${it.data_conclusao}`);
    return partes.length ? `<div class="aplic-extra">${partes.join('<br>')}</div>` : '';
  }).join('');

  // Observação do operador (mostrada quando concluída ou já preenchida)
  const obsOp = g.itens.map(it => it.obs_operador).find(Boolean) || '';
  const extraObsOp = (obsOp && g.status === 'concluido')
    ? `<div class="aplic-extra">🧑‍🌾 <strong>Operador:</strong> ${obsOp.replace(/</g,'&lt;')}</div>` : '';

  // Botão de ação da operação inteira (todos os produtos do card mudam juntos)
  let botaoOperacao = '';
  const temPendente = g.itens.some(it => it.status === 'planejado' || it.status === 'enviado_operador');
  const temExecucao = g.itens.some(it => it.status === 'execucao');
  if (temPendente) {
    botaoOperacao = `<button class="aplic-btn aplic-btn-iniciar" onclick="event.stopPropagation();aplicIniciarGrupo('${cardId}')">▶ Iniciar aplicação</button>`;
  } else if (temExecucao) {
    botaoOperacao = `<button class="aplic-btn aplic-btn-concluir" onclick="event.stopPropagation();aplicConcluirGrupo('${cardId}')">■ Concluir aplicação</button>`;
  }
  // Guarda os ids dos itens do grupo para as ações em lote
  const idsGrupo = g.itens.map(it => it.id).join(',');

  const cabecalhoArea = areaHa > 0
    ? `<span class="aplic-card-area">${fmt(areaHa)} ha</span>`
    : `<span class="aplic-card-area aplic-card-area-alerta" title="Cadastre a área do talhão em Cadastros para calcular o total">área não cadastrada</span>`;

  // Tipo da operação (selo colorido + cor de fundo do card)
  const ehPulv = g.itens.some(it => tipoDaAdubacao(it) === 'pulverizacao');
  const vazaoGrupo = (g.itens.find(it => it.vazao) || {}).vazao || '';
  const seloTipo = ehPulv
    ? `<span class="aplic-tipo aplic-tipo-pulv">💧 Pulverização${vazaoGrupo?` · ${vazaoGrupo}`:''}</span>`
    : `<span class="aplic-tipo aplic-tipo-solido">🪨 Sólidos</span>`;

  // ── CÁLCULO POR TANQUE (só pulverização, tanque de 3.100 L) ──
  // Área coberta por tanque = capacidade ÷ vazão (L/ha).
  // Volume de cada produto por tanque = dose × área coberta.
  // Último tanque: área que sobra depois dos tanques cheios, com volumes proporcionais.
  const TANQUE_L = 3100;
  const vazaoNum = parseFloat(((String(vazaoGrupo).match(/\d+[.,]?\d*/)||[''])[0]).replace(',','.')) || 0;
  let blocoTanque = '';
  if (ehPulv && vazaoNum > 0) {
    const areaPorTanque = TANQUE_L / vazaoNum;
    const prods = g.itens.flatMap(it => produtosDaAplicacao(it)).filter(p => p.produto);
    let infoTanques = '', colUltimo = '', linhasUltimo = false, restoHa = 0, nCheios = 0;
    if (areaHa > 0) {
      nCheios = Math.floor(areaHa / areaPorTanque + 1e-9);
      restoHa = areaHa - nCheios * areaPorTanque;
      if (restoHa < 0.005) { restoHa = 0; }
      linhasUltimo = restoHa > 0;
      infoTanques = `
        <div class="aplic-tanque-resumo">
          <div>🛢 Cada tanque cheio (${fmt(TANQUE_L)} L) cobre <strong>${fmt(areaPorTanque)} ha</strong></div>
          <div>➡️ Neste talhão: <strong>${nCheios} tanque(s) cheio(s)</strong>${linhasUltimo?` + <strong>último tanque de ${fmt(restoHa)} ha</strong> (${fmt(restoHa*vazaoNum)} L de calda)`:' (fecha exato, sem sobra)'}</div>
        </div>`;
    } else {
      infoTanques = `
        <div class="aplic-tanque-resumo">
          <div>🛢 Cada tanque cheio (${fmt(TANQUE_L)} L) cobre <strong>${fmt(areaPorTanque)} ha</strong></div>
          <div style="color:var(--aplic-ambar)">⚠️ Sem área do talhão cadastrada — não dá pra calcular o último tanque.</div>
        </div>`;
    }
    const linhasTanque = prods.map(p => {
      const porTanque = p.dose * areaPorTanque;
      const noUltimo = linhasUltimo ? p.dose * restoHa : 0;
      return `<tr>
        <td class="aplic-td-prod">${p.produto}</td>
        <td class="aplic-td-total">${fmt(porTanque)} ${p.unidade||''}</td>
        ${linhasUltimo?`<td class="aplic-td-total">${fmt(noUltimo)} ${p.unidade||''}</td>`:''}
      </tr>`;
    }).join('');
    blocoTanque = `
      <div class="aplic-tanque">
        <div class="aplic-tanque-titulo">🛢 Volume por tanque</div>
        ${infoTanques}
        <table class="aplic-tabela aplic-tabela-tanque">
          <thead><tr><th>Produto</th><th>Tanque cheio</th>${linhasUltimo?`<th>Último tanque</th>`:''}</tr></thead>
          <tbody>${linhasTanque}</tbody>
        </table>
      </div>`;
  }

  // Campo de observação do operador (sempre visível quando em execução).
  // Salva no primeiro item do grupo (obs_operador).
  const primeiroId = g.itens[0]?.id || '';
  const obsOperadorAtual = g.itens.map(it => it.obs_operador).find(Boolean) || '';
  const blocoObsOperador = temExecucao ? `
    <div class="aplic-obs-op">
      <label>Observação do operador</label>
      <textarea id="obsop-${cardId}" onclick="event.stopPropagation()" placeholder="Ex: condições do tempo, ajustes feitos...">${obsOperadorAtual.replace(/</g,'&lt;')}</textarea>
      <button class="aplic-btn-obs" onclick="event.stopPropagation();salvarObsOperador('${primeiroId}','${cardId}')">Salvar observação</button>
    </div>` : '';

  return `
    <div class="aplic-card ${g.status} ${ehPulv?'tipo-pulv':'tipo-solido'}" id="${cardId}" data-ids="${idsGrupo}">
      <div class="aplic-card-head" onclick="toggleAplicCard('${cardId}')">
        <div style="flex:1;min-width:0">
          <div class="aplic-info-grid">
            <div class="aplic-info">
              <span class="aplic-info-label">📅 Data planejada</span>
              <span class="aplic-info-valor">${fmtDataBR(g.data)}</span>
            </div>
            <div class="aplic-info">
              <span class="aplic-info-label">🏡 Fazenda</span>
              <span class="aplic-info-valor">${g.fazenda}</span>
            </div>
            <div class="aplic-info">
              <span class="aplic-info-label">📍 Talhão</span>
              <span class="aplic-info-valor">${g.talhao}</span>
            </div>
            <div class="aplic-info">
              <span class="aplic-info-label">📐 Área</span>
              <span class="aplic-info-valor">${areaHa>0?fmt(areaHa)+' ha':'<span style="font-size:14px;color:var(--aplic-ambar)">não cadastrada</span>'}</span>
            </div>
          </div>
          <div class="aplic-card-resumo">${seloTipo}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
          ${acaoTopo}
          <span class="aplic-card-seta">▾</span>
        </div>
      </div>
      <div class="aplic-card-detalhes">
        <table class="aplic-tabela">
          <thead><tr><th>Produto</th><th>Dose</th><th>Total no talhão</th></tr></thead>
          <tbody>${linhas}</tbody>
        </table>
        ${blocoTanque}
        ${extras}
        ${extraObsOp}
        ${blocoObsOperador}
        ${botaoOperacao?`<div class="aplic-acao-wrap">${botaoOperacao}</div>`:''}
      </div>
    </div>`;
}

// Salva a observação do operador no registro (campo obs_operador)
window.salvarObsOperador = async function(id, cardId) {
  const el = document.getElementById(`obsop-${cardId}`);
  if (!el) return;
  const texto = el.value.trim();
  const a = adubacoes.find(x=>x.id===id);
  if (a) a.obs_operador = texto;
  if (estaOnline()) {
    try {
      await updateDoc(doc(db,'insumos_campo_adubacao',id), { obs_operador: texto });
      toast('Observação salva!');
    } catch(e) {
      enfileirarAcao({ tipo:'obs', id, obs_operador: texto });
      toast('Observação salva (offline).');
    }
  } else {
    enfileirarAcao({ tipo:'obs', id, obs_operador: texto });
    toast('Observação salva (offline).');
  }
  salvarCacheAplicacoes();
};

// Busca a área (ha) de um talhão pelo cadastro, casando fazenda + nome do talhão
function areaDoTalhao(fazenda, talhao) {
  if (!talhao) return 0;
  const t = talhoes.find(t =>
    normalizar(t.nome) === normalizar(talhao) &&
    (!fazenda || normalizar(t.fazenda||'') === normalizar((fazenda||'').replace('Fazenda ','')))
  );
  return t ? (parseFloat(t.area_ha) || 0) : 0;
}

window.toggleAplicCard = function(cardId) {
  const card = document.getElementById(cardId);
  if (card) card.classList.toggle('aberto');
};

// Ações em lote: inicia/conclui todos os produtos da operação (card) de uma vez
window.aplicIniciarGrupo = async function(cardId) {
  const card = document.getElementById(cardId);
  if (!card) return;
  const ids = (card.dataset.ids||'').split(',').filter(Boolean);
  for (const id of ids) {
    const a = adubacoes.find(x=>x.id===id);
    if (a && (a.status==='planejado' || a.status==='enviado_operador')) {
      await aplicIniciar(id, true);
    }
  }
  renderModoAplicacoes();
};

window.aplicConcluirGrupo = async function(cardId) {
  const card = document.getElementById(cardId);
  if (!card) return;
  // Pega a observação que o operador tenha digitado no card (campo sempre visível)
  const elObs = document.getElementById(`obsop-${cardId}`);
  const obsOperador = elObs ? elObs.value.trim() : '';
  if (!confirm('Concluir todos os produtos desta aplicação?')) return;
  const ids = (card.dataset.ids||'').split(',').filter(Boolean);
  for (const id of ids) {
    const a = adubacoes.find(x=>x.id===id);
    if (a && a.status==='execucao') {
      await aplicConcluir(id, true, obsOperador);
    }
  }
  renderModoAplicacoes();
};

function fmtDataHora(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}

window.aplicIniciar = async function(id, emLote) {
  const a = adubacoes.find(x=>x.id===id);
  if (!a) return;
  const agora = Date.now();
  // aplica local na hora (funciona on e offline)
  a.status = 'execucao'; a.iniciado_em = agora;
  const acao = { tipo:'iniciar', id, ts: agora };
  if (estaOnline()) {
    try {
      await updateDoc(doc(db,'insumos_campo_adubacao',id), { status:'execucao', iniciado_em: Timestamp.fromMillis(agora) });
    } catch(e) {
      enfileirarAcao(acao); // falhou mesmo online: enfileira
    }
  } else {
    enfileirarAcao(acao); // offline: guarda para subir depois
  }
  salvarCacheAplicacoes();
  if (!emLote) { toast(estaOnline()?'Aplicação iniciada!':'Iniciada (offline) — vai sincronizar ao voltar a rede.'); renderModoAplicacoes(); }
};

// ── BAIXA AUTOMÁTICA DE ESTOQUE ──
// Ao concluir uma aplicação, gera a retirada correspondente (dose × área do talhão)
// e vincula à aplicação (aplicacao_id) para não duplicar nem perder rastreio.
async function baixarEstoquePorAplicacao(a) {
  if (!a || a.estoque_baixado) return { ok: true }; // já baixado
  const areaHa = areaDoTalhao(a.fazenda, a.talhao);
  if (areaHa <= 0) return { ok: false, motivo: 'talhão sem área cadastrada' };
  const prods = produtosDaAplicacao(a).filter(p => (parseFloat(p.dose)||0) > 0);
  if (prods.length === 0) return { ok: false, motivo: 'sem dose' };

  const retirada_ids = [];
  let algumSemCadastro = false;
  try {
    for (const p of prods) {
      const dose = parseFloat(p.dose) || 0;
      const qtd = dose * areaHa;
      // Casa o produto com o estoque (match exato ou parcial)
      const alvo = normalizar(p.produto || '');
      let est = estoque.find(e => normalizar(e.produto) === alvo);
      if (!est) est = estoque.find(e => normalizar(e.produto).includes(alvo) || alvo.includes(normalizar(e.produto)));
      if (!est) algumSemCadastro = true;
      const retirada = {
        produto: est ? est.produto : (p.produto || ''),
        unidade: est ? est.unidade : (p.unidade || ''),
        quantidade: qtd,
        fazenda: a.fazenda || '', talhao: a.talhao || '',
        cultura: '', safra: a.safra || '',
        obs: `Baixa automática — aplicação concluída (${fmt(dose)} ${p.unidade||''}/ha × ${fmt(areaHa)} ha)`,
        custo_unitario: est ? (est.custo_medio||0) : 0,
        custo_total: qtd * (est ? (est.custo_medio||0) : 0),
        data: Timestamp.now(), operador_uid: usuarioAtual?.uid || '',
        origem: 'aplicacao', aplicacao_id: a.id
      };
      const ref = await addDoc(collection(db,'insumos_retiradas'), retirada);
      retiradas.unshift({id: ref.id, ...retirada});
      retirada_ids.push(ref.id);
    }
    await updateDoc(doc(db,'insumos_campo_adubacao',a.id), { estoque_baixado: true, retirada_ids });
    a.estoque_baixado = true; a.retirada_ids = retirada_ids;
    recalcularEstoque();
    return { ok: true, semCadastro: algumSemCadastro };
  } catch(e) {
    return { ok: false, motivo: e.message };
  }
}

// Reverte a baixa (usado quando o master volta o status de "concluído")
async function reverterBaixaAplicacao(a) {
  if (!a || !a.estoque_baixado) return;
  // suporta formato novo (retirada_ids[]) e antigo (retirada_id)
  const ids = Array.isArray(a.retirada_ids) ? a.retirada_ids : (a.retirada_id ? [a.retirada_id] : []);
  try {
    for (const rid of ids) {
      await deleteDoc(doc(db,'insumos_retiradas',rid));
      const i = retiradas.findIndex(r=>r.id===rid);
      if (i>=0) retiradas.splice(i,1);
    }
    await updateDoc(doc(db,'insumos_campo_adubacao',a.id), { estoque_baixado: false, retirada_ids: [], retirada_id: '' });
    a.estoque_baixado = false; a.retirada_ids = []; a.retirada_id = '';
    recalcularEstoque();
  } catch(e) { /* silencioso */ }
}

window.aplicConcluir = async function(id, emLote, obsOperador) {
  const a = adubacoes.find(x=>x.id===id);
  if (!a) return;
  if (!emLote && !confirm(`Concluir a aplicação de "${a.produto}" em ${a.talhao}?`)) return;
  const data_conclusao = hoje();
  const iniciado_em_ts = (typeof a.iniciado_em === 'number') ? a.iniciado_em : (a.iniciado_em?.toMillis ? a.iniciado_em.toMillis() : null);
  // aplica local na hora
  a.status = 'concluido'; a.data_conclusao = data_conclusao;
  if (obsOperador != null && obsOperador !== '') a.obs_operador = obsOperador;
  const acao = { tipo:'concluir', id, data_conclusao, obs_operador: obsOperador||'', iniciado_em_ts };
  if (estaOnline()) {
    try {
      const upd = { status:'concluido', data_conclusao };
      if (obsOperador != null && obsOperador !== '') upd.obs_operador = obsOperador;
      await updateDoc(doc(db,'insumos_campo_adubacao',id), upd);
      const baixa = await baixarEstoquePorAplicacao(a);
      if (!emLote) {
        if (baixa.ok) toast('Aplicação concluída!' + (baixa.semCadastro ? ' (produto sem entrada no estoque)' : ''));
        else toast(`Concluída, mas estoque NÃO baixado: ${baixa.motivo}.`, 'erro');
      }
    } catch(e) {
      enfileirarAcao(acao); // falhou online: enfileira
      if (!emLote) toast('Concluída (será sincronizada em breve).');
    }
  } else {
    enfileirarAcao(acao); // offline
    if (!emLote) toast('Concluída (offline) — vai sincronizar ao voltar a rede.');
  }
  salvarCacheAplicacoes();
  if (!emLote) renderModoAplicacoes();
};

// ── DADOS ──
async function carregarDados() {
  const [pSnap, enSnap, rSnap, cSnap, tSnap, sSnap, fSnap, cuSnap, plSnap, adSnap, colSnap] = await Promise.all([
    getDocs(query(collection(db, 'insumos_pedidos'), orderBy('criado_em', 'desc'))),
    getDocs(collection(db, 'estoque_ins_entradas')),
    getDocs(query(collection(db, 'insumos_retiradas'), orderBy('data', 'desc'))),
    getDocs(query(collection(db, 'insumos_contas'), orderBy('vencimento'))),
    getDocs(query(collection(db, 'insumos_talhoes'), orderBy('nome'))),
    getDocs(query(collection(db, 'insumos_safras'), orderBy('nome'))),
    getDocs(query(collection(db, 'insumos_fazendas'), orderBy('nome'))),
    getDocs(query(collection(db, 'insumos_culturas'), orderBy('nome'))),
    getDocs(query(collection(db, 'insumos_campo_plantio'), orderBy('data', 'desc'))),
    getDocs(query(collection(db, 'insumos_campo_adubacao'), orderBy('data', 'desc'))),
    getDocs(query(collection(db, 'insumos_campo_colheita'), orderBy('data', 'desc')))
  ]);
  pedidos = pSnap.docs.map(d => ({id: d.id, ...d.data()}));
  entradasRaw = enSnap.docs.map(d => ({id: d.id, ...d.data()}));
  retiradas = rSnap.docs.map(d => ({id: d.id, ...d.data()}));
  contas = cSnap.docs.map(d => ({id: d.id, ...d.data()}));
  talhoes = tSnap.docs.map(d => ({id: d.id, ...d.data()}));
  safras = sSnap.docs.map(d => ({id: d.id, ...d.data()}));
  fazendas = fSnap.docs.map(d => ({id: d.id, ...d.data()}));
  culturas = cuSnap.docs.map(d => ({id: d.id, ...d.data()}));
  plantios = plSnap.docs.map(d => ({id: d.id, ...d.data()}));
  adubacoes = adSnap.docs.map(d => ({id: d.id, ...d.data()}));
  colheitas = colSnap.docs.map(d => ({id: d.id, ...d.data()}));
  // Fallback: se ainda não cadastrou fazendas, usa as 3 conhecidas como sugestão inicial
  if (fazendas.length === 0) {
    fazendas = [{id:'_tmp1',nome:'Rodeio'},{id:'_tmp2',nome:'Córrego das Flores'},{id:'_tmp3',nome:'Palmeiras'}];
  }
  recalcularEstoque();
}

// Estoque real = soma das entradas (compras) do ACF Estoque, menos as retiradas lançadas aqui no Insumos.
// O ACF Estoque nunca teve "saídas" para insumos — essa é a peça que o ACF Gestão adiciona.
function recalcularEstoque() {
  const mapa = {};
  entradasRaw.forEach(e => {
    const nome = (e.prodNome || '').trim();
    if (!nome) return;
    const k = normalizar(nome);
    if (!mapa[k]) mapa[k] = { produto: nome, unidade: e.unid||'', qtdEntradas:0, valorEntradas:0, prodId: e.prodId||'' };
    const qtd = parseFloat(e.qtd)||0;
    const preco = parseFloat(e.preco)||0;
    mapa[k].qtdEntradas += qtd;
    mapa[k].valorEntradas += qtd*preco;
    if (e.unid) mapa[k].unidade = e.unid;
    if (e.prodId) mapa[k].prodId = e.prodId;
    const dtVal = e.dt?.toDate ? e.dt.toDate() : (e.dt ? new Date(e.dt) : null);
    if (dtVal && (!mapa[k].ultimaEntradaDt || dtVal > mapa[k].ultimaEntradaDt)) mapa[k].ultimaEntradaDt = dtVal;
  });
  const qtdRetiradaPorProduto = {};
  retiradas.forEach(r => {
    const k = normalizar(r.produto);
    qtdRetiradaPorProduto[k] = (qtdRetiradaPorProduto[k]||0) + (parseFloat(r.quantidade)||0);
  });
  estoque = Object.entries(mapa).map(([k, m]) => ({
    id: k, produto: m.produto, unidade: m.unidade, prodId: m.prodId,
    custo_medio: m.qtdEntradas>0 ? m.valorEntradas/m.qtdEntradas : 0,
    quantidade: m.qtdEntradas - (qtdRetiradaPorProduto[k]||0),
    ultima_entrada: m.ultimaEntradaDt ? m.ultimaEntradaDt.toLocaleDateString('pt-BR') : ''
  })).sort((a,b) => a.produto.localeCompare(b.produto));
}

// Carrega o compêndio (estoque_ins_produtos) só quando necessário, com cache
async function carregarCompendio() {
  if (compendio) return compendio;
  try {
    const snap = await getDocs(collection(db, 'estoque_ins_produtos'));
    compendioDetalhado = snap.docs.map(d => ({id: d.id, ...d.data()}));
    compendio = compendioDetalhado.map(dt => dt.nome || '').filter(Boolean).sort();
  } catch(e) {
    compendio = []; compendioDetalhado = [];
  }
  return compendio;
}

// (legado) função mantida por segurança; a cobertura agora usa 'adubacoes' internas
async function carregarAplicacoes() {
  if (aplicacoesAgroOp) return aplicacoesAgroOp;
  try {

    aplicacoesAgroOp = snap.docs.map(d => ({id: d.id, ...d.data()}));

// ══════════════ DASHBOARD ══════════════
function renderDashboard() {
  const hojeStr = hoje();
  // Junta todas as operações do caderno num formato comum
  const ops = [];
  // Converte iniciado_em (Timestamp ou número) para data ISO
  const dataInicio = (v) => {
    if (!v) return '';
    try { const d = v.toDate ? v.toDate() : new Date(v); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    catch(e) { return ''; }
  };
  plantios.forEach(p => { const cs = cultivaresDoPlantio(p); const nomes = cs.map(c=>c.cultivar).filter(Boolean).join(', '); ops.push({ tipo:'Plantio', icone:'🌱', data:p.data, iniciado:dataInicio(p.iniciado_em), data_conclusao:p.data_conclusao||'', fazenda:p.fazenda, talhao:p.talhao, status:p.status, desc:`${p.cultura||'Plantio'}${nomes?` (${nomes})`:''}`, descricao:p.cultura||'', produtos: cs.map(c=>({produto:`${c.cultivar||p.cultura||'—'}`, dose:c.ciclo_dias?`ciclo ${fmt(c.ciclo_dias)}d`:'', unidade:''})) }); });
  adubacoes.forEach(a => ops.push({ tipo: tipoDaAdubacao(a)==='pulverizacao'?'Pulverização':'Sólidos', icone: tipoDaAdubacao(a)==='pulverizacao'?'💧':'🪨', data:a.data, iniciado:dataInicio(a.iniciado_em), data_conclusao:a.data_conclusao||'', fazenda:a.fazenda, talhao:a.talhao, status:a.status, desc: resumoProdutos(a), descricao: a.categoria||(tipoDaAdubacao(a)==='pulverizacao'?'Pulverização':'Sólido'), produtos: produtosDaAplicacao(a) }));
  colheitas.forEach(c => ops.push({ tipo:'Colheita', icone:'🌾', data:c.data, iniciado:dataInicio(c.iniciado_em), data_conclusao:c.data_conclusao||'', fazenda:c.fazenda, talhao:c.talhao, status:c.status, desc:`${c.cultura||'Colheita'}`, descricao:c.cultura||'Colheita', produtos: c.produtividade?[{produto:c.cultura||'Colheita', dose:`${fmt(c.produtividade)} ${c.unidade_produtividade||'sc/ha'}`, unidade:''}]:[] }));

  // Contadores por status
  const nPlanejadas = ops.filter(o => o.status==='planejado' || o.status==='enviado_operador').length;
  const nExecucao = ops.filter(o => o.status==='execucao').length;
  const nConcluidas = ops.filter(o => o.status==='concluido').length;

  // ATRASADA = concluída DEPOIS da data planejada. Dias de atraso = execução − planejada.
  // Planejadas / em execução NÃO contam como atrasadas.
  function diasEntre(d1, d2) { // d2 - d1 em dias (datas ISO)
    const a = new Date(d1+'T00:00:00'), b = new Date(d2+'T00:00:00');
    return Math.round((b - a) / 86400000);
  }
  const atrasadas = ops
    .filter(o => o.status==='concluido' && o.data && o.data_conclusao && o.data_conclusao > o.data)
    .map(o => ({ ...o, diasAtraso: diasEntre(o.data, o.data_conclusao) }))
    .filter(o => o.diasAtraso > 0)
    .sort((a,b)=> b.diasAtraso - a.diasAtraso);

  // Agrupa por dias de atraso (ex: "3 atrasadas 2 dias")
  const porDias = {};
  atrasadas.forEach(o => { porDias[o.diasAtraso] = (porDias[o.diasAtraso]||0) + 1; });
  const resumoAtraso = Object.keys(porDias).map(Number).sort((a,b)=>b-a)
    .map(d => `${porDias[d]} atrasada${porDias[d]>1?'s':''} ${d} dia${d>1?'s':''}`).join(' · ');

  // Próximas 5 planejadas (data >= hoje, não concluídas)
  const proximas = ops.filter(o => o.status!=='concluido' && o.data && o.data >= hojeStr)
    .sort((a,b)=>(a.data||'').localeCompare(b.data||''))
    .slice(0,5);

  // Listas para os cards expansíveis
  const emExecucao = ops.filter(o => o.status==='execucao');

  const ultimas6 = executadas.slice(0,6);
  // Pendentes vencidas: planejadas/em execução com data já passada e não concluídas
  const pendentesVencidas = ops

        </div>
        ${o.produtos&&o.produtos.length?`<table class="prod-dose-mini" style="margin-top:6px">${o.produtos.map(p=>`<tr><td class="pd-nome">${p.produto||'—'}</td><td class="pd-dose">${p.dose?(typeof p.dose==='number'?fmt(p.dose)+' '+(p.unidade||''):p.dose):''}</td></tr>`).join('')}</table>`:''}
      </div>`).join('');

      ${pendentesVencidas.length===0?'<div class="dash-exp-vazio">Nenhuma pendência vencida.</div>':pendentesVencidas.map(o=>`
        <div class="dash-exp-item">

// ── Calendário mensal de aplicações no dashboard ──
// Amarelo = sólidos, Azul = pulverização. Mostra só o talhão nos dias com aplicação.
let calMesAtual = null; // {ano, mes} — mes 0-11
window.mudarMesCalendario = function(delta) {
  if (!calMesAtual) return;
  let m = calMesAtual.mes + delta, a = calMesAtual.ano;
  if (m < 0) { m = 11; a--; } else if (m > 11) { m = 0; a++; }
  calMesAtual = { ano: a, mes: m };
  renderCalendarioDash();
};

function renderCalendarioDash() {
  const cont = document.getElementById('dash-calendario');
  if (!cont) return;
  // Mês inicial: o atual
  if (!calMesAtual) { const h = new Date(); calMesAtual = { ano: h.getFullYear(), mes: h.getMonth() }; }
  const { ano, mes } = calMesAtual;

  // Junta aplicações por dia. Concluídas entram em VERDE na data de execução;
  // as demais entram na cor do tipo (amarelo=sólido, azul=pulverização) na data planejada.
  // Pendentes cuja data já passou recebem marca de vencida (borda vermelha).
  const hojeCal = hoje();
  const porDia = {}; // 'AAAA-MM-DD' -> [{talhao, classe, vencida}]
  adubacoes.forEach(a => {
    let dref, classe, vencida = false;
    if (a.status === 'concluido' && a.data_conclusao) {
      dref = String(a.data_conclusao).slice(0,10);
      classe = 'cal-concluido';
    } else {
      if (!a.data) return;
      dref = String(a.data).slice(0,10);
      classe = tipoDaAdubacao(a)==='pulverizacao' ? 'cal-pulv' : 'cal-solido';
      vencida = dref < hojeCal; // planejada/em execução com data já passada
    }
    if (!porDia[dref]) porDia[dref] = [];
    porDia[dref].push({ talhao: a.talhao||'—', classe, vencida });
  });

  const nomesMeses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const primeiroDia = new Date(ano, mes, 1).getDay(); // 0=domingo
  const diasNoMes = new Date(ano, mes+1, 0).getDate();
  const hojeISO = hoje();

  let celulas = '';
  // espaços vazios antes do dia 1
  for (let i=0;i<primeiroDia;i++) celulas += `<div class="cal-cel cal-vazia"></div>`;
  for (let dia=1; dia<=diasNoMes; dia++) {
    const iso = `${ano}-${String(mes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
    const evs = porDia[iso] || [];
    const ehHoje = iso === hojeISO;
    const tags = evs.map(e => `<span class="cal-tag ${e.classe}${e.vencida?' cal-vencida':''}">${e.vencida?'⚠ ':''}${e.talhao}</span>`).join('');
    celulas += `<div class="cal-cel ${ehHoje?'cal-hoje':''}">
      <div class="cal-num">${dia}</div>
      <div class="cal-tags">${tags}</div>
    </div>`;
  }

  cont.innerHTML = `
    <div class="cal-topo">
      <button class="btn btn-sm btn-secondary" onclick="mudarMesCalendario(-1)">◀</button>
      <div class="cal-titulo">${nomesMeses[mes]} ${ano}</div>
      <button class="btn btn-sm btn-secondary" onclick="mudarMesCalendario(1)">▶</button>
    </div>
    <div class="cal-legenda">
      <span><span class="cal-bola cal-solido"></span> Sólidos</span>
      <span><span class="cal-bola cal-pulv"></span> Pulverização</span>
      <span><span class="cal-bola cal-concluido"></span> Concluída</span>
      <span><span class="cal-bola" style="background:#fff;border:2px solid var(--vermelho)"></span> Vencida</span>
    </div>
    <div class="cal-grid cal-cabecalho">
      ${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
    </div>
    <div class="cal-grid">${celulas}</div>`;
}

window.toggleDashCard = function(qual) {
  const el = document.getElementById('dashexp-'+qual);
  const seta = document.getElementById('seta-'+qual);
  if (!el) return;
  // fecha os outros
  ['exec','exec-done','atraso','vencidas'].forEach(q => {
    if (q !== qual) {
      const outro = document.getElementById('dashexp-'+q); if (outro) outro.style.display='none';
      const s = document.getElementById('seta-'+q); if (s) s.textContent='▾';
    }
  });
  const abrir = el.style.display === 'none';
  el.style.display = abrir ? 'block' : 'none';
  if (seta) seta.textContent = abrir ? '▴' : '▾';
};

window.toggleDashOp = function(idx) {
  const det = document.getElementById('dashdet-'+idx);

// ══════════════ PREVISÃO DE COBERTURA ══════════════
window.renderCobertura = renderCobertura;
let coberturaJanela = 0; // 0 = tudo; ou 3, 7, 10, 15 dias
window.mudarJanelaCobertura = function(dias) { coberturaJanela = parseInt(dias)||0; renderCobertura(); };

async function renderCobertura() {
  const alvo = () => document.getElementById('estoque-conteudo') || document.getElementById('main-content');
  alvo().innerHTML = `<div class="loading"><div class="spinner"></div> Cruzando planejamento e estoque...</div>`;

  const hojeStr = hoje();
  const limite = coberturaJanela > 0 ? somarDias(hojeStr, coberturaJanela) : null;

  // Aplicações que entram no cálculo: não concluídas E (atrasadas OU dentro da janela).
  // Atrasadas (data < hoje) sempre entram. Se janela = "Tudo", entram todas as não concluídas.
  const planejadasBrutas = adubacoes.filter(a => {
    if (a.status === 'concluido') return false;
    if (!limite) return true;                    // "Tudo"
    if (!a.data) return true;                     // sem data: mantém para não sumir
    if (a.data < hojeStr) return true;            // atrasada: sempre entra
    return a.data <= limite;                      // dentro da janela
  });

  const planejadas = planejadasBrutas.map(a => ({
    talhao: a.talhao, fazenda: a.fazenda,
    produtos: produtosDaAplicacao(a).map(p => ({ produto: p.produto, dose: p.dose }))
  }));

  // Necessidade por produto: dose × área
  const necessidade = {};
  planejadas.forEach(a => {
    let areaHa = parseFloat(a.area || a.areaHa || a.area_ha || a.hectares) || 0;
    if (!areaHa && a.talhao) {
      const t = talhoes.find(t => normalizar(t.nome) === normalizar(a.talhao) && (!a.fazenda || normalizar(t.fazenda||'') === normalizar((a.fazenda||'').replace('Fazenda ',''))));
      if (t) areaHa = parseFloat(t.area_ha) || 0;
    }
    (a.produtos||[]).forEach(p => {
      const nome = p.produto || p.nome || '';
      if (!nome) return;
      const k = normalizar(nome);
      if (!necessidade[k]) necessidade[k] = { produto: nome, total: 0, aplicacoesSemArea: 0, dosesSemArea: [] };
      const dose = parseFloat(String(p.dose).replace(',','.')) || 0;
      if (areaHa > 0) necessidade[k].total += dose * areaHa;
      else { necessidade[k].aplicacoesSemArea++; necessidade[k].dosesSemArea.push(dose); }
    });
  });

  // Pendente nos pedidos (a receber)
  const pendentePedidos = {};
  pedidos.filter(p => p.status !== 'entregue_total' && p.status !== 'cancelado').forEach(p => {
    (p.itens||[]).forEach(it => {
      const k = normalizar(it.produto);
      const pend = (it.quantidade||0) - (it.quantidade_recebida||0);
      if (pend > 0) pendentePedidos[k] = (pendentePedidos[k]||0) + pend;
    });
  });

  // Montar linhas com dois saldos: só estoque, e estoque + pedidos
  const chaves = Object.keys(necessidade);
  let rows = chaves.map(k => {
    const n = necessidade[k];
    const est = estoque.find(e => normalizar(e.produto) === k);
    const emEstoque = est ? (est.quantidade||0) : 0;
    const unidade = est ? est.unidade : '';
    const aChegar = pendentePedidos[k] || 0;
    const saldoEstoque = emEstoque - n.total;             // só o que tenho hoje
    const saldoComPedidos = emEstoque + aChegar - n.total; // contando o que vai chegar
    return { ...n, emEstoque, aChegar, saldoEstoque, saldoComPedidos, unidade, k };
  }).sort((a,b) => a.saldoEstoque - b.saldoEstoque);

  const faltando = rows.filter(r => r.saldoEstoque < 0).length;           // falta no estoque físico
  const semArea = rows.filter(r => r.aplicacoesSemArea > 0).length;

  const nQ = planejadasBrutas.length;
  const rotuloJanela = coberturaJanela > 0 ? `próximos ${coberturaJanela} dias + atrasadas` : 'todas as aplicações não concluídas';

  const botaoJanela = (dias, rotulo) =>
    `<button class="btn btn-sm ${coberturaJanela===dias?'btn-primary':'btn-secondary'}" onclick="mudarJanelaCobertura(${dias})">${rotulo}</button>`;

  alvo().innerHTML = `
    <div class="sec-header">
      <div class="sec-titulo">🔮 Previsão de Cobertura de Estoque</div>
      <button class="btn btn-secondary btn-sm" onclick="renderCobertura()">↻ Atualizar</button>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center">
      <span style="font-size:13px;color:var(--cinza);margin-right:4px">Janela:</span>
      ${botaoJanela(3,'3 dias')}
      ${botaoJanela(7,'7 dias')}
      ${botaoJanela(10,'10 dias')}
      ${botaoJanela(15,'15 dias')}
      ${botaoJanela(0,'Tudo')}
    </div>
    <p style="font-size:13px;color:var(--cinza);margin-bottom:16px">
      Necessidade de <strong>${nQ}</strong> aplicação(ões) — ${rotuloJanela}.
      <strong>Saldo</strong> = estoque − necessário. A coluna "A receber" mostra os pedidos em aberto (não entram no saldo).
    </p>
    ${faltando > 0 ? `
    <div style="background:#fee2e2;border:1px solid #fca5a5;border-radius:var(--radius);padding:14px 18px;margin-bottom:16px">
      🔴 <strong>${faltando} produto(s) sem cobertura no estoque</strong> para esta janela — considere fazer pedido de compra.
    </div>` : chaves.length > 0 ? `
    <div style="background:#d1fae5;border:1px solid #6ee7b7;border-radius:var(--radius);padding:14px 18px;margin-bottom:16px">
      ✅ <strong>Todos os produtos têm cobertura no estoque para esta janela!</strong>
    </div>` : ''}
    ${semArea > 0 ? `
    <div style="background:#fef3c7;border:1px solid #fcd34d;border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;font-size:13px">
      ⚠️ ${semArea} produto(s) têm aplicações sem área definida — a necessidade pode estar subestimada. Cadastre a área dos talhões em <strong>⚙️ Cadastros</strong>.
    </div>` : ''}

    ${chaves.length === 0 ? `
    <div class="tabela-wrap"><div class="tabela-vazia">Nenhuma aplicação ${coberturaJanela>0?'nesta janela':'planejada'}.<br>
    ${coberturaJanela>0?'Tente uma janela maior ou "Tudo".':'Crie um planejamento em 📓 Caderno de Campo.'}</div></div>` : `
    <div class="tabela-wrap"><table>
      <thead><tr><th>Produto</th><th>Necessário</th><th>Em Estoque</th><th>A Receber</th><th>Saldo</th></tr></thead>
      <tbody>
      ${rows.map(r => `
        <tr style="${r.saldoEstoque<0?'background:#fef2f2':''}">
          <td><strong>${r.produto}</strong>${r.aplicacoesSemArea>0?` <span class="badge badge-amarelo" title="aplicações sem área">⚠ s/área</span>`:''}</td>
          <td>${fmt(r.total)} ${r.unidade}</td>
          <td>${fmt(r.emEstoque)}</td>
          <td style="color:var(--azul)">${r.aChegar>0?'+'+fmt(r.aChegar):'—'}</td>
          <td style="font-weight:700;color:${r.saldoEstoque<0?'var(--vermelho)':'var(--verde)'}">${r.saldoEstoque<0?'🔴 Faltam '+fmt(Math.abs(r.saldoEstoque)):'✅ +'+fmt(r.saldoEstoque)}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>
    <div style="margin-top:16px">
      <button class="btn btn-primary" onclick="exportarCobertura()">📥 Exportar Excel</button>
    </div>`}
  `;
  window._coberturaRows = rows;
}

window.exportarCobertura = function() {
  const rows = window._coberturaRows || [];
  const suf = coberturaJanela > 0 ? `_${coberturaJanela}dias` : '_tudo';
  exportarExcel('Previsao_Cobertura'+suf,
    ['Produto','Necessário','Unidade','Em Estoque','A Receber (pedidos)','Saldo'],
    rows.map(r => [r.produto, r.total, r.unidade, r.emEstoque, r.aChegar, r.saldoEstoque])
  );
};

window.ordenarPedidos = function(campo) {
  if (ordenacaoPedidos.campo === campo) ordenacaoPedidos.dir *= -1;
  else { ordenacaoPedidos.campo = campo; ordenacaoPedidos.dir = 1; }
  filtrarPedidos();
};

function thOrdPed(campo, rotulo) {
  const seta = ordenacaoPedidos.campo === campo ? (ordenacaoPedidos.dir===1?' ▲':' ▼') : '';
  return `<th class="th-ord" onclick="ordenarPedidos('${campo}')">${rotulo}<span class="th-seta">${seta}</span></th>`;
}

window.filtrarPedidos = function() {
  const statusF = document.getElementById('filtro-status-pedido')?.value || '';
  const safraF = document.getElementById('filtro-safra-pedido')?.value || '';
  const fornF = document.getElementById('filtro-fornecedor')?.value || '';
  const prodF = (document.getElementById('filtro-produto')?.value || '').toLowerCase();
  const lista = pedidos.filter(p => (!statusF || p.status === statusF) && (!fornF || p.fornecedor === fornF));
  const el = document.getElementById('lista-pedidos');
  if (!el) return;

  // Achata pedidos -> um item por linha (filtra safra e produto no nível do item)
  const linhas = [];
  lista.forEach(p => {
    (p.itens||[]).forEach(it => {
      if (safraF && normalizar(it.safra||'') !== normalizar(safraF)) return;
      if (prodF && !(it.produto||'').toLowerCase().includes(prodF)) return;
      const saldo = (it.quantidade||0) - (it.quantidade_recebida||0);
      const statusItem = saldo<=0 ? 'entregue_total' : (it.quantidade_recebida||0)>0 ? 'parcial' : 'pendente';
      linhas.push({ pedidoId: p.id, pedidoStatus: p.status, fornecedor: p.fornecedor, produto: it.produto,
        unidade: it.unidade, volumeCompra: it.quantidade||0, volumeRecebido: it.quantidade_recebida||0, saldo, statusItem,
        precoUnit: it.preco_unit||0 });
    });
  });
  if (linhas.length === 0) { el.innerHTML = `<div class="tabela-wrap"><div class="tabela-vazia">Nenhum pedido encontrado</div></div>`; return; }

  // Ordenação clicável
  const o = ordenacaoPedidos;
  const numericos = ['volumeCompra','volumeRecebido','saldo','precoUnit'];
  linhas.sort((a,b) => {
    let va = a[o.campo], vb = b[o.campo];
    if (o.campo === 'status') { va = a.statusItem; vb = b.statusItem; }
    if (numericos.includes(o.campo)) return ((va||0)-(vb||0)) * o.dir;
    return String(va||'').localeCompare(String(vb||''), 'pt', {numeric:true}) * o.dir;
  });

  el.innerHTML = `
    <div class="tabela-wrap"><table>
      <thead><tr>
        ${thOrdPed('fornecedor','Fornecedor')}
        ${thOrdPed('produto','Produto')}
        ${thOrdPed('volumeCompra','Compra')}
        ${thOrdPed('volumeRecebido','Recebido')}
        ${thOrdPed('saldo','Saldo')}
        ${thOrdPed('precoUnit','Valor/un')}
        ${thOrdPed('status','Status')}
        <th class="col-acoes">Ações</th>
      </tr></thead>
      <tbody>
        ${linhas.map(l => `
          <tr>
            <td><strong>${l.fornecedor}</strong></td>
            <td>${l.produto}</td>
            <td>${fmt(l.volumeCompra)} ${l.unidade}</td>
            <td>${fmt(l.volumeRecebido)} ${l.unidade}</td>
            <td style="font-weight:700;color:${l.saldo>0?'var(--laranja)':'var(--verde)'}">${fmt(l.saldo)} ${l.unidade}</td>
            <td>${l.precoUnit>0?'R$ '+fmt(l.precoUnit):'—'}</td>
            <td>${badgeStatus(l.statusItem)}</td>
            <td class="col-acoes"><div class="acoes-wrap">
              <button class="btn btn-sm btn-secondary" onclick="verPedido('${l.pedidoId}')">Ver</button>
              ${l.pedidoStatus !== 'entregue_total' && l.pedidoStatus !== 'cancelado' ?
                `<button class="btn btn-sm btn-laranja" onclick="abrirBaixa('${l.pedidoId}')">Receber</button>` : ''}
            </div></td>
          </tr>`).join('')}
      </tbody>
    </table></div>`;
};

// ══════════════ IMPORTAR PEDIDOS DE COMPRA (Excel) ══════════════
const COLUNAS_PEDIDOS = ['Safra','Grupo','Fornecedor','Produto','Volume','Unidade (L, Kg, Ton, Bag, sc)','R$/unidade','R$ Total','Vencimento (data, "Barter" ou "30 DDF")'];
const EXEMPLO_PEDIDOS = ['Soja 26/27','Herbicida','Agro Insumos Ltda','Glifosato 480','200','L','32.50','6500','30 DDF'];

window.baixarModeloPedidos = function() {
  try {
    const ws = XLSX.utils.aoa_to_sheet([COLUNAS_PEDIDOS, EXEMPLO_PEDIDOS]);
    ws['!cols'] = COLUNAS_PEDIDOS.map(c => ({ wch: Math.max(c.length+2, 16) }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Modelo');
    XLSX.writeFile(wb, `ACF_Modelo_Pedidos.xlsx`);
  } catch(e) { toast('Erro ao gerar modelo: '+e.message,'erro'); }
};

window.importarPedidosExcel = function(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try {
      await carregarCompendio();
      const wb = XLSX.read(ev.target.result, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const linhas = XLSX.utils.sheet_to_json(ws, { defval: '' });
      if (linhas.length === 0) { toast('Planilha vazia.','erro'); input.value=''; return; }

      // 1ª passada: ler e agrupar por fornecedor
      const gruposPorFornecedor = {}; // fornecedor -> { itens:[...], vencimentos:[{produto,valor,vencimento}] }
      let ignorados = 0;
      linhas.forEach(row => {
        const fornecedor = (row['Fornecedor']||'').toString().trim();
        const produto = (row['Produto']||'').toString().trim();
        const volume = parseFloat(row['Volume'])||0;
        const unidade = (row['Unidade (L, Kg, Ton, Bag, sc)']||row['Unidade']||'').toString().trim();
        if (!fornecedor || !produto || volume<=0 || !unidade) { ignorados++; return; }

        const grupo = (row['Grupo']||'').toString().trim();
        const safra = (row['Safra']||'').toString().trim();
        let precoUnit = parseFloat(row['R$/unidade'])||0;
        let valorTotal = parseFloat(row['R$ Total'])||0;
        if (!precoUnit && valorTotal) precoUnit = valorTotal/volume;
        if (!valorTotal && precoUnit) valorTotal = precoUnit*volume;
        const condTxt = (row['Vencimento (data, "Barter" ou "30 DDF")']||row['Vencimento (AAAA-MM-DD)']||row['Vencimento']||'').toString().trim();
        const cond = interpretarCondicaoPagamento(condTxt);

        if (!gruposPorFornecedor[fornecedor]) gruposPorFornecedor[fornecedor] = { itens: [], vencimentos: [] };
        gruposPorFornecedor[fornecedor].itens.push({
          produto, categoria: grupo, safra, quantidade: volume, quantidade_recebida: 0,
          unidade, preco_unit: precoUnit, total: valorTotal,
          cond_pagamento: cond ? cond.texto : '',
          cond_tipo: cond ? cond.tipo : '',
          cond_dias: cond && cond.tipo==='ddf' ? cond.dias : 0
        });
        // Só cria conta com vencimento em data se o texto já for uma data.
        // "X DDF" vira conta na hora do recebimento; "Barter"/texto não gera vencimento.
        if (cond && cond.tipo==='data') {
          gruposPorFornecedor[fornecedor].vencimentos.push({ produto, valor: valorTotal, vencimento: cond.data, cond: cond.texto });
        }
      });

      const fornecedoresImportados = Object.keys(gruposPorFornecedor);
      if (fornecedoresImportados.length === 0) { toast('Nenhuma linha válida — confira Fornecedor, Produto, Volume e Unidade.','erro'); input.value=''; return; }

      // 2ª passada: gravar 1 pedido por fornecedor (com todos os itens) + 1 conta por item com vencimento
      const novosPedidos = [];
      const novasContas = [];
      let batch = writeBatch(db);
      let contadorBatch = 0;
      let itensImportados = 0;

      for (const fornecedor of fornecedoresImportados) {
        const grupo = gruposPorFornecedor[fornecedor];
        const valor_total = grupo.itens.reduce((s,it) => s+it.total, 0);
        const pedido = {
          fornecedor, fazenda: '', data_pedido: hoje(), previsao_entrega: '', obs: '',
          itens: grupo.itens, valor_total, status: 'pendente',
          criado_em: Timestamp.now(), criado_por: usuarioAtual.uid
        };
        const pRef = doc(collection(db,'insumos_pedidos'));
        batch.set(pRef, pedido);
        novosPedidos.push({ id: pRef.id, ...pedido });
        contadorBatch++;
        itensImportados += grupo.itens.length;

        grupo.vencimentos.forEach(v => {
          const conta = {
            fornecedor, descricao: `${v.produto} (importado)${v.cond?` — ${v.cond}`:''}`, valor_total: v.valor,
            vencimento: Timestamp.fromDate(new Date(v.vencimento+'T12:00:00')),
            pedido_id: pRef.id, pago: false, criado_em: Timestamp.now()
          };
          const cRef = doc(collection(db,'insumos_contas'));
          batch.set(cRef, conta);
          novasContas.push({ id: cRef.id, ...conta });
          contadorBatch++;
        });

        // Firestore limita 500 operações por batch — fecha e abre um novo a cada 400
        if (contadorBatch >= 400) {
          await batch.commit();
          batch = writeBatch(db);
          contadorBatch = 0;
        }
      }

      if (contadorBatch > 0) await batch.commit();

      pedidos.unshift(...novosPedidos);
      contas.push(...novasContas);
      contas.sort((a,b) => (a.vencimento?.toDate?a.vencimento.toDate():new Date(a.vencimento)) - (b.vencimento?.toDate?b.vencimento.toDate():new Date(b.vencimento)));

      toast(`${fornecedoresImportados.length} pedido(s) criado(s) (${itensImportados} ite${itensImportados>1?'ns':'m'}) como Pendente${novasContas.length>0?`, ${novasContas.length} conta(s) a pagar gerada(s)`:''}${ignorados>0?`. ${ignorados} linha(s) ignorada(s)`:''}.`);
      renderPedidos();
    } catch(e) { toast('Erro ao importar: '+e.message,'erro'); }
    input.value = '';
  };
  reader.readAsArrayBuffer(file);
};

function badgeStatus(s) {
  const map = { 'pendente':['badge-azul','Pendente'], 'parcial':['badge-amarelo','Parcial'],
    'entregue_total':['badge-verde','Entregue'], 'cancelado':['badge-cinza','Cancelado'] };
  const [cls, label] = map[s] || ['badge-cinza', s];
  return `<span class="badge ${cls}">${label}</span>`;
}

window.salvarPedido = async function() {
  const fornecedor = document.getElementById('ped-fornecedor').value.trim();
  if (!fornecedor) { toast('Informe o fornecedor.', 'erro'); return; }
  const itensValidos = itensPedidoTemp.filter(i => i.produto && i.quantidade);
  if (itensValidos.length === 0) { toast('Adicione pelo menos um item.', 'erro'); return; }
  // Vencimento do pedido (data fixa ou prazo em dias após a entrega)
  const vencTipo = document.getElementById('ped-venc-tipo').value;
  let vencData = '', vencDias = 0;
  if (vencTipo === 'data') {
    vencData = document.getElementById('ped-venc-data')?.value || '';
    if (!vencData) { toast('Informe a data de vencimento.','erro'); return; }
  } else if (vencTipo === 'ddf') {
    vencDias = parseFloat(document.getElementById('ped-venc-dias')?.value)||0;
    if (!vencDias) { toast('Informe os dias após a entrega.','erro'); return; }
  }
  const itens = itensValidos.map(i => ({
    produto: i.produto.trim(), quantidade: parseFloat(i.quantidade)||0, quantidade_recebida: 0,
    unidade: i.unidade, preco_unit: parseFloat(i.preco_unit)||0,
    total: (parseFloat(i.quantidade)||0)*(parseFloat(i.preco_unit)||0),
    // guarda a condição no item para gerar a conta no recebimento (DDF)
    cond_tipo: vencTipo==='ddf' ? 'ddf' : '', cond_dias: vencTipo==='ddf' ? vencDias : 0
  }));
  const valor_total = itens.reduce((s,i) => s+i.total, 0);
  const pedido = {
    fornecedor, fazenda: document.getElementById('ped-fazenda').value,
    data_pedido: document.getElementById('ped-data').value,
    previsao_entrega: document.getElementById('ped-entrega').value,
    obs: document.getElementById('ped-obs').value,
    venc_tipo: vencTipo, venc_data: vencData, venc_dias: vencDias,
    itens, valor_total, status: 'pendente',
    criado_em: Timestamp.now(), criado_por: usuarioAtual.uid
  };
  try {
    const ref = await addDoc(collection(db, 'insumos_pedidos'), pedido);
    pedidos.unshift({id: ref.id, ...pedido});
    fecharModal('modal-pedido');
    toast('Pedido criado com sucesso!');
    if (valor_total > 0 && vencTipo === 'data') {
      // Data fixa: gera a conta a pagar direto com essa data
      const conta = {
        descricao: `Pedido ${fornecedor}`, fornecedor, categoria: 'Insumos',
        valor_total, vencimento: Timestamp.fromDate(new Date(vencData+'T12:00:00')),
        pago: false, pedido_id: ref.id, criado_em: Timestamp.now()
      };
      const cref = await addDoc(collection(db,'insumos_contas'), conta);
      contas.push({id: cref.id, ...conta});
      contas.sort((a,b) => (a.vencimento?.toDate?a.vencimento.toDate():new Date(a.vencimento)) - (b.vencimento?.toDate?b.vencimento.toDate():new Date(b.vencimento)));
      toast('Conta a pagar gerada com vencimento em '+fmtDataBR(vencData)+'.');
      renderPedidos();
    } else if (vencTipo === 'ddf') {
      // Prazo DDF: a conta será gerada automaticamente no recebimento
      toast(`Conta será gerada no recebimento (${vencDias} dias após a entrega).`);
      renderPedidos();
    } else if (valor_total > 0) {
      // Sem vencimento definido: oferece o fluxo de conta automática (parcelas)
      abrirContaAutomatica(ref.id, fornecedor, valor_total);
    } else {
      renderPedidos();
    }
  } catch(e) { toast('Erro ao salvar: ' + e.message, 'erro'); }
};

window.salvarContaAutomatica = async function(pedidoId, fornecedor, valor) {
  const venc = document.getElementById('ca-venc').value;
  const parcelas = parseInt(document.getElementById('ca-parcelas').value)||1;
  if (!venc) { toast('Informe o vencimento.','erro'); return; }
  try {
    for (let i = 0; i < parcelas; i++) {
      const dataVenc = new Date(venc + 'T12:00:00');
      dataVenc.setMonth(dataVenc.getMonth() + i);
      const conta = {
        fornecedor, descricao: `Pedido de compra${parcelas>1?` (${i+1}/${parcelas})`:''}`,
        valor_total: valor/parcelas, vencimento: Timestamp.fromDate(dataVenc),
        pedido_id: pedidoId, pago: false, criado_em: Timestamp.now()
      };
      const ref = await addDoc(collection(db,'insumos_contas'), conta);
      contas.push({id: ref.id, ...conta});
    }
    contas.sort((a,b) => (a.vencimento?.toDate?a.vencimento.toDate():new Date(a.vencimento)) - (b.vencimento?.toDate?b.vencimento.toDate():new Date(b.vencimento)));
    fecharModal('modal-conta-auto');
    toast(parcelas>1?`${parcelas} parcelas geradas no contas a pagar!`:'Conta a pagar gerada!');
    renderPedidos();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

// Recalcula valor_total e status de um pedido a partir dos itens, grava e atualiza a lista local
async function salvarItensPedido(pedidoId, novosItens) {
  const valor_total = novosItens.reduce((s,x) => s+(x.total||0), 0);
  const todosEntregues = novosItens.length>0 && novosItens.every(x => (x.quantidade_recebida||0) >= (x.quantidade||0));
  const algumEntregue = novosItens.some(x => (x.quantidade_recebida||0) > 0);
  const status = todosEntregues ? 'entregue_total' : algumEntregue ? 'parcial' : 'pendente';
  await updateDoc(doc(db,'insumos_pedidos',pedidoId), { itens: novosItens, valor_total, status });
  const p = pedidos.find(x=>x.id===pedidoId);
  if (p) { p.itens = novosItens; p.valor_total = valor_total; p.status = status; }
}

window.salvarEdicaoItemPedido = async function(pedidoId, idx) {
  const p = pedidos.find(x=>x.id===pedidoId);
  if (!p) return;
  const produto = document.getElementById('eip-produto').value.trim();
  const quantidade = parseFloat(document.getElementById('eip-qtd').value)||0;
  if (!produto) { toast('Informe o produto.','erro'); return; }
  const it = p.itens[idx];
  if (quantidade < (it.quantidade_recebida||0)) { toast(`A quantidade não pode ser menor que o já recebido (${fmt(it.quantidade_recebida)} ${it.unidade}).`,'erro'); return; }
  const preco_unit = parseFloat(document.getElementById('eip-preco').value)||0;
  const cond = interpretarCondicaoPagamento(document.getElementById('eip-cond').value);
  const novosItens = [...p.itens];
  novosItens[idx] = {
    ...it, produto, categoria: document.getElementById('eip-categoria').value,
    safra: document.getElementById('eip-safra').value, quantidade,
    unidade: document.getElementById('eip-unidade').value, preco_unit,
    total: quantidade * preco_unit,
    cond_pagamento: cond ? cond.texto : '',
    cond_tipo: cond ? cond.tipo : '',
    cond_dias: cond && cond.tipo==='ddf' ? cond.dias : 0
  };
  try {
    await salvarItensPedido(pedidoId, novosItens);
    toast('Item atualizado!');
    fecharModal('modal-editar-item-pedido');
    fecharModal('modal-ver-pedido');
    verPedido(pedidoId);
    filtrarPedidos();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

window.removerItemPedido = async function(pedidoId, idx) {
  if(!exigirMaster())return;
  const p = pedidos.find(x=>x.id===pedidoId);
  if (!p) return;
  const it = p.itens[idx];
  if (p.itens.length <= 1) { toast('Um pedido precisa ter ao menos um item. Exclua o pedido inteiro na lista se quiser remover tudo.','erro'); return; }
  const aviso = (it.quantidade_recebida||0) > 0
    ? `Este item já teve ${fmt(it.quantidade_recebida)} ${it.unidade} recebido(s) (esse histórico de estoque não será apagado). Remover a pendência mesmo assim?`
    : `Remover "${it.produto}" deste pedido?`;
  if (!confirm(aviso)) return;
  const novosItens = p.itens.filter((_,i) => i!==idx);
  try {
    await salvarItensPedido(pedidoId, novosItens);
    toast('Item removido.');
    fecharModal('modal-ver-pedido');
    verPedido(pedidoId);
    filtrarPedidos();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

        <div class="modal-footer">

          <button class="btn btn-primary" id="btn-confirma-baixa" onclick="confirmarBaixa('${id}')">Confirmar Recebimento</button>
        </div>
      </div>
    </div>`);
  carregarCompendio();

window.confirmarBaixa = async function(id) {
  const p = pedidos.find(x => x.id === id);
  if (!p) return;
  const btn = document.getElementById('btn-confirma-baixa');
  btn.disabled = true; btn.textContent = 'Salvando...';
  const itensPend = (p.itens||[]).filter(it => (it.quantidade||0) - (it.quantidade_recebida||0) > 0);
  const dataReceb = document.getElementById('baixa-data').value;
  const batch = writeBatch(db);
  let totalRecebido = 0;
  const novosItens = [...p.itens];

  const novosContasLocais = [];
  itensPend.forEach((it, i) => {
    const qtdReceber = parseFloat(document.getElementById(`baixa-qtd-${i}`)?.value) || 0;
    if (qtdReceber <= 0) return;
    totalRecebido += qtdReceber;
    const idx = novosItens.findIndex(x => x.produto === it.produto);
    if (idx >= 0) novosItens[idx] = { ...novosItens[idx], quantidade_recebida: (novosItens[idx].quantidade_recebida||0) + qtdReceber };
    // tenta casar com o compêndio pra herdar prodId/cat/ia (opcional, não bloqueia se não achar)
    const match = (compendioDetalhado||[]).find(c => normalizar(c.nome||'') === normalizar(it.produto));
    const novaEntrada = {
      cat: match?.cat || it.categoria || '', dt: Timestamp.now(), forn: p.fornecedor, funcId: '', funcNome: '',
      ia: match?.ia || '', nf: '', preco: it.preco_unit||0, prodId: match?.id || '',
      prodNome: it.produto, qtd: qtdReceber, unid: it.unidade
    };
    const eRef = doc(collection(db, 'estoque_ins_entradas'));
    batch.set(eRef, novaEntrada);
    entradasRaw.push({ id: eRef.id, ...novaEntrada });

    // Condição "X DDF": gera conta a pagar com vencimento = recebimento + X dias.
    // Faz isso só uma vez por item (na 1ª vez que ele é recebido), pra não duplicar em baixas parciais.
    if (it.cond_tipo === 'ddf' && it.cond_dias > 0 && !it.conta_gerada) {
      const venc = somarDias(dataReceb, it.cond_dias);
      const conta = {
        fornecedor: p.fornecedor, descricao: `${it.produto} — ${it.cond_pagamento} (receb. ${dataReceb})`,
        valor_total: it.total || 0, vencimento: Timestamp.fromDate(new Date(venc+'T12:00:00')),
        pedido_id: id, pago: false, criado_em: Timestamp.now()
      };
      const cRef = doc(collection(db, 'insumos_contas'));
      batch.set(cRef, conta);
      novosContasLocais.push({ id: cRef.id, ...conta });
      if (idx >= 0) novosItens[idx] = { ...novosItens[idx], conta_gerada: true };
    }
  });

  if (totalRecebido === 0) { toast('Informe a quantidade a receber.', 'erro'); btn.disabled=false; btn.textContent='Confirmar Recebimento'; return; }

  const todosEntregues = novosItens.every(it => (it.quantidade_recebida||0) >= (it.quantidade||0));
  const novoStatus = todosEntregues ? 'entregue_total' : 'parcial';

  batch.update(doc(db, 'insumos_pedidos', id), { itens: novosItens, status: novoStatus });
  try {
    await batch.commit();
    const pi = pedidos.findIndex(x => x.id === id);
    if (pi >= 0) { pedidos[pi].itens = novosItens; pedidos[pi].status = novoStatus; }
    if (novosContasLocais.length > 0) {
      contas.push(...novosContasLocais);
      contas.sort((a,b) => (a.vencimento?.toDate?a.vencimento.toDate():new Date(a.vencimento)) - (b.vencimento?.toDate?b.vencimento.toDate():new Date(b.vencimento)));
    }
    recalcularEstoque();
    fecharModal('modal-baixa');
    toast(`Recebimento registrado no ACF Estoque!${novosContasLocais.length>0?` ${novosContasLocais.length} conta(s) a pagar gerada(s).`:''}`);
    renderPedidos();
  } catch(e) { toast('Erro: ' + e.message, 'erro'); btn.disabled=false; btn.textContent='Confirmar Recebimento'; }
};

      const da = a.dt?.toDate ? a.dt.toDate() : new Date(a.dt||0);
      const db2 = b.dt?.toDate ? b.dt.toDate() : new Date(b.dt||0);
      return db2 - da;
    });
  const retiradasProduto = retiradas.filter(r => normalizar(r.produto)===normalizar(produtoNome)).reduce((s,r)=>s+(r.quantidade||0),0);
  document.body.insertAdjacentHTML('beforeend', `

window.salvarEdicaoLote = async function(loteId) {
  const l = entradasRaw.find(e => e.id === loteId);
  if (!l) return;
  const prodNome = document.getElementById('el-produto').value.trim();
  const qtd = parseFloat(document.getElementById('el-qtd').value)||0;
  if (!prodNome || qtd<=0) { toast('Preencha produto e quantidade.','erro'); return; }
  const upd = {
    prodNome, qtd, unid: document.getElementById('el-unid').value,
    preco: parseFloat(document.getElementById('el-preco').value)||0,
    dt: Timestamp.fromDate(new Date(document.getElementById('el-data').value+'T12:00:00')),
    forn: document.getElementById('el-forn').value
  };
  try {
    await updateDoc(doc(db,'estoque_ins_entradas',loteId), upd);
    Object.assign(l, upd);
    recalcularEstoque();
    fecharModal('modal-editar-lote');
    fecharModal('modal-lotes');
    abrirLotesProduto(prodNome);
    filtrarEstoque();
    toast('Lote atualizado! Saldo e custo médio recalculados.');
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

window.removerLote = async function(loteId, produtoNome) {
  if(!exigirMaster())return;
  if (!confirm('Excluir este lote de entrada? O saldo do produto vai diminuir e o custo médio será recalculado.')) return;
  try {
    await deleteDoc(doc(db,'estoque_ins_entradas',loteId));
    const i = entradasRaw.findIndex(e => e.id === loteId);
    if (i>=0) entradasRaw.splice(i,1);
    recalcularEstoque();
    fecharModal('modal-lotes');
    const aindaTem = entradasRaw.some(e => normalizar(e.prodNome||'')===normalizar(produtoNome));
    if (aindaTem) abrirLotesProduto(produtoNome);
    filtrarEstoque();
    toast('Lote excluído. Estoque recalculado.');
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

window.filtrarRetiradas = function() {

  });
  const el = document.getElementById('lista-retiradas');
  if (!el) return;
  const totalCusto = lista.reduce((s,r)=>s+(r.custo_total||0),0);

  el.innerHTML = `

window.abrirEditarRetirada = function(id) {
  if(!exigirMaster())return;

        <div class="form-row">
          <div class="form-group"><label>Quantidade *</label><input type="number" id="edr-qtd" value="${r.quantidade||0}" min="0" step="0.01"></div>

        </div>
      </div>
    </div>`);
};

window.salvarEdicaoRetirada = async function(id) {
  const r = retiradas.find(x=>x.id===id);
  if (!r) return;
  const qtd = parseFloat(document.getElementById('edr-qtd').value)||0;
  const upd = {
    quantidade: qtd,
    unidade: document.getElementById('edr-unidade').value.trim(),
    fazenda: document.getElementById('edr-fazenda').value.trim(),
    talhao: document.getElementById('edr-talhao').value.trim(),
    obs: document.getElementById('edr-obs').value.trim(),
    custo_total: qtd * (r.custo_unitario||0)
  };
  try {
    await updateDoc(doc(db,'insumos_retiradas',id), upd);
    Object.assign(r, upd);
    recalcularEstoque();
    fecharModal('modal-editar-retirada');
    toast('Retirada atualizada! Estoque recalculado.');
    filtrarRetiradas();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

window.excluirRetirada = async function(id) {
  if(!exigirMaster())return;
  const r = retiradas.find(x=>x.id===id);
  if (!r) return;
  const aviso = r.origem==='aplicacao'
    ? `Excluir esta retirada (gerada pela aplicação de "${r.produto}")? O produto volta ao estoque e a aplicação vinculada é marcada como não-baixada.`
    : `Excluir a retirada de "${r.produto}"? O produto volta ao estoque.`;
  if (!confirm(aviso)) return;
  try {
    await deleteDoc(doc(db,'insumos_retiradas',id));
    const i = retiradas.findIndex(x=>x.id===id); if (i>=0) retiradas.splice(i,1);
    // Se veio de uma aplicação, limpa o vínculo para permitir baixar de novo se quiser
    if (r.origem === 'aplicacao' && r.aplicacao_id) {
      const a = adubacoes.find(x=>x.id===r.aplicacao_id);
      if (a) {
        const idsRest = (a.retirada_ids||[]).filter(x=>x!==id);
        const aindaTem = idsRest.length > 0;
        try {
          await updateDoc(doc(db,'insumos_campo_adubacao',a.id), { retirada_ids: idsRest, estoque_baixado: aindaTem });
          a.retirada_ids = idsRest; a.estoque_baixado = aindaTem;
        } catch(e){}
      }
    }
    recalcularEstoque();
    toast('Retirada excluída. Estoque recalculado.');
    filtrarRetiradas();
  } catch(e) { toast('Erro: '+e.message,'erro'); }
};

window.exportarRetiradas = function() {
  const lista = window._retiradasFiltradas || retiradas;
  exportarExcel('Retiradas', ['Data','Produto','Quantidade','Unidade','Fazenda','Talhão','Cultura','Safra','Custo Unit (R$)','Custo Total (R$)'],
    lista.map(r => [fmtData(r.data), r.produto, r.quantidade||0, r.unidade, r.fazenda, r.talhao||'', r.cultura||'', r.safra||'', r.custo_unitario||0, r.custo_total||0]));
};
